<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Equipos Calificados</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #1f2937;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* MENÚ LATERAL */
        .sidebar {
            width: 250px;
            background: #172033;
            color: white;
            padding: 20px 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .logo {
            padding: 10px 22px 25px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #303a4f;
            margin-bottom: 15px;
        }

        .logo span {
            display: block;
            font-size: 12px;
            font-weight: normal;
            color: #aeb8ca;
            margin-top: 5px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin: 4px 10px;
        }

        .menu button {
            width: 100%;
            padding: 13px 15px;
            border: none;
            background: transparent;
            color: #d8deea;
            text-align: left;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu button:hover {
            background: #26334b;
            color: white;
        }

        .menu button.active {
            background: #34445f;
            color: white;
            font-weight: bold;
        }

        /* CONTENIDO */
        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
        }

        /* TARJETAS */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        /* PANEL */
        .panel {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .panel h2 {
            margin-bottom: 10px;
        }

        .panel p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        /* TABLA */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f9fafb;
        }

        /* BOTONES */
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* FORMULARIO */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- MENÚ -->
    <aside class="sidebar">

        <div class="logo">
            Gestión de Equipos
            <span>Calificados</span>
        </div>

        <ul class="menu">

            <li>
                <button class="active" onclick="mostrarPagina('inicio', this)">
                    🏠 Inicio
                </button>
            </li>

            <li>
                <button onclick="mostrarPagina('equipos', this)">
                    ⚙️ Equipos
                </button>
            </li>

            <li>
                <button onclick="mostrarPagina('calificaciones', this)">
                    📋 Calificaciones
                </button>
            </li>

            <li>
                <button onclick="mostrarPagina('documentos', this)">
                    📁 Documentos
                </button>
            </li>

            <li>
                <button onclick="mostrarPagina('configuracion', this)">
                    ⚙️ Configuración
                </button>
            </li>

        </ul>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="main">

        <div id="contenido"></div>

    </main>

</div>


<script>

function mostrarPagina(pagina, boton) {

    /* Quitar selección anterior */
    document.querySelectorAll(".menu button").forEach(function(btn) {
        btn.classList.remove("active");
    });

    /* Seleccionar botón actual */
    boton.classList.add("active");

    const contenido = document.getElementById("contenido");


    /* INICIO */
    if (pagina === "inicio") {

        contenido.innerHTML = `

            <div class="header">
                <h1>Inicio</h1>
                <p>Gestión de Equipos Calificados</p>
            </div>

            <div class="cards">

                <div class="card">
                    <h3>Equipos registrados</h3>
                    <div class="number">0</div>
                </div>

                <div class="card">
                    <h3>Equipos calificados</h3>
                    <div class="number">0</div>
                </div>

                <div class="card">
                    <h3>Calificaciones pendientes</h3>
                    <div class="number">0</div>
                </div>

                <div class="card">
                    <h3>Documentos</h3>
                    <div class="number">0</div>
                </div>

            </div>

            <div class="panel">

                <h2>Bienvenido</h2>

                <p>
                    Desde este sistema podrás gestionar los equipos,
                    calificaciones y documentación asociada.
                </p>

            </div>

        `;
    }


    /* EQUIPOS */
    if (pagina === "equipos") {

        contenido.innerHTML = `

            <div class="header">
                <h1>Equipos</h1>
                <p>Registro y gestión de equipos.</p>
            </div>

            <div class="panel">

                <button class="btn" onclick="nuevoEquipo()">
                    + Nuevo equipo
                </button>

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Equipo</th>
                            <th>Área</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>-</td>
                            <td>No existen equipos registrados</td>
                            <td>-</td>
                            <td>-</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        `;
    }


    /* CALIFICACIONES */
    if (pagina === "calificaciones") {

        contenido.innerHTML = `

            <div class="header">
                <h1>Calificaciones</h1>
                <p>Gestión de las calificaciones de equipos.</p>
            </div>

            <div class="panel">

                <button class="btn">
                    + Nueva calificación
                </button>

                <table>

                    <thead>
                        <tr>
                            <th>Equipo</th>
                            <th>Tipo</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                            <td>Sin registros</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        `;
    }


    /* DOCUMENTOS */
    if (pagina === "documentos") {

        contenido.innerHTML = `

            <div class="header">
                <h1>Documentos</h1>
                <p>Documentación asociada a los equipos y calificaciones.</p>
            </div>

            <div class="panel">

                <button class="btn">
                    + Agregar documento
                </button>

                <table>

                    <thead>
                        <tr>
                            <th>Documento</th>
                            <th>Equipo</th>
                            <th>Tipo</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                            <td>Sin documentos</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        `;
    }


    /* CONFIGURACIÓN */
    if (pagina === "configuracion") {

        contenido.innerHTML = `

            <div class="header">
                <h1>Configuración</h1>
                <p>Configuración general del sistema.</p>
            </div>

            <div class="panel">

                <h2>Configuración del sistema</h2>

                <br>

                <div class="form-group">

                    <label>Nombre del sistema</label>

                    <input
                        type="text"
                        value="Gestión de Equipos Calificados"
                    >

                </div>

                <div class="form-group">

                    <label>Responsable</label>

                    <input
                        type="text"
                        placeholder="Ingrese responsable"
                    >

                </div>

                <button class="btn">
                    Guardar configuración
                </button>

            </div>

        `;
    }

}


/* NUEVO EQUIPO */

function nuevoEquipo() {

    const contenido = document.getElementById("contenido");

    contenido.innerHTML = `

        <div class="header">

            <h1>Nuevo equipo</h1>

            <p>
                Ingrese la información del equipo.
            </p>

        </div>

        <div class="panel">

            <div class="form-group">

                <label>Código del equipo</label>

                <input
                    type="text"
                    placeholder="Ej: E780/EF"
                >

            </div>


            <div class="form-group">

                <label>Nombre del equipo</label>

                <input
                    type="text"
                    placeholder="Ej: Envasadora de Gotas"
                >

            </div>


            <div class="form-group">

                <label>Área</label>

                <input
                    type="text"
                    placeholder="Ej: Producción"
                >

            </div>


            <div class="form-group">

                <label>Estado</label>

                <select>

                    <option>Activo</option>
                    <option>Fuera de servicio</option>
                    <option>En mantenimiento</option>

                </select>

            </div>


            <button class="btn">
                Guardar equipo
            </button>

        </div>

    `;
}


/* CARGAR INICIO AL ABRIR */

window.onload = function() {

    const primerBoton = document.querySelector(".menu button");

    mostrarPagina("inicio", primerBoton);

};

</script>

</body>
</html>
