<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestión SAC-M</title>
<link rel="icon" type="image/png" href="PPPP.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}
:root{
--prater:#e30613;--prater-dark:#bd0010;--prater-soft:#fde8ea;
--bg:#eef1f3;--white:#fff;--text:#17212b;--muted:#687887;--border:#dfe4e8;
--green:#16834a;--green-bg:#dff7e8;--yellow:#b97900;--yellow-bg:#fff0ca;
--red:#d91f2b;--red-bg:#fde1e3;--blue:#196cb8;--blue-bg:#e7f1ff;
--purple:#6e55b3;--purple-bg:#eee9ff;--gray:#667685;--gray-bg:#edf1f4;
--shadow:0 5px 20px rgba(30,45,60,.06)
}

html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body.menu-abierto{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700;transition:.15s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
input,select,textarea{width:100%;min-height:40px;padding:10px 11px;border:1px solid #d2d9df;border-radius:8px;background:#fff;color:var(--text);outline:none;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:#9aa8b4;box-shadow:0 0 0 3px rgba(25,108,184,.08)}
input[readonly]{background:#edf1f4;color:#576675}
textarea{min-height:90px;resize:vertical}
label{display:block;margin-bottom:6px;font-size:12px;font-weight:700}

/* SIDEBAR */
.sidebar{
position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--border);
padding:18px 12px;overflow-y:auto;z-index:500;transition:transform .22s ease
}
.logo-box{padding:5px 8px 15px;border-bottom:1px solid #e6e9ed;cursor:pointer}
.logo-imagen{display:block;width:150px;height:auto;margin-bottom:10px}
.logo-subtitulo{font-size:13px;font-weight:700;line-height:1.35}
.logo-descripcion{margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.6px}
.sidebar-cerrar{display:none;position:absolute;top:12px;right:12px;width:36px;height:36px;padding:0;background:#f1f3f5;color:#465462;font-size:18px}
.menu{list-style:none;padding:0;margin:16px 0}
.menu li{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding:10px 11px;border-radius:9px;color:#536373;font-size:13px;cursor:pointer;transition:.15s}
.menu li:hover{background:#f5f7f8}
.menu li.activo{background:var(--prater-soft);color:var(--prater);font-weight:700}
.menu-icono{width:19px;flex:none;text-align:center}
.menu-overlay{display:none;position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:450}

/* CONTENT */
.contenido{min-height:100vh;margin-left:250px;padding:18px 28px 28px}
.topbar{
position:sticky;top:0;z-index:90;display:flex;justify-content:space-between;align-items:flex-start;
gap:20px;padding:10px 0 15px;margin-bottom:8px;background:rgba(238,241,243,.95);backdrop-filter:blur(10px)
}
.topbar-izquierda{display:flex;align-items:flex-start;gap:10px;min-width:0}
.menu-movil-btn{display:none;width:42px;height:42px;padding:0;background:#fff;border:1px solid var(--border);font-size:20px;flex:none}
.titulo-bloque{min-width:0}
.titulo-pagina{margin:0;font-size:27px;letter-spacing:-.4px}
.subtitulo-pagina{margin-top:5px;color:var(--muted);font-size:13px}
.topbar-acciones{position:relative;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}

/* USER */
.usuario-superior{display:flex;align-items:center;gap:9px;min-height:42px;padding:6px 11px;background:#fff;border:1px solid var(--border);border-radius:10px}
.usuario-icono{width:29px;height:29px;display:flex;align-items:center;justify-content:center;background:#f2f4f6;border-radius:50%;flex:none}
.usuario-nombre{font-size:11px;font-weight:800}
.usuario-rol{margin-top:2px;color:#748291;font-size:9px}
.btn-sesion{min-height:42px;background:#fff;color:#445465;border:1px solid var(--border)}

/* CARDS */
.tarjeta,.modulo-card,.hero-panel,.resumen-card,.etapa-resumen{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow)}
.tarjeta{padding:20px;margin-bottom:18px;border-radius:14px}
.tarjeta h2,.tarjeta h3{margin-top:0}
.subdato{color:#748392;font-size:11px;line-height:1.5}
.seccion-titulo{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}
.seccion-titulo h2{margin:0}

/* BUTTONS */
.btn-principal{background:var(--prater);color:#fff}
.btn-principal:hover{background:var(--prater-dark)}
.btn-secundario,.btn-gris,.btn-editar{background:#edf1f4;color:#344454}
.btn-verde{background:var(--green-bg);color:var(--green)}
.btn-azul{background:var(--blue-bg);color:var(--blue)}
.btn-amarillo{background:var(--yellow-bg);color:#9b6600}
.btn-morado{background:var(--purple-bg);color:var(--purple)}
.btn-eliminar{background:var(--red-bg);color:var(--red)}
.btn-baja{background:#fff0f1;color:#c8202b}
.btn-reactivar{background:var(--green-bg);color:var(--green)}
.btn-eliminar-definitivo{background:#a9000b;color:#fff}
.btn-icono{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.botones,.acciones-form,.acciones-tabla{display:flex;flex-wrap:wrap;gap:8px}
.acciones-form{margin-top:15px}

/* NOTIFICATIONS */
.btn-campana{position:relative;width:42px;height:42px;padding:0;background:#fff;border:1px solid var(--border);color:#364655;font-size:18px}
.contador-notificacion{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;background:var(--prater);color:#fff;border:2px solid var(--bg);border-radius:20px;font-size:9px}
.panel-notificaciones{position:absolute;top:50px;right:0;width:410px;max-height:540px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 45px rgba(25,35,45,.18);z-index:1000}
.panel-notificaciones-header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e9ec}
.notificacion-item{padding:13px 16px;border-bottom:1px solid #edf0f2;cursor:pointer}
.notificacion-item:hover{background:#f7f9fa}
.notificacion-titulo{font-size:12px;font-weight:700}
.notificacion-texto{margin-top:4px;color:#71808e;font-size:11px;line-height:1.5}

/* SUBMENU */
.submenu{display:flex;flex-wrap:wrap;gap:7px;padding:7px;margin-bottom:20px;background:#fff;border:1px solid var(--border);border-radius:12px;overflow-x:auto}
.submenu button{background:transparent;color:#627181;white-space:nowrap}
.submenu button:hover{background:#f3f5f6}
.submenu button.activo{background:var(--prater-soft);color:var(--prater)}

/* GENERAL HOME */
.inicio-bienvenida{padding:28px;background:linear-gradient(135deg,#fff,#f7f9fa);border:1px solid var(--border);border-radius:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.inicio-bienvenida h1{margin:0 0 7px;font-size:30px}
.inicio-bienvenida p{margin:0;color:var(--muted);font-size:13px}
.modulo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.modulo-card{padding:19px;border-radius:13px;cursor:pointer;transition:.15s}
.modulo-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(30,45,60,.1)}
.modulo-icono{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f1f3f5;font-size:20px;margin-bottom:12px}
.modulo-card h3{margin:0 0 7px;font-size:15px}

/* DASHBOARD */
.resumen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:18px}
.resumen-card{display:flex;align-items:center;gap:12px;min-height:92px;padding:16px;border-radius:13px}
.resumen-icono{width:43px;height:43px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%;font-size:19px}
.resumen-titulo{color:var(--muted);font-size:11px;line-height:1.35}
.resumen-numero{margin-top:3px;font-size:24px;font-weight:800}
.verde-bg{background:var(--green-bg)}.amarillo-bg{background:var(--yellow-bg)}.rojo-bg{background:var(--red-bg)}.azul-bg{background:var(--blue-bg)}.gris-bg{background:var(--gray-bg)}.morado-bg{background:var(--purple-bg)}
.dashboard-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:18px}
.hero-panel{padding:22px;border-radius:15px}
.hero-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.hero-numero{margin-top:5px;font-size:37px;font-weight:800}
.hero-descripcion{margin-top:5px;color:var(--muted);font-size:12px}
.barra-fondo{height:12px;margin-top:15px;overflow:hidden;background:#e9edef;border-radius:20px}
.barra-avance{height:100%;background:#25a45d;border-radius:20px;transition:width .25s}
.accion-principal{margin-top:14px;padding:15px;background:#f7f9fa;border-left:4px solid var(--blue);border-radius:9px}
.accion-principal-titulo{font-size:13px;font-weight:800}
.accion-principal-texto{margin-top:5px;color:#657584;font-size:12px;line-height:1.5}

/* STAGES */
.panel-etapas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:18px}
.etapa-resumen{padding:18px;border-radius:13px}
.etapa-resumen-cabecera{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.etapa-resumen-titulo{font-size:20px;font-weight:800}
.etapa-estados{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.etapa-mini{padding:10px;background:#f7f8fa;border-radius:9px}
.etapa-mini-numero{margin-top:4px;font-size:19px;font-weight:800}

/* STATES */
.badge{display:inline-block;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.vigente,.cumplido{background:var(--green-bg);color:var(--green)}
.proximo,.pendiente{background:var(--yellow-bg);color:var(--yellow)}
.vencido{background:var(--red-bg);color:var(--red)}
.neutro,.baja{background:var(--gray-bg);color:var(--gray)}
.programado{background:var(--blue-bg);color:var(--blue)}
.punto{display:inline-block;width:11px;height:11px;margin-right:6px;border-radius:50%;vertical-align:-1px}
.punto-verde{background:#21a35c}.punto-amarillo{background:#e4a000}.punto-rojo{background:#dc303c}.punto-gris{background:#a7b0b8}

/* TABLES */
.tabla-contenedor{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:11px 10px;background:#f3f5f6;color:#455565;border-bottom:1px solid #dfe3e8;text-align:left;white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid #e7eaed;vertical-align:middle}
tbody tr:hover td{background:#fafbfc}
.codigo{font-weight:800}

/* MOBILE EQUIPMENT CARDS */
.lista-equipos-movil{display:none}
.equipo-movil-card{padding:16px;background:#fff;border:1px solid var(--border);border-radius:13px;margin-bottom:11px;box-shadow:0 3px 12px rgba(30,45,60,.04)}
.equipo-movil-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.equipo-movil-codigo{color:var(--prater);font-size:13px;font-weight:800}
.equipo-movil-nombre{font-size:16px;font-weight:800;margin-top:3px}
.equipo-movil-datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.equipo-movil-dato{padding:9px;background:#f7f8fa;border-radius:8px}
.equipo-movil-label{font-size:9px;color:#7a8793;text-transform:uppercase}
.equipo-movil-valor{font-size:11px;font-weight:700;margin-top:3px}
.equipo-movil-accion{margin-top:12px;padding:11px;background:#f7f9fa;border-left:3px solid var(--blue);border-radius:8px;font-size:11px}
.equipo-movil-botones{display:flex;gap:8px;margin-top:12px}
.equipo-movil-botones button{flex:1}

/* FORMS */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.completo{grid-column:1/-1}
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:15px}

/* FICHA */
.ficha-hero{margin-bottom:18px;padding:22px;background:linear-gradient(135deg,#fff,#fafbfc);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.ficha-hero-cabecera{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.ficha-codigo{margin-bottom:5px;color:var(--prater);font-size:15px;font-weight:800}
.ficha-nombre{margin:0;font-size:27px}
.ficha-estado-area{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}
.estado-global-grande{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:22px;font-size:12px;font-weight:800}
.ficha-proxima-accion{margin-top:18px;padding:14px 16px;background:#f6f8fa;border-left:4px solid var(--blue);border-radius:9px}
.ficha-proxima-accion strong{display:block;margin-bottom:4px;font-size:12px}
.ficha-proxima-accion span{color:#607080;font-size:12px}
.ficha-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ficha-dato{padding:14px;background:#f7f8fa;border-radius:10px}
.ficha-label{color:#71808f;font-size:11px}
.ficha-valor{margin-top:4px;font-size:14px;font-weight:700}

/* IQ OQ PQ */
.calificacion-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.etapa-card{overflow:hidden;background:#fff;border:1px solid var(--border);border-left:5px solid #a8b1ba;border-radius:12px}
.etapa-card.estado-vigente{border-left-color:var(--green)}
.etapa-card.estado-proximo{border-left-color:#e1a000}
.etapa-card.estado-vencido{border-left-color:var(--red)}
.etapa-card.estado-neutro{border-left-color:#a8b1ba}
.etapa-header{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:#f4f6f7}
.etapa-titulo{font-size:16px;font-weight:800}
.doc-card{padding:14px;border-top:1px solid #e8ebee}
.doc-tipo{margin-bottom:5px;color:#6b7885;font-size:11px}
.doc-codigo{margin-bottom:8px;font-weight:800;word-break:break-word}
.doc-linea{margin-top:5px;color:#5d6c7b;font-size:11px;line-height:1.45}
.sin-documento{color:#87939e;font-size:12px;line-height:1.5}

/* PROGRAM */
.programa-cabecera{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}
.programa-anio{margin-top:3px;font-size:28px;font-weight:800}
.programa-resumen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:15px}
.programa-mini{padding:13px;background:#f7f8fa;border-radius:9px;font-size:11px;color:#677684}
.programa-mini strong{display:block;margin-top:4px;color:var(--text);font-size:20px}

/* EXCEL */
.excel-panel{padding:30px;background:#fafbfc;border:2px dashed #d2d9df;border-radius:14px;text-align:center}
.excel-resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.excel-resumen-card{padding:14px;background:#fff;border:1px solid var(--border);border-radius:10px}
.excel-resumen-card strong{display:block;margin-top:4px;font-size:23px}
.fila-valida td{background:#f5fbf7!important}
.fila-duplicada td{background:#fff8e7!important}
.fila-error td{background:#fff1f2!important}

/* DANGER */
.zona-peligro{background:#fff9f9;border-color:#efb7bc}
.zona-peligro h2{color:#aa000b}
.advertencia{padding:13px;background:var(--red-bg);color:#98131d;border-radius:9px;font-size:12px;line-height:1.55}

/* LOGIN */
.login-overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:15px;background:rgba(0,0,0,.45);z-index:2000}
.login-card{width:360px;max-width:100%;padding:24px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.login-error{display:none;margin-bottom:10px;color:var(--red);font-size:12px}

/* TABLET */
@media(max-width:1200px){
.resumen{grid-template-columns:repeat(3,minmax(0,1fr))}
.programa-resumen{grid-template-columns:repeat(3,minmax(0,1fr))}
.modulo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1000px){
.dashboard-hero{grid-template-columns:1fr}
.panel-etapas,.calificacion-grid{grid-template-columns:1fr}
.ficha-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* MOBILE */
@media(max-width:800px){
.sidebar{width:min(300px,86vw);transform:translateX(-105%);box-shadow:8px 0 30px rgba(0,0,0,.15)}
.sidebar.abierto{transform:translateX(0)}
.sidebar-cerrar{display:block}
.menu-overlay.visible{display:block}
.contenido{margin-left:0;padding:10px 13px 25px}
.logo-box{padding-top:16px}
.logo-imagen{width:140px}
.menu-movil-btn{display:inline-flex;align-items:center;justify-content:center}
.topbar{align-items:flex-start;gap:10px;padding-top:7px}
.topbar-izquierda{align-items:flex-start}
.titulo-pagina{font-size:21px;line-height:1.15}
.subtitulo-pagina{font-size:11px}
.topbar-acciones{gap:6px}
.usuario-superior{padding:5px 8px}
.usuario-superior .usuario-rol{display:none}
.usuario-icono{width:27px;height:27px}
.btn-sesion{padding:8px 10px;font-size:11px}
.btn-campana{width:39px;height:39px}
.inicio-bienvenida{padding:20px}
.inicio-bienvenida h1{font-size:24px}
.modulo-grid,.resumen,.programa-resumen,.form-grid,.form-grid-3,.filtros,.ficha-grid,.excel-resumen{grid-template-columns:1fr}
.modulo-card{padding:16px}
.resumen-card{min-height:78px}
.dashboard-hero,.panel-etapas,.calificacion-grid{grid-template-columns:1fr}
.ficha-hero{padding:17px}
.ficha-hero-cabecera{flex-direction:column}
.ficha-estado-area{justify-content:flex-start}
.ficha-nombre{font-size:23px}
.tarjeta{padding:16px}
.seccion-titulo,.programa-cabecera{align-items:flex-start;flex-direction:column}
.completo{grid-column:auto}
.excel-panel{padding:20px 12px}
.botones>button,.acciones-form>button{min-height:42px}
.panel-notificaciones{position:fixed;top:65px;left:12px;right:12px;width:auto;max-height:70vh}
.submenu{flex-wrap:nowrap}
.tabla-equipos-escritorio{display:none}
.lista-equipos-movil{display:block}
}

@media(max-width:480px){
.contenido{padding:8px 10px 22px}
.topbar{flex-direction:column}
.topbar-acciones{width:100%;justify-content:flex-end}
.titulo-pagina{font-size:20px}
.resumen-numero{font-size:21px}
.hero-numero{font-size:31px}
.equipo-movil-datos{grid-template-columns:1fr}
.usuario-superior-info{max-width:90px}
.usuario-nombre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

@media(min-width:801px){
.tabla-equipos-escritorio{display:block}
.lista-equipos-movil{display:none}
}
</style>
</head>

<body>

<div id="menuOverlay" class="menu-overlay" onclick="cerrarMenuMovil()"></div>

<aside class="sidebar" id="sidebar">
<button class="sidebar-cerrar" onclick="cerrarMenuMovil()">×</button>

<div class="logo-box" onclick="mostrarInicioGeneral();cerrarMenuMovil()" title="Inicio General SAC-M">
<img src="logo prater.png" class="logo-imagen" alt="Laboratorios Prater">
<div class="logo-subtitulo">Sistemas de Apoyo Crítico y Metrología</div>
<div class="logo-descripcion">LABORATORIOS PRATER</div>
</div>

<ul class="menu" id="menuPrincipal">
<li data-modulo="calificacion" onclick="abrirModulo('calificacion')"><span class="menu-icono">▣</span>Calificación de Equipos</li>
<li data-modulo="calibracion" onclick="abrirModulo('calibracion')"><span class="menu-icono">◎</span>Calibración de Equipos</li>
<li data-modulo="agua" onclick="abrirModulo('agua')"><span class="menu-icono">◉</span>Agua Purificada</li>
<li data-modulo="hvac" onclick="abrirModulo('hvac')"><span class="menu-icono">≋</span>HVAC</li>
<li data-modulo="aire" onclick="abrirModulo('aire')"><span class="menu-icono">➜</span>Aire Comprimido</li>

<script>
const ADMIN_USUARIO="admin",ADMIN_CLAVE="SACM2026",DIAS_PROXIMO=180;
let esAdmin=sessionStorage.getItem("adminSACM")==="true";
let moduloActual="inicio",indiceEdicionEquipo=null,indiceEdicionDocumento=null,excelTemporal=null,panelNotificacionesAbierto=false;

const $=id=>document.getElementById(id);

let equiposCalibracion=leerDatos("equiposCalibracion"),registrosCalibracion=leerDatos("registrosCalibracion"),documentosSACM=leerDatos("documentosSACM"),registrosDocumentales=leerDatos("registrosDocumentales");

function guardarTodo(){
localStorage.setItem("equipos",JSON.stringify(equipos));
localStorage.setItem("calificaciones",JSON.stringify(calificaciones));
localStorage.setItem("programasCalificacion",JSON.stringify(programasCalificacion));

localStorage.setItem("registrosCalibracion",JSON.stringify(registrosCalibracion));

}

const val=id=>String($(id)?.value||"").trim();
const sel=id=>$(id)?.value||"";
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const escJS=s=>String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const esVistaMovil=()=>window.matchMedia("(max-width:800px)").matches;

function abrirMenuMovil(){if(!esVistaMovil())return;$("sidebar").classList.add("abierto");$("menuOverlay").classList.add("visible");document.body.classList.add("menu-abierto")}
function cerrarMenuMovil(){$("sidebar").classList.remove("abierto");$("menuOverlay").classList.remove("visible");document.body.classList.remove("menu-abierto")}
window.addEventListener("resize",()=>{if(!esVistaMovil())cerrarMenuMovil()});

function fechaHoy(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
const anioActual=()=>new Date().getFullYear();
function fechaBonita(f){if(!f)return"—";const p=String(f).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:f}
function sumarAnios(f,n){if(!f)return"";const[a,m,d]=f.split("-").map(Number);let x=new Date(a+n,m-1,d);if(x.getMonth()!==m-1)x=new Date(a+n,m,0);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`}
function normalizarFechaExcel(v){
if(v===null||v===undefined||v==="")return"";
if(v instanceof Date)return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
if(typeof v==="number"){const x=XLSX.SSF.parse_date_code(v);return x?`${x.y}-${String(x.m).padStart(2,"0")}-${String(x.d).padStart(2,"0")}`:""}
const t=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
const m=t.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:"";
}
function col(f,n){for(const x of n)if(f[x]!==undefined&&f[x]!==null&&String(f[x]).trim()!=="")return f[x];return""}
const MESES=["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const obtenerMes=f=>f?MESES[Number(String(f).split("-")[1])||0]:"";
const obtenerNumeroMes=f=>f?Number(String(f).split("-")[1]||0):0;
const obtenerAnioFecha=f=>f?Number(String(f).split("-")[0]||0):0;

function migrar(){
let c=false;
equipos.forEach(e=>{
["marca","modelo","serie","fechaBaja","motivoBaja"].forEach(k=>{if(!(k in e)){e[k]="";c=true}});
if(!("estado"in e)){e.estado="Operativo";c=true}
if(!("aplicaPQ"in e)){e.aplicaPQ=true;c=true}
if(!Array.isArray(e.historialEstado)){e.historialEstado=[];c=true}
});
calificaciones.forEach(r=>{
if(!r.fecha&&r.emision){r.fecha=r.emision;c=true}
if(!("responsable"in r)){r.responsable="";c=true}
if(r.fecha&&!r.vencimiento){r.vencimiento=sumarAnios(r.fecha,5);c=true}
});
if(c)guardarTodo();
}

function actualizarPermisosUI(){$$(".solo-admin")}
function $$(selector){return document.querySelectorAll(selector)}
function actualizarPermisosUI(){$$(".solo-admin").forEach(x=>x.style.display=esAdmin?"flex":"none")}

function estadoFecha(f){
if(!f)return{texto:"Sin registro",clase:"neutro"};
const h=new Date();h.setHours(0,0,0,0);const v=new Date(f+"T00:00:00");
if(Number.isNaN(v.getTime()))return{texto:"Fecha inválida",clase:"neutro"};
const d=Math.ceil((v-h)/86400000);
return d<0?{texto:"Vencido",clase:"vencido"}:d<=DIAS_PROXIMO?{texto:"Próximo",clase:"proximo"}:{texto:"Vigente",clase:"vigente"};
}
function puntoEstado(e){
const p=e.clase==="vigente"?"punto-verde":e.clase==="proximo"?"punto-amarillo":e.clase==="vencido"?"punto-rojo":"punto-gris";
return`<span class="punto ${p}"></span><span class="badge ${e.clase}">${e.texto}</span>`;
}
const fechaDocumento=r=>r?.fecha||r?.emision||"";
function ultimoDocumento(c,t,d){return calificaciones.filter(r=>r.equipoCodigo===c&&r.tipo===t&&r.documento===d).sort((a,b)=>fechaDocumento(b).localeCompare(fechaDocumento(a)))[0]||null}
function docsReq(e){
const d=[["IQ","Protocolo"],["IQ","Reporte"],["OQ","Protocolo"],["OQ","Reporte"]];
if(e.aplicaPQ!==false)d.push(["PQ","Protocolo"],["PQ","Reporte"]);
return d.map(x=>({tipo:x[0],documento:x[1]}));
}
function estadoEtapa(e,t){
if(t==="PQ"&&e.aplicaPQ===false)return{texto:"No aplica",clase:"neutro"};
const p=ultimoDocumento(e.codigo,t,"Protocolo"),r=ultimoDocumento(e.codigo,t,"Reporte");
if(!p||!r)return{texto:"Incompleto",clase:"vencido"};
const ep=estadoFecha(p.vencimiento),er=estadoFecha(r.vencimiento);
if(ep.clase==="vencido"||er.clase==="vencido")return{texto:"Vencido",clase:"vencido"};
if(ep.clase==="proximo"||er.clase==="proximo")return{texto:"Próximo",clase:"proximo"};
return{texto:"Vigente",clase:"vigente"};
}
function estadoGlobalEquipo(e){
if(e.estado==="De baja")return{texto:"De baja",clase:"neutro",icono:"⊘"};
const t=["IQ","OQ"];if(e.aplicaPQ!==false)t.push("PQ");const s=t.map(x=>estadoEtapa(e,x));
if(s.some(x=>x.clase==="vencido"))return{texto:"Vencida / incompleta",clase:"vencido",icono:"!"};
if(s.some(x=>x.clase==="proximo"))return{texto:"Próxima a recalificar",clase:"proximo",icono:"◷"};
return{texto:"Calificación vigente",clase:"vigente",icono:"✓"};
}
const equipoCompletamenteCalificado=e=>["vigente","proximo"].includes(estadoGlobalEquipo(e).clase);
const obtenerPrograma=a=>programasCalificacion.find(p=>Number(p.anio)===Number(a))||null;
const documentoReferenciaPrograma=e=>e.aplicaPQ!==false?ultimoDocumento(e.codigo,"PQ","Reporte"):ultimoDocumento(e.codigo,"OQ","Reporte");

function proximaAccionEquipo(e){
if(e.estado==="De baja")return{texto:"Equipo fuera del programa activo",detalle:"La documentación permanece disponible como historial.",prioridad:99};
const etapas=["IQ","OQ"];if(e.aplicaPQ!==false)etapas.push("PQ");
for(const t of etapas){
const p=ultimoDocumento(e.codigo,t,"Protocolo");if(!p)return{texto:`Completar Protocolo ${t}`,detalle:"No existe protocolo registrado para esta etapa.",prioridad:1};
const r=ultimoDocumento(e.codigo,t,"Reporte");if(!r)return{texto:`Completar Reporte ${t}`,detalle:"Existe protocolo, pero no reporte registrado.",prioridad:1};
}
const venc=docsReq(e).map(x=>({...x,registro:ultimoDocumento(e.codigo,x.tipo,x.documento)})).filter(x=>x.registro&&estadoFecha(x.registro.vencimiento).clase==="vencido").sort((a,b)=>a.registro.vencimiento.localeCompare(b.registro.vencimiento));
if(venc.length){const x=venc[0];return{texto:`Regularizar ${x.tipo} ${x.documento}`,detalle:`${x.registro.codigo} venció el ${fechaBonita(x.registro.vencimiento)}.`,prioridad:2}}
const prox=docsReq(e).map(x=>({...x,registro:ultimoDocumento(e.codigo,x.tipo,x.documento)})).filter(x=>x.registro&&estadoFecha(x.registro.vencimiento).clase==="proximo").sort((a,b)=>a.registro.vencimiento.localeCompare(b.registro.vencimiento));
if(prox.length){const x=prox[0];return{texto:`Preparar recalificación ${x.tipo}`,detalle:`${x.registro.codigo} vence el ${fechaBonita(x.registro.vencimiento)}.`,prioridad:4}}
return{texto:"Sin acciones pendientes",detalle:"La documentación requerida se encuentra vigente.",prioridad:50};
}

/* LOGIN */
function abrirLogin(){$("loginModal").style.display="block";$("loginUsuario").value="";$("loginClave").value="";$("loginError").style.display="none"}
function cerrarLogin(){$("loginModal").style.display="none"}
function iniciarSesion(){
if(val("loginUsuario")===ADMIN_USUARIO&&val("loginClave")===ADMIN_CLAVE){

}else $("loginError").style.display="block";
}
function cerrarSesion(){
if(!confirm("¿Cerrar sesión de administrador?"))return;
esAdmin=false;sessionStorage.removeItem("adminSACM");actualizarPermisosUI();mostrarInicioGeneral();
}
function renderUsuarioSuperior(){
return`<div class="usuario-superior"><div class="usuario-icono">👤</div><div class="usuario-superior-info"><div class="usuario-nombre">${esAdmin?"Administrador":"Modo consulta"}</div><div class="usuario-rol">${esAdmin?"SAC-M · Acceso completo":"Solo lectura"}</div></div></div><button class="btn-sesion" onclick="${esAdmin?"cerrarSesion()":"abrirLogin()"}">${esAdmin?"Cerrar sesión":"Ingresar"}</button>`;

/* NAV */
function marcarMenuActivo(m){$$("#menuPrincipal li").forEach(x=>x.classList.remove("activo"));if(m){const x=document.querySelector(`[data-modulo="${m}"]`);if(x)x.classList.add("activo")}}
function abrirModulo(m){
cerrarMenuMovil();panelNotificacionesAbierto=false;
if(!esAdmin&&["documentacion","kpi"].includes(m)){mostrarInicioGeneral();return}
moduloActual=m;marcarMenuActivo(m);
if(m==="calificacion"){esAdmin?mostrarInicioCalificacion():mostrarEquiposCalificacion();return}
if(m==="calibracion"){mostrarModuloBase("Calibración de Equipos","Gestión de instrumentos, certificados e historial metrológico.","◎");return}
if(m==="agua"){mostrarModuloBase("Agua Purificada","Gestión documental del sistema de agua purificada.","◉");return}
if(m==="hvac"){mostrarModuloBase("HVAC","Gestión documental de sistemas HVAC.","≋");return}
if(m==="aire"){mostrarModuloBase("Aire Comprimido","Gestión documental del sistema de aire comprimido.","➜");return}
if(m==="mapeos"){mostrarModuloBase("Mapeos Térmicos","Gestión de estudios y remapeos térmicos.","⌁");return}
if(m==="documentacion"){mostrarModuloBase("Documentación SAC-M","Gestión maestra de documentos SAC-M.","▤");return}
if(m==="kpi")mostrarKPI();
}
function modulosInicio(){
const m=[
["calificacion","▣","Calificación de Equipos","Equipos, IQ, OQ, PQ y vigencias."],
["calibracion","◎","Calibración de Equipos","Instrumentos, certificados e historial."],
["agua","◉","Agua Purificada","Sistemas y documentación asociada."],
["hvac","≋","HVAC","Sistemas, filtros, ensayos y certificaciones."],
["aire","➜","Aire Comprimido","Sistemas, ensayos y mantenimientos."],
["mapeos","⌁","Mapeos Térmicos","Estudios, remapeos y documentación."]
];
if(esAdmin)m.push(["documentacion","▤","Documentación SAC-M","Procedimientos, programas y documentos maestros."],["kpi","◫","KPI","Indicadores de gestión SAC-M."]);
return m;
}
function mostrarInicioGeneral(){
cerrarMenuMovil();moduloActual="inicio";marcarMenuActivo(null);actualizarCumplimientoProgramas();
const activos=equipos.filter(e=>e.estado!=="De baja"),alertas=generarNotificaciones();
$("contenido").innerHTML=
cabecera("Gestión SAC-M","Sistemas de Apoyo Crítico y Metrología")+
`<div class="inicio-bienvenida"><h1>Bienvenido a Gestión SAC-M</h1><p>${esAdmin?"Panel general para gestión, planificación y control documental.":"Consulta de equipos, sistemas y documentación autorizada."}</p></div>
${esAdmin?`<div class="resumen">${tarjetaResumen("⚙","Equipos calificados",equipos.length,"azul-bg")}${tarjetaResumen("✓","Equipos activos",activos.length,"verde-bg")}${tarjetaResumen("🔔","Alertas calificación",alertas.length,"amarillo-bg")}${tarjetaResumen("📅","Programa próximo año",obtenerPrograma(anioActual()+1)?"Generado":"Pendiente","morado-bg")}</div>`:""}
<div class="tarjeta"><div class="seccion-titulo"><div><h2>Módulos SAC-M</h2><div class="subdato">Selecciona un módulo para ingresar.</div></div></div><div class="modulo-grid">${modulosInicio().map(m=>`<div class="modulo-card" onclick="abrirModulo('${m[0]}')"><div class="modulo-icono">${m[1]}</div><h3>${m[2]}</h3><div class="subdato">${m[3]}</div></div>`).join("")}</div></div>
${esAdmin&&alertas.length?`<div class="tarjeta"><h2>Necesita atención</h2>${alertas.slice(0,8).map(a=>`<div class="notificacion-item" onclick="mostrarFichaEquipo('${escJS(a.equipoCodigo)}')"><div class="notificacion-titulo">${a.icono} ${esc(a.titulo)}</div><div class="notificacion-texto">${esc(a.texto)}</div></div>`).join("")}</div>`:""}`;
}
function mostrarModuloBase(t,s,i){
$("contenido").innerHTML=cabecera(`${i} ${t}`,s)+`<div class="tarjeta"><h2>Módulo en preparación</h2><p>${esAdmin?"Este módulo se desarrollará después de finalizar Calificación de Equipos.":"Este módulo está disponible para consulta. Sus vistas específicas se definirán cuando completemos su desarrollo."}</p></div>`;
}

/* NOTIFICATIONS */
function generarNotificaciones(){
const a=[];
equipos.filter(e=>e.estado!=="De baja").forEach(e=>docsReq(e).forEach(x=>{
const r=ultimoDocumento(e.codigo,x.tipo,x.documento);if(!r)return;const s=estadoFecha(r.vencimiento);
if(["vencido","proximo"].includes(s.clase))a.push({equipoCodigo:e.codigo,prioridad:s.clase==="vencido"?1:2,icono:s.clase==="vencido"?"🔴":"🟡",titulo:`${e.codigo} · ${x.tipo} ${x.documento}`,texto:`${r.codigo} ${s.clase==="vencido"?"venció":"vence"} el ${fechaBonita(r.vencimiento)}.`});
}));
return a.sort((x,y)=>x.prioridad-y.prioridad);
}
function toggleNotificaciones(ev){
if(!esAdmin)return;ev?.stopPropagation();panelNotificacionesAbierto=!panelNotificacionesAbierto;const p=$("panelNotificaciones");if(!p)return;
if(!panelNotificacionesAbierto){p.innerHTML="";return}
const l=generarNotificaciones();
p.innerHTML=`<div class="panel-notificaciones" onclick="event.stopPropagation()"><div class="panel-notificaciones-header"><strong>Notificaciones</strong><span class="badge neutro">${l.length}</span></div>${l.length?l.map(x=>`<div class="notificacion-item" onclick="mostrarFichaEquipo('${escJS(x.equipoCodigo)}')"><div class="notificacion-titulo">${x.icono} ${esc(x.titulo)}</div><div class="notificacion-texto">${esc(x.texto)}</div></div>`).join(""):`<div class="notificacion-item"><div class="notificacion-texto">No existen alertas documentales.</div></div>`}</div>`;
}
document.addEventListener("click",()=>{if(panelNotificacionesAbierto){panelNotificacionesAbierto=false;const p=$("panelNotificaciones");if(p)p.innerHTML=""}});

/* QUALIFICATION NAV */
function submenuCalificacion(a){
if(!esAdmin)return`<div class="submenu"><button class="activo" onclick="mostrarEquiposCalificacion()">⚙ Equipos</button></div>`;
return`<div class="submenu"><button class="${a==="inicio"?"activo":""}" onclick="mostrarInicioCalificacion()">⌂ Inicio</button><button class="${a==="equipos"?"activo":""}" onclick="mostrarEquiposCalificacion()">⚙ Equipos</button><button class="${a==="programa"?"activo":""}" onclick="mostrarProgramaCalificacion()">📅 Programa anual</button><button class="${a==="documentos"?"activo":""}" onclick="mostrarGestionDocumentos()">▣ Documentación</button><button class="${a==="excel"?"activo":""}" onclick="mostrarExcelCalificacion()">⇩ Carga Excel</button></div>`;
}
function tarjetaResumen(i,t,v,c){return`<div class="resumen-card"><div class="resumen-icono ${c}">${i}</div><div><div class="resumen-titulo">${t}</div><div class="resumen-numero">${v}</div></div></div>`}
function resumenEtapa(t){
const l=equipos.filter(e=>e.estado!=="De baja"&&!(t==="PQ"&&e.aplicaPQ===false)),r={total:l.length,vigente:0,proximo:0,vencido:0};
l.forEach(e=>{const s=estadoEtapa(e,t);if(s.clase==="vigente")r.vigente++;else if(s.clase==="proximo")r.proximo++;else r.vencido++});return r;
}
function tarjetaResumenEtapa(t){
const d=resumenEtapa(t);
return`<div class="etapa-resumen"><div class="etapa-resumen-cabecera"><div class="etapa-resumen-titulo">${t}</div><span class="badge neutro">${d.total} equipos</span></div><div class="etapa-estados"><div class="etapa-mini"><div class="subdato">Vigentes</div><div class="etapa-mini-numero">${d.vigente}</div></div><div class="etapa-mini"><div class="subdato">Próximos</div><div class="etapa-mini-numero">${d.proximo}</div></div><div class="etapa-mini"><div class="subdato">Vencidos / incompletos</div><div class="etapa-mini-numero">${d.vencido}</div></div></div></div>`;
}

/* QUALIFICATION DASHBOARD */
function mostrarInicioCalificacion(){
if(!esAdmin){mostrarEquiposCalificacion();return}
moduloActual="calificacion";marcarMenuActivo("calificacion");actualizarCumplimientoProgramas();
const a=equipos.filter(e=>e.estado!=="De baja"),b=equipos.filter(e=>e.estado==="De baja");
const v=a.filter(e=>estadoGlobalEquipo(e).clase==="vigente"),p=a.filter(e=>estadoGlobalEquipo(e).clase==="proximo"),x=a.filter(e=>estadoGlobalEquipo(e).clase==="vencido");
const pct=a.length?Math.round((v.length+p.length)/a.length*100):0;
const acciones=a.map(e=>({e,a:proximaAccionEquipo(e)})).filter(x=>x.a.prioridad<50).sort((x,y)=>x.a.prioridad-y.a.prioridad),prim=acciones[0];

$("contenido").innerHTML=
cabecera("Calificación de Equipos","Gestión documental, planificación anual y seguimiento IQ / OQ / PQ","",true)+

`<div class="resumen">${tarjetaResumen("⚙","Equipos activos",a.length,"azul-bg")}${tarjetaResumen("✓","Calificación vigente",v.length,"verde-bg")}${tarjetaResumen("◷","Próximos",p.length,"amarillo-bg")}${tarjetaResumen("!","Vencidos / incompletos",x.length,"rojo-bg")}${tarjetaResumen("⊘","De baja",b.length,"gris-bg")}</div>

function tablaEquiposAtencion(){
const l=equipos.filter(e=>e.estado!=="De baja").map(e=>({e,s:estadoGlobalEquipo(e),a:proximaAccionEquipo(e)})).filter(x=>x.s.clase!=="vigente"||x.a.prioridad<50).slice(0,12);
if(!l.length)return`<div class="subdato">No existen equipos que requieran atención inmediata.</div>`;
return`<div class="tabla-contenedor"><table><thead><tr><th>Equipo</th><th>Área</th><th>Estado global</th><th>Próxima acción</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td><strong>${esc(x.e.codigo)}</strong><div class="subdato">${esc(x.e.nombre)}</div></td><td>${esc(x.e.area)}</td><td><span class="badge ${x.s.clase}">${x.s.icono} ${x.s.texto}</span></td><td><strong>${esc(x.a.texto)}</strong><div class="subdato">${esc(x.a.detalle)}</div></td><td><button class="btn-icono btn-azul" onclick="mostrarFichaEquipo('${escJS(x.e.codigo)}')">👁</button></td></tr>`).join("")}</tbody></table></div>`;

function tablaProximasCalificaciones(){
const l=equipos.filter(e=>e.estado!=="De baja").map(e=>({e,r:documentoReferenciaPrograma(e)})).filter(x=>x.r).sort((a,b)=>a.r.vencimiento.localeCompare(b.r.vencimiento)).slice(0,10);
if(!l.length)return`<div class="subdato">No existen documentos RCD/RCO de referencia registrados.</div>`;
return`<div class="tabla-contenedor"><table><thead><tr><th>Equipo</th><th>Área</th><th>Referencia</th><th>Mes límite</th><th>Año</th><th>Estado</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td><strong>${esc(x.e.codigo)}</strong><div class="subdato">${esc(x.e.nombre)}</div></td><td>${esc(x.e.area)}</td><td class="codigo">${esc(x.r.codigo)}</td><td>${obtenerMes(x.r.vencimiento)}</td><td>${obtenerAnioFecha(x.r.vencimiento)}</td><td>${puntoEstado(estadoFecha(x.r.vencimiento))}</td><td><button class="btn-icono btn-azul" onclick="mostrarFichaEquipo('${escJS(x.e.codigo)}')">👁</button></td></tr>`).join("")}</tbody></table></div>`;

function tablaActividadReciente(){
const l=[...calificaciones].sort((a,b)=>fechaDocumento(b).localeCompare(fechaDocumento(a))).slice(0,10);

return`<div class="tabla-contenedor"><table><thead><tr><th>Emisión</th><th>Equipo</th><th>Documento</th><th>Código</th><th>Elaboró / Ejecutó</th></tr></thead><tbody>${l.map(x=>`<tr><td>${fechaBonita(fechaDocumento(x))}</td><td>${esc(x.equipoCodigo)}</td><td>${x.tipo} · ${x.documento}</td><td class="codigo">${esc(x.codigo)}</td><td>${esc(x.responsable||"—")}</td></tr>`).join("")}</tbody></table></div>`;

function guardarEquipo(){
if(!esAdmin)return;
const codigo=val("eqCodigo"),nombre=val("eqNombre"),area=val("eqArea");
if(!codigo||!nombre||!area){alert("Completa Código, Nombre y Área.");return}
const dup=equipos.findIndex((e,i)=>String(e.codigo).toLowerCase()===codigo.toLowerCase()&&i!==indiceEdicionEquipo);
if(dup!==-1){alert("Ya existe otro equipo con ese código.");return}
if(indiceEdicionEquipo===null){
equipos.push({codigo,nombre,area,marca:val("eqMarca"),modelo:val("eqModelo"),serie:val("eqSerie"),ubicacion:val("eqUbicacion"),aplicaPQ:sel("eqPQ")==="si",estado:"Operativo",fechaBaja:"",motivoBaja:"",historialEstado:[]});
}else{
const e=equipos[indiceEdicionEquipo],ant=e.codigo;
Object.assign(e,{codigo,nombre,area,marca:val("eqMarca"),modelo:val("eqModelo"),serie:val("eqSerie"),ubicacion:val("eqUbicacion"),aplicaPQ:sel("eqPQ")==="si"});
calificaciones.forEach(r=>{if(r.equipoCodigo===ant){r.equipoCodigo=codigo;r.equipoNombre=nombre}});
programasCalificacion.forEach(p=>p.equipos?.forEach(x=>{if(x.equipoCodigo===ant){x.equipoCodigo=codigo;x.equipoNombre=nombre}}));
}
guardarTodo();actualizarCumplimientoProgramas();mostrarEquiposCalificacion();
}

const p=ultimoDocumento(e.codigo,t,"Protocolo"),r=ultimoDocumento(e.codigo,t,"Reporte"),s=estadoEtapa(e,t);
return`<div class="etapa-card estado-${s.clase}"><div class="etapa-header"><div class="etapa-titulo">${t}</div>${puntoEstado(s)}</div>${tarjetaDocumentoFicha(p,"Protocolo")}${tarjetaDocumentoFicha(r,"Reporte")}</div>`;

function tablaHistorialEquipo(c){
const l=calificaciones.filter(x=>x.equipoCodigo===c).sort((a,b)=>fechaDocumento(b).localeCompare(fechaDocumento(a)));
if(!l.length)return`<div class="subdato">No existen documentos registrados.</div>`;
return`<div class="tabla-contenedor"><table><thead><tr><th>Etapa</th><th>Documento</th><th>Código</th><th>Versión</th><th>Emisión</th><th>Vencimiento</th><th>Elaboró / Ejecutó</th><th>Estado</th>${esAdmin?"<th>Acciones</th>":""}</tr></thead><tbody>${l.map(r=>{const i=calificaciones.indexOf(r);return`<tr><td>${r.tipo}</td><td>${r.documento}</td><td class="codigo">${esc(r.codigo)}</td><td>${esc(r.version||"—")}</td><td>${fechaBonita(fechaDocumento(r))}</td><td>${fechaBonita(r.vencimiento)}</td><td>${esc(r.responsable||"—")}</td><td>${puntoEstado(estadoFecha(r.vencimiento))}</td>${esAdmin?`<td><div class="acciones-tabla"><button class="btn-icono btn-editar" onclick="editarDocumentoDesdeFicha(${i})">✎</button><button class="btn-icono btn-eliminar" onclick="eliminarDocumentoDesdeFicha(${i},'${escJS(c)}')">🗑</button></div></td>`:""}</tr>`}).join("")}</tbody></table></div>`;
}
function editarEquipoDesdeFicha(i){if(!esAdmin)return;mostrarEquiposCalificacion();setTimeout(()=>formEquipo(i),0)}
function mostrarFormularioBaja(c){
if(!esAdmin)return;
$("zonaBaja").innerHTML=`<div class="form-grid"><div><label>Fecha de baja</label><input id="fechaBaja" type="date" value="${fechaHoy()}"></div><div><label>Motivo</label><input id="motivoBaja" placeholder="Ej.: retiro definitivo, reemplazo..."></div></div><div class="acciones-form"><button class="btn-baja" onclick="confirmarBajaEquipo('${escJS(c)}')">Confirmar baja</button><button class="btn-secundario" onclick="$('zonaBaja').innerHTML=''">Cancelar</button></div>`;
}
function confirmarBajaEquipo(c){
const e=equipos.find(x=>x.codigo===c);if(!e||!esAdmin)return;
if(!val("fechaBaja")){alert("Ingresa la fecha de baja.");return}
if(!confirm(`¿Dar de baja ${c}?\n\nLa documentación permanecerá almacenada.`))return;
e.estado="De baja";e.fechaBaja=val("fechaBaja");e.motivoBaja=val("motivoBaja");
if(!Array.isArray(e.historialEstado))e.historialEstado=[];
e.historialEstado.push({estado:"De baja",fecha:e.fechaBaja,motivo:e.motivoBaja});
guardarTodo();actualizarCumplimientoProgramas();mostrarFichaEquipo(c);
}
function reactivarEquipo(c){
const e=equipos.find(x=>x.codigo===c);if(!e||!esAdmin||!confirm(`¿Reactivar ${c}?`))return;
e.estado="Operativo";if(!Array.isArray(e.historialEstado))e.historialEstado=[];
e.historialEstado.push({estado:"Reactivado",fecha:fechaHoy(),motivo:"Equipo reincorporado al estado operativo."});
guardarTodo();actualizarCumplimientoProgramas();mostrarFichaEquipo(c);
}
function eliminarEquipoDefinitivamente(c){
if(!esAdmin)return;const e=equipos.find(x=>x.codigo===c);if(!e)return;
if(!confirm(`ELIMINACIÓN DEFINITIVA\n\n${e.codigo} - ${e.nombre}\n\n¿Continuar?`))return;
if((prompt(`Para confirmar escribe exactamente:\n${c}`)||"").trim()!==c){alert("El código no coincide.");return}
equipos=equipos.filter(x=>x.codigo!==c);calificaciones=calificaciones.filter(x=>x.equipoCodigo!==c);
programasCalificacion=programasCalificacion.map(p=>({...p,equipos:(p.equipos||[]).filter(x=>x.equipoCodigo!==c)}));
guardarTodo();mostrarEquiposCalificacion();
}
