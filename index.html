<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión SAC-M</title>

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <style>
        /* =========================================================
           BASE
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef1f3;
            color: #182230;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            min-height: 40px;
            padding: 10px 11px;
            border: 1px solid #d4dae0;
            border-radius: 8px;
            background: #ffffff;
            font-size: 13px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #9da8b3;
        }

        input[readonly] {
            background: #edf1f4;
            color: #50606f;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: #ffffff;
            border-right: 1px solid #dfe3e8;
            z-index: 100;
        }

        .logo-box {
            padding: 5px 8px 14px;
            border-bottom: 1px solid #e6e9ed;
        }

        .logo-imagen {
            display: block;
            width: 150px;
            height: auto;
            margin-bottom: 10px;
        }

        .logo-subtitulo {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.35;
        }

        .logo-descripcion {
            margin-top: 4px;
            color: #66788a;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        .menu {
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
        }

        .menu li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            padding: 10px 11px;
            color: #526273;
            font-size: 13px;
            line-height: 1.25;
            border-radius: 9px;
            cursor: pointer;
        }

        .menu li:hover {
            background: #f7f8fa;
        }

        .menu li.activo {
            background: #fde8ea;
            color: #e30613;
            font-weight: 700;
        }

        .menu-icono {
            width: 18px;
            flex: none;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #e6e9ed;
        }

        .sidebar-label {
            margin-bottom: 6px;
            color: #657484;
            font-size: 10px;
            text-transform: uppercase;
        }

        .usuario-box {
            padding: 10px;
            background: #f7f8fa;
            border-radius: 8px;
        }

        .usuario-nombre {
            font-size: 13px;
            font-weight: 700;
        }

        .usuario-area {
            margin-top: 3px;
            color: #6d7985;
            font-size: 11px;
        }

        .btn-login,
        .btn-logout {
            width: 100%;
            margin-top: 9px;
        }

        /* =========================================================
           CONTENIDO
        ========================================================= */

        .contenido {
            min-height: 100vh;
            margin-left: 250px;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 22px;
        }

        .titulo-pagina {
            margin: 0;
            font-size: 26px;
        }

        .subtitulo-pagina {
            margin-top: 5px;
            color: #66788a;
            font-size: 13px;
        }

        .tarjeta {
            margin-bottom: 18px;
            padding: 20px;
            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 14px;
        }

        .tarjeta h2,
        .tarjeta h3 {
            margin-top: 0;
        }

        .subdato {
            margin-top: 3px;
            color: #748291;
            font-size: 11px;
        }

        /* =========================================================
           SUBMENÚ
        ========================================================= */

        .submenu {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 20px;
            padding: 7px;
            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 12px;
        }

        .submenu button {
            background: transparent;
            color: #627181;
        }

        .submenu button:hover {
            background: #f4f6f7;
        }

        .submenu button.activo {
            background: #fde8ea;
            color: #e30613;
        }

        /* =========================================================
           BOTONES
        ========================================================= */

        .btn-principal,
        .btn-rojo-principal,
        .btn-login {
            background: #e30613;
            color: #ffffff;
        }

        .btn-secundario,
        .btn-gris,
        .btn-editar,
        .btn-logout {
            background: #edf1f4;
            color: #344454;
        }

        .btn-verde {
            background: #e3f7ea;
            color: #17753b;
        }

        .btn-eliminar {
            background: #fde8ea;
            color: #e30613;
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* =========================================================
           FORMULARIOS
        ========================================================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .completo {
            grid-column: 1 / -1;
        }

        .acciones-form {
            display: flex;
            gap: 9px;
            margin-top: 14px;
        }

        .acciones-form button {
            flex: 1;
        }

        /* =========================================================
           TABLAS
        ========================================================= */

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            padding: 11px 9px;
            background: #f3f5f6;
            color: #455565;
            border-bottom: 1px solid #dfe3e8;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 11px 9px;
            border-bottom: 1px solid #e6e9ed;
            vertical-align: middle;
        }

        tbody tr:hover td {
            background: #fafbfc;
        }

        .acciones-tabla {
            display: flex;
            gap: 5px;
        }

        .codigo {
            font-weight: 700;
        }

        .enlace-equipo {
            color: #d60916;
            font-weight: 700;
            cursor: pointer;
        }

        .enlace-equipo:hover {
            text-decoration: underline;
        }

        /* =========================================================
           ESTADOS
        ========================================================= */

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .vigente {
            background: #def7e8;
            color: #17854b;
        }

        .proximo {
            background: #fff0cc;
            color: #c98200;
        }

        .vencido {
            background: #fde0e2;
            color: #d91f2b;
        }

        .neutro {
            background: #edf1f4;
            color: #66788a;
        }

        .semaforo-punto {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 7px;
            border-radius: 50%;
            vertical-align: -1px;
        }

        .punto-verde {
            background: #20a35b;
        }

        .punto-amarillo {
            background: #e6a400;
        }

        .punto-rojo {
            background: #dc303c;
        }

        .punto-gris {
            background: #a8b1ba;
        }

        /* =========================================================
           DASHBOARD
        ========================================================= */

        .resumen {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 18px;
        }

        .resumen-card {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 17px;
            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 13px;
        }

        .resumen-icono {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
        }

        .verde-bg {
            background: #dcf8e8;
        }

        .amarillo-bg {
            background: #fff3d8;
        }

        .rojo-bg {
            background: #fde4e6;
        }

        .resumen-titulo {
            color: #66788a;
            font-size: 12px;
        }

        .resumen-numero {
            margin-top: 2px;
            font-size: 24px;
            font-weight: 800;
        }

        .dashboard-dos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* =========================================================
           FICHAS
        ========================================================= */

        .ficha-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .ficha-dato {
            padding: 12px;
            background: #f7f8fa;
            border-radius: 9px;
        }

        .ficha-label {
            color: #71808f;
            font-size: 11px;
        }

        .ficha-valor {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 700;
        }

        .estado-ficha {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .estado-ficha-card {
            padding: 15px;
            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 12px;
            text-align: center;
        }

        .estado-ficha-titulo {
            margin-bottom: 9px;
            color: #71808f;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .calificacion-bloque {
            overflow: hidden;
            border: 1px solid #e1e5e9;
            border-radius: 12px;
        }

        .calificacion-cabecera {
            padding: 13px 15px;
            background: #f5f6f7;
            font-size: 16px;
            font-weight: 800;
        }

        .no-aplica {
            padding: 25px;
            background: #fafbfc;
            color: #748291;
            text-align: center;
        }

        .modo-consulta {
            margin-bottom: 18px;
            padding: 9px 12px;
            background: #e7f1ff;
            color: #196cb8;
            border-radius: 8px;
            font-size: 12px;
        }

        /* =========================================================
           CALIBRACIÓN TERRENO
        ========================================================= */

        .campo-terreno {
            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }

        .instrumento-seleccionado {
            margin: 15px 0;
            padding: 18px;
            background: #f7f8fa;
            border-radius: 12px;
        }

        .accion-calibrar {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background: #159447;
            color: #ffffff;
            font-size: 17px;
        }

        .calibrado-ok {
            margin-top: 14px;
            padding: 14px;
            background: #eaf8ef;
            color: #14733a;
            border-radius: 10px;
            font-weight: 700;
        }

        .carga-excel {
            padding: 35px;
            background: #fafbfc;
            border: 2px dashed #d4dae0;
            border-radius: 14px;
            text-align: center;
        }

        /* =========================================================
           DOCUMENTACIÓN
        ========================================================= */

        .documentos-categorias {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .documento-categoria {
            padding: 15px;
            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 12px;
            cursor: pointer;
        }

        .documento-categoria:hover {
            border-color: #e30613;
        }

        .documento-categoria-titulo {
            color: #66788a;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .documento-categoria-numero {
            margin-top: 5px;
            font-size: 24px;
            font-weight: 800;
        }

        .filtros-documentacion {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* =========================================================
           KPI
        ========================================================= */

        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .kpi-chart {
            padding: 20px;
            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 14px;
        }

        .chart-wrap {
            position: relative;
            max-width: 430px;
            height: 280px;
            margin: auto;
        }

        .kpi-detalle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .kpi-estado {
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .kpi-estado.verde {
            background: #eefaf3;
        }

        .kpi-estado.rojo {
            background: #fff0f1;
        }

        .kpi-estado-cantidad {
            margin-top: 3px;
            font-size: 23px;
            font-weight: 800;
        }

        /* =========================================================
           LOGIN
        ========================================================= */

        .login-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
        }

        .login-card {
            width: 360px;
            max-width: 90%;
            padding: 24px;
            background: #ffffff;
            border-radius: 14px;
        }

        .login-error {
            display: none;
            margin-bottom: 10px;
            color: #d91f2b;
            font-size: 12px;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1150px) {
            .dashboard-dos,
            .kpi-grid {
                grid-template-columns: 1fr;
            }

            .ficha-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .documentos-categorias {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 190px;
            }

            .contenido {
                margin-left: 190px;
                padding: 15px;
            }

            .logo-imagen {
                width: 140px;
            }

            .form-grid,
            .resumen,
            .ficha-grid,
            .estado-ficha,
            .filtros-documentacion,
            .documentos-categorias {
                grid-template-columns: 1fr;
            }

            .completo {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<!-- =========================================================
     MENÚ LATERAL
========================================================= -->

<aside class="sidebar">

    <div class="logo-box">
        <img src="logo prater.png" alt="Laboratorios Prater" class="logo-imagen">

        <div class="logo-subtitulo">
            Sistemas de Apoyo Crítico y Metrología
        </div>

        <div class="logo-descripcion">
            LABORATORIOS PRATER
        </div>
    </div>

    <ul class="menu" id="menuPrincipal">

        <li data-modulo="calificacion" class="activo" onclick="abrirModulo('calificacion')">

        </li>

        <li data-modulo="calibracion" onclick="abrirModulo('calibracion')">

        <li data-modulo="agua" onclick="abrirModulo('agua')">

    <div class="sidebar-bottom">

        <div class="sidebar-label">

        </div>

        <div class="usuario-box">

            <div class="usuario-area" id="areaUsuario"></div>
        </div>

            class="btn-login"
            id="btnAcceso"
            onclick="abrirLogin()"
        >
            🔐 Acceso administrador
        </button>

        <button

        </button>

</aside>

<!-- =========================================================
     CONTENIDO
========================================================= -->

<main class="contenido" id="contenido"></main>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginModal" style="display:none">

    <div class="login-overlay">

        <div class="login-card">

            <h2>Acceso administrador</h2>

            <div class="login-error" id="loginError">

                <button
                    class="btn-principal"
                    onclick="iniciarSesion()"

                    Ingresar
                </button>

                <button
                    class="btn-secundario"
                    onclick="cerrarLogin()"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

const ADMIN_USUARIO = "admin";
const ADMIN_CLAVE = "SACM2026";

const DIAS_PROXIMO_VENCIMIENTO = 180;

let esAdmin = sessionStorage.getItem("adminSACM") === "true";
let moduloActual = "calificacion";

let equipoEditando = null;
let calificacionEditando = null;
let manualEditando = null;

let equipoCalibracionEditando = null;
let registroCalibracionEditando = null;

let documentoEditando = null;

let graficosKPI = [];

/* =========================================================
   DATOS
========================================================= */

let equipos = cargarLocalStorage("equipos", []);
let calificaciones = cargarLocalStorage("calificaciones", []);
let manuales = cargarLocalStorage("manuales", []);

let equiposCalibracion = cargarLocalStorage("equiposCalibracion", []);
let registrosCalibracion = cargarLocalStorage("registrosCalibracion", []);

let documentosSACM = cargarLocalStorage("documentosSACM", []);

/* Migración segura de datos antiguos */

equipos = equipos.map(equipo => ({
    codigo: equipo.codigo || "",
    nombre: equipo.nombre || "",
    area: equipo.area || "",
    ubicacion: equipo.ubicacion || "",
    aplicaPQ: equipo.aplicaPQ !== false
}));

equiposCalibracion = equiposCalibracion.map(equipo => ({
    codigo: equipo.codigo || "",
    nombre: equipo.nombre || "",
    area: equipo.area || "",
    ubicacion: equipo.ubicacion || "",
    tipo: equipo.tipo || ""
}));

guardarDatos();

/* =========================================================
   LOCAL STORAGE
========================================================= */

function cargarLocalStorage(clave, valorDefecto) {
    try {
        const contenido = localStorage.getItem(clave);

        if (!contenido) {
            return valorDefecto;
        }

        return JSON.parse(contenido);

    } catch (error) {
        console.error("Error leyendo localStorage:", clave, error);
        return valorDefecto;
    }
}

function guardarDatos() {

    localStorage.setItem(
        "equipos",
        JSON.stringify(equipos)
    );

    localStorage.setItem(
        "calificaciones",
        JSON.stringify(calificaciones)
    );

    localStorage.setItem(
        "manuales",
        JSON.stringify(manuales)
    );

    localStorage.setItem(
        "equiposCalibracion",
        JSON.stringify(equiposCalibracion)
    );

    localStorage.setItem(
        "registrosCalibracion",
        JSON.stringify(registrosCalibracion)
    );

    localStorage.setItem(
        "documentosSACM",
        JSON.stringify(documentosSACM)
    );
}

/* =========================================================
   FUNCIONES GENERALES
========================================================= */

function obtenerValor(id) {
    const elemento = document.getElementById(id);

    if (!elemento) {
        return "";
    }

    return elemento.value.trim();
}

function obtenerSelect(id) {
    const elemento = document.getElementById(id);

    if (!elemento) {
        return "";
    }

    return elemento.value;
}

function escaparHTML(valor) {
    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escaparJS(valor) {
    return String(valor ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

function fechaBonita(fecha) {

    if (!fecha) {
        return "—";
    }

    const partes = fecha.split("-");

    if (partes.length !== 3) {
        return fecha;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function fechaHoyISO() {

    const hoy = new Date();

    const año = hoy.getFullYear();
    const mes = String(hoy.getMonth() + 1).padStart(2, "0");
    const dia = String(hoy.getDate()).padStart(2, "0");

    return `${año}-${mes}-${dia}`;
}

function sumarAnios(fecha, cantidad) {

    if (!fecha) {
        return "";
    }

    const [año, mes, dia] = fecha.split("-").map(Number);

    let nuevaFecha = new Date(
        año + cantidad,
        mes - 1,
        dia
    );

    /*
        Corrige casos como 29 de febrero.
    */

    if (nuevaFecha.getMonth() !== mes - 1) {
        nuevaFecha = new Date(
            año + cantidad,
            mes,
            0
        );
    }

    return [
        nuevaFecha.getFullYear(),
        String(nuevaFecha.getMonth() + 1).padStart(2, "0"),
        String(nuevaFecha.getDate()).padStart(2, "0")
    ].join("-");
}

function abrirLogin() {

    document.getElementById("loginModal").style.display = "block";

    document.getElementById("loginUsuario").value = "";
    document.getElementById("loginClave").value = "";

    document.getElementById("loginError").style.display = "none";

    setTimeout(() => {
        document.getElementById("loginUsuario").focus();
    }, 50);
}

function cerrarLogin() {
    document.getElementById("loginModal").style.display = "none";
}

function iniciarSesion() {

    const usuario = obtenerValor("loginUsuario");
    const clave = document.getElementById("loginClave").value;

    if (
        usuario === ADMIN_USUARIO &&
        clave === ADMIN_CLAVE
    ) {

        esAdmin = true;

        sessionStorage.setItem(
            "adminSACM",
            "true"
        );

        cerrarLogin();
        actualizarUsuario();
        abrirModulo(moduloActual);

        return;
    }

    document.getElementById("loginError").style.display = "block";
}

function cerrarSesion() {

    if (!confirm("¿Cerrar la sesión de administrador?")) {
        return;
    }

    esAdmin = false;

    sessionStorage.removeItem(
        "adminSACM"
    );

    actualizarUsuario();

    if (moduloActual === "kpi") {
        abrirModulo("calificacion");
    } else {
        abrirModulo(moduloActual);
    }
}

/* =========================================================
   ESTADOS
========================================================= */

function estadoFecha(fecha) {

    if (!fecha) {

        return {
            texto: "Sin fecha",
            clase: "neutro",
            nivel: 0
        };
    }

    const hoy = new Date();

    hoy.setHours(
        0,
        0,
        0,
        0
    );

    const vencimiento = new Date(
        fecha + "T00:00:00"
    );

    const diferenciaDias = Math.ceil(
        (vencimiento - hoy) / 86400000
    );

    if (diferenciaDias < 0) {

        return {
            texto: "Vencido",
            clase: "vencido",
            nivel: 3
        };
    }

    if (
        diferenciaDias <= DIAS_PROXIMO_VENCIMIENTO
    ) {

        return {
            texto: "Próximo",
            clase: "proximo",
            nivel: 2
        };
    }

    return {
        texto: "Vigente",
        clase: "vigente",
        nivel: 1
    };
}

function puntoEstado(estado) {

    let clasePunto = "punto-gris";

    if (estado.clase === "vigente") {
        clasePunto = "punto-verde";
    }

    if (estado.clase === "proximo") {
        clasePunto = "punto-amarillo";
    }

    if (estado.clase === "vencido") {
        clasePunto = "punto-rojo";
    }

    return `
        <span class="semaforo-punto ${clasePunto}"></span>
        <span class="badge ${estado.clase}">
            ${estado.texto}
        </span>
    `;
}

function contarEstados(lista) {

    const resultado = {
        vigentes: 0,
        proximos: 0,
        vencidos: 0
    };

    lista.forEach(registro => {

        const estado = estadoFecha(
            registro.vencimiento || registro.vigencia
        );

        if (estado.clase === "vigente") {
            resultado.vigentes++;
        }

        if (estado.clase === "proximo") {
            resultado.proximos++;
        }

        if (estado.clase === "vencido") {
            resultado.vencidos++;
        }
    });

    return resultado;
}

function obtenerEstadoTipoCalificacion(codigoEquipo, tipo) {

    const documentos = obtenerDocumentosActualesCalificacion(
        codigoEquipo,
        tipo
    );

    if (!documentos.length) {

        return {
            texto: "Sin registros",
            clase: "neutro",
            nivel: 0
        };
    }

    let peorEstado = {
        texto: "Vigente",
        clase: "vigente",
        nivel: 1
    };

    documentos.forEach(documento => {

        const estado = estadoFecha(
            documento.vencimiento
        );

        if (estado.nivel > peorEstado.nivel) {
            peorEstado = estado;
        }
    });

    return peorEstado;
}

/*
    Para evitar que versiones históricas vencidas
    vuelvan rojo un equipo que tiene una versión nueva,
    se usa el documento más reciente de cada combinación:
    tipo + documento.
*/

function obtenerDocumentosActualesCalificacion(codigoEquipo, tipo) {

    const registros = calificaciones.filter(registro =>
        registro.equipoCodigo === codigoEquipo &&
        registro.tipo === tipo
    );

    const actuales = {};

    registros.forEach(registro => {

        const clave = registro.documento;

        if (!actuales[clave]) {
            actuales[clave] = registro;
            return;
        }

        const fechaActual = new Date(
            actuales[clave].fecha || "1900-01-01"
        );

        const fechaNueva = new Date(
            registro.fecha || "1900-01-01"
        );

        if (fechaNueva >= fechaActual) {
            actuales[clave] = registro;
        }
    });

    return Object.values(actuales);
}

function estadoGeneralCalificacion(codigoEquipo) {

    const equipo = equipos.find(
        elemento => elemento.codigo === codigoEquipo
    );

    const estados = [
        obtenerEstadoTipoCalificacion(
            codigoEquipo,
            "IQ"
        ),

        obtenerEstadoTipoCalificacion(
            codigoEquipo,
            "OQ"
        )
    ];

    if (equipo?.aplicaPQ) {

        estados.push(
            obtenerEstadoTipoCalificacion(
                codigoEquipo,
                "PQ"
            )
        );
    }

    const registrosManual = manuales.filter(
        manual =>
            manual.equipoCodigo === codigoEquipo
    );

    if (registrosManual.length) {

        const manualActual = [...registrosManual].sort(
            (a, b) =>
                new Date(b.vencimiento) -
                new Date(a.vencimiento)
        )[0];

        estados.push(
            estadoFecha(
                manualActual.vencimiento
            )
        );
    }

    let peor = {
        texto: "Sin registros",
        clase: "neutro",
        nivel: 0
    };

    estados.forEach(estado => {

        if (estado.nivel > peor.nivel) {
            peor = estado;
        }
    });

    return peor;
}

function tablaEstadoCalificacion() {

    if (!equipos.length) {

        return `
            <div class="subdato">
                No hay equipos registrados.
            </div>
        `;
    }

    let html = `

        <div class="tabla-contenedor">

            <table>

                <thead>
                    <tr>
                        <th>Equipo</th>
                        <th>Nombre</th>
                        <th>Área</th>
                        <th>Ubicación</th>
                        <th>IQ</th>
                        <th>OQ</th>
                        <th>PQ</th>
                        <th>Manual</th>
                        <th>Estado general</th>
                    </tr>
                </thead>

                <tbody>
    `;

    equipos.forEach((equipo, indice) => {

        const iq = obtenerEstadoTipoCalificacion(
            equipo.codigo,
            "IQ"
        );

        const oq = obtenerEstadoTipoCalificacion(
            equipo.codigo,
            "OQ"
        );

        const pq = equipo.aplicaPQ
            ? obtenerEstadoTipoCalificacion(
                equipo.codigo,
                "PQ"
            )
            : null;

        const manualesEquipo = manuales.filter(
            manual =>
                manual.equipoCodigo === equipo.codigo
        );

        let estadoManual = {
            texto: "Sin registros",
            clase: "neutro",
            nivel: 0
        };

        if (manualesEquipo.length) {

            const ultimo = [...manualesEquipo].sort(
                (a, b) =>
                    new Date(b.vencimiento) -
                    new Date(a.vencimiento)
            )[0];

            estadoManual = estadoFecha(
                ultimo.vencimiento
            );
        }

        const general =
            estadoGeneralCalificacion(
                equipo.codigo
            );

        html += `

            <tr>

                <td>
                    <span
                        class="enlace-equipo"
                        onclick="verFichaCalificacion(${indice})"
                    >
                        ${escaparHTML(equipo.codigo)}
                    </span>
                </td>

                <td>
                    ${escaparHTML(equipo.nombre)}
                </td>

                <td>
                    ${escaparHTML(equipo.area)}
                </td>

                <td>
                    ${escaparHTML(equipo.ubicacion) || "—"}
                </td>

                <td>
                    ${puntoEstado(iq)}
                </td>

                <td>
                    ${puntoEstado(oq)}
                </td>

                <td>
                    ${
                        equipo.aplicaPQ
                            ? puntoEstado(pq)
                            : `<span class="badge neutro">No aplica</span>`
                    }
                </td>

                <td>
                    ${puntoEstado(estadoManual)}
                </td>

                <td>
                    ${puntoEstado(general)}
                </td>

            </tr>
        `;
    });

    html += `
                </tbody>

            </table>

        </div>
    `;

    return html;
}

function guardarEquipoCalificacion() {

    if (!esAdmin) {
        return;
    }

    const equipo = {
        codigo: obtenerValor("eqCodigo"),
        nombre: obtenerValor("eqNombre"),
        area: obtenerValor("eqArea"),
        ubicacion: obtenerValor("eqUbicacion"),
        aplicaPQ:
            obtenerSelect("eqAplicaPQ") === "si"
    };

    if (
        !equipo.codigo ||
        !equipo.nombre ||
        !equipo.area
    ) {

        alert(
            "Completa código, nombre y área."
        );

        return;
    }

    const duplicado = equipos.findIndex(
        (elemento, indice) =>
            elemento.codigo.toLowerCase() ===
                equipo.codigo.toLowerCase() &&
            indice !== equipoEditando
    );

    if (duplicado !== -1) {

        alert(
            "Ya existe un equipo con ese código."
        );

        return;
    }

    if (equipoEditando === null) {

        equipos.push(equipo);

    } else {

        const codigoAnterior =
            equipos[equipoEditando].codigo;

        equipos[equipoEditando] = equipo;

        /*
            Si cambia el código, se actualizan
            los registros relacionados.
        */

        if (
            codigoAnterior !== equipo.codigo
        ) {

            calificaciones.forEach(registro => {

                if (
                    registro.equipoCodigo === codigoAnterior
                ) {

                    registro.equipoCodigo =
                        equipo.codigo;

                    registro.equipoNombre =
                        equipo.nombre;
                }
            });

            manuales.forEach(registro => {

                if (
                    registro.equipoCodigo === codigoAnterior
                ) {

                    registro.equipoCodigo =
                        equipo.codigo;

                    registro.equipoNombre =
                        equipo.nombre;
                }
            });
        }
    }

    guardarDatos();
    mostrarEquiposCalificacion();
}

function editarEquipoCalificacion(indice) {

    if (!esAdmin) {
        return;
    }

    const equipo = equipos[indice];

    nuevoEquipoCalificacion();

    equipoEditando = indice;

    document.getElementById("eqCodigo").value =
        equipo.codigo;

    document.getElementById("eqNombre").value =
        equipo.nombre;

    document.getElementById("eqArea").value =
        equipo.area;

    document.getElementById("eqUbicacion").value =
        equipo.ubicacion || "";

    document.getElementById("eqAplicaPQ").value =
        equipo.aplicaPQ
        ? "si"
        : "no";
}

function eliminarEquipoCalificacion(indice) {

    if (!esAdmin) {
        return;
    }

    const equipo = equipos[indice];

    const cantidadCalificaciones =
        calificaciones.filter(
            registro =>
                registro.equipoCodigo === equipo.codigo
        ).length;

    const cantidadManuales =
        manuales.filter(
            registro =>
                registro.equipoCodigo === equipo.codigo
        ).length;

    const mensaje =
        `¿Eliminar ${equipo.codigo} - ${equipo.nombre}?` +
        `\n\nTambién se eliminarán:` +
        `\nCalificaciones: ${cantidadCalificaciones}` +
        `\nManuales: ${cantidadManuales}`;

    if (!confirm(mensaje)) {
        return;
    }

    equipos.splice(
        indice,
        1
    );

    calificaciones = calificaciones.filter(
        registro =>
            registro.equipoCodigo !== equipo.codigo
    );

    manuales = manuales.filter(
        registro =>
            registro.equipoCodigo !== equipo.codigo
    );

    guardarDatos();
    renderTablaEquiposCalificacion();
}

function cerrarFormularioEquipoCalificacion() {

    if (contenedor) {

}

function renderTablaEquiposCalificacion() {

    const contenedor =
        document.getElementById(
            "tablaEquiposCalificacion"
        );

    if (!contenedor) {
        return;
    }

    const busqueda =
        (
            document.getElementById(
                "buscarEquipoCalificacion"
            )?.value || ""
        ).toLowerCase();

    const lista = equipos.filter(
        equipo =>
            [

function actualizarTiposCalificacion() {

    const codigo =
        obtenerSelect("calEquipo");

    const equipo =
        equipos.find(
            elemento =>
                elemento.codigo === codigo
        );

    const selector =
        document.getElementById(
            "calTipo"
        );

    if (!selector) {
        return;
    }

    const tipoAnterior =
        selector.value;

    const tipos = [
        "IQ",
        "OQ"
    ];

    if (equipo?.aplicaPQ) {
        tipos.push("PQ");
    }

    selector.innerHTML =
        tipos.map(tipo => `

            <option
                value="${tipo}"
                ${
                    tipo === tipoAnterior
                    ? "selected"
                    : ""
                }
            >
                ${tipo}
            </option>

        `).join("");

    generarCodigoCalificacion();
}

function generarCodigoCalificacion() {

    const equipo =
        obtenerSelect("calEquipo");

    const tipo =
        obtenerSelect("calTipo");

    const documento =
        obtenerSelect("calDocumento");

    const version =
        obtenerValor("calVersion");

    const campoCodigo =
        document.getElementById(
            "calCodigo"
        );

    if (!campoCodigo) {
        return;
    }

    if (
        !equipo ||
        !tipo ||
        !documento ||
        !version
    ) {

        campoCodigo.value = "";
        return;
    }

    const prefijos = {

        IQ: {
            Protocolo: "PCI",
            Reporte: "RCI"
        },

        OQ: {
            Protocolo: "PCO",
            Reporte: "RCO"
        },

        PQ: {
            Protocolo: "PCD",
            Reporte: "RCD"
        }
    };

    campoCodigo.value =
        `${prefijos[tipo][documento]}-${equipo}-${version}`;
}

function actualizarVencimientoCalificacion() {

    const fecha =
        obtenerValor("calFecha");

    const vencimiento =
        document.getElementById(
            "calVencimiento"
        );

    if (!vencimiento) {
        return;
    }

    vencimiento.value =
        sumarAnios(
            fecha,
            5
        );
}

function guardarCalificacion() {

    if (!esAdmin) {
        return;
    }

    generarCodigoCalificacion();
    actualizarVencimientoCalificacion();

    const codigoEquipo =
        obtenerSelect("calEquipo");

    const equipo =
        equipos.find(
            elemento =>
                elemento.codigo === codigoEquipo
        );

    const registro = {

        equipoCodigo:
            codigoEquipo,

        equipoNombre:
            equipo?.nombre || "",

        tipo:
            obtenerSelect("calTipo"),

        documento:
            obtenerSelect("calDocumento"),

        version:
            obtenerValor("calVersion"),

        codigo:
            obtenerValor("calCodigo"),

        fecha:
            obtenerValor("calFecha"),

        vencimiento:
            obtenerValor("calVencimiento")
    };

    if (
        !registro.equipoCodigo ||
        !registro.tipo ||
        !registro.documento ||
        !registro.version ||
        !registro.fecha
    ) {

        alert(
            "Completa todos los campos obligatorios."
        );

        return;
    }

    if (calificacionEditando === null) {

        calificaciones.push(
            registro
        );

    } else {

        calificaciones[
            calificacionEditando
        ] = registro;
    }

    guardarDatos();
    mostrarCalificaciones();
}

function editarCalificacion(indice) {

    if (!esAdmin) {
        return;
    }

    const registro =
        calificaciones[indice];

    mostrarCalificaciones();

    nuevaCalificacion(
        registro.equipoCodigo
    );

    calificacionEditando =
        indice;

    document.getElementById("calEquipo").value =
        registro.equipoCodigo;

    actualizarTiposCalificacion();

    document.getElementById("calTipo").value =
        registro.tipo;

    document.getElementById("calDocumento").value =
        registro.documento;

    document.getElementById("calVersion").value =
        registro.version;

    document.getElementById("calFecha").value =
        registro.fecha;

    actualizarVencimientoCalificacion();
    generarCodigoCalificacion();
}

function eliminarCalificacion(indice) {

    if (!esAdmin) {

    const registro =

        ? obtenerEstadoTipoCalificacion(

        );

function obtenerUltimaCalibracion(
    codigoEquipo
) {

    const lista =
        registrosCalibracion
            .filter(
                registro =>
                    registro.equipoCodigo === codigoEquipo
            )
            .sort(
                (a, b) =>
                    new Date(b.fecha) -
                    new Date(a.fecha)
            );

    return lista[0] || null;
}

function obtenerEstadoEquipoMetrologia(
    codigoEquipo
) {

    const ultima =
        obtenerUltimaCalibracion(
            codigoEquipo
        );

    if (!ultima) {

        return {
            texto: "Sin registro",
            clase: "neutro",
            nivel: 0
        };
    }

    return estadoFecha(
        ultima.vencimiento
    );
}

    moduloActual = "calibracion";

    let proximos = 0;

    equiposCalibracion.forEach(
        equipo => {

                obtenerEstadoEquipoMetrologia(
                    equipo.codigo

            if (estado.clase === "vigente") {
                vigentes++;

            if (estado.clase === "proximo") {

function guardarEquipoMetrologia() {

    if (!esAdmin) {
        return;
    }

    const equipo = {

        codigo:
            obtenerValor("metEqCodigo"),

        nombre:
            obtenerValor("metEqNombre"),

        area:
            obtenerValor("metEqArea"),

        ubicacion:
            obtenerValor("metEqUbicacion"),

        tipo:
            obtenerValor("metEqTipo")
    };

    if (
        !equipo.codigo ||
        !equipo.nombre ||
        !equipo.area
    ) {

        alert(
            "Completa código, nombre y área."
        );

        return;
    }

    const duplicado =
        equiposCalibracion.findIndex(
            (elemento, indice) =>
                elemento.codigo.toLowerCase() ===
                    equipo.codigo.toLowerCase() &&
                indice !== equipoCalibracionEditando
        );

    if (duplicado !== -1) {

        alert(
            "Ya existe un instrumento con ese código."
        );

        return;
    }

    if (
        equipoCalibracionEditando === null
    ) {

        equiposCalibracion.push(
            equipo
        );

    } else {

        const codigoAnterior =
            equiposCalibracion[
                equipoCalibracionEditando
            ].codigo;

        equiposCalibracion[
            equipoCalibracionEditando
        ] = equipo;

        if (
            codigoAnterior !== equipo.codigo
        ) {

            registrosCalibracion.forEach(
                registro => {

                    if (
                        registro.equipoCodigo === codigoAnterior
                    ) {

                        registro.equipoCodigo =
                            equipo.codigo;

                        registro.equipoNombre =
                            equipo.nombre;
                    }
                }
            );
        }
    }

    guardarDatos();
    mostrarEquiposMetrologia();
}

function editarEquipoMetrologia(indice) {

    if (!esAdmin) {
        return;
    }

    const equipo =
        equiposCalibracion[indice];

    nuevoEquipoMetrologia();

    equipoCalibracionEditando =
        indice;

    document.getElementById("metEqCodigo").value =
        equipo.codigo;

    document.getElementById("metEqNombre").value =
        equipo.nombre;

    document.getElementById("metEqArea").value =
        equipo.area;

    document.getElementById("metEqUbicacion").value =
        equipo.ubicacion || "";

    document.getElementById("metEqTipo").value =
        equipo.tipo || "";
}

function eliminarEquipoMetrologia(indice) {

    if (!esAdmin) {
        return;
    }

    const equipo =
        equiposCalibracion[indice];

    const registrosRelacionados =
        registrosCalibracion.filter(
            registro =>
                registro.equipoCodigo === equipo.codigo
        ).length;

    if (
        !confirm(
            `¿Eliminar ${equipo.codigo} - ${equipo.nombre}?` +
            `\n\nTambién se eliminarán ${registrosRelacionados} calibraciones del historial.`
        )
    ) {
        return;
    }

    equiposCalibracion.splice(
        indice,
        1
    );

    registrosCalibracion =
        registrosCalibracion.filter(
            registro =>
                registro.equipoCodigo !== equipo.codigo
        );

    guardarDatos();
    renderTablaEquiposMetrologia();
}

function cerrarFormularioEquipoMetrologia() {

    const formulario =
        document.getElementById(
            "formEquipoMetrologia"

    if (formulario) {
        formulario.innerHTML = "";

function renderTablaEquiposMetrologia() {

    const contenedor =
        document.getElementById(
            "tablaEquiposMetrologia"
        );

    if (!contenedor) {
        return;
    }

    const busqueda =
        (
            document.getElementById(
                "buscarEquipoMetrologia"
            )?.value || ""
        ).toLowerCase();

    const lista =
        equiposCalibracion.filter(
            equipo =>
                [
                    equipo.codigo,
                    equipo.nombre,
                    equipo.area,
                    equipo.ubicacion,
                    equipo.tipo
                ].some(
                    valor =>
                        String(valor || "")
                            .toLowerCase()
                            .includes(busqueda)
                )
        );

    let html = `

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Área</th>
                        <th>Ubicación</th>
                        <th>Tipo</th>
                        <th>Estado</th>

                        ${
                            esAdmin
                            ? `<th>Acciones</th>`
                            : ""
                        }

                    </tr>

                </thead>

                <tbody>
    `;

    lista.forEach(equipo => {

        const indice =
            equiposCalibracion.indexOf(
                equipo
            );

        html += `

            <tr>

                <td>

                    <span
                        class="enlace-equipo"
                        onclick="verFichaMetrologia(${indice})"
                    >
                        ${escaparHTML(equipo.codigo)}
                    </span>

                </td>

                <td>
                    ${escaparHTML(equipo.nombre)}
                </td>

                <td>
                    ${escaparHTML(equipo.area)}
                </td>

                <td>
                    ${escaparHTML(equipo.ubicacion) || "—"}
                </td>

                <td>
                    ${escaparHTML(equipo.tipo) || "—"}
                </td>

                <td>
                    ${puntoEstado(
                        obtenerEstadoEquipoMetrologia(
                            equipo.codigo
                        )
                    )}
                </td>

                ${
                    esAdmin
                    ? `
                        <td>

                            <div class="acciones-tabla">

                                <button
                                    class="btn-editar"
                                    onclick="editarEquipoMetrologia(${indice})"
                                >
                                    ✎
                                </button>

                                <button
                                    class="btn-eliminar"

                                >
                                    🗑
                                </button>

                            </div>

                        </td>
                    `
                    : ""
                }

            </tr>
        `;
    });

    html += `

    contenedor.innerHTML = html;
}

    if (!esAdmin) {
        return;

    actualizarVencimientoMetrologia();

    const codigoEquipo =
        obtenerSelect("metEquipo");

    const equipo =
        equiposCalibracion.find(
            elemento =>
                elemento.codigo === codigoEquipo
        );

    const registro = {

        equipoCodigo:
            codigoEquipo,

        equipoNombre:
            equipo?.nombre || "",

        certificado:
            obtenerValor("metCertificado") || "Pendiente",

        fecha:
            obtenerValor("metFecha"),

        vencimiento:
            obtenerValor("metVencimiento"),

        proveedor:
            obtenerValor("metProveedor")
    };

    if (
        !registro.equipoCodigo ||
        !registro.fecha
    ) {

        alert(
            "Debes seleccionar un equipo e ingresar la fecha de calibración."
        );

        return;
    }

    if (
        registroCalibracionEditando === null
    ) {

        registrosCalibracion.push(
            registro
        );

    } else {

        registrosCalibracion[
            registroCalibracionEditando
        ] = registro;
    }

    guardarDatos();
    mostrarRegistrosCalibracion();
}

function editarRegistroCalibracion(indice) {

    if (!esAdmin) {
        return;
    }

    const registro =
        registrosCalibracion[indice];

    mostrarRegistrosCalibracion();

    nuevaCalibracionMetrologia(
        registro.equipoCodigo
    );

    registroCalibracionEditando =
        indice;

    document.getElementById("metEquipo").value =
        registro.equipoCodigo;

    document.getElementById("metCertificado").value =
        registro.certificado === "Pendiente"
        ? ""
        : registro.certificado;

    document.getElementById("metFecha").value =
        registro.fecha;

    document.getElementById("metProveedor").value =

function descargarPlantillaMetrologia() {

        XLSX.utils.json_to_sheet([
            {
                "Código": "E1169/EF",

function obtenerColumna(
    fila,
    nombres
) {

    for (const nombre of nombres) {

        if (
            fila[nombre] !== undefined &&
            fila[nombre] !== null &&
            fila[nombre] !== ""
        ) {

            return String(
                fila[nombre]
            ).trim();
        }
    }

    return "";
}

function normalizarFechaExcel(valor) {

    if (!valor) {
        return "";
    }

    if (valor instanceof Date) {

        return [
            valor.getFullYear(),
            String(valor.getMonth() + 1).padStart(2, "0"),
            String(valor.getDate()).padStart(2, "0")
        ].join("-");
    }

    if (typeof valor === "number") {

        const fecha =
            XLSX.SSF.parse_date_code(
                valor
            );

        if (!fecha) {
            return "";
        }

        return [
            fecha.y,
            String(fecha.m).padStart(2, "0"),
            String(fecha.d).padStart(2, "0")
        ].join("-");
    }

    const texto =
        String(valor).trim();

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(texto)
    ) {
        return texto;
    }

    const coincidencia =
        texto.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (coincidencia) {

        return [
            coincidencia[3],
            String(coincidencia[2]).padStart(2, "0"),
            String(coincidencia[1]).padStart(2, "0")
        ].join("-");
    }

    return "";
}

function importarExcelMetrologia(evento) {

    if (!esAdmin) {
        return;
    }

    const archivo =
        evento.target.files[0];

    if (!archivo) {
        return;
    }

    const lector =
        new FileReader();

    lector.onload = eventoLectura => {

        try {

            const libro =
                XLSX.read(
                    new Uint8Array(
                        eventoLectura.target.result
                    ),
                    {
                        type: "array",
                        cellDates: true
                    }
                );

            const hoja =
                libro.Sheets[
                    libro.SheetNames[0]
                ];

            const filas =
                XLSX.utils.sheet_to_json(
                    hoja,
                    {
                        defval: ""
                    }
                );

            let equiposNuevos = 0;
            let calibracionesNuevas = 0;
            let omitidas = 0;

            filas.forEach(fila => {

                const codigo =
                    obtenerColumna(
                        fila,
                        [
                            "Código",
                            "Codigo"
                        ]
                    );

                const nombre =
                    obtenerColumna(
                        fila,
                        [
                            "Nombre"
                        ]
                    );

                const area =
                    obtenerColumna(
                        fila,
                        [
                            "Área",
                            "Area"
                        ]
                    );

                const ubicacion =
                    obtenerColumna(
                        fila,
                        [
                            "Ubicación",
                            "Ubicacion"
                        ]
                    );

                const tipo =
                    obtenerColumna(
                        fila,
                        [
                            "Tipo"
                        ]
                    );

                const certificado =
                    obtenerColumna(
                        fila,
                        [
                            "N° Certificado",
                            "Nº Certificado",
                            "Certificado"
                        ]
                    );

                const proveedor =
                    obtenerColumna(
                        fila,
                        [
                            "Laboratorio / Proveedor",
                            "Proveedor",
                            "Laboratorio"
                        ]
                    );

                const fecha =
                    normalizarFechaExcel(
                        fila["Fecha Calibración"] ||
                        fila["Fecha Calibracion"]
                    );

                if (
                    !codigo ||
                    !nombre ||
                    !area
                ) {

                    omitidas++;
                    return;
                }

                let equipo =
                    equiposCalibracion.find(
                        elemento =>
                            elemento.codigo === codigo
                    );

                if (!equipo) {

                    equipo = {
                        codigo,
                        nombre,
                        area,
                        ubicacion,
                        tipo
                    };

                    equiposCalibracion.push(
                        equipo
                    );

                    equiposNuevos++;
                }

                if (!fecha) {
                    return;
                }

                const duplicado =
                    registrosCalibracion.some(
                        registro =>
                            registro.equipoCodigo === codigo &&
                            registro.fecha === fecha &&
                            registro.certificado ===
                                (certificado || "Pendiente")
                    );

                if (duplicado) {

                    omitidas++;
                    return;
                }

                registrosCalibracion.push({

                    equipoCodigo:
                        codigo,

                    equipoNombre:
                        nombre,

                    certificado:
                        certificado || "Pendiente",

                    fecha,

                    vencimiento:
                        sumarAnios(
                            fecha,
                            1
                        ),

                    proveedor
                });

                calibracionesNuevas++;
            });

            guardarDatos();

            alert(
                `Carga completada.` +
                `\n\nEquipos nuevos: ${equiposNuevos}` +
                `\nCalibraciones nuevas: ${calibracionesNuevas}` +
                `\nFilas omitidas: ${omitidas}`
            );

            mostrarInicioMetrologia();

        } catch (error) {

            console.error(error);

            alert(
                "No fue posible leer el archivo Excel."
            );
        }
    };

    lector.readAsArrayBuffer(
        archivo
    );

    evento.target.value = "";
}

function guardarDocumentoSACM() {

    if (!esAdmin) {
        return;
    }

    const documento = {

        tipo:
            obtenerSelect("docTipo"),

        codigo:
            obtenerValor("docCodigo"),

        nombre:
            obtenerValor("docNombre"),

        emision:
            obtenerValor("docEmision"),

        vigencia:
            obtenerValor("docVigencia")
    };

    if (
        !documento.tipo ||
        !documento.codigo ||
        !documento.nombre ||
        !documento.emision ||
        !documento.vigencia
    ) {

        alert(
            "Completa todos los campos obligatorios."
        );

        return;
    }

    if (
        new Date(documento.vigencia) <
        new Date(documento.emision)
    ) {

        alert(
            "La fecha de vigencia no puede ser anterior a la fecha de emisión."
        );

        return;
    }

    const duplicado =
        documentosSACM.findIndex(
            (elemento, indice) =>
                elemento.codigo.toLowerCase() ===
                    documento.codigo.toLowerCase() &&
                indice !== documentoEditando
        );

    if (duplicado !== -1) {

        alert(
            "Ya existe un documento con ese código."
        );

        return;
    }

    if (documentoEditando === null) {

        documentosSACM.push(
            documento
        );

    } else {

        documentosSACM[
            documentoEditando
        ] = documento;
    }

    guardarDatos();
    mostrarDocumentosSACM();
}

function editarDocumentoSACM(indice) {

    if (!esAdmin) {
        return;
    }

    const documento =
        documentosSACM[indice];

    nuevoDocumentoSACM();

    documentoEditando =
        indice;

    document.getElementById("docTipo").value =
        documento.tipo;

    document.getElementById("docCodigo").value =
        documento.codigo;

    document.getElementById("docNombre").value =
        documento.nombre;

    document.getElementById("docEmision").value =
        documento.emision;

    document.getElementById("docVigencia").value =
        documento.vigencia;

    document.getElementById(
        "formDocumentoSACM"
    ).scrollIntoView({
        behavior: "smooth"
    });
}

function eliminarDocumentoSACM(indice) {

    if (!esAdmin) {
        return;
    }

    const documento =
        documentosSACM[indice];

    if (
        !confirm(
            `¿Eliminar ${documento.codigo} - ${documento.nombre}?`
        )
    ) {
        return;
    }

    documentosSACM.splice(
        indice,
        1
    );

    guardarDatos();
    renderTablaDocumentosSACM();
}

    const formulario =
        document.getElementById(

}

function renderTablaDocumentosSACM() {

    const contenedor =
        document.getElementById(
            "tablaDocumentosSACM"
        );

    if (!contenedor) {
        return;
    }

    const busqueda =
        (
            document.getElementById(
                "buscarDocumentoSACM"
            )?.value || ""
        ).toLowerCase();

    const tipo =
        obtenerSelect(
            "filtroTipoDocumento"
        );

    const estadoFiltro =
        obtenerSelect(
            "filtroEstadoDocumento"
        );

    const lista =
        documentosSACM
            .filter(documento => {

                const coincideBusqueda =
                    [
                        documento.codigo,
                        documento.nombre
                    ].some(
                        valor =>
                            String(valor || "")
                                .toLowerCase()
                                .includes(busqueda)
                    );

                const coincideTipo =
                    !tipo ||
                    documento.tipo === tipo;

                const estado =
                    estadoFecha(
                        documento.vigencia
                    );

                const coincideEstado =
                    !estadoFiltro ||
                    estado.clase === estadoFiltro;

                return (
                    coincideBusqueda &&
                    coincideTipo &&
                    coincideEstado
                );
            })
            .sort(
                (a, b) =>
                    a.tipo.localeCompare(
                        b.tipo
                    ) ||
                    a.codigo.localeCompare(
                        b.codigo
                    )
            );

    let html = `

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>
                        <th>Tipo</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Emisión</th>
                        <th>Vigencia</th>
                        <th>Estado</th>

                        ${
                            esAdmin
                            ? `<th>Acciones</th>`
                            : ""
                        }

                    </tr>

                </thead>

                <tbody>
    `;

    lista.forEach(documento => {

        const indice =
            documentosSACM.indexOf(
                documento
            );

        const estado =
            estadoFecha(
                documento.vigencia
            );

        html += `

            <tr>

                <td>
                    ${escaparHTML(documento.tipo)}
                </td>

                <td class="codigo">
                    ${escaparHTML(documento.codigo)}
                </td>

                <td>
                    ${escaparHTML(documento.nombre)}
                </td>

                <td>
                    ${fechaBonita(documento.emision)}
                </td>

                <td>
                    ${fechaBonita(documento.vigencia)}
                </td>

                <td>
                    ${puntoEstado(estado)}
                </td>

                ${
                    esAdmin
                    ? `
                        <td>

                            <div class="acciones-tabla">

                                <button
                                    class="btn-editar"
                                    onclick="editarDocumentoSACM(${indice})"
                                >
                                    ✎
                                </button>

                                <button
                                    class="btn-eliminar"
                                    onclick="eliminarDocumentoSACM(${indice})"
                                >
                                    🗑
                                </button>

                            </div>

                        </td>
                    `
                    : ""
                }

            </tr>
        `;
    });

    html += `
                </tbody>

            </table>

        </div>
    `;

    contenedor.innerHTML = html;
}

function obtenerKPIQualificacionTipo(tipo) {

    const listaEquipos =
        tipo === "PQ"
        ? equipos.filter(
            equipo =>
                equipo.aplicaPQ
        )
        : equipos;

    const resultado = {
        total: listaEquipos.length,
        vigente: 0,
        vencido: 0
    };

    listaEquipos.forEach(equipo => {

        const documentos =
            obtenerDocumentosActualesCalificacion(
                equipo.codigo,
                tipo
            );

        if (!documentos.length) {

            resultado.vencido++;
            return;
        }

        const tieneVencido =
            documentos.some(
                documento =>
                    estadoFecha(
                        documento.vencimiento
                    ).clase === "vencido"
            );

        if (tieneVencido) {
            resultado.vencido++;
        } else {
            resultado.vigente++;
        }
    });

    return resultado;
}

function obtenerKPIEquiposCompletos() {

    const resultado = {
        total: equipos.length,
        vigente: 0,
        vencido: 0
    };

    equipos.forEach(equipo => {

        const tipos = [
            "IQ",
            "OQ"
        ];

        if (equipo.aplicaPQ) {
            tipos.push("PQ");
        }

        const completo =
            tipos.every(tipo => {

                const documentos =
                    obtenerDocumentosActualesCalificacion(
                        equipo.codigo,
                        tipo
                    );

                if (!documentos.length) {
                    return false;
                }

                return documentos.every(
                    documento =>
                        estadoFecha(
                            documento.vencimiento
                        ).clase !== "vencido"
                );
            });

        if (completo) {
            resultado.vigente++;
        } else {
            resultado.vencido++;
        }
    });

    return resultado;
}

function obtenerKPIMetrologia() {

    const resultado = {
        total: equiposCalibracion.length,
        vigente: 0,
        vencido: 0
    };

    equiposCalibracion.forEach(
        equipo => {

            const ultima =
                obtenerUltimaCalibracion(
                    equipo.codigo
                );

            if (!ultima) {

                resultado.vencido++;
                return;
            }

            const estado =
                estadoFecha(
                    ultima.vencimiento
                );

            if (
                estado.clase === "vencido"
            ) {

                resultado.vencido++;

            } else {

                resultado.vigente++;
            }
        }
    );

    return resultado;
}

function obtenerKPIDocumentacion() {

    const resultado = {
        total: documentosSACM.length,
        vigente: 0,
        vencido: 0
    };

    documentosSACM.forEach(
        documento => {

            const estado =
                estadoFecha(
                    documento.vigencia
                );

            if (
                estado.clase === "vencido"
            ) {

                resultado.vencido++;

            } else {

                resultado.vigente++;
            }
        }
    );

    return resultado;
}

function calcularPorcentaje(
    valor,
    total
) {

    if (!total) {
        return 0;
    }

    return Math.round(
        (valor / total) * 100
    );
}

function cajaGraficoKPI(
    titulo,
    datos,
    id
) {

    return `

        <div class="kpi-chart">

            <h3>
                ${titulo}
            </h3>

            <div class="subdato">
                Total considerado:
                ${datos.total}
            </div>

            <div class="chart-wrap">

                <canvas id="${id}"></canvas>

            </div>

            <div class="kpi-detalle">

                <div class="kpi-estado verde">

                    <strong>
                        Vigentes
                    </strong>

                    <div class="kpi-estado-cantidad">
                        ${datos.vigente}
                    </div>

                    <div>
                        ${calcularPorcentaje(
                            datos.vigente,
                            datos.total
                        )}%
                    </div>

                </div>

                <div class="kpi-estado rojo">

                    <strong>
                        Vencidos
                    </strong>

                    <div class="kpi-estado-cantidad">
                        ${datos.vencido}
                    </div>

                    <div>
                        ${calcularPorcentaje(
                            datos.vencido,
                            datos.total
                        )}%
                    </div>

                </div>

            </div>

        </div>
    `;
}

function crearGraficoKPI(
    id,
    datos
) {

    const canvas =
        document.getElementById(id);

    if (
        !canvas ||
        typeof Chart === "undefined"
    ) {
        return;
    }

    let valores = [
        datos.vigente,
        datos.vencido
    ];

    let etiquetas = [
        "Vigente",
        "Vencido"
    ];

    if (datos.total === 0) {

        valores = [1];
        etiquetas = [
            "Sin registros"
        ];
    }

    const grafico =
        new Chart(
            canvas,
            {
                type: "doughnut",

                data: {
                    labels:
                        etiquetas,

                    datasets: [
                        {
                            data:
                                valores,

                            backgroundColor:
                                datos.total
                                ? [
                                    "#28a65a",
                                    "#dc3545"
                                ]
                                : [
                                    "#d7dce0"
                                ],

                            borderColor:
                                "#ffffff",

                            borderWidth:
                                4
                        }
                    ]
                },

                options: {

                    responsive:
                        true,

                    maintainAspectRatio:
                        false,

                    cutout:
                        "60%",

                    plugins: {

                        legend: {
                            position:
                                "bottom"
                        },

                        tooltip: {

                            callbacks: {

                                label(contexto) {

                                    if (!datos.total) {
                                        return " Sin registros";
                                    }

                                    const porcentaje =
                                        calcularPorcentaje(
                                            contexto.raw,
                                            datos.total
                                        );

                                    return (
                                        ` ${contexto.label}: ` +
                                        `${contexto.raw} (${porcentaje}%)`
                                    );
                                }
                            }
                        }
                    }
                }
            }
        );

    graficosKPI.push(
        grafico
    );
}

function destruirGraficosKPI() {

    graficosKPI.forEach(
        grafico => {

            try {
                grafico.destroy();
            } catch (error) {
                console.error(error);
            }
        }
    );

    graficosKPI = [];
}
