<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Equipos Calificados</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    background: #1f2937;
    color: white;
    padding-top: 20px;
}

.logo {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    padding: 15px;
    border-bottom: 1px solid #374151;
    margin-bottom: 15px;
}

.menu {
    list-style: none;
    padding: 0;
    margin: 0;
}

.menu li {
    padding: 15px 20px;
    cursor: pointer;
    border-left: 4px solid transparent;
}

.menu li:hover,
.menu li.activo {
    background: #374151;
    border-left: 4px solid #60a5fa;
}

.contenido {
    margin-left: 230px;
    padding: 30px;
}

h1 {
    margin-top: 0;
    color: #1f2937;
}

h2 {
    color: #1f2937;
}

.tarjeta {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.resumen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.resumen-card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.resumen-card .numero {
    font-size: 30px;
    font-weight: bold;
    color: #2563eb;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 14px;
}

input[readonly] {
    background: #f3f4f6;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-grid .completo {
    grid-column: span 2;
}

button {
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 6px;
}

.btn-principal {
    background: #2563eb;
    color: white;
}

.btn-principal:hover {
    background: #1d4ed8;
}

.btn-secundario {
    background: #6b7280;
    color: white;
}

.btn-verde {
    background: #16a34a;
    color: white;
}

.btn-rojo {
    background: #dc2626;
    color: white;
}

.btn-amarillo {
    background: #d97706;
    color: white;
}

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: white;
}

th {
    background: #1f2937;
    color: white;
    padding: 11px;
    text-align: left;
    white-space: nowrap;
}

td {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
}

tr:hover {
    background: #f9fafb;
}

.estado {
    padding: 5px 8px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
}

.estado-activo {
    background: #dcfce7;
    color: #166534;
}

.estado-mantenimiento {
    background: #fef3c7;
    color: #92400e;
}

.estado-fuera {
    background: #fee2e2;
    color: #991b1b;
}

.vigente {
    background: #dcfce7;
    color: #166534;
    padding: 5px 8px;
    border-radius: 5px;
    font-weight: bold;
    font-size: 12px;
}

.proximo {
    background: #fef3c7;
    color: #92400e;
    padding: 5px 8px;
    border-radius: 5px;
    font-weight: bold;
    font-size: 12px;
}

.vencido {
    background: #fee2e2;
    color: #991b1b;
    padding: 5px 8px;
    border-radius: 5px;
    font-weight: bold;
    font-size: 12px;
}

.codigo-generado {
    font-size: 16px;
    font-weight: bold;
    color: #2563eb;
}

.oculto {
    display: none;
}

.info {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 4px;
}

.acciones {
    white-space: nowrap;
}

@media (max-width: 800px) {
    .sidebar {
        width: 180px;
    }

    .contenido {
        margin-left: 180px;
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-grid .completo {
        grid-column: span 1;
    }
}
</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        Gestión de Equipos
    </div>

    <ul class="menu">
        <li onclick="mostrarPagina('inicio', this)" class="activo">
            🏠 Inicio
        </li>

        <li onclick="mostrarPagina('equipos', this)">
            ⚙️ Equipos
        </li>

        <li onclick="mostrarPagina('calificaciones', this)">
            📋 Calificaciones
        </li>

        <li onclick="mostrarPagina('documentos', this)">
            📄 Documentos
        </li>

        <li onclick="mostrarPagina('configuracion', this)">
            ⚙️ Configuración
        </li>
    </ul>

</div>

<div class="contenido" id="contenido"></div>

<script>

let equipos = JSON.parse(localStorage.getItem("equipos")) || [];
let calificaciones = JSON.parse(localStorage.getItem("calificaciones")) || [];

let equipoEditando = null;
let calificacionEditando = null;


/* =========================================================
   GUARDAR DATOS
========================================================= */

function guardarDatos() {

    localStorage.setItem("equipos", JSON.stringify(equipos));
    localStorage.setItem("calificaciones", JSON.stringify(calificaciones));

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function mostrarPagina(pagina, elemento) {

    document.querySelectorAll(".menu li").forEach(li => {
        li.classList.remove("activo");
    });

    if (elemento) {
        elemento.classList.add("activo");
    }

    if (pagina === "inicio") {
        mostrarInicio();
    }

    if (pagina === "equipos") {
        mostrarEquipos();
    }

    if (pagina === "calificaciones") {
        mostrarCalificaciones();
    }

    if (pagina === "documentos") {
        mostrarDocumentos();
    }

    if (pagina === "configuracion") {
        mostrarConfiguracion();
    }

}


/* =========================================================
   INICIO
========================================================= */

function mostrarInicio() {

    let activos = equipos.filter(e => e.estado === "Activo").length;

    let reportesVencidos = calificaciones.filter(c => {

        return c.documento === "Reporte" &&
               c.vencimiento &&
               new Date(c.vencimiento) < new Date();

    }).length;


    document.getElementById("contenido").innerHTML = `

        <h1>Inicio</h1>

        <div class="resumen">

            <div class="resumen-card">
                <div>Equipos registrados</div>
                <div class="numero">${equipos.length}</div>
            </div>

            <div class="resumen-card">
                <div>Equipos activos</div>
                <div class="numero">${activos}</div>
            </div>

            <div class="resumen-card">
                <div>Calificaciones</div>
                <div class="numero">${calificaciones.length}</div>
            </div>

            <div class="resumen-card">
                <div>Reportes vencidos</div>
                <div class="numero">${reportesVencidos}</div>
            </div>

        </div>

        <div class="tarjeta">

            <h2>Gestión de Equipos Calificados</h2>

            <p>
                Sistema para controlar equipos, calificaciones,
                protocolos y reportes.
            </p>

            <p>
                Los reportes tienen una vigencia automática de
                <strong>5 años</strong> desde su fecha de emisión.
            </p>

        </div>

    `;

}


/* =========================================================
   EQUIPOS
========================================================= */

function mostrarEquipos() {

    document.getElementById("contenido").innerHTML = `

        <h1>Equipos</h1>

        <div class="tarjeta">

            <button class="btn-principal"
                    onclick="nuevoEquipo()">
                + Nuevo equipo
            </button>

            <button class="btn-verde"
                    onclick="document.getElementById('archivoExcel').click()">
                📥 Importar Excel
            </button>

            <button class="btn-secundario"
                    onclick="descargarPlantilla()">
                📊 Descargar plantilla
            </button>

            <input
                type="file"
                id="archivoExcel"
                accept=".xlsx,.xls"
                style="display:none"
                onchange="importarExcel(event)"
            >

        </div>

        <div id="formularioEquipo"></div>

        <div class="tarjeta">

            <h2>Equipos registrados</h2>

            <input
                type="text"
                id="busquedaEquipo"
                placeholder="Buscar por código, nombre, área, ubicación..."
                oninput="buscarEquipos()"
            >

            <div id="tablaEquipos"></div>

        </div>

    `;

    mostrarTablaEquipos();

}


function nuevoEquipo() {

    equipoEditando = null;

    document.getElementById("formularioEquipo").innerHTML = `

        <div class="tarjeta">

            <h2>Nuevo equipo</h2>

            <div class="form-grid">

                <div>
                    <label>Código</label>
                    <input id="codigoEquipo">
                </div>

                <div>
                    <label>Nombre del equipo</label>
                    <input id="nombreEquipo">
                </div>

                <div>
                    <label>Área</label>
                    <input id="areaEquipo">
                </div>

                <div>
                    <label>Ubicación</label>
                    <input id="ubicacionEquipo">
                </div>

                <div>
                    <label>Fabricante</label>
                    <input id="fabricanteEquipo">
                </div>

                <div>
                    <label>Modelo</label>
                    <input id="modeloEquipo">
                </div>

                <div>
                    <label>N.º de serie</label>
                    <input id="serieEquipo">
                </div>

                <div>
                    <label>Estado</label>

                    <select id="estadoEquipo">

                        <option>Activo</option>
                        <option>En mantenimiento</option>
                        <option>Fuera de servicio</option>

                    </select>

                </div>

            </div>

            <button class="btn-principal"
                    onclick="guardarEquipo()">
                Guardar equipo
            </button>

            <button class="btn-secundario"
                    onclick="cancelarFormularioEquipo()">
                Cancelar
            </button>

        </div>

    `;

}


function guardarEquipo() {

    let equipo = {

        codigo: document.getElementById("codigoEquipo").value.trim(),
        nombre: document.getElementById("nombreEquipo").value.trim(),
        area: document.getElementById("areaEquipo").value.trim(),
        ubicacion: document.getElementById("ubicacionEquipo").value.trim(),
        fabricante: document.getElementById("fabricanteEquipo").value.trim(),
        modelo: document.getElementById("modeloEquipo").value.trim(),
        serie: document.getElementById("serieEquipo").value.trim(),
        estado: document.getElementById("estadoEquipo").value

    };


    if (!equipo.codigo || !equipo.nombre) {

        alert("Debes ingresar al menos el código y el nombre del equipo.");

        return;

    }


    if (equipoEditando === null) {

        equipos.push(equipo);

    } else {

        equipos[equipoEditando] = equipo;

    }


    guardarDatos();

    document.getElementById("formularioEquipo").innerHTML = "";

    mostrarTablaEquipos();

    alert("Equipo guardado correctamente.");

}


function editarEquipo(indice) {

    let equipo = equipos[indice];

    equipoEditando = indice;


    document.getElementById("formularioEquipo").innerHTML = `

        <div class="tarjeta">

            <h2>Editar equipo</h2>

            <div class="form-grid">

                <div>
                    <label>Código</label>
                    <input id="codigoEquipo"
                           value="${escapeHTML(equipo.codigo)}">
                </div>

                <div>
                    <label>Nombre del equipo</label>
                    <input id="nombreEquipo"
                           value="${escapeHTML(equipo.nombre)}">
                </div>

                <div>
                    <label>Área</label>
                    <input id="areaEquipo"
                           value="${escapeHTML(equipo.area)}">
                </div>

                <div>
                    <label>Ubicación</label>
                    <input id="ubicacionEquipo"
                           value="${escapeHTML(equipo.ubicacion)}">
                </div>

                <div>
                    <label>Fabricante</label>
                    <input id="fabricanteEquipo"
                           value="${escapeHTML(equipo.fabricante)}">
                </div>

                <div>
                    <label>Modelo</label>
                    <input id="modeloEquipo"
                           value="${escapeHTML(equipo.modelo)}">
                </div>

                <div>
                    <label>N.º de serie</label>
                    <input id="serieEquipo"
                           value="${escapeHTML(equipo.serie)}">
                </div>

                <div>
                    <label>Estado</label>

                    <select id="estadoEquipo">

                        <option ${equipo.estado === "Activo" ? "selected" : ""}>
                            Activo
                        </option>

                        <option ${equipo.estado === "En mantenimiento" ? "selected" : ""}>
                            En mantenimiento
                        </option>

                        <option ${equipo.estado === "Fuera de servicio" ? "selected" : ""}>
                            Fuera de servicio
                        </option>

                    </select>

                </div>

            </div>

            <button class="btn-principal"
                    onclick="guardarEquipo()">
                Guardar cambios
            </button>

            <button class="btn-secundario"
                    onclick="cancelarFormularioEquipo()">
                Cancelar
            </button>

        </div>

    `;

}


function cancelarFormularioEquipo() {

    document.getElementById("formularioEquipo").innerHTML = "";

    equipoEditando = null;

}


function eliminarEquipo(indice) {

    let equipo = equipos[indice];

    if (!confirm(
        "¿Seguro que deseas eliminar el equipo " +
        equipo.codigo + "?"
    )) {
        return;
    }


    equipos.splice(indice, 1);

    guardarDatos();

    mostrarTablaEquipos();

}


function buscarEquipos() {

    mostrarTablaEquipos(
        document.getElementById("busquedaEquipo").value
    );

}


function mostrarTablaEquipos(filtro = "") {

    let texto = filtro.toLowerCase();

    let lista = equipos.filter(e => {

        return (
            (e.codigo || "").toLowerCase().includes(texto) ||
            (e.nombre || "").toLowerCase().includes(texto) ||
            (e.area || "").toLowerCase().includes(texto) ||
            (e.ubicacion || "").toLowerCase().includes(texto) ||
            (e.fabricante || "").toLowerCase().includes(texto) ||
            (e.modelo || "").toLowerCase().includes(texto) ||
            (e.serie || "").toLowerCase().includes(texto)
        );

    });


    let html = `

        <div class="tabla-contenedor">

        <table>

            <thead>

                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Área</th>
                    <th>Ubicación</th>
                    <th>Fabricante</th>
                    <th>Modelo</th>
                    <th>N.º de serie</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

    `;


    lista.forEach(equipo => {

        let indice = equipos.indexOf(equipo);

        let claseEstado = "";

        if (equipo.estado === "Activo") {
            claseEstado = "estado-activo";
        }

        if (equipo.estado === "En mantenimiento") {
            claseEstado = "estado-mantenimiento";
        }

        if (equipo.estado === "Fuera de servicio") {
            claseEstado = "estado-fuera";
        }


        html += `

            <tr>

                <td><strong>${escapeHTML(equipo.codigo)}</strong></td>

                <td>${escapeHTML(equipo.nombre)}</td>

                <td>${escapeHTML(equipo.area)}</td>

                <td>${escapeHTML(equipo.ubicacion)}</td>

                <td>${escapeHTML(equipo.fabricante)}</td>

                <td>${escapeHTML(equipo.modelo)}</td>

                <td>${escapeHTML(equipo.serie)}</td>

                <td>
                    <span class="estado ${claseEstado}">
                        ${escapeHTML(equipo.estado)}
                    </span>
                </td>

                <td class="acciones">

                    <button class="btn-amarillo"
                            onclick="editarEquipo(${indice})">
                        Editar
                    </button>

                    <button class="btn-rojo"
                            onclick="eliminarEquipo(${indice})">
                        Eliminar
                    </button>

                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

        </div>

    `;


    document.getElementById("tablaEquipos").innerHTML = html;

}


/* =========================================================
   IMPORTAR EXCEL
========================================================= */

function importarExcel(event) {

    let archivo = event.target.files[0];

    if (!archivo) return;


    let lector = new FileReader();


    lector.onload = function(e) {

        try {

            let datos = new Uint8Array(e.target.result);

            let libro = XLSX.read(datos, {
                type: "array"
            });

            let hoja = libro.Sheets[libro.SheetNames[0]];

            let filas = XLSX.utils.sheet_to_json(hoja);


            let nuevos = 0;


            filas.forEach(fila => {

                let codigo = obtenerColumna(
                    fila,
                    ["Código", "Codigo", "codigo"]
                );

                let nombre = obtenerColumna(
                    fila,
                    ["Nombre del equipo", "Nombre", "nombre"]
                );

                if (!codigo || !nombre) return;


                let equipo = {

                    codigo: codigo,
                    nombre: nombre,

                    area: obtenerColumna(
                        fila,
                        ["Área", "Area", "area"]
                    ),

                    ubicacion: obtenerColumna(
                        fila,
                        ["Ubicación", "Ubicacion", "ubicacion"]
                    ),

                    fabricante: obtenerColumna(
                        fila,
                        ["Fabricante", "fabricante"]
                    ),

                    modelo: obtenerColumna(
                        fila,
                        ["Modelo", "modelo"]
                    ),

                    serie: obtenerColumna(
                        fila,
                        [
                            "N.º de serie",
                            "N° de serie",
                            "Nº de serie",
                            "Numero de serie",
                            "N.º Serie",
                            "Serie"
                        ]
                    ),

                    estado: obtenerColumna(
                        fila,
                        ["Estado", "estado"]
                    ) || "Activo"

                };


                let existe = equipos.some(
                    x => x.codigo === equipo.codigo
                );


                if (!existe) {

                    equipos.push(equipo);

                    nuevos++;

                }

            });


            guardarDatos();

            mostrarTablaEquipos();

            alert(
                "Importación terminada.\n\n" +
                "Equipos nuevos agregados: " + nuevos
            );


        } catch (error) {

            alert(
                "No se pudo leer el archivo Excel."
            );

            console.error(error);

        }

    };


    lector.readAsArrayBuffer(archivo);

    event.target.value = "";

}


function obtenerColumna(fila, nombres) {

    for (let nombre of nombres) {

        if (
            fila[nombre] !== undefined &&
            fila[nombre] !== null
        ) {

            return String(fila[nombre]).trim();

        }

    }

    return "";

}


/* =========================================================
   PLANTILLA EXCEL
========================================================= */

function descargarPlantilla() {

    let datos = [

        {
            "Código": "E780/EF",
            "Nombre del equipo": "Envasadora de Gotas",
            "Área": "Producción",
            "Ubicación": "Línea de Envasado",
            "Fabricante": "Fabricante ejemplo",
            "Modelo": "Modelo ejemplo",
            "N.º de serie": "SN-0001",
            "Estado": "Activo"
        },

        {
            "Código": "E781/EF",
            "Nombre del equipo": "Disco de Arrastre",
            "Área": "Producción",
            "Ubicación": "Línea de Envasado",
            "Fabricante": "Fabricante ejemplo",
            "Modelo": "Modelo ejemplo",
            "N.º de serie": "SN-0002",
            "Estado": "Activo"
        }

    ];


    let hoja = XLSX.utils.json_to_sheet(datos);

    let libro = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        libro,
        hoja,
        "Equipos"
    );


    XLSX.writeFile(
        libro,
        "Plantilla_Equipos.xlsx"
    );

}


/* =========================================================
   CALIFICACIONES
========================================================= */

function mostrarCalificaciones() {

    document.getElementById("contenido").innerHTML = `

        <h1>Calificaciones</h1>

        <div class="tarjeta">

            <button class="btn-principal"
                    onclick="nuevaCalificacion()">
                + Nueva calificación
            </button>

        </div>

        <div id="formularioCalificacion"></div>

        <div class="tarjeta">

            <h2>Registro de protocolos y reportes</h2>

            <input
                type="text"
                id="busquedaCalificacion"
                placeholder="Buscar por equipo, código o tipo..."
                oninput="buscarCalificaciones()"
            >

            <div id="tablaCalificaciones"></div>

        </div>

    `;


    mostrarTablaCalificaciones();

}


function nuevaCalificacion() {

    if (equipos.length === 0) {

        alert(
            "Primero debes registrar al menos un equipo."
        );

        return;

    }


    calificacionEditando = null;


    let opcionesEquipos = "";

    equipos.forEach((equipo, indice) => {

        opcionesEquipos += `

            <option value="${indice}">
                ${escapeHTML(equipo.codigo)}
                - ${escapeHTML(equipo.nombre)}
            </option>

        `;

    });


    document.getElementById(
        "formularioCalificacion"
    ).innerHTML = `

        <div class="tarjeta">

            <h2>Nueva calificación</h2>

            <div class="info">

                El código se generará automáticamente según
                el tipo de calificación, documento, equipo y versión.

            </div>

            <div class="form-grid">

                <div class="completo">

                    <label>Equipo</label>

                    <select
                        id="calEquipo"
                        onchange="generarCodigoCalificacion()">

                        <option value="">
                            Seleccionar equipo
                        </option>

                        ${opcionesEquipos}

                    </select>

                </div>


                <div>

                    <label>Tipo de calificación</label>

                    <select
                        id="calTipo"
                        onchange="generarCodigoCalificacion()">

                        <option value="">
                            Seleccionar
                        </option>

                        <option value="IQ">
                            IQ
                        </option>

                        <option value="OQ">
                            OQ
                        </option>

                        <option value="PQ">
                            PQ
                        </option>

                    </select>

                </div>


                <div>

                    <label>Tipo de documento</label>

                    <select
                        id="calDocumento"
                        onchange="generarCodigoCalificacion()">

                        <option value="">
                            Seleccionar
                        </option>

                        <option value="Protocolo">
                            Protocolo
                        </option>

                        <option value="Reporte">
                            Reporte
                        </option>

                    </select>

                </div>


                <div>

                    <label>Versión</label>

                    <input
                        type="text"
                        id="calVersion"
                        placeholder="Ejemplo: 04"
                        oninput="generarCodigoCalificacion()"
                    >

                </div>


                <div>

                    <label>Fecha de emisión</label>

                    <input
                        type="date"
                        id="calFecha"
                        onchange="calcularVencimiento()"
                    >

                </div>


                <div id="campoVencimiento">

                    <label>Fecha de vencimiento</label>

                    <input
                        type="date"
                        id="calVencimiento"
                        readonly
                    >

                </div>


                <div class="completo">

                    <label>Código generado</label>

                    <input
                        type="text"
                        id="calCodigo"
                        class="codigo-generado"
                        readonly
                        placeholder="Se generará automáticamente"
                    >

                </div>

            </div>


            <button
                class="btn-principal"
                onclick="guardarCalificacion()">

                Guardar

            </button>


            <button
                class="btn-secundario"
                onclick="cancelarCalificacion()">

                Cancelar

            </button>

        </div>

    `;


    document.getElementById("calFecha").value =
        obtenerFechaActual();


    calcularVencimiento();

}


function generarCodigoCalificacion() {

    let equipoIndice =
        document.getElementById("calEquipo").value;

    let tipo =
        document.getElementById("calTipo").value;

    let documento =
        document.getElementById("calDocumento").value;

    let version =
        document.getElementById("calVersion").value.trim();


    let codigoCampo =
        document.getElementById("calCodigo");


    if (
        equipoIndice === "" ||
        tipo === "" ||
        documento === "" ||
        version === ""
    ) {

        codigoCampo.value = "";

        return;

    }


    let equipo = equipos[equipoIndice];


    let prefijo = "";


    if (documento === "Protocolo") {

        if (tipo === "IQ") prefijo = "PCI";
        if (tipo === "OQ") prefijo = "PCO";
        if (tipo === "PQ") prefijo = "PCD";

    }


    if (documento === "Reporte") {

        if (tipo === "IQ") prefijo = "RCI";
        if (tipo === "OQ") prefijo = "RCO";
        if (tipo === "PQ") prefijo = "RCD";

    }


    codigoCampo.value =
        prefijo +
        "-" +
        equipo.codigo +
        "-" +
        version;


    calcularVencimiento();

}


function calcularVencimiento() {

    let documento =
        document.getElementById("calDocumento");

    let fecha =
        document.getElementById("calFecha");

    let vencimiento =
        document.getElementById("calVencimiento");

    if (!documento || !fecha || !vencimiento) {
        return;
    }


    if (
        documento.value === "Reporte" &&
        fecha.value
    ) {

        let fechaOriginal =
            new Date(fecha.value + "T00:00:00");


        fechaOriginal.setFullYear(
            fechaOriginal.getFullYear() + 5
        );


        vencimiento.value =
            formatearFechaInput(fechaOriginal);

    } else {

        vencimiento.value = "";

    }

}


function guardarCalificacion() {

    let equipoIndice =
        document.getElementById("calEquipo").value;

    let tipo =
        document.getElementById("calTipo").value;

    let documento =
        document.getElementById("calDocumento").value;

    let version =
        document.getElementById("calVersion").value.trim();

    let fecha =
        document.getElementById("calFecha").value;

    let codigo =
        document.getElementById("calCodigo").value;

    let vencimiento =
        document.getElementById("calVencimiento").value;


    if (
        equipoIndice === "" ||
        !tipo ||
        !documento ||
        !version ||
        !fecha
    ) {

        alert(
            "Completa todos los campos obligatorios."
        );

        return;

    }


    let equipo = equipos[equipoIndice];


    let registro = {

        equipoCodigo: equipo.codigo,

        equipoNombre: equipo.nombre,

        tipo: tipo,

        documento: documento,

        version: version,

        codigo: codigo,

        fecha: fecha,

        vencimiento:
            documento === "Reporte"
                ? vencimiento
                : ""

    };


    if (calificacionEditando === null) {

        calificaciones.push(registro);

    } else {

        calificaciones[calificacionEditando] =
            registro;

    }


    guardarDatos();

    document.getElementById(
        "formularioCalificacion"
    ).innerHTML = "";

    mostrarTablaCalificaciones();

    alert(
        "Registro guardado correctamente."
    );

}


function cancelarCalificacion() {

    document.getElementById(
        "formularioCalificacion"
    ).innerHTML = "";

    calificacionEditando = null;

}


/* =========================================================
   EDITAR CALIFICACIÓN
========================================================= */

function editarCalificacion(indice) {

    let registro = calificaciones[indice];

    calificacionEditando = indice;


    let opcionesEquipos = "";

    equipos.forEach((equipo, i) => {

        let seleccionado =
            equipo.codigo === registro.equipoCodigo
                ? "selected"
                : "";


        opcionesEquipos += `

            <option value="${i}" ${seleccionado}>

                ${escapeHTML(equipo.codigo)}
                - ${escapeHTML(equipo.nombre)}

            </option>

        `;

    });


    document.getElementById(
        "formularioCalificacion"
    ).innerHTML = `

        <div class="tarjeta">

            <h2>Editar calificación</h2>

            <div class="form-grid">

                <div class="completo">

                    <label>Equipo</label>

                    <select
                        id="calEquipo"
                        onchange="generarCodigoCalificacion()">

                        ${opcionesEquipos}

                    </select>

                </div>


                <div>

                    <label>Tipo de calificación</label>

                    <select
                        id="calTipo"
                        onchange="generarCodigoCalificacion()">

                        <option value="IQ"
                            ${registro.tipo === "IQ" ? "selected" : ""}>
                            IQ
                        </option>

                        <option value="OQ"
                            ${registro.tipo === "OQ" ? "selected" : ""}>
                            OQ
                        </option>

                        <option value="PQ"
                            ${registro.tipo === "PQ" ? "selected" : ""}>
                            PQ
                        </option>

                    </select>

                </div>


                <div>

                    <label>Tipo de documento</label>

                    <select
                        id="calDocumento"
                        onchange="generarCodigoCalificacion()">

                        <option value="Protocolo"
                            ${registro.documento === "Protocolo" ? "selected" : ""}>
                            Protocolo
                        </option>

                        <option value="Reporte"
                            ${registro.documento === "Reporte" ? "selected" : ""}>
                            Reporte
                        </option>

                    </select>

                </div>


                <div>

                    <label>Versión</label>

                    <input
                        type="text"
                        id="calVersion"
                        value="${escapeHTML(registro.version)}"
                        oninput="generarCodigoCalificacion()"
                    >

                </div>


                <div>

                    <label>Fecha de emisión</label>

                    <input
                        type="date"
                        id="calFecha"
                        value="${registro.fecha}"
                        onchange="calcularVencimiento()"
                    >

                </div>


                <div>

                    <label>Fecha de vencimiento</label>

                    <input
                        type="date"
                        id="calVencimiento"
                        value="${registro.vencimiento || ""}"
                        readonly
                    >

                </div>


                <div class="completo">

                    <label>Código generado</label>

                    <input
                        type="text"
                        id="calCodigo"
                        class="codigo-generado"
                        value="${escapeHTML(registro.codigo)}"
                        readonly
                    >

                </div>

            </div>


            <button
                class="btn-principal"
                onclick="guardarCalificacion()">

                Guardar cambios

            </button>


            <button
                class="btn-secundario"
                onclick="cancelarCalificacion()">

                Cancelar

            </button>

        </div>

    `;


    generarCodigoCalificacion();

}


function eliminarCalificacion(indice) {

    let registro =
        calificaciones[indice];


    if (!confirm(
        "¿Seguro que deseas eliminar el registro " +
        registro.codigo +
        "?"
    )) {

        return;

    }


    calificaciones.splice(indice, 1);

    guardarDatos();

    mostrarTablaCalificaciones();

}


/* =========================================================
   TABLA CALIFICACIONES
========================================================= */

function buscarCalificaciones() {

    mostrarTablaCalificaciones(
        document.getElementById(
            "busquedaCalificacion"
        ).value
    );

}


function mostrarTablaCalificaciones(
    filtro = ""
) {

    let texto =
        filtro.toLowerCase();


    let lista =
        calificaciones.filter(c => {

            return (

                (c.equipoCodigo || "")
                    .toLowerCase()
                    .includes(texto)

                ||

                (c.equipoNombre || "")
                    .toLowerCase()
                    .includes(texto)

                ||

                (c.codigo || "")
                    .toLowerCase()
                    .includes(texto)

                ||

                (c.tipo || "")
                    .toLowerCase()
                    .includes(texto)

                ||

                (c.documento || "")
                    .toLowerCase()
                    .includes(texto)

            );

        });


    let html = `

        <div class="tabla-contenedor">

        <table>

            <thead>

                <tr>

                    <th>Equipo</th>

                    <th>Calificación</th>

                    <th>Documento</th>

                    <th>Código</th>

                    <th>Versión</th>

                    <th>Fecha emisión</th>

                    <th>Fecha vencimiento</th>

                    <th>Estado</th>

                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

    `;


    lista.forEach(registro => {

        let indice =
            calificaciones.indexOf(registro);


        let estado = "";

        let clase = "";


        if (registro.documento === "Reporte") {

            let hoy =
                new Date();

            hoy.setHours(0,0,0,0);


            let fechaVencimiento =
                new Date(
                    registro.vencimiento +
                    "T00:00:00"
                );


            let diferencia =
                Math.ceil(
                    (
                        fechaVencimiento - hoy
                    ) /
                    (1000 * 60 * 60 * 24)
                );


            if (diferencia < 0) {

                estado = "Vencido";

                clase = "vencido";

            } else if (diferencia <= 180) {

                estado =
                    "Próximo a vencer";

                clase = "proximo";

            } else {

                estado = "Vigente";

                clase = "vigente";

            }

        } else {

            estado = "Registrado";

            clase = "vigente";

        }


        html += `

            <tr>

                <td>

                    <strong>
                        ${escapeHTML(
                            registro.equipoCodigo
                        )}
                    </strong>

                    <br>

                    ${escapeHTML(
                        registro.equipoNombre
                    )}

                </td>


                <td>
                    ${escapeHTML(
                        registro.tipo
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        registro.documento
                    )}
                </td>


                <td>

                    <strong>
                        ${escapeHTML(
                            registro.codigo
                        )}
                    </strong>

                </td>


                <td>
                    ${escapeHTML(
                        registro.version
                    )}
                </td>


                <td>
                    ${formatearFecha(
                        registro.fecha
                    )}
                </td>


                <td>

                    ${
                        registro.vencimiento
                        ?
                        formatearFecha(
                            registro.vencimiento
                        )
                        :
                        "—"
                    }

                </td>


                <td>

                    <span class="${clase}">
                        ${estado}
                    </span>

                </td>


                <td class="acciones">

                    <button
                        class="btn-amarillo"
                        onclick="editarCalificacion(${indice})">

                        Editar

                    </button>


                    <button
                        class="btn-rojo"
                        onclick="eliminarCalificacion(${indice})">

                        Eliminar

                    </button>

                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

        </div>

    `;


    document.getElementById(
        "tablaCalificaciones"
    ).innerHTML = html;

}

/* =========================================================
   FUNCIONES AUXILIARES
========================================================= */

function obtenerFechaActual() {

    let hoy = new Date();

    return formatearFechaInput(hoy);

}


function formatearFechaInput(fecha) {

    let año =
        fecha.getFullYear();

    let mes =
        String(
            fecha.getMonth() + 1
        ).padStart(2, "0");

    let dia =
        String(
            fecha.getDate()
        ).padStart(2, "0");


    return `${año}-${mes}-${dia}`;

}


function formatearFecha(fecha) {

    if (!fecha) return "—";


    let partes =
        fecha.split("-");


    if (partes.length !== 3) {

        return fecha;

    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


function escapeHTML(valor) {

    if (valor === null ||
        valor === undefined) {

        return "";

    }


    return String(valor)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}
