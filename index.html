<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión SAC-M</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef1f3;color:#182230}button,input,select{font-family:inherit}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700}.sidebar{width:245px;height:100vh;background:#fff;border-right:1px solid #dfe3e8;position:fixed;inset:0 auto 0 0;padding:18px 12px;display:flex;flex-direction:column;z-index:10;overflow:auto}.logo-box{padding:5px 8px 14px;border-bottom:1px solid #e6e9ed}.logo-imagen{width:150px;height:auto;display:block;margin:0 0 9px}.logo-subtitulo{font-size:13px;font-weight:700;line-height:1.3}.logo-descripcion{margin-top:4px;font-size:10px;color:#66788a;letter-spacing:.5px}.menu{list-style:none;margin:16px 0 0;padding:0}.menu li{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;margin-bottom:4px;cursor:pointer;color:#526273;font-size:13px}.menu li:hover{background:#f7f8fa}.menu li.activo{color:#e30613;background:#fde8ea;font-weight:700}.menu-icono{width:18px;text-align:center}.sidebar-bottom{margin-top:auto;border-top:1px solid #e6e9ed;padding-top:15px}.sidebar-label{font-size:10px;color:#657484;text-transform:uppercase;margin-bottom:6px}.usuario-box{padding:10px;background:#f7f8fa;border-radius:8px}.usuario-nombre{font-weight:700;font-size:13px}.usuario-area{color:#6d7985;font-size:11px;margin-top:3px}.btn-login,.btn-logout{width:100%;margin-top:9px}.btn-login,.btn-principal,.btn-rojo-principal{background:#e30613;color:#fff}.btn-logout,.btn-secundario,.btn-gris,.btn-editar{background:#edf1f4;color:#344454}.btn-verde{background:#e3f7ea;color:#17753b}.btn-eliminar{background:#fde8ea;color:#e30613}.contenido{margin-left:245px;padding:28px;min-height:100vh}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.titulo-pagina{margin:0;font-size:26px}.subtitulo-pagina{margin-top:5px;color:#66788a;font-size:13px}.tarjeta{background:#fff;border:1px solid #e0e5e9;border-radius:14px;padding:20px;margin-bottom:18px}.tarjeta h2,.tarjeta h3{margin-top:0}.submenu{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;padding:7px;background:#fff;border:1px solid #e0e5e9;border-radius:12px}.submenu button{background:transparent;color:#627181}.submenu button:hover{background:#f4f6f7}.submenu button.activo{background:#fde8ea;color:#e30613}.botones{display:flex;gap:8px;flex-wrap:wrap}.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.resumen-card{background:#fff;border:1px solid #e0e5e9;border-radius:13px;padding:17px;display:flex;gap:13px;align-items:center}.resumen-icono{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}.verde-bg{background:#dcf8e8}.amarillo-bg{background:#fff3d8}.rojo-bg{background:#fde4e6}.resumen-titulo{font-size:12px;color:#66788a}.resumen-numero{font-size:24px;font-weight:800}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.completo{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:10px 11px;min-height:40px;border:1px solid #d4dae0;border-radius:8px;background:#fff;font-size:13px}input[readonly]{background:#edf1f4;color:#50606f}.acciones-form{display:flex;gap:9px;margin-top:14px}.acciones-form button{flex:1}.tabla-contenedor{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{padding:11px 9px;text-align:left;background:#f3f5f6;border-bottom:1px solid #dfe3e8;color:#455565;white-space:nowrap}td{padding:11px 9px;border-bottom:1px solid #e6e9ed}tr:hover td{background:#fafbfc}.acciones-tabla{display:flex;gap:5px}.codigo{font-weight:700}.subdato{font-size:11px;color:#748291;margin-top:3px}.badge{display:inline-block;padding:6px 10px;border-radius:18px;font-size:11px;font-weight:700;white-space:nowrap}.vigente{background:#def7e8;color:#17854b}.proximo{background:#fff0cc;color:#c98200}.vencido{background:#fde0e2;color:#d91f2b}.neutro{background:#edf1f4;color:#66788a}.semaforo-punto{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:7px}.punto-verde{background:#20a35b}.punto-amarillo{background:#e6a400}.punto-rojo{background:#dc303c}.punto-gris{background:#a8b1ba}.filtros{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin-bottom:14px}.dashboard-dos,.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ficha-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.ficha-dato{background:#f7f8fa;border-radius:9px;padding:12px}.ficha-label{font-size:11px;color:#71808f}.ficha-valor{font-size:14px;font-weight:700;margin-top:4px}.estado-ficha{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.estado-ficha-card{background:#fff;border:1px solid #e0e5e9;border-radius:12px;padding:15px;text-align:center}.estado-ficha-titulo{font-size:11px;color:#71808f;font-weight:700;margin-bottom:9px}.calificacion-bloque{border:1px solid #e1e5e9;border-radius:12px;overflow:hidden}.calificacion-cabecera{padding:13px 15px;background:#f5f6f7;font-size:16px;font-weight:800}.no-aplica{text-align:center;padding:25px;color:#748291;background:#fafbfc}.enlace-equipo{cursor:pointer;color:#d60916;font-weight:700}.modo-consulta{background:#e7f1ff;color:#196cb8;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:18px}.modulo-portada{min-height:380px;display:flex;align-items:center;justify-content:center;text-align:center}.modulo-icono{font-size:35px;margin-bottom:15px}.login-overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:1000}.login-card{width:360px;max-width:90%;background:#fff;border-radius:14px;padding:24px}.login-error{font-size:12px;color:#d91f2b;margin-bottom:10px;display:none}.kpi-resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi-mini,.kpi-chart{background:#fff;border:1px solid #e0e5e9;border-radius:13px;padding:17px}.kpi-mini-label{font-size:11px;color:#71808f;font-weight:700}.kpi-mini-num{font-size:27px;font-weight:800}.chart-wrap{position:relative;height:280px;max-width:430px;margin:auto}.kpi-detalle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.kpi-estado{border-radius:10px;padding:12px;text-align:center}.kpi-estado.verde{background:#eefaf3}.kpi-estado.rojo{background:#fff0f1}.kpi-estado-cantidad{font-size:23px;font-weight:800}.campo-terreno{max-width:750px;margin:auto}.instrumento-seleccionado{background:#f7f8fa;border-radius:12px;padding:18px;margin:15px 0}.accion-calibrar{width:100%;font-size:18px;padding:15px;background:#159447;color:#fff}.calibrado-ok{background:#eaf8ef;color:#14733a;border-radius:10px;padding:14px;margin-top:14px;font-weight:700}.carga-excel{border:2px dashed #d4dae0;border-radius:14px;padding:35px;text-align:center;background:#fafbfc}
@media(max-width:1100px){.dashboard-dos,.kpi-grid{grid-template-columns:1fr}.kpi-resumen{grid-template-columns:repeat(2,1fr)}.ficha-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.sidebar{width:185px}.contenido{margin-left:185px;padding:15px}.resumen,.form-grid,.ficha-grid,.filtros,.kpi-resumen{grid-template-columns:1fr}.logo-imagen{width:130px}}
</style>
</head>
<body>

<aside class="sidebar">
<div class="logo-box"><img src="logo prater.png" class="logo-imagen"><div class="logo-subtitulo">Sistemas de Apoyo Crítico y Metrología</div><div class="logo-descripcion">LABORATORIOS PRATER</div></div>
<ul class="menu" id="menuPrincipal">
<li class="activo" data-modulo="calificacion" onclick="abrirModulo('calificacion',this)"><span class="menu-icono">▣</span>Calificación de Equipos</li>
<li id="menuKPI" data-modulo="kpi" style="display:none" onclick="abrirModulo('kpi',this)"><span class="menu-icono">◫</span>KPI</li>
<li data-modulo="calibracion" onclick="abrirModulo('calibracion',this)"><span class="menu-icono">◎</span>Calibración de Equipos</li>
<li data-modulo="agua" onclick="abrirModulo('agua',this)"><span class="menu-icono">◉</span>Agua Purificada</li>
<li data-modulo="hvac" onclick="abrirModulo('hvac',this)"><span class="menu-icono">≋</span>HVAC</li>
<li data-modulo="aire" onclick="abrirModulo('aire',this)"><span class="menu-icono">➜</span>Aire Comprimido</li>
<li data-modulo="mapeos" onclick="abrirModulo('mapeos',this)"><span class="menu-icono">⌁</span>Mapeos Térmicos</li>
<li data-modulo="documentacion" onclick="abrirModulo('documentacion',this)"><span class="menu-icono">▤</span>Documentación SAC-M</li>
</ul>
<div class="sidebar-bottom"><div class="sidebar-label">Usuario</div><div class="usuario-box"><div class="usuario-nombre" id="nombreUsuario"></div><div class="usuario-area" id="areaUsuario"></div></div><button class="btn-login" id="btnAcceso" onclick="abrirLogin()">🔐 Acceso administrador</button><button class="btn-logout" id="btnSalir" onclick="cerrarSesion()" style="display:none">Cerrar sesión</button></div>
</aside>

<main class="contenido" id="contenido"></main>

<div id="loginModal" style="display:none"><div class="login-overlay"><div class="login-card"><h2>Acceso administrador</h2><div class="login-error" id="loginError">Usuario o contraseña incorrectos.</div><label>Usuario</label><input id="loginUsuario"><label>Contraseña</label><input type="password" id="loginClave" onkeydown="if(event.key==='Enter')iniciarSesion()"><div class="acciones-form"><button class="btn-principal" onclick="iniciarSesion()">Ingresar</button><button class="btn-secundario" onclick="cerrarLogin()">Cancelar</button></div></div></div></div>

<script>
const ADMIN_USUARIO="admin",ADMIN_CLAVE="SACM2026";
let esAdmin=sessionStorage.getItem("adminSACM")==="true",moduloActual="calificacion",equipoEditando=null,calificacionEditando=null,manualEditando=null,equipoCalibracionEditando=null,registroCalibracionEditando=null,graficosKPI=[];
let equipos=JSON.parse(localStorage.getItem("equipos"))||[],calificaciones=JSON.parse(localStorage.getItem("calificaciones"))||[],manuales=JSON.parse(localStorage.getItem("manuales"))||[],equiposCalibracion=JSON.parse(localStorage.getItem("equiposCalibracion"))||[],registrosCalibracion=JSON.parse(localStorage.getItem("registrosCalibracion"))||[];
equipos=equipos.map(e=>({codigo:e.codigo||"",nombre:e.nombre||"",area:e.area||"",ubicacion:e.ubicacion||"",aplicaPQ:e.aplicaPQ!==false}));
equiposCalibracion=equiposCalibracion.map(e=>({codigo:e.codigo||"",nombre:e.nombre||"",area:e.area||"",ubicacion:e.ubicacion||"",tipo:e.tipo||""}));
function guardarDatos(){localStorage.setItem("equipos",JSON.stringify(equipos));localStorage.setItem("calificaciones",JSON.stringify(calificaciones));localStorage.setItem("manuales",JSON.stringify(manuales));localStorage.setItem("equiposCalibracion",JSON.stringify(equiposCalibracion));localStorage.setItem("registrosCalibracion",JSON.stringify(registrosCalibracion))}
guardarDatos();

function val(id){return document.getElementById(id)?.value.trim()||""}function valSelect(id){return document.getElementById(id)?.value||""}function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function escJS(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}function fechaBonita(f){if(!f)return"—";let p=f.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:f}function hoyISO(){let d=new Date(),m=String(d.getMonth()+1).padStart(2,"0"),dia=String(d.getDate()).padStart(2,"0");return`${d.getFullYear()}-${m}-${dia}`}
function sumarAnos(fecha,n){if(!fecha)return"";let [a,m,d]=fecha.split("-").map(Number),x=new Date(a+n,m-1,d);if(x.getMonth()!==m-1)x=new Date(a+n,m,0);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`}

function actualizarUsuario(){nombreUsuario.textContent=esAdmin?"ADMINISTRADOR":"MODO CONSULTA";areaUsuario.textContent=esAdmin?"SAC-M · Edición habilitada":"Solo lectura";btnAcceso.style.display=esAdmin?"none":"block";btnSalir.style.display=esAdmin?"block":"none";menuKPI.style.display=esAdmin?"flex":"none"}
function abrirLogin(){loginModal.style.display="block";loginUsuario.value="";loginClave.value="";loginError.style.display="none"}function cerrarLogin(){loginModal.style.display="none"}function iniciarSesion(){if(val("loginUsuario")===ADMIN_USUARIO&&loginClave.value===ADMIN_CLAVE){esAdmin=true;sessionStorage.setItem("adminSACM","true");cerrarLogin();actualizarUsuario();abrirModulo(moduloActual)}else loginError.style.display="block"}function cerrarSesion(){if(!confirm("¿Cerrar la sesión?"))return;esAdmin=false;sessionStorage.removeItem("adminSACM");actualizarUsuario();abrirModulo(moduloActual==="kpi"?"calificacion":moduloActual)}

function abrirModulo(m,el){if(m==="kpi"&&!esAdmin)return;destruirGraficosKPI();moduloActual=m;document.querySelectorAll("#menuPrincipal li").forEach(x=>x.classList.remove("activo"));(el||document.querySelector(`[data-modulo="${m}"]`))?.classList.add("activo");if(m==="calificacion")return mostrarInicio();if(m==="calibracion")return mostrarInicioCalibracion();if(m==="kpi")return mostrarKPI("calificacion");let d={agua:["Agua Purificada","◉"],hvac:["HVAC","≋"],aire:["Aire Comprimido","➜"],mapeos:["Mapeos Térmicos","⌁"],documentacion:["Documentación SAC-M","▤"]};contenido.innerHTML=`<div class="topbar"><div><h1 class="titulo-pagina">${d[m][0]}</h1><div class="subtitulo-pagina">Sistemas de Apoyo Crítico y Metrología</div></div></div><div class="tarjeta modulo-portada"><div><div class="modulo-icono">${d[m][1]}</div><h2>${d[m][0]}</h2><p>Módulo preparado para su próximo desarrollo.</p></div></div>`}

function subCal(a){return`<div class="submenu"><button class="${a==="inicio"?"activo":""}" onclick="mostrarInicio()">⌂ Inicio</button><button class="${a==="equipos"?"activo":""}" onclick="mostrarEquipos()">⚙ Equipos</button>${esAdmin?`<button class="${a==="cal"?"activo":""}" onclick="mostrarCalificaciones()">▣ Calificaciones</button><button class="${a==="man"?"activo":""}" onclick="mostrarManuales()">▤ Manuales</button><button class="${a==="base"?"activo":""}" onclick="mostrarBase()">◉ Base de datos</button>`:""}</div>`}
function subMet(a){return`<div class="submenu"><button class="${a==="inicio"?"activo":""}" onclick="mostrarInicioCalibracion()">⌂ Inicio</button><button class="${a==="equipos"?"activo":""}" onclick="mostrarEquiposCalibracion()">⚙ Equipos</button>${esAdmin?`<button class="${a==="cal"?"activo":""}" onclick="mostrarCalibracionesEquipos()">◎ Calibraciones</button><button class="${a==="terreno"?"activo":""}" onclick="mostrarTerreno()">📍 Trabajo en terreno</button><button class="${a==="excel"?"activo":""}" onclick="mostrarCargaExcelCalibracion()">⇩ Carga Excel</button>`:""}</div>`}

function estadoFecha(f){if(!f)return{texto:"Sin fecha",clase:"neutro",nivel:0};let h=new Date();h.setHours(0,0,0,0);let d=Math.ceil((new Date(f+"T00:00:00")-h)/86400000);return d<0?{texto:"Vencido",clase:"vencido",nivel:3}:d<=180?{texto:"Próximo",clase:"proximo",nivel:2}:{texto:"Vigente",clase:"vigente",nivel:1}}
function estadoLista(l){if(!l.length)return{texto:"Sin registros",clase:"neutro",nivel:0};let p={texto:"Vigente",clase:"vigente",nivel:1};l.forEach(x=>{let s=estadoFecha(x.vencimiento);if(s.nivel>p.nivel)p=s});return p}
function puntoEstado(s){let p=s.clase==="vigente"?"punto-verde":s.clase==="proximo"?"punto-amarillo":s.clase==="vencido"?"punto-rojo":"punto-gris";return`<span class="semaforo-punto ${p}"></span><span class="badge ${s.clase}">${s.texto}</span>`}
function contarEstados(l){let r={vigentes:0,proximos:0,vencidos:0};l.forEach(x=>{let s=estadoFecha(x.vencimiento);if(s.clase==="vigente")r.vigentes++;if(s.clase==="proximo")r.proximos++;if(s.clase==="vencido")r.vencidos++});return r}
function card(i,t,n,c){return`<div class="resumen-card"><div class="resumen-icono ${c}">${i}</div><div><div class="resumen-titulo">${t}</div><div class="resumen-numero">${n}</div></div></div>`}

function estadoGeneralEquipo(c){let e=equipos.find(x=>x.codigo===c),l=[estadoLista(calificaciones.filter(x=>x.equipoCodigo===c&&x.tipo==="IQ")),estadoLista(calificaciones.filter(x=>x.equipoCodigo===c&&x.tipo==="OQ")),estadoLista(manuales.filter(x=>x.equipoCodigo===c))];if(e?.aplicaPQ)l.push(estadoLista(calificaciones.filter(x=>x.equipoCodigo===c&&x.tipo==="PQ")));return l.reduce((a,b)=>b.nivel>a.nivel?b:a,{texto:"Sin registros",clase:"neutro",nivel:0})}

function mostrarInicio(){moduloActual="calificacion";let c=contarEstados(calificaciones),m=contarEstados(manuales);contenido.innerHTML=`<div class="topbar"><div><h1 class="titulo-pagina">Calificación de Equipos</h1><div class="subtitulo-pagina">Gestión de IQ, OQ, PQ y Manuales Operativos</div></div></div>${subCal("inicio")}${!esAdmin?`<div class="modo-consulta">👁 Modo consulta.</div>`:""}<div class="dashboard-dos"><div><div class="resumen">${card("✓","Vigentes",c.vigentes,"verde-bg")}${card("◷","Próximas",c.proximos,"amarillo-bg")}${card("!","Vencidas",c.vencidos,"rojo-bg")}</div></div><div><div class="resumen">${card("✓","Manuales vigentes",m.vigentes,"verde-bg")}${card("◷","Próximos",m.proximos,"amarillo-bg")}${card("!","Vencidos",m.vencidos,"rojo-bg")}</div></div></div><div class="tarjeta"><h2>Estado por equipo</h2>${tablaSemaforoEquipos()}</div>`}
function tablaSemaforoEquipos(){if(!equipos.length)return`<div class="subdato">No hay equipos.</div>`;let h=`<div class="tabla-contenedor"><table><thead><tr><th>Equipo</th><th>Nombre</th><th>Área</th><th>Ubicación</th><th>IQ</th><th>OQ</th><th>PQ</th><th>Manual</th><th>Estado</th></tr></thead><tbody>`;equipos.forEach((e,i)=>{let iq=estadoLista(calificaciones.filter(x=>x.equipoCodigo===e.codigo&&x.tipo==="IQ")),oq=estadoLista(calificaciones.filter(x=>x.equipoCodigo===e.codigo&&x.tipo==="OQ")),pq=e.aplicaPQ?estadoLista(calificaciones.filter(x=>x.equipoCodigo===e.codigo&&x.tipo==="PQ")):null,mo=estadoLista(manuales.filter(x=>x.equipoCodigo===e.codigo));h+=`<tr><td><span class="enlace-equipo" onclick="verFichaEquipo(${i})">${esc(e.codigo)}</span></td><td>${esc(e.nombre)}</td><td>${esc(e.area)}</td><td>${esc(e.ubicacion)||"—"}</td><td>${puntoEstado(iq)}</td><td>${puntoEstado(oq)}</td><td>${e.aplicaPQ?puntoEstado(pq):`<span class="badge neutro">No aplica</span>`}</td><td>${puntoEstado(mo)}</td><td>${puntoEstado(estadoGeneralEquipo(e.codigo))}</td></tr>`});return h+"</tbody></table></div>"}

function mostrarEquipos(){contenido.innerHTML=`<div class="topbar"><div><h1 class="titulo-pagina">Equipos</h1></div>${esAdmin?`<button class="btn-principal" onclick="nuevoEquipo()">+ Nuevo equipo</button>`:""}</div>${subCal("equipos")}<div id="formEquipo"></div><div class="tarjeta"><input id="buscarEquipo" placeholder="Buscar..." oninput="tablaEquipos()"><div id="tablaEquipos"></div></div>`;tablaEquipos()}
function nuevoEquipo(){equipoEditando=null;formEquipo.innerHTML=`<div class="tarjeta"><h2>Nuevo equipo</h2><div class="form-grid"><div><label>Código</label><input id="eqCodigo"></div><div><label>Nombre</label><input id="eqNombre"></div><div><label>Área</label><input id="eqArea"></div><div><label>Ubicación</label><input id="eqUbicacion"></div><div><label>¿Aplica PQ?</label><select id="eqPQ"><option value="si">Sí</option><option value="no">No</option></select></div></div><div class="acciones-form"><button class="btn-principal" onclick="guardarEquipo()">Guardar</button><button onclick="formEquipo.innerHTML=''">Cancelar</button></div></div>`}
function guardarEquipo(){let e={codigo:val("eqCodigo"),nombre:val("eqNombre"),area:val("eqArea"),ubicacion:val("eqUbicacion"),aplicaPQ:eqPQ.value==="si"};if(!e.codigo||!e.nombre||!e.area)return alert("Completa código, nombre y área.");equipoEditando===null?equipos.push(e):equipos[equipoEditando]=e;guardarDatos();mostrarEquipos()}
function editarEquipo(i){let e=equipos[i];nuevoEquipo();equipoEditando=i;eqCodigo.value=e.codigo;eqNombre.value=e.nombre;eqArea.value=e.area;eqUbicacion.value=e.ubicacion;eqPQ.value=e.aplicaPQ?"si":"no"}

function mostrarTerreno(){if(!esAdmin)return;contenido.innerHTML=`<div class="topbar"><div><h1 class="titulo-pagina">Trabajo en terreno</h1><div class="subtitulo-pagina">Registro rápido de instrumentos calibrados</div></div></div>${subMet("terreno")}<div class="tarjeta campo-terreno"><h2>Registrar calibración</h2><label>Seleccionar instrumento</label><select id="terrenoEquipo" onchange="actualizarInstrumentoTerreno()"><option value="">Seleccione...</option>${equiposCalibracion.slice().sort((a,b)=>a.codigo.localeCompare(b.codigo)).map(e=>`<option value="${esc(e.codigo)}">${esc(e.codigo)} - ${esc(e.nombre)}</option>`).join("")}</select><div id="infoTerreno"></div><div class="form-grid"><div><label>N° Certificado <span class="subdato">(opcional)</span></label><input id="terrenoCertificado" placeholder="Puede completarse después"></div><div><label>Empresa / Proveedor <span class="subdato">(opcional)</span></label><input id="terrenoProveedor"></div></div><button class="accion-calibrar" style="margin-top:15px" onclick="marcarCalibrado()">✓ Marcar como calibrado</button><div id="mensajeTerreno"></div></div><div class="tarjeta"><h2>Últimos registros</h2>${tablaUltimosTerreno()}</div>`}

function actualizarInstrumentoTerreno(){let c=terrenoEquipo.value,e=equiposCalibracion.find(x=>x.codigo===c);if(!e){infoTerreno.innerHTML="";return}let u=ultimaCalibracion(c);infoTerreno.innerHTML=`<div class="instrumento-seleccionado"><div class="ficha-grid"><div><div class="ficha-label">Código</div><div class="ficha-valor">${esc(e.codigo)}</div></div><div><div class="ficha-label">Nombre</div><div class="ficha-valor">${esc(e.nombre)}</div></div><div><div class="ficha-label">Ubicación</div><div class="ficha-valor">${esc(e.ubicacion)||"—"}</div></div><div><div class="ficha-label">Estado actual</div><div class="ficha-valor">${puntoEstado(estadoEquipoCalibracion(c))}</div></div></div>${u?`<div class="subdato" style="margin-top:12px">Última calibración: ${fechaBonita(u.fecha)} · Vence: ${fechaBonita(u.vencimiento)}</div>`:""}</div>`}

function marcarCalibrado(){let c=terrenoEquipo.value;if(!c)return alert("Selecciona un instrumento.");let e=equiposCalibracion.find(x=>x.codigo===c),fecha=hoyISO(),vence=sumarAnos(fecha,1);if(!confirm(`¿Confirmar que ${e.codigo} - ${e.nombre} fue calibrado hoy ${fechaBonita(fecha)}?`))return;registrosCalibracion.push({equipoCodigo:e.codigo,equipoNombre:e.nombre,certificado:val("terrenoCertificado")||"Pendiente",fecha,vencimiento:vence,proveedor:val("terrenoProveedor")});guardarDatos();mensajeTerreno.innerHTML=`<div class="calibrado-ok">✓ ${esc(e.codigo)} registrado como calibrado. Nueva vigencia hasta ${fechaBonita(vence)}.</div>`;terrenoCertificado.value="";actualizarInstrumentoTerreno();setTimeout(()=>mostrarTerreno(),1200)}

function tablaUltimosTerreno(){let l=registrosCalibracion.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,10);if(!l.length)return`<div class="subdato">Sin registros.</div>`;return`<table><thead><tr><th>Equipo</th><th>Fecha</th><th>Vencimiento</th><th>Certificado</th></tr></thead><tbody>${l.map(x=>`<tr><td>${esc(x.equipoCodigo)} - ${esc(x.equipoNombre)}</td><td>${fechaBonita(x.fecha)}</td><td>${fechaBonita(x.vencimiento)}</td><td>${esc(x.certificado)||"—"}</td></tr>`).join("")}</tbody></table>`}

function verFichaCalibracion(i){let e=equiposCalibracion[i],h=registrosCalibracion.filter(x=>x.equipoCodigo===e.codigo).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));contenido.innerHTML=`<div class="topbar"><div><h1>${esc(e.codigo)} — ${esc(e.nombre)}</h1></div><button onclick="mostrarEquiposCalibracion()">← Volver</button></div>${subMet("equipos")}<div class="tarjeta"><div class="ficha-grid"><div class="ficha-dato"><div class="ficha-label">Código</div><div class="ficha-valor">${esc(e.codigo)}</div></div><div class="ficha-dato"><div class="ficha-label">Área</div><div class="ficha-valor">${esc(e.area)}</div></div><div class="ficha-dato"><div class="ficha-label">Tipo</div><div class="ficha-valor">${esc(e.tipo)||"—"}</div></div><div class="ficha-dato"><div class="ficha-label">Estado</div><div class="ficha-valor">${puntoEstado(estadoEquipoCalibracion(e.codigo))}</div></div></div></div><div class="tarjeta"><h2>Historial</h2><table><thead><tr><th>Certificado</th><th>Fecha</th><th>Vencimiento</th><th>Proveedor</th></tr></thead><tbody>${h.map(x=>`<tr><td>${esc(x.certificado)||"—"}</td><td>${fechaBonita(x.fecha)}</td><td>${fechaBonita(x.vencimiento)}</td><td>${esc(x.proveedor)||"—"}</td></tr>`).join("")}</tbody></table></div>`}

function mostrarCargaExcelCalibracion(){if(!esAdmin)return;contenido.innerHTML=`<div class="topbar"><h1>Carga Excel</h1></div>${subMet("excel")}<div class="tarjeta"><div class="carga-excel"><h2>Importar equipos y calibraciones</h2><p>El vencimiento se calculará automáticamente a 1 año.</p><div class="botones" style="justify-content:center"><button class="btn-principal" onclick="excelMet.click()">Seleccionar Excel</button><button class="btn-gris" onclick="descargarPlantillaCalibracion()">Descargar plantilla</button></div><input id="excelMet" type="file" accept=".xlsx,.xls" style="display:none" onchange="importarExcelCalibracion(event)"></div></div>`}
function descargarPlantillaCalibracion(){let ws=XLSX.utils.json_to_sheet([{"Código":"E1169/EF","Nombre":"Cronómetro Digital","Área":"Producción","Ubicación":"Sala","Tipo":"Cronómetro","N° Certificado":"CAL-001","Fecha Calibración":"09/09/2026","Laboratorio / Proveedor":"Proveedor"}]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Calibraciones");XLSX.writeFile(wb,"Plantilla_Calibraciones.xlsx")}
function normalizarFecha(v){if(!v)return"";if(v instanceof Date)return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;if(typeof v==="number"){let d=XLSX.SSF.parse_date_code(v);return`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`}let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`:""}
function col(o,n){for(let x of n)if(o[x]!=null&&o[x]!=="")return String(o[x]).trim();return""}
function importarExcelCalibracion(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{try{let wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),ne=0,nc=0;rows.forEach(x=>{let codigo=col(x,["Código","Codigo"]),nombre=col(x,["Nombre"]),area=col(x,["Área","Area"]),ubicacion=col(x,["Ubicación","Ubicacion"]),tipo=col(x,["Tipo"]),cert=col(x,["N° Certificado","Certificado"]),prov=col(x,["Laboratorio / Proveedor","Proveedor"]),fecha=normalizarFecha(x["Fecha Calibración"]||x["Fecha Calibracion"]);if(!codigo||!nombre||!area)return;let eq=equiposCalibracion.find(z=>z.codigo===codigo);if(!eq){equiposCalibracion.push({codigo,nombre,area,ubicacion,tipo});ne++}if(fecha&&!registrosCalibracion.some(z=>z.equipoCodigo===codigo&&z.certificado===cert&&z.fecha===fecha)){registrosCalibracion.push({equipoCodigo:codigo,equipoNombre:nombre,certificado:cert||"Pendiente",fecha,vencimiento:sumarAnos(fecha,1),proveedor:prov});nc++}});guardarDatos();alert(`Carga completada.\nEquipos nuevos: ${ne}\nCalibraciones: ${nc}`);mostrarInicioCalibracion()}catch(err){alert("No se pudo leer el Excel.")}};r.readAsArrayBuffer(f)}

/* KPI */
function subKPI(a){return`<div class="submenu">${["calificacion|Calificación de Equipos","calibracion|Calibración de Equipos","agua|Agua Purificada","hvac|HVAC","aire|Aire Comprimido","mapeos|Mapeos Térmicos"].map(x=>{let p=x.split("|");return`<button class="${a===p[0]?"activo":""}" onclick="mostrarKPI('${p[0]}')">${p[1]}</button>`}).join("")}</div>`}
function kpiTipo(t){let l=t==="PQ"?equipos.filter(e=>e.aplicaPQ):equipos,r={total:l.length,vigente:0,vencido:0};l.forEach(e=>{let d=calificaciones.filter(x=>x.equipoCodigo===e.codigo&&x.tipo===t),v=d.length&&!d.some(x=>estadoFecha(x.vencimiento).clase==="vencido");r[v?"vigente":"vencido"]++});return r}
function kpiCompleto(){let r={total:equipos.length,vigente:0,vencido:0};equipos.forEach(e=>{let t=["IQ","OQ"];if(e.aplicaPQ)t.push("PQ");let ok=t.every(x=>{let d=calificaciones.filter(c=>c.equipoCodigo===e.codigo&&c.tipo===x);return d.length&&!d.some(c=>estadoFecha(c.vencimiento).clase==="vencido")});r[ok?"vigente":"vencido"]++});return r}
function mostrarKPI(a="calificacion"){if(!esAdmin)return;if(a!=="calificacion"){contenido.innerHTML=`<div class="topbar"><h1>KPI</h1></div>${subKPI(a)}<div class="tarjeta modulo-portada"><h2>Módulo KPI en desarrollo</h2></div>`;return}let iq=kpiTipo("IQ"),oq=kpiTipo("OQ"),pq=kpiTipo("PQ"),co=kpiCompleto();contenido.innerHTML=`<div class="topbar"><h1>KPI · Calificación de Equipos</h1></div>${subKPI(a)}<div class="kpi-grid">${cajaGraf("IQ",iq,"g1")}${cajaGraf("OQ",oq,"g2")}${cajaGraf("PQ",pq,"g3")}${cajaGraf("Completamente calificados",co,"g4")}</div>`;setTimeout(()=>{graf("g1",iq);graf("g2",oq);graf("g3",pq);graf("g4",co)},0)}
function pct(v,t){return t?Math.round(v/t*100):0}function cajaGraf(t,d,id){return`<div class="kpi-chart"><h3>${t}</h3><div class="chart-wrap"><canvas id="${id}"></canvas></div><div class="kpi-detalle"><div class="kpi-estado verde"><b>Vigentes</b><div class="kpi-estado-cantidad">${d.vigente}</div>${pct(d.vigente,d.total)}%</div><div class="kpi-estado rojo"><b>Vencidos</b><div class="kpi-estado-cantidad">${d.vencido}</div>${pct(d.vencido,d.total)}%</div></div></div>`}
function graf(id,d){graficosKPI.push(new Chart(document.getElementById(id),{type:"doughnut",data:{labels:["Vigente","Vencido"],datasets:[{data:[d.vigente,d.vencido],backgroundColor:["#28a65a","#dc3545"]}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom"}}}}))}function destruirGraficosKPI(){graficosKPI.forEach(x=>{try{x.destroy()}catch(e){}});graficosKPI=[]}

actualizarUsuario();abrirModulo("calificacion");
</script>
</body>
</html>
