<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f3;
    color: #182230;
}

button,
input,
select,
textarea {

}

button {

}

input,

}

}

label {

.menu {

.sidebar-bottom {

/* =========================================================

.contenido {

/* =========================================================

/* =========================================================

</style>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ADMIN_USUARIO = "admin";
const ADMIN_CLAVE = "SACM2026";

const DIAS_PROXIMO_VENCIMIENTO = 180;

let esAdmin =
    sessionStorage.getItem("adminSACM") === "true";

let moduloActual = "calificacion";

let indiceEdicion = null;

let graficosKPI = [];

/* =========================================================
   ALMACENAMIENTO
========================================================= */

function leerDatos(clave) {

    try {

        const contenido =
            localStorage.getItem(clave);

        if (!contenido) {
            return [];
        }

        return JSON.parse(contenido);

    } catch (error) {

        console.error(
            "Error leyendo:",
            clave,
            error
        );

        return [];
    }
}

let equipos =
    leerDatos("equipos");

let calificaciones =
    leerDatos("calificaciones");

let manuales =
    leerDatos("manuales");

let equiposCalibracion =
    leerDatos("equiposCalibracion");

let registrosCalibracion =
    leerDatos("registrosCalibracion");

let documentosSACM =
    leerDatos("documentosSACM");

let registrosDocumentales =
    leerDatos("registrosDocumentales");

function guardarTodo() {

    localStorage.setItem(
        "equipos",
        JSON.stringify(equipos)
    );

    localStorage.setItem(
        "calificaciones",
        JSON.stringify(calificaciones)
    );

    localStorage.setItem(
        "manuales",
        JSON.stringify(manuales)
    );

    localStorage.setItem(
        "equiposCalibracion",
        JSON.stringify(equiposCalibracion)
    );

    localStorage.setItem(
        "registrosCalibracion",
        JSON.stringify(registrosCalibracion)
    );

    localStorage.setItem(
        "documentosSACM",
        JSON.stringify(documentosSACM)
    );

    localStorage.setItem(
        "registrosDocumentales",
        JSON.stringify(registrosDocumentales)
    );
}

/* =========================================================
   UTILIDADES
========================================================= */

function obtenerValor(id) {

    const elemento =
        document.getElementById(id);

    return elemento
        ? elemento.value.trim()
        : "";
}

function obtenerSelect(id) {

    const elemento =
        document.getElementById(id);

    return elemento
        ? elemento.value
        : "";
}

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function fechaBonita(fecha) {

    if (!fecha) {
        return "—";
    }

    const partes =
        fecha.split("-");

    if (partes.length !== 3) {
        return fecha;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function fechaHoy() {

    const hoy =
        new Date();

    return [
        hoy.getFullYear(),
        String(hoy.getMonth() + 1).padStart(2,"0"),
        String(hoy.getDate()).padStart(2,"0")
    ].join("-");
}

function sumarAnios(fecha,cantidad) {

    if (!fecha) {
        return "";
    }

    const [
        anio,
        mes,
        dia
    ] = fecha.split("-").map(Number);

    let nueva =
        new Date(
            anio + cantidad,
            mes - 1,
            dia
        );

    if (
        nueva.getMonth() !== mes - 1
    ) {

        nueva =
            new Date(
                anio + cantidad,
                mes,
                0
            );
    }

    return [
        nueva.getFullYear(),
        String(nueva.getMonth()+1).padStart(2,"0"),
        String(nueva.getDate()).padStart(2,"0")
    ].join("-");
}

/* =========================================================
   ESTADOS
========================================================= */

function estadoFecha(fecha) {

    if (!fecha) {

        return {
            texto: "Sin fecha",
            clase: "neutro"
        };
    }

    const hoy =
        new Date();

    hoy.setHours(0,0,0,0);

    const vencimiento =
        new Date(
            fecha + "T00:00:00"
        );

    const dias =
        Math.ceil(
            (vencimiento - hoy) /
            86400000
        );

    if (dias < 0) {

        return {
            texto: "Vencido",
            clase: "vencido"
        };
    }

    if (
        dias <=
        DIAS_PROXIMO_VENCIMIENTO
    ) {

        return {
            texto: "Próximo",
            clase: "proximo"
        };
    }

    return {
        texto: "Vigente",
        clase: "vigente"
    };
}

function puntoEstado(estado) {

    let punto = "punto-gris";

    if (estado.clase === "vigente") {
        punto = "punto-verde";
    }

    if (estado.clase === "proximo") {
        punto = "punto-amarillo";
    }

    if (estado.clase === "vencido") {
        punto = "punto-rojo";
    }

    return `
        <span class="semaforo-punto ${punto}"></span>
        <span class="badge ${estado.clase}">
            ${estado.texto}
        </span>
    `;
}

function resumenEstados(lista,campo="vigencia") {

    const resultado = {
        vigente: 0,
        proximo: 0,
        vencido: 0
    };

    lista.forEach(registro => {

        const estado =
            estadoFecha(
                registro[campo]
            );

        if (estado.clase === "vigente") {
            resultado.vigente++;
        }

        if (estado.clase === "proximo") {
            resultado.proximo++;
        }

        if (estado.clase === "vencido") {
            resultado.vencido++;
        }
    });

    return resultado;
}

function tarjetaResumen(
    icono,
    titulo,
    valor,
    clase
) {

    return `
        <div class="resumen-card">

function marcarMenuActivo(modulo) {

    document
        .querySelectorAll(
            "#menuPrincipal li"
        )
        .forEach(
            elemento =>
                elemento.classList.remove(
                    "activo"
                )
        );

    document
        .querySelector(
            `[data-modulo="${modulo}"]`
        )
        ?.classList.add(
            "activo"
        );
}

function abrirModulo(modulo) {

    if (
        modulo === "kpi" &&
        !esAdmin
    ) {
        return;
    }

    destruirGraficos();

    moduloActual =
        modulo;

    marcarMenuActivo(
        modulo
    );

    if (
        modulo === "calificacion"
    ) {
        mostrarInicioCalificacion();
        return;
    }

    if (
        modulo === "calibracion"
    ) {
        mostrarInicioCalibracion();
        return;
    }

    if (
        modulo === "documentacion"
    ) {
        mostrarInicioDocumentacion();
        return;
    }

    if (
        ["agua","hvac","aire","mapeos"]
        .includes(modulo)
    ) {

        mostrarInicioModuloDocumental(
            modulo
        );

        return;
    }

    if (
        modulo === "kpi"
    ) {

        mostrarKPI(
            "calificacion"
        );
    }
}

function ultimoDocumentoCalificacion(
    codigo,
    tipo,
    documento
) {

    return calificaciones
        .filter(
            registro =>
                registro.equipoCodigo === codigo &&
                registro.tipo === tipo &&
                registro.documento === documento
        )
        .sort(
            (a,b) =>
                new Date(b.fecha) -
                new Date(a.fecha)
        )[0] || null;
}

function estadoTipoCalificacion(
    codigo,
    tipo
) {

    const protocolo =
        ultimoDocumentoCalificacion(
            codigo,
            tipo,
            "Protocolo"
        );

    const reporte =
        ultimoDocumentoCalificacion(
            codigo,
            tipo,
            "Reporte"
        );

    if (
        !protocolo ||
        !reporte
    ) {

        return {
            texto:"Sin registros",
            clase:"neutro"
        };
    }

    const estados = [
        estadoFecha(
            protocolo.vencimiento
        ),
        estadoFecha(
            reporte.vencimiento
        )
    ];

    if (
        estados.some(
            estado =>
                estado.clase === "vencido"
        )
    ) {

        return {
            texto:"Vencido",
            clase:"vencido"
        };
    }

    if (
        estados.some(
            estado =>
                estado.clase === "proximo"
        )
    ) {

        return {
            texto:"Próximo",
            clase:"proximo"
        };
    }

    return {
        texto:"Vigente",
        clase:"vigente"
    };
}

function guardarEquipoCalificacion() {

    const registro = {

        codigo:
            obtenerValor("eqCodigo"),

        nombre:
            obtenerValor("eqNombre"),

        area:
            obtenerValor("eqArea"),

        ubicacion:
            obtenerValor("eqUbicacion"),

        aplicaPQ:
            obtenerSelect("eqPQ") === "si"
    };

    if (
        !registro.codigo ||
        !registro.nombre ||
        !registro.area
    ) {

        alert(
            "Completa código, nombre y área."
        );

        return;
    }

    const duplicado =
        equipos.findIndex(
            (equipo,indice) =>
                equipo.codigo.toLowerCase() ===
                    registro.codigo.toLowerCase() &&
                indice !== indiceEdicion
        );

    if (
        duplicado !== -1
    ) {

        alert(
            "Ya existe un equipo con ese código."
        );

        return;
    }

    if (
        indiceEdicion === null
    ) {

        equipos.push(
            registro
        );

    } else {

        const codigoAnterior =
            equipos[indiceEdicion].codigo;

        equipos[indiceEdicion] =
            registro;

        calificaciones.forEach(
            documento => {

                if (
                    documento.equipoCodigo ===
                    codigoAnterior
                ) {

                    documento.equipoCodigo =
                        registro.codigo;

                    documento.equipoNombre =
                        registro.nombre;
                }
            }
        );

        manuales.forEach(
            manual => {

                if (
                    manual.equipoCodigo ===
                    codigoAnterior
                ) {

                    manual.equipoCodigo =
                        registro.codigo;

                    manual.equipoNombre =
                        registro.nombre;
                }
            }
        );
    }

    guardarTodo();
    mostrarEquiposCalificacion();
}

function eliminarEquipoCalificacion(
    indice
) {

    if (!esAdmin) {
        return;
    }

    const equipo =
        equipos[indice];

    if (
        !confirm(
            `¿Eliminar ${equipo.codigo}?`
        )
    ) {
        return;
    }

    equipos.splice(
        indice,
        1
    );

    calificaciones =
        calificaciones.filter(
            registro =>
                registro.equipoCodigo !==
                equipo.codigo
        );

    manuales =
        manuales.filter(
            registro =>
                registro.equipoCodigo !==
                equipo.codigo
        );

    guardarTodo();

    renderEquiposCalificacion();
}

function actualizarTiposCalificacion(
    seleccionado = ""
) {

    const codigo =
        obtenerSelect(
            "calEquipo"
        );

    const equipo =
        equipos.find(
            elemento =>
                elemento.codigo === codigo
        );

    const tipos = [
        "IQ",
        "OQ"
    ];

    if (
        equipo?.aplicaPQ !== false
    ) {
        tipos.push("PQ");
    }

    const selector =
        document.getElementById(
            "calTipo"
        );

    if (!selector) {
        return;
    }

    selector.innerHTML =
        tipos.map(tipo => `

            <option
                value="${tipo}"
                ${tipo===seleccionado?"selected":""}
            >
                ${tipo}
            </option>

        `).join("");
}

function generarCodigoCalificacion() {

    const codigo =
        obtenerSelect(
            "calEquipo"
        );

    const tipo =
        obtenerSelect(
            "calTipo"
        );

    const documento =
        obtenerSelect(
            "calDocumento"
        );

    const version =
        obtenerValor(
            "calVersion"
        );

    const campo =
        document.getElementById(
            "calCodigo"
        );

    if (!campo) {
        return;
    }

    if (!version) {

        campo.value = "";
        return;
    }

    const prefijos = {

        IQ:{
            Protocolo:"PCI",
            Reporte:"RCI"
        },

        OQ:{
            Protocolo:"PCO",
            Reporte:"RCO"
        },

        PQ:{
            Protocolo:"PCD",
            Reporte:"RCD"
        }
    };

    campo.value =
        `${prefijos[tipo][documento]}-${codigo}-${version}`;
}

function actualizarVencimientoCalificacion() {

    const campo =
        document.getElementById(
            "calVencimiento"
        );

    if (!campo) {
        return;
    }

    campo.value =
        sumarAnios(
            obtenerValor(
                "calFecha"
            ),
            5
        );
}

function guardarCalificacion() {

    actualizarVencimientoCalificacion();
    generarCodigoCalificacion();

    const codigo =
        obtenerSelect(

function ultimaCalibracion(
    codigo
) {

    return registrosCalibracion
        .filter(
            registro =>
                registro.equipoCodigo === codigo
        )
        .sort(
            (a,b) =>
                new Date(b.fecha) -
                new Date(a.fecha)
        )[0] || null;
}

function mostrarInicioCalibracion() {

    moduloActual =
        "calibracion";

    marcarMenuActivo(
        "calibracion"
    );

    let vigente = 0;
    let proximo = 0;
    let vencido = 0;

    equiposCalibracion.forEach(
        equipo => {

            const ultima =
                ultimaCalibracion(
                    equipo.codigo
                );

            if (!ultima) {
                return;
            }

            const estado =
                estadoFecha(
                    ultima.vencimiento
                );

            if (
                estado.clase === "vigente"
            ) {
                vigente++;
            }

            if (
                estado.clase === "proximo"
            ) {
                proximo++;
            }

            if (
                estado.clase === "vencido"
            ) {
                vencido++;
            }
        }
    );

    document.getElementById(
        "contenido"
    ).innerHTML = `

        <div class="topbar">

            <div>

                <h1 class="titulo-pagina">
                    Calibración de Equipos
                </h1>

                    Control documental de instrumentos y calibraciones
                </div>

            </div>

            ${tarjetaResumen(

                equiposCalibracion.length,
                "azul-bg"

                "✓",
                "Vigentes",
                vigente,
                "verde-bg"
            )}

            ${tarjetaResumen(
                "◷",
                "Próximos",
                proximo,
                "amarillo-bg"
            )}

            ${tarjetaResumen(
                "!",
                "Vencidos",
                vencido,
                "rojo-bg"
            )}

        </div>

        <div class="tarjeta">

            <h2>

            ${tablaResumenCalibracion()}

        </div>
    `;
}

function guardarInstrumento() {

    const registro = {

        codigo:
            obtenerValor("metCodigo"),

        nombre:
            obtenerValor("metNombre"),

        area:
            obtenerValor("metArea"),

        ubicacion:
            obtenerValor("metUbicacion"),

        tipo:
            obtenerValor("metTipo")
    };

    if (
        !registro.codigo ||
        !registro.nombre ||
        !registro.area
    ) {

        alert(
            "Completa código, nombre y área."
        );

        return;
    }

    if (
        indiceEdicion === null
    ) {

        equiposCalibracion.push(
            registro
        );

    } else {

        const anterior =
            equiposCalibracion[
                indiceEdicion
            ];

        registrosCalibracion.forEach(
            calibracion => {

                if (
                    calibracion.equipoCodigo ===
                    anterior.codigo
                ) {

                    calibracion.equipoCodigo =
                        registro.codigo;

                    calibracion.equipoNombre =
                        registro.nombre;
                }
            }
        );

        equiposCalibracion[
            indiceEdicion
        ] = registro;
    }

    guardarTodo();

    mostrarEquiposCalibracion();
}

function descargarPlantillaCalibracion() {

    const hoja =
        XLSX.utils.json_to_sheet([
            {
                "Código":"E1169/EF",
                "Nombre":"Cronómetro Digital",
                "Área":"Producción",
                "Ubicación":"Sala",
                "Tipo":"Cronómetro",
                "N° Certificado":"CAL-001",
                "Fecha Calibración":"09/09/2026",
                "Proveedor":"Proveedor externo"
            }
        ]);

    const libro =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        libro,
        hoja,
        "Calibraciones"
    );

    XLSX.writeFile(
        libro,
        "Plantilla_Calibraciones.xlsx"
    );
}

function importarExcelCalibracion(
    evento
) {

    const archivo =
        evento.target.files[0];

    if (!archivo) {
        return;
    }

    const lector =
        new FileReader();

    lector.onload =
        eventoLectura => {

            try {

                const libro =
                    XLSX.read(
                        new Uint8Array(
                            eventoLectura.target.result
                        ),
                        {
                            type:"array",
                            cellDates:true
                        }
                    );

                const hoja =
                    libro.Sheets[
                        libro.SheetNames[0]
                    ];

                const filas =
                    XLSX.utils.sheet_to_json(
                        hoja,
                        {
                            defval:""
                        }
                    );

                filas.forEach(
                    fila => {

                        const codigo =
                            String(
                                fila["Código"] ||
                                fila["Codigo"] ||
                                ""
                            ).trim();

                        const nombre =
                            String(
                                fila["Nombre"] ||
                                ""
                            ).trim();

                        const area =
                            String(
                                fila["Área"] ||
                                fila["Area"] ||
                                ""
                            ).trim();

                        if (
                            !codigo ||
                            !nombre ||
                            !area
                        ) {
                            return;
                        }

                        if (
                            !equiposCalibracion.some(
                                equipo =>
                                    equipo.codigo === codigo
                            )
                        ) {

                            equiposCalibracion.push({

                                codigo,

                                nombre,

                                area,

                                ubicacion:
                                    String(
                                        fila["Ubicación"] ||
                                        fila["Ubicacion"] ||
                                        ""
                                    ),

                                tipo:
                                    String(
                                        fila["Tipo"] ||
                                        ""
                                    )
                            });
                        }

                        let fecha =
                            fila["Fecha Calibración"] ||
                            fila["Fecha Calibracion"];

                        if (
                            fecha instanceof Date
                        ) {

                            fecha = [
                                fecha.getFullYear(),
                                String(fecha.getMonth()+1).padStart(2,"0"),
                                String(fecha.getDate()).padStart(2,"0")
                            ].join("-");
                        }

                        if (
                            typeof fecha === "string" &&
                            /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(fecha)
                        ) {

                            const [
                                dia,
                                mes,
                                anio
                            ] = fecha.split("/");

                            fecha =
                                `${anio}-${mes.padStart(2,"0")}-${dia.padStart(2,"0")}`;
                        }

                        if (!fecha) {
                            return;
                        }

                        registrosCalibracion.push({

                            equipoCodigo:
                                codigo,

                            equipoNombre:
                                nombre,

                            certificado:
                                String(
                                    fila["N° Certificado"] ||
                                    fila["Certificado"] ||
                                    "Pendiente"
                                ),

                            fecha,

                            vencimiento:
                                sumarAnios(
                                    fecha,
                                    1
                                ),

                            proveedor:
                                String(
                                    fila["Proveedor"] ||
                                    fila["Laboratorio / Proveedor"] ||
                                    ""
                                )
                        });
                    }
                );

                guardarTodo();

                alert(
                    "Carga completada."
                );

                mostrarInicioCalibracion();

            } catch(error) {

                console.error(error);

                alert(
                    "No se pudo leer el archivo."
                );
            }
        };

    lector.readAsArrayBuffer(
        archivo
    );
}

function guardarDocumentoSACM() {

    const registro = {

        tipo:
            obtenerSelect(
                "docTipo"
            ),

        codigo:
            obtenerValor(
                "docCodigo"
            ),

        nombre:
            obtenerValor(
                "docNombre"
            ),

        emision:
            obtenerValor(
                "docEmision"
            ),

        vigencia:
            obtenerValor(
                "docVigencia"
            )
    };

    if (
        !registro.codigo ||
        !registro.nombre ||
        !registro.emision ||
        !registro.vigencia
    ) {

        alert(
            "Completa todos los campos."
        );

        return;
    }

    if (
        registro.vigencia <
        registro.emision
    ) {

        alert(
            "La vigencia no puede ser anterior a la emisión."
        );

        return;
    }

    if (
        indiceEdicion === null
    ) {

        documentosSACM.push(
            registro
        );

    } else {

        documentosSACM[
            indiceEdicion
        ] = registro;
    }

    guardarTodo();

    mostrarDocumentosSACM();
}

function eliminarDocumentoSACM(
    indice
) {

    if (
        !confirm(
            "¿Eliminar este documento?"
        )
    ) {
        return;
    }

    documentosSACM.splice(
        indice,
        1
    );

    guardarTodo();

    renderDocumentosSACM();
}

                                </td>

                                <td>
                                    ${puntoEstado(

function guardarRegistroDocumental(
    modulo,
    categoria
) {

    const registro = {

        modulo,

        categoria,

        codigo:
            obtenerValor(
                "regDocCodigo"
            ),

        nombre:
            obtenerValor(
                "regDocNombre"
            ),

        emision:
            obtenerValor(
                "regDocEmision"
            ),

        vigencia:
            obtenerValor(
                "regDocVigencia"
            ),

        proveedor:
            obtenerValor(
                "regDocProveedor"
            ),

        referencia:
            obtenerValor(
                "regDocReferencia"
            ),

        observaciones:
            obtenerValor(
                "regDocObservaciones"
            )
    };

    if (
        !registro.codigo ||
        !registro.nombre
    ) {

        alert(
            "Completa código e identificación."
        );

        return;
    }

    if (
        registro.emision &&
        registro.vigencia &&
        registro.vigencia <
        registro.emision
    ) {

        alert(
            "La fecha de vigencia no puede ser anterior a la emisión."
        );

        return;
    }

    if (
        indiceEdicion === null
    ) {

        registrosDocumentales.push(
            registro
        );

    } else {

        registrosDocumentales[
            indiceEdicion
        ] = registro;
    }

    guardarTodo();

    mostrarCategoriaDocumental(
        modulo,
        categoria
    );
}

function eliminarRegistroDocumental(
    indice,
    modulo,
    categoria
) {

    if (
        !confirm(
            "¿Eliminar este registro?"

    ) {
        return;
    }

    registrosDocumentales.splice(
        indice,
        1
    );

    guardarTodo();

    renderCategoriaDocumental(
        modulo,
        categoria
    );
}

    const buscar =

        registrosCategoria(
            modulo,
            categoria

            registro =>
                [
                    registro.codigo,
                    registro.nombre,
                    registro.proveedor,
                    registro.referencia
                ].some(
                    campo =>
                        String(campo||"")
                        .toLowerCase()

        );

    document.getElementById(
        "tablaPrincipal"
    ).innerHTML =
        tablaRegistrosDocumentales(
            lista,
            true,
            modulo,
            categoria
        );

function porcentaje(
    valor,
    total
) {

    if (!total) {
        return 0;
    }

    return Math.round(
        valor / total * 100
    );
}

function kpiCalificacionTipo(
    tipo
) {

    const lista =
        tipo === "PQ"
        ? equipos.filter(
            equipo =>
                equipo.aplicaPQ !== false
        )
        : equipos;

    const resultado = {
        total: lista.length,
        vigente: 0,
        vencido: 0
    };

    lista.forEach(
        equipo => {

            const estado =
                estadoTipoCalificacion(
                    equipo.codigo,
                    tipo
                );

            if (
                estado.clase === "vigente" ||
                estado.clase === "proximo"
            ) {

                resultado.vigente++;

            } else {

                resultado.vencido++;
            }
        }
    );

    return resultado;
}

function kpiCalibracion() {

    const resultado = {
        total:equiposCalibracion.length,
        vigente:0,
        vencido:0
    };

    equiposCalibracion.forEach(
        equipo => {

            const ultima =
                ultimaCalibracion(
                    equipo.codigo
                );

            if (!ultima) {

                resultado.vencido++;
                return;
            }

            const estado =
                estadoFecha(
                    ultima.vencimiento
                );

            if (
                estado.clase === "vencido"
            ) {

                resultado.vencido++;

            } else {

                resultado.vigente++;
            }
        }
    );

    return resultado;
}

function kpiModuloDocumental(

) {

    const lista =
        registrosModulo(

        ).filter(
            registro =>
                registro.vigencia
        );

            }
        }
    );

}

function kpiDocumentacion() {

    };

function mostrarKPI(
    area
) {

    if (!esAdmin) {
        return;
    }

    moduloActual =
        "kpi";

    marcarMenuActivo(
        "kpi"
    );

    destruirGraficos();

    let graficos = [];

    if (
        area === "calificacion"
    ) {

        graficos = [
            ["IQ",kpiCalificacionTipo("IQ")],
            ["OQ",kpiCalificacionTipo("OQ")],
            ["PQ",kpiCalificacionTipo("PQ")]
        ];

    } else if (
        area === "calibracion"
    ) {

        graficos = [
            [
                "Calibración de Equipos",
                kpiCalibracion()
            ]
        ];

    } else if (
        area === "documentacion"
    ) {

        graficos = [
            [
                "Documentación SAC-M",
                kpiDocumentacion()
            ]
        ];

    } else {

        graficos = [
            [
                CONFIG_MODULOS[area].titulo,
                kpiModuloDocumental(area)
            ]
        ];
    }

    document.getElementById(
        "contenido"
    ).innerHTML = `

        <div class="topbar">

            <div>

                <h1 class="titulo-pagina">
                    KPI
                </h1>

                <div class="subtitulo-pagina">
                    Indicadores de vigencia documental
                </div>

            </div>

        </div>

        ${submenuKPI(area)}

        <div class="kpi-grid">

            ${graficos.map((grafico,indice) =>
                cajaGraficoKPI(
                    grafico[0],
                    grafico[1],
                    `grafico${indice}`
                )
            ).join("")}

        </div>
    `;

    setTimeout(
        () => {

            graficos.forEach(
                (grafico,indice) => {

                    crearGrafico(
                        `grafico${indice}`,
                        grafico[1]
                    );
                }
            );
        },
        0
    );
}

function cajaGraficoKPI(
    titulo,
    datos,
    id
) {

    return `

        <div class="kpi-chart">

            <h3>
                ${titulo}
            </h3>

            <div class="subdato">
                Total considerado:
                ${datos.total}
            </div>

            <div class="chart-wrap">
                <canvas id="${id}"></canvas>
            </div>

            <div class="kpi-detalle">

                <div class="kpi-estado verde">

                    <strong>
                        Vigentes
                    </strong>

                    <div class="kpi-cantidad">
                        ${datos.vigente}
                    </div>

                    ${porcentaje(
                        datos.vigente,
                        datos.total
                    )}%

                </div>

                <div class="kpi-estado rojo">

                    <strong>
                        Vencidos
                    </strong>

                    <div class="kpi-cantidad">
                        ${datos.vencido}
                    </div>

                    ${porcentaje(
                        datos.vencido,
                        datos.total
                    )}%

                </div>

            </div>

        </div>
    `;
}

function crearGrafico(
    id,
    datos
) {

    const canvas =
        document.getElementById(id);

    if (!canvas) {
        return;
    }

    const grafico =
        new Chart(
            canvas,
            {
                type:"doughnut",

                data:{
                    labels:[
                        "Vigente",
                        "Vencido"
                    ],

                    datasets:[
                        {
                            data:[
                                datos.vigente,
                                datos.vencido
                            ],

                            backgroundColor:[
                                "#28a65a",
                                "#dc3545"
                            ],

                            borderColor:
                                "#ffffff",

                            borderWidth:
                                4
                        }
                    ]
                },

                options:{
                    responsive:true,
                    maintainAspectRatio:false,
                    cutout:"60%",

                    plugins:{
                        legend:{
                            position:"bottom"
                        }
                    }
                }
            }
        );

    graficosKPI.push(
        grafico
    );
}

function destruirGraficos() {

    graficosKPI.forEach(
        grafico => {

            try {
                grafico.destroy();
            } catch(error) {}
        }
    );

    graficosKPI = [];
}

   SINCRONIZACIÓN ENTRE PESTAÑAS
========================================================= */

window.addEventListener(
    "storage",
    () => {

        equipos =
            leerDatos("equipos");

        calificaciones =
            leerDatos("calificaciones");

        manuales =
            leerDatos("manuales");

        equiposCalibracion =
            leerDatos("equiposCalibracion");

        registrosCalibracion =
            leerDatos("registrosCalibracion");

        documentosSACM =
            leerDatos("documentosSACM");

        registrosDocumentales =
            leerDatos("registrosDocumentales");

        if (
            moduloActual !== "kpi"
        ) {

            abrirModulo(
                moduloActual
            );
        }
    }
);

/* =========================================================
   INICIO
========================================================= */

actualizarUsuario();

abrirModulo(
    "calificacion"
);

</script>
