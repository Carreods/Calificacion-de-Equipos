<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión SAC-M</title>

    <!-- Icono de la pestaña -->
    <link rel="icon" type="image/png" href="PPPP.png">

    <!-- Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --rojo-prater: #e30613;
            --rojo-claro: #fde8ea;

            --fondo: #eef1f3;
            --blanco: #ffffff;

            --texto: #182230;
            --texto-secundario: #66788a;

            --borde: #dfe4e8;

            --verde: #17854b;
            --verde-fondo: #def7e8;

            --amarillo: #c98200;
            --amarillo-fondo: #fff0cc;

            --rojo: #d91f2b;
            --rojo-fondo: #fde0e2;

            --gris: #66788a;
            --gris-fondo: #edf1f4;

            --azul: #196cb8;
            --azul-fondo: #e7f1ff;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--fondo);
            color: var(--texto);
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: 700;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 11px;
            border: 1px solid #d4dae0;
            border-radius: 8px;
            background: #ffffff;
            font-size: 13px;
            outline: none;
        }

        input,
        select {
            min-height: 40px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9ba8b4;
        }

        input[readonly] {
            background: #edf1f4;
            color: #50606f;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;

            width: 250px;
            height: 100vh;

            padding: 18px 12px;

            display: flex;
            flex-direction: column;

            overflow-y: auto;

            background: #ffffff;
            border-right: 1px solid var(--borde);

            z-index: 100;
        }

        .logo-box {
            padding: 5px 8px 14px;
            border-bottom: 1px solid #e6e9ed;
        }

        .logo-imagen {
            display: block;
            width: 150px;
            height: auto;
            margin-bottom: 10px;
        }

        .logo-subtitulo {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.35;
        }

        .logo-descripcion {
            margin-top: 4px;
            color: var(--texto-secundario);
            font-size: 10px;
            letter-spacing: .5px;
        }

        .menu {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
        }

        .menu li {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 10px 11px;
            margin-bottom: 4px;

            border-radius: 9px;

            color: #526273;
            font-size: 13px;
            line-height: 1.25;

            cursor: pointer;
        }

        .menu li:hover {
            background: #f7f8fa;
        }

        .menu li.activo {
            background: var(--rojo-claro);
            color: var(--rojo-prater);
            font-weight: 700;
        }

        .menu-icono {
            width: 18px;
            flex: none;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #e6e9ed;
        }

        .sidebar-label {
            margin-bottom: 6px;
            color: #657484;
            font-size: 10px;
            text-transform: uppercase;
        }

        .usuario-box {
            padding: 10px;
            background: #f7f8fa;
            border-radius: 8px;
        }

        .usuario-nombre {
            font-size: 13px;
            font-weight: 700;
        }

        .usuario-area {
            margin-top: 3px;
            color: #6d7985;
            font-size: 11px;
        }

        /* =========================================================
           CONTENIDO
        ========================================================= */

        .contenido {
            min-height: 100vh;
            margin-left: 250px;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 22px;
        }

        .titulo-pagina {
            margin: 0;
            font-size: 26px;
        }

        .subtitulo-pagina {
            margin-top: 5px;
            color: var(--texto-secundario);
            font-size: 13px;
        }

        .tarjeta {
            margin-bottom: 18px;
            padding: 20px;

            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 14px;
        }

        .tarjeta h2,
        .tarjeta h3 {
            margin-top: 0;
        }

        .subdato {
            margin-top: 3px;
            color: #748291;
            font-size: 11px;
        }

        /* =========================================================
           BOTONES
        ========================================================= */

        .btn-principal,
        .btn-login {
            background: var(--rojo-prater);
            color: #ffffff;
        }

        .btn-secundario,
        .btn-gris,
        .btn-editar,
        .btn-logout {
            background: #edf1f4;
            color: #344454;
        }

        .btn-verde {
            background: #e3f7ea;
            color: #17753b;
        }

        .btn-azul {
            background: #e7f1ff;
            color: #196cb8;
        }

        .btn-amarillo {
            background: #fff0cc;
            color: #9d6900;
        }

        .btn-eliminar {
            background: #fde8ea;
            color: #e30613;
        }

        .btn-baja {
            background: #fff0f1;
            color: #d91f2b;
        }

        .btn-reactivar {
            background: #e3f7ea;
            color: #17753b;
        }

        .btn-eliminar-definitivo {
            background: #b0000b;
            color: #ffffff;
        }

        .btn-eliminar-definitivo:hover {
            background: #8f0009;
        }

        .btn-login,
        .btn-logout {
            width: 100%;
            margin-top: 9px;
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* =========================================================
           SUBMENÚ
        ========================================================= */

        .submenu {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            padding: 7px;
            margin-bottom: 20px;

            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 12px;
        }

        .submenu button {
            background: transparent;
            color: #627181;
        }

        .submenu button:hover {
            background: #f4f6f7;
        }

        .submenu button.activo {
            background: var(--rojo-claro);
            color: var(--rojo-prater);
        }

        /* =========================================================
           FORMULARIOS
        ========================================================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .form-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .completo {
            grid-column: 1 / -1;
        }

        .acciones-form {
            display: flex;
            gap: 9px;
            margin-top: 15px;
        }

        .acciones-form button {
            flex: 1;
        }

        /* =========================================================
           TABLAS
        ========================================================= */

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            padding: 11px 9px;

            background: #f3f5f6;
            color: #455565;

            border-bottom: 1px solid #dfe3e8;

            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 11px 9px;
            border-bottom: 1px solid #e6e9ed;
            vertical-align: middle;
        }

        tbody tr:hover td {
            background: #fafbfc;
        }

        .codigo {
            font-weight: 700;
        }

        .enlace {
            color: #d60916;
            font-weight: 700;
            cursor: pointer;
        }

        .enlace:hover {
            text-decoration: underline;
        }

        .acciones-tabla {
            display: flex;
            gap: 5px;
        }

        /* =========================================================
           ESTADOS
        ========================================================= */

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .vigente {
            background: var(--verde-fondo);
            color: var(--verde);
        }

        .proximo {
            background: var(--amarillo-fondo);
            color: var(--amarillo);
        }

        .vencido {
            background: var(--rojo-fondo);
            color: var(--rojo);
        }

        .neutro {
            background: var(--gris-fondo);
            color: var(--gris);
        }

        .baja {
            background: #eceff1;
            color: #525f69;
        }

        .semaforo-punto {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 7px;
            border-radius: 50%;
            vertical-align: -1px;
        }

        .punto-verde {
            background: #20a35b;
        }

        .punto-amarillo {
            background: #e6a400;
        }

        .punto-rojo {
            background: #dc303c;
        }

        .punto-gris {
            background: #a8b1ba;
        }

        /* =========================================================
           RESUMEN
        ========================================================= */

        .resumen {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 18px;
        }

        .resumen-card {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 17px;

            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 13px;
        }

        .resumen-icono {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 42px;
            height: 42px;

            border-radius: 50%;
            font-size: 20px;
        }

        .verde-bg {
            background: #dcf8e8;
        }

        .amarillo-bg {
            background: #fff3d8;
        }

        .rojo-bg {
            background: #fde4e6;
        }

        .azul-bg {
            background: #e6f1ff;
        }

        .gris-bg {
            background: #edf1f4;
        }

        .resumen-titulo {
            color: var(--texto-secundario);
            font-size: 12px;
        }

        .resumen-numero {
            margin-top: 2px;
            font-size: 24px;
            font-weight: 800;
        }

        /* =========================================================
           FILTROS
        ========================================================= */

        .filtros {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* =========================================================
           FICHA DE EQUIPO
        ========================================================= */

        .ficha-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .ficha-codigo {
            color: var(--rojo-prater);
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .ficha-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .ficha-dato {
            padding: 14px;
            background: #f7f8fa;
            border-radius: 10px;
        }

        .ficha-label {
            color: #71808f;
            font-size: 11px;
        }

        .ficha-valor {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 700;
        }

        .estado-equipo-grande {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .estado-operativo {
            background: #def7e8;
            color: #17854b;
        }

        .estado-baja {
            background: #eceff1;
            color: #4f5b65;
        }

        .calificacion-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .etapa-card {
            border: 1px solid #e0e5e9;
            border-radius: 12px;
            overflow: hidden;
        }

        .etapa-header {
            padding: 12px 14px;
            background: #f3f5f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .etapa-titulo {
            font-size: 15px;
            font-weight: 800;
        }

        .doc-card {
            padding: 14px;
            border-top: 1px solid #e8ebee;
        }

        .doc-tipo {
            color: #6b7885;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .doc-codigo {
            font-weight: 800;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .doc-fechas {
            font-size: 11px;
            line-height: 1.6;
        }

        .sin-documento {
            color: #87939e;
            font-size: 12px;
        }

        .historial-item {
            padding: 12px 0;
            border-bottom: 1px solid #e6eaed;
        }

        .historial-item:last-child {
            border-bottom: 0;
        }

        /* =========================================================
           ZONA DE PELIGRO
        ========================================================= */

        .zona-peligro {
            border: 1px solid #efb5ba;
            background: #fff8f8;
        }

        .zona-peligro h2 {
            color: #b0000b;
        }

        .advertencia-peligro {
            padding: 12px 14px;
            margin-bottom: 14px;

            background: #fde8ea;
            color: #99131c;

            border-radius: 9px;

            font-size: 12px;
            line-height: 1.5;
        }

        /* =========================================================
           EXCEL
        ========================================================= */

        .excel-panel {
            padding: 30px;
            background: #fafbfc;
            border: 2px dashed #d4dae0;
            border-radius: 14px;
            text-align: center;
        }

        .excel-resumen {
            display: grid;
            grid-template-columns: repeat(4, minmax(0,1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .excel-resumen-card {
            padding: 14px;
            background: #ffffff;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
        }

        .excel-resumen-card strong {
            display: block;
            margin-top: 4px;
            font-size: 24px;
        }

        .fila-error td {
            background: #fff1f2 !important;
        }

        .fila-duplicada td {
            background: #fff8e6 !important;
        }

        .fila-valida td {
            background: #f5fbf7 !important;
        }

        /* =========================================================
           CONSULTA
        ========================================================= */

        .modo-consulta {
            margin-bottom: 18px;
            padding: 10px 13px;
            background: #e7f1ff;
            color: #196cb8;
            border-radius: 8px;
            font-size: 12px;
        }

        /* =========================================================
           LOGIN
        ========================================================= */

        .login-overlay {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,.45);

            z-index: 1000;
        }

        .login-card {
            width: 360px;
            max-width: 90%;
            padding: 24px;
            background: #ffffff;
            border-radius: 14px;
        }

        .login-error {
            display: none;
            margin-bottom: 10px;
            color: #d91f2b;
            font-size: 12px;
        }

        /* =========================================================
           OTROS MÓDULOS
        ========================================================= */

        .modulo-grid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 15px;
        }

        .modulo-card {
            padding: 18px;
            background: #fff;
            border: 1px solid #e0e5e9;
            border-radius: 12px;
        }

        .modulo-card h3 {
            margin: 0 0 8px;
        }

        /* =========================================================
           KPI
        ========================================================= */

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 18px;
        }

        .kpi-card {
            background: #ffffff;
            border: 1px solid #e0e5e9;
            border-radius: 14px;
            padding: 20px;
        }

        .kpi-card h3 {
            margin-top: 0;
        }

        .kpi-numero {
            font-size: 30px;
            font-weight: 800;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media(max-width:1100px) {
            .resumen,
            .ficha-grid,
            .calificacion-grid,
            .kpi-grid,
            .excel-resumen,
            .modulo-grid {
                grid-template-columns: repeat(2,minmax(0,1fr));
            }
        }

        @media(max-width:800px) {
            .sidebar {
                width: 190px;
            }

            .contenido {
                margin-left: 190px;
                padding: 15px;
            }

            .logo-imagen {
                width: 140px;
            }

            .form-grid,
            .form-grid-3,
            .resumen,
            .ficha-grid,
            .calificacion-grid,
            .kpi-grid,
            .excel-resumen,
            .modulo-grid,
            .filtros {
                grid-template-columns: 1fr;
            }

            .completo {
                grid-column: auto;
            }

            .ficha-cabecera {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar">

    <div class="logo-box">

        <img
            src="logo prater.png"
            alt="Laboratorios Prater"
            class="logo-imagen"
        >

        <div class="logo-subtitulo">
            Sistemas de Apoyo Crítico y Metrología
        </div>

        <div class="logo-descripcion">
            LABORATORIOS PRATER
        </div>

    </div>

    <ul class="menu" id="menuPrincipal">

        <li data-modulo="calificacion" onclick="abrirModulo('calificacion')">
            <span class="menu-icono">▣</span>
            Calificación de Equipos
        </li>

        <li data-modulo="calibracion" onclick="abrirModulo('calibracion')">
            <span class="menu-icono">◎</span>
            Calibración de Equipos
        </li>

        <li data-modulo="agua" onclick="abrirModulo('agua')">
            <span class="menu-icono">◉</span>
            Agua Purificada
        </li>

        <li data-modulo="hvac" onclick="abrirModulo('hvac')">
            <span class="menu-icono">≋</span>
            HVAC
        </li>

        <li data-modulo="aire" onclick="abrirModulo('aire')">
            <span class="menu-icono">➜</span>
            Aire Comprimido
        </li>

        <li data-modulo="mapeos" onclick="abrirModulo('mapeos')">
            <span class="menu-icono">⌁</span>
            Mapeos Térmicos
        </li>

        <li data-modulo="documentacion" onclick="abrirModulo('documentacion')">
            <span class="menu-icono">▤</span>
            Documentación SAC-M
        </li>

        <li
            id="menuKPI"
            data-modulo="kpi"
            style="display:none"
            onclick="abrirModulo('kpi')"
        >
            <span class="menu-icono">◫</span>
            KPI
        </li>

    </ul>

    <div class="sidebar-bottom">

        <div class="sidebar-label">
            Usuario
        </div>

        <div class="usuario-box">

            <div
                class="usuario-nombre"
                id="nombreUsuario"
            ></div>

            <div
                class="usuario-area"
                id="areaUsuario"
            ></div>

        </div>

        <button
            class="btn-login"
            id="btnAcceso"
            onclick="abrirLogin()"
        >
            🔐 Acceso administrador
        </button>

        <button
            class="btn-logout"
            id="btnSalir"
            onclick="cerrarSesion()"
            style="display:none"
        >
            Cerrar sesión
        </button>

    </div>

</aside>

<main class="contenido" id="contenido"></main>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginModal" style="display:none">

    <div class="login-overlay">

        <div class="login-card">

            <h2>
                Acceso administrador
            </h2>

            <div
                class="login-error"
                id="loginError"
            >
                Usuario o contraseña incorrectos.
            </div>

            <label>Usuario</label>
            <input id="loginUsuario">

            <label>Contraseña</label>
            <input
                type="password"
                id="loginClave"
                onkeydown="if(event.key==='Enter') iniciarSesion()"
            >

            <div class="acciones-form">

                <button
                    class="btn-principal"
                    onclick="iniciarSesion()"
                >
                    Ingresar
                </button>

                <button
                    class="btn-secundario"
                    onclick="cerrarLogin()"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ADMIN_USUARIO = "admin";
const ADMIN_CLAVE = "SACM2026";

const DIAS_PROXIMO = 180;

let esAdmin =
    sessionStorage.getItem("adminSACM") === "true";

let moduloActual = "calificacion";

let indiceEdicionEquipo = null;
let indiceEdicionDocumento = null;

let excelTemporal = null;

/* =========================================================
   ALMACENAMIENTO
========================================================= */

function leerDatos(clave) {

    try {

        const contenido =
            localStorage.getItem(clave);

        if (!contenido) {
            return [];
        }

        const datos =
            JSON.parse(contenido);

        return Array.isArray(datos)
            ? datos
            : [];

    } catch(error) {

        console.error(
            "Error leyendo " + clave,
            error
        );

        return [];
    }
}

let equipos =
    leerDatos("equipos");

let calificaciones =
    leerDatos("calificaciones");

let equiposCalibracion =

    let cambios = false;

    equipos.forEach(equipo => {

        if (!("marca" in equipo)) {
            equipo.marca = "";
            cambios = true;
        }

        if (!("modelo" in equipo)) {
            equipo.modelo = "";
            cambios = true;
        }

        if (!("serie" in equipo)) {
            equipo.serie = "";
            cambios = true;
        }

        if (!("estado" in equipo)) {
            equipo.estado = "Operativo";
            cambios = true;
        }

        if (!("fechaBaja" in equipo)) {
            equipo.fechaBaja = "";
            cambios = true;
        }

        if (!("motivoBaja" in equipo)) {

/* =========================================================
   UTILIDADES
========================================================= */

function obtenerValor(id) {

    const elemento =
        document.getElementById(id);

    return elemento

        : "";
}

function obtenerSelect(id) {

    const elemento =
        document.getElementById(id);

    return elemento
        ? elemento.value
        : "";
}

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escaparJS(valor) {

    return String(valor ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

function fechaBonita(fecha) {

    if (!fecha) {
        return "—";
    }

    const partes =
        String(fecha).split("-");

    if (partes.length !== 3) {
        return fecha;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function fechaHoy() {

    const hoy = new Date();

    return [
        hoy.getFullYear(),
        String(hoy.getMonth()+1).padStart(2,"0"),
        String(hoy.getDate()).padStart(2,"0")
    ].join("-");
}

function sumarAnios(fecha,cantidad) {

    if (!fecha) {
        return "";
    }

    const partes =
        String(fecha).split("-");

    if (partes.length !== 3) {
        return "";
    }

    const anio = Number(partes[0]);
    const mes = Number(partes[1]);
    const dia = Number(partes[2]);

    let nuevaFecha =
        new Date(
            anio + cantidad,
            mes - 1,
            dia
        );

    if (
        nuevaFecha.getMonth() !==
        mes - 1
    ) {

        nuevaFecha =
            new Date(
                anio + cantidad,
                mes,
                0
            );
    }

    return [
        nuevaFecha.getFullYear(),
        String(nuevaFecha.getMonth()+1).padStart(2,"0"),
        String(nuevaFecha.getDate()).padStart(2,"0")
    ].join("-");
}

function normalizarFechaExcel(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "";
    }

    if (valor instanceof Date) {

        return [
            valor.getFullYear(),
            String(valor.getMonth()+1).padStart(2,"0"),
            String(valor.getDate()).padStart(2,"0")
        ].join("-");
    }

    if (typeof valor === "number") {

        const fecha =
            XLSX.SSF.parse_date_code(valor);

        if (!fecha) {
            return "";
        }

        return [
            fecha.y,
            String(fecha.m).padStart(2,"0"),
            String(fecha.d).padStart(2,"0")
        ].join("-");
    }

    const texto =
        String(valor).trim();

    if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) {
        return texto;
    }

    const match =
        texto.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (match) {

        return (
            match[3] +
            "-" +
            match[2].padStart(2,"0") +
            "-" +
            match[1].padStart(2,"0")
        );
    }

    return "";
}

function columnaExcel(fila,nombres) {

    for (const nombre of nombres) {

        if (
            fila[nombre] !== undefined &&
            fila[nombre] !== null &&
            String(fila[nombre]).trim() !== ""
        ) {
            return fila[nombre];
        }
    }

    return "";
}

/* =========================================================
   ESTADOS
========================================================= */

function estadoFecha(fecha) {

    if (!fecha) {

        return {
            texto:"Sin registro",
            clase:"neutro"
        };
    }

    const hoy =
        new Date();

    hoy.setHours(0,0,0,0);

    const vencimiento =
        new Date(
            fecha + "T00:00:00"
        );

    const dias =
        Math.ceil(
            (vencimiento - hoy) /
            86400000
        );

    if (dias < 0) {

        return {
            texto:"Vencido",
            clase:"vencido"
        };
    }

    if (dias <= DIAS_PROXIMO) {

        return {
            texto:"Próximo",
            clase:"proximo"
        };
    }

    return {
        texto:"Vigente",
        clase:"vigente"
    };
}

function puntoEstado(estado) {

    let punto = "punto-gris";

    if (estado.clase === "vigente") {
        punto = "punto-verde";
    }

    if (estado.clase === "proximo") {
        punto = "punto-amarillo";
    }

    if (estado.clase === "vencido") {
        punto = "punto-rojo";
    }

    return `
        <span class="semaforo-punto ${punto}"></span>
        <span class="badge ${estado.clase}">
            ${estado.texto}
        </span>
    `;
}

function tarjetaResumen(icono,titulo,valor,clase) {

    return `
        <div class="resumen-card">

            <div class="resumen-icono ${clase}">
                ${icono}
            </div>

            <div>

                <div class="resumen-titulo">
                    ${titulo}
                </div>

                <div class="resumen-numero">
                    ${valor}
                </div>

            </div>

        </div>
    `;
}

/* =========================================================
   DOCUMENTOS DE CALIFICACIÓN
========================================================= */

function fechaDocumento(registro) {

    return (
        registro?.fecha ||
        registro?.emision ||
        ""
    );
}

function ultimoDocumento(
    equipoCodigo,
    tipo,
    documento
) {

    return calificaciones
        .filter(
            registro =>
                registro.equipoCodigo === equipoCodigo &&
                registro.tipo === tipo &&
                registro.documento === documento
        )
        .sort(
            (a,b) =>
                fechaDocumento(b)
                .localeCompare(
                    fechaDocumento(a)
                )
        )[0] || null;
}

function estadoEtapa(equipo,tipo) {

    if (
        tipo === "PQ" &&
        equipo.aplicaPQ === false
    ) {

        return {
            texto:"No aplica",
            clase:"neutro"
        };
    }

    const protocolo =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Protocolo"
        );

    const reporte =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Reporte"
        );

    if (
        !protocolo ||
        !reporte
    ) {

        return {
            texto:"Incompleto",
            clase:"vencido"
        };
    }

    const estadoProtocolo =
        estadoFecha(
            protocolo.vencimiento
        );

    const estadoReporte =
        estadoFecha(
            reporte.vencimiento
        );

    if (
        estadoProtocolo.clase === "vencido" ||
        estadoReporte.clase === "vencido"
    ) {

        return {
            texto:"Vencido",
            clase:"vencido"
        };
    }

    if (
        estadoProtocolo.clase === "proximo" ||
        estadoReporte.clase === "proximo"
    ) {

        return {
            texto:"Próximo",
            clase:"proximo"
        };
    }

    return {
        texto:"Vigente",
        clase:"vigente"
    };
}

function equipoCompletamenteCalificado(equipo) {

    const iq =
        estadoEtapa(
            equipo,
            "IQ"
        );

    const oq =
        estadoEtapa(
            equipo,
            "OQ"
        );

    if (
        iq.clase === "vencido" ||
        oq.clase === "vencido"
    ) {
        return false;
    }

    if (
        equipo.aplicaPQ !== false
    ) {

        const pq =
            estadoEtapa(
                equipo,
                "PQ"
            );

        if (pq.clase === "vencido") {
            return false;
        }
    }

    return true;
}

function guardarEquipo() {

    const codigo =
        obtenerValor(
            "eqCodigo"
        );

    const nombre =
        obtenerValor(
            "eqNombre"
        );

    const area =
        obtenerValor(
            "eqArea"
        );

    if (
        !codigo ||
        !nombre ||
        !area
    ) {

        alert(
            "Completa Código, Nombre y Área."
        );

        return;
    }

    const duplicado =
        equipos.findIndex(
            (equipo,indice) =>
                equipo.codigo.toLowerCase() ===
                    codigo.toLowerCase() &&
                indice !==
                    indiceEdicionEquipo
        );

    if (duplicado !== -1) {

        alert(
            "Ya existe otro equipo con ese código."
        );

        return;
    }

    if (
        indiceEdicionEquipo === null
    ) {

        equipos.push({

            codigo,
            nombre,
            area,

            marca:
                obtenerValor(
                    "eqMarca"
                ),

            modelo:
                obtenerValor(
                    "eqModelo"
                ),

            serie:
                obtenerValor(
                    "eqSerie"
                ),

            ubicacion:
                obtenerValor(
                    "eqUbicacion"
                ),

            aplicaPQ:
                obtenerSelect(
                    "eqPQ"
                ) === "si",

            estado:
                "Operativo",

            fechaBaja:
                "",

            motivoBaja:
                "",

            historialEstado:
                []
        });

    } else {

        const anterior =
            equipos[
                indiceEdicionEquipo
            ];

        const codigoAnterior =
            anterior.codigo;

        anterior.codigo = codigo;
        anterior.nombre = nombre;
        anterior.area = area;

        anterior.marca =
            obtenerValor(
                "eqMarca"
            );

        anterior.modelo =
            obtenerValor(
                "eqModelo"
            );

        anterior.serie =
            obtenerValor(
                "eqSerie"
            );

        anterior.ubicacion =
            obtenerValor(
                "eqUbicacion"
            );

        anterior.aplicaPQ =
            obtenerSelect(
                "eqPQ"
            ) === "si";

        calificaciones.forEach(
            documento => {

                if (
                    documento.equipoCodigo ===
                    codigoAnterior
                ) {

                    documento.equipoCodigo =
                        codigo;

                    documento.equipoNombre =
                        nombre;
                }
            }
        );
    }

    guardarTodo();

    mostrarEquiposCalificacion();
}

function renderEquipos() {

    const contenedor =
        document.getElementById(
            "tablaPrincipal"
        );

    if (!contenedor) {
        return;
    }

    const buscar =
        obtenerValor(
            "buscarEquipo"
        ).toLowerCase();

    const filtroEstado =
        obtenerSelect(
            "filtroEstadoEquipo"
        );

    const filtroPQ =
        obtenerSelect(
            "filtroPQ"
        );

    const lista =
        equipos.filter(
            equipo => {

                const coincideBusqueda =
                    [
                        equipo.codigo,
                        equipo.nombre,
                        equipo.area,
                        equipo.marca,
                        equipo.modelo,
                        equipo.serie,
                        equipo.ubicacion
                    ].some(
                        campo =>
                            String(campo||"")
                            .toLowerCase()
                            .includes(buscar)
                    );

                const coincideEstado =
                    !filtroEstado ||
                    equipo.estado ===
                    filtroEstado;

                const coincidePQ =
                    !filtroPQ ||
                    (
                        filtroPQ === "si" &&
                        equipo.aplicaPQ !== false
                    ) ||
                    (
                        filtroPQ === "no" &&
                        equipo.aplicaPQ === false
                    );

                return (
                    coincideBusqueda &&
                    coincideEstado &&
                    coincidePQ
                );
            }
        );

    if (!lista.length) {

        contenedor.innerHTML = `
            <div class="subdato">
                No se encontraron equipos.
            </div>
        `;

        return;
    }

    contenedor.innerHTML = `

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>

                        <th>Nombre</th>

                        <th>Modelo</th>
                        <th>Serie</th>
                        <th>Ubicación</th>
                        <th>PQ</th>
                        <th>Estado</th>

                            <tr>

                                <td class="codigo">
                                    ${escaparHTML(equipo.codigo)}
                                </td>

                                <td>
                                    ${escaparHTML(equipo.nombre)}
                                </td>

                                <td>
                                    ${escaparHTML(equipo.area)}
                                </td>

                                <td>
                                    ${escaparHTML(equipo.marca)||"—"}
                                </td>

                                <td>
                                    ${escaparHTML(equipo.modelo)||"—"}
                                </td>

                                <td>
                                    ${escaparHTML(equipo.serie)||"—"}
                                </td>

                                <td>
                                    ${escaparHTML(equipo.ubicacion)||"—"}
                                </td>

                                <td>
                                    ${

                                            ? "Sí"

                                    }
                                </td>

                                <td>

                                    ${
                                        equipo.estado === "De baja"
                                            ? `<span class="badge baja">De baja</span>`
                                            : `<span class="badge vigente">Operativo</span>`
                                    }

                                </td>

                                <td>

                                    <button

                                        onclick="mostrarFichaEquipo('${escaparJS(equipo.codigo)}')"

function tarjetaEtapa(equipo,tipo) {

    if (
        tipo === "PQ" &&
        equipo.aplicaPQ === false
    ) {

        return `
            <div class="etapa-card">

                <div class="etapa-header">

                    <div class="etapa-titulo">
                        PQ
                    </div>

                    <span class="badge neutro">
                        No aplica

                </div>

                <div class="doc-card">

                    <div class="sin-documento">
                        Este equipo fue definido como no aplicable a Calificación de Desempeño.
                    </div>

                </div>

            </div>
        `;
    }

    const protocolo =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Protocolo"
        );

    const reporte =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Reporte"
        );

    const estado =
        estadoEtapa(
            equipo,
            tipo
        );

    return `
        <div class="etapa-card">

            <div class="etapa-header">

                <div class="etapa-titulo">
                    ${tipo}
                </div>

                ${puntoEstado(estado)}

            </div>

            ${tarjetaDocumentoFicha(
                protocolo,
                "Protocolo"
            )}

            ${tarjetaDocumentoFicha(
                reporte,
                "Reporte"
            )}

        </div>
    `;
}

function tarjetaDocumentoFicha(
    registro,

    }

    return `
        <div class="doc-card">

            <div class="doc-tipo">
                ${tipoDocumento}
            </div>

            <div class="doc-codigo">
                ${escaparHTML(registro.codigo)}

            <div class="doc-fechas">

        return `

function confirmarBajaEquipo(codigo) {

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    const fecha =
        obtenerValor(
            "fechaBaja"
        );

    const motivo =
        obtenerValor(
            "motivoBaja"
        );

    if (!fecha) {

        alert(
            "Ingresa la fecha de baja."
        );

        return;
    }

    if (
        !confirm(
            `¿Confirmar la baja del equipo ${equipo.codigo}?\n\n` +
            `La documentación NO será eliminada y el equipo dejará de participar en los KPI.`
        )
    ) {
        return;
    }

    equipo.estado =
        "De baja";

    equipo.fechaBaja =
        fecha;

    equipo.motivoBaja =
        motivo;

    if (
        !Array.isArray(
            equipo.historialEstado
        )
    ) {

        equipo.historialEstado = [];
    }

    equipo.historialEstado.push({

        estado:
            "De baja",

        fecha,

        motivo
    });

    guardarTodo();

    mostrarFichaEquipo(
        codigo
    );
}

/* =========================================================
   REACTIVAR
========================================================= */

function reactivarEquipo(codigo) {

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    if (
        !confirm(
            `¿Reactivar el equipo ${equipo.codigo}?\n\n` +
            `Al reactivarlo volverá a participar automáticamente en los KPI.`
        )
    ) {
        return;
    }

    equipo.estado =
        "Operativo";

    if (
        !Array.isArray(
            equipo.historialEstado
        )
    ) {

        equipo.historialEstado = [];
    }

    equipo.historialEstado.push({

        estado:
            "Reactivado",

        fecha:
            fechaHoy(),

        motivo:
            "Equipo reincorporado al estado operativo."
    });

    guardarTodo();

    mostrarFichaEquipo(
        codigo
    );
}

/* =========================================================
   ELIMINAR DEFINITIVAMENTE
========================================================= */

function eliminarEquipoDefinitivamente(codigo) {

    if (!esAdmin) {
        return;
    }

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {

        alert(
            "El equipo ya no existe."
        );

        return;
    }

    const documentosRelacionados =
        calificaciones.filter(
            documento =>
                documento.equipoCodigo ===
                codigo
        ).length;

    const confirmacionInicial =
        confirm(
            `ELIMINACIÓN DEFINITIVA\n\n` +
            `Equipo: ${equipo.codigo} - ${equipo.nombre}\n` +
            `Documentos IQ/OQ/PQ asociados: ${documentosRelacionados}\n\n` +
            `Esta acción eliminará el equipo y toda su documentación de calificación.\n\n` +
            `No utilices esta opción para equipos retirados del servicio; para eso existe "Dar de baja".\n\n` +
            `¿Deseas continuar?`
        );

    if (!confirmacionInicial) {
        return;
    }

    const codigoIngresado =
        prompt(
            `Para confirmar la eliminación definitiva, escribe exactamente el código del equipo:\n\n${equipo.codigo}`
        );

    if (codigoIngresado === null) {
        return;
    }

    if (
        codigoIngresado.trim() !==
        equipo.codigo
    ) {

        alert(
            "El código ingresado no coincide.\n\nEl equipo NO fue eliminado."
        );

        return;
    }

    const confirmacionFinal =
        confirm(
            `Última confirmación:\n\n` +
            `Se eliminará definitivamente:\n\n` +
            `• ${equipo.codigo} - ${equipo.nombre}\n` +
            `• ${documentosRelacionados} documento(s) de calificación asociados\n\n` +
            `¿Eliminar ahora?`
        );

    if (!confirmacionFinal) {
        return;
    }

    /*
        Primero se elimina toda la documentación
        perteneciente al equipo.
    */
    calificaciones =
        calificaciones.filter(
            documento =>
                documento.equipoCodigo !==
                codigo
        );

    /*
        Luego se elimina el equipo.
    */
    equipos =
        equipos.filter(
            item =>
                item.codigo !==
                codigo
        );

    guardarTodo();

    alert(
        `El equipo ${codigo} y su documentación asociada fueron eliminados definitivamente.`
    );

    mostrarEquiposCalificacion();
}

        equipos.find(

    const buscar =
        obtenerValor(
            "buscarDocumentoCal"

        obtenerSelect(
            "filtroTipoCal"
        );

    const documento =
        obtenerSelect(
            "filtroDocCal"
        );

    const lista =
        calificaciones.filter(
            registro => {

                const coincideBuscar =
                    [
                        registro.equipoCodigo,
                        registro.equipoNombre,
                        registro.codigo,
                        registro.tipo,
                        registro.documento
                    ].some(
                        valor =>
                            String(valor||"")
                            .toLowerCase()
                            .includes(buscar)
                    );

                const coincideTipo =
                    !tipo ||
                    registro.tipo === tipo;

                const coincideDocumento =
                    !documento ||
                    registro.documento === documento;

                return (
                    coincideBuscar &&
                    coincideTipo &&
                    coincideDocumento

function leerExcelCalificacion(evento) {

    const archivo =
        evento.target.files[0];

    if (!archivo) {
        return;
    }

    const lector =
        new FileReader();

    lector.onload =
        eventoLectura => {

            try {

                const libro =
                    XLSX.read(
                        new Uint8Array(
                            eventoLectura.target.result
                        ),
                        {
                            type:"array",
                            cellDates:true
                        }
                    );

                const hoja =
                    libro.Sheets[
                        libro.SheetNames[0]
                    ];

                const filas =
                    XLSX.utils.sheet_to_json(
                        hoja,
                        {
                            defval:"",
                            raw:true
                        }
                    );

                procesarExcelCalificacion(
                    filas,
                    archivo.name
                );

            } catch(error) {

                console.error(error);

                alert(
                    "No fue posible leer el archivo Excel."
                );
            }
        };

    lector.readAsArrayBuffer(
        archivo
    );

    evento.target.value = "";
}

function procesarExcelCalificacion(
    filas,
    nombreArchivo
) {

    const resultados = [];

    filas.forEach(
        (fila,indice) => {

            const codigo =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Código equipo",
                            "Codigo equipo",
                            "Código",
                            "Codigo"
                        ]
                    )
                ).trim();

            const nombre =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Nombre",
                            "Nombre equipo"
                        ]
                    )
                ).trim();

            const area =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Área",
                            "Area"
                        ]
                    )
                ).trim();

            if (
                !codigo ||
                !nombre ||
                !area
            ) {

                resultados.push({

                    fila:
                        indice + 2,

                    estado:
                        "error",

                    codigo,

                    nombre,

                    mensaje:
                        "Falta Código, Nombre o Área.",

                    data:
                        null
                });

                return;
            }

            const aplicaTexto =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Aplica PQ"
                        ]
                    )
                )
                .trim()
                .toLowerCase();

            const aplicaPQ =
                ![
                    "no",
                    "n",
                    "false",
                    "0"
                ].includes(
                    aplicaTexto
                );

            const equipo = {

                codigo,
                nombre,
                area,

                marca:
                    String(
                        columnaExcel(
                            fila,
                            ["Marca"]
                        )
                    ).trim(),

                modelo:
                    String(
                        columnaExcel(
                            fila,
                            ["Modelo"]
                        )
                    ).trim(),

                    String(
                        columnaExcel(
                            fila,

                                "N° de Serie"
                            ]
                        )
                    ).trim(),

                ubicacion:
                    String(
                        columnaExcel(
                            fila,
                            [
                                "Ubicación",
                                "Ubicacion"
                            ]
                        )
                    ).trim(),

                aplicaPQ,

                estado:
                    "Operativo",

                fechaBaja:
                    "",

                motivoBaja:
                    "",

                historialEstado:
                    []
            };

            const documentos = [];

            agregarDocumentoDesdeExcel(
                documentos,
                fila,
                codigo,
                nombre,
                "IQ",
                "Protocolo",
                "Protocolo IQ",
                "Emisión Protocolo IQ"
            );

            agregarDocumentoDesdeExcel(
                documentos,
                fila,
                codigo,
                nombre,
                "IQ",
                "Reporte",
                "Reporte IQ",
                "Emisión Reporte IQ"
            );

            agregarDocumentoDesdeExcel(
                documentos,
                fila,
                codigo,
                nombre,
                "OQ",
                "Protocolo",
                "Protocolo OQ",
                "Emisión Protocolo OQ"
            );

            agregarDocumentoDesdeExcel(
                documentos,
                fila,
                codigo,
                nombre,
                "OQ",
                "Reporte",
                "Reporte OQ",
                "Emisión Reporte OQ"
            );

            if (aplicaPQ) {

                    documentos,
                    fila,
                    codigo,
                    nombre,
                    "PQ",
                    "Protocolo",
                    "Protocolo PQ",

                );

                agregarDocumentoDesdeExcel(
                    documentos,
                    fila,
                    codigo,
                    nombre,
                    "PQ",
                    "Reporte",
                    "Reporte PQ",
                    "Emisión Reporte PQ"
                );
            }

            const existe =
                equipos.some(
                    item =>
                        item.codigo
                        .toLowerCase() ===
                        codigo.toLowerCase()
                );

            resultados.push({

                fila:
                    indice + 2,

                estado:
                    existe
                        ? "duplicado"
                        : "valido",

                codigo,
                nombre,

                mensaje:
                    existe
                        ? "El equipo ya existe."
                        : `Equipo nuevo · ${documentos.length} documentos detectados.`,

                data:{
                    equipo,
                    documentos
                }
            });
        }
    );

    excelTemporal = {
        archivo:
            nombreArchivo,

        resultados
    };

    renderPreviewExcelCalificacion();
}

function agregarDocumentoDesdeExcel(
    destino,
    fila,
    codigoEquipo,
    nombreEquipo,
    tipo,
    documento,
    columnaCodigo,
    columnaFecha
) {

    const codigo =
        String(
            columnaExcel(
                fila,
                [columnaCodigo]
            )
        ).trim();

    const fecha =
        normalizarFechaExcel(
            columnaExcel(
                fila,
                [columnaFecha]
            )
        );

    if (
        !codigo &&
        !fecha
    ) {
        return;
    }

    if (
        !codigo ||
        !fecha
    ) {
        return;
    }

    destino.push({

        equipoCodigo:
            codigoEquipo,

        equipoNombre:
            nombreEquipo,

        tipo,

        documento,

        codigo,

        version:
            extraerVersionDocumento(
                codigo
            ),

        fecha,

        vencimiento:
            sumarAnios(
                fecha,
                5
            )
    });
}

function extraerVersionDocumento(codigo) {

    if (!codigo) {
        return "";
    }

    const partes =
        String(codigo)
        .split("-");

    if (partes.length < 2) {
        return "";
    }

    return partes[
        partes.length - 1
    ];
}

function cancelarExcel() {

function confirmarImportacionCalificacion() {

    if (!excelTemporal) {
        return;
    }

    const modo =
        obtenerSelect(
            "modoImportacionCal"
        ) || "omitir";

    let nuevos = 0;
    let actualizados = 0;
    let omitidos = 0;

    excelTemporal.resultados.forEach(
        resultado => {

            if (
                resultado.estado ===
                "error"
            ) {

                omitidos++;
                return;
            }

            const data =
                resultado.data;

            const indice =
                equipos.findIndex(
                    equipo =>
                        equipo.codigo
                        .toLowerCase() ===
                        data.equipo.codigo
                        .toLowerCase()
                );

            if (indice === -1) {

                equipos.push(
                    data.equipo
                );

                data.documentos.forEach(
                    documento => {
                        agregarDocumentoSiNoExiste(
                            documento
                        );
                    }
                );

                nuevos++;

                return;
            }

            if (modo === "omitir") {

                omitidos++;
                return;
            }

            const anterior =
                equipos[indice];

            equipos[indice] = {

                ...anterior,

                codigo:
                    data.equipo.codigo,

                nombre:
                    data.equipo.nombre,

                area:
                    data.equipo.area,

                marca:
                    data.equipo.marca,

                modelo:
                    data.equipo.modelo,

                serie:
                    data.equipo.serie,

                ubicacion:
                    data.equipo.ubicacion,

                aplicaPQ:
                    data.equipo.aplicaPQ
            };

            data.documentos.forEach(
                documento => {

                    agregarDocumentoSiNoExiste(
                        documento
                    );
                }
            );

            actualizados++;
        }
    );

    guardarTodo();

    alert(
        `Importación completada.\n\n` +
        `Equipos nuevos: ${nuevos}\n` +
        `Equipos actualizados: ${actualizados}\n` +
        `Omitidos: ${omitidos}`
    );

    excelTemporal = null;

    mostrarInicioCalificacion();
}

function agregarDocumentoSiNoExiste(documento) {

    const existe =
        calificaciones.some(
            registro =>
                registro.equipoCodigo ===
                    documento.equipoCodigo &&
                registro.tipo ===
                    documento.tipo &&
                registro.documento ===
                    documento.documento &&
                registro.codigo ===
                    documento.codigo &&
                fechaDocumento(registro) ===
                    documento.fecha
        );

    if (!existe) {

        calificaciones.push(
            documento
        );
    }
}

    if (!equipos.length) {

    }

    const datos =
        equipos.map(
            equipo => {

                const pi =
                    ultimoDocumento(
                        equipo.codigo,
                        "IQ",
                        "Protocolo"
                    );

                const ri =
                    ultimoDocumento(
                        equipo.codigo,
                        "IQ",
                        "Reporte"
                    );

                const po =
                    ultimoDocumento(
                        equipo.codigo,
                        "OQ",
                        "Protocolo"
                    );

                const ro =
                    ultimoDocumento(
                        equipo.codigo,
                        "OQ",
                        "Reporte"
                    );

                const pp =
                    ultimoDocumento(
                        equipo.codigo,
                        "PQ",
                        "Protocolo"
                    );

                const rp =
                    ultimoDocumento(

                        "PQ",
                        "Reporte"
                    );

                return {

                    "Código equipo":
                        equipo.codigo,

                    "Nombre":
                        equipo.nombre,

                    "Área":
                        equipo.area,

                    "Marca":
                        equipo.marca || "",

                    "Modelo":
                        equipo.modelo || "",

                    "Serie":
                        equipo.serie || "",

                    "Ubicación":
                        equipo.ubicacion || "",

                    "Aplica PQ":
                        equipo.aplicaPQ !== false
                            ? "Sí"
                            : "No",

                    "Estado":
                        equipo.estado || "Operativo",

                    "Fecha de baja":
                        equipo.fechaBaja || "",

                    "Motivo de baja":
                        equipo.motivoBaja || "",

                    "Protocolo IQ":
                        pi?.codigo || "",

                    "Emisión Protocolo IQ":
                        fechaDocumento(pi),

                    "Reporte IQ":
                        ri?.codigo || "",

                    "Emisión Reporte IQ":
                        fechaDocumento(ri),

                    "Protocolo OQ":
                        po?.codigo || "",

                    "Emisión Protocolo OQ":
                        fechaDocumento(po),

                    "Reporte OQ":
                        ro?.codigo || "",

                    "Emisión Reporte OQ":
                        fechaDocumento(ro),

                    "Protocolo PQ":
                        equipo.aplicaPQ !== false
                            ? pp?.codigo || ""
                            : "NO APLICA",

                    "Emisión Protocolo PQ":
                        equipo.aplicaPQ !== false
                            ? fechaDocumento(pp)
                            : "",

                    "Reporte PQ":
                        equipo.aplicaPQ !== false
                            ? rp?.codigo || ""
                            : "NO APLICA",

                    "Emisión Reporte PQ":
                        equipo.aplicaPQ !== false
                            ? fechaDocumento(rp)
                            : ""
                };
            }
        );

    const hoja =
        XLSX.utils.json_to_sheet(
            datos
        );

    const libro =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        libro,
        hoja,
        "Calificación"
    );

    XLSX.writeFile(
        libro,
        `Base_Calificacion_${fechaHoy()}.xlsx`
    );
}

function contarKPIEtapa(tipo) {

    const lista =
        equipos.filter(
            equipo => {

                if (
                    equipo.estado ===
                    "De baja"
                ) {
                    return false;
                }

                if (
                    tipo === "PQ" &&
                    equipo.aplicaPQ === false
                ) {
                    return false;
                }

                return true;
            }
        );

    let vigente = 0;
    let vencido = 0;

    lista.forEach(
        equipo => {

            const estado =
                estadoEtapa(
                    equipo,
                    tipo
                );

            if (
                estado.clase === "vigente" ||
                estado.clase === "proximo"
            ) {

                vigente++;

            } else {

                vencido++;
            }
        }
    );

    return {
        total:
            lista.length,

        vigente,
        vencido
    };
}

function tarjetaKPI(titulo,datos) {

    const porcentajeVigente =
        datos.total
            ? Math.round(
                datos.vigente /
                datos.total *
                100
            )
            : 0;

    const porcentajeVencido =
        datos.total
            ? Math.round(
                datos.vencido /
                datos.total *
                100
            )
            : 0;

    return `
        <div class="kpi-card">

            <h3>
                ${titulo}
            </h3>

            <div class="subdato">
                Total considerado:
                ${datos.total}
            </div>

            <div
                style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:10px;
                    margin-top:18px;
                "
            >

                <div
                    style="
                        padding:15px;
                        background:#eefaf3;
                        border-radius:10px;
                    "
                >

                    <div>
                        Vigente
                    </div>

                    <div class="kpi-numero">
                        ${datos.vigente}
                    </div>

                    <strong>
                        ${porcentajeVigente}%
                    </strong>

                </div>

                <div
                    style="
                        padding:15px;
                        background:#fff0f1;
                        border-radius:10px;
                    "
                >

                    <div>
                        Vencido / Incompleto
                    </div>

                    <div class="kpi-numero">
                        ${datos.vencido}
                    </div>

                    <strong>
                        ${porcentajeVencido}%
                    </strong>

                </div>

            </div>

        </div>
    `;
}
