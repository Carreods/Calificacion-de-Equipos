function renderPreviewExcelCalibracion(){if(!excelCalibracionTemporal)return;const r=excelCalibracionTemporal.resultados,n=r.filter(x=>x.estado==="valido").length,e=r.filter(x=>x.estado==="duplicado").length,er=r.filter(x=>x.estado==="error").length;$("previewExcelCalibracion").innerHTML=`<div class="tarjeta"><h2>Vista previa</h2><div class="excel-resumen"><div class="excel-resumen-card">Filas<strong>${r.length}</strong></div><div class="excel-resumen-card">Nuevos<strong>${n}</strong></div><div class="excel-resumen-card">Existentes<strong>${e}</strong></div><div class="excel-resumen-card">Errores<strong>${er}</strong></div></div><label>Instrumentos existentes</label><select id="modoImportacionInstrumentos" style="max-width:450px"><option value="omitir">Omitir instrumentos existentes</option><option value="actualizar">Actualizar datos y agregar calibración nueva</option></select><div class="tabla-contenedor" style="margin-top:15px"><table><thead><tr><th>Fila</th><th>Código</th><th>Instrumento</th><th>Calibración</th><th>Resultado</th></tr></thead><tbody>${r.map(x=>`<tr class="${x.estado==="valido"?"fila-valida":x.estado==="duplicado"?"fila-duplicada":"fila-error"}"><td>${x.fila}</td><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td>${x.data?.registro?fechaBonita(x.data.registro.fecha):"Sin registro"}</td><td>${esc(x.mensaje)}</td></tr>`).join("")}</tbody></table></div><div class="acciones-form"><button class="btn-principal" onclick="confirmarImportacionCalibracion()">Importar</button><button class="btn-secundario" onclick="excelCalibracionTemporal=null;$('previewExcelCalibracion').innerHTML=''">Cancelar</button></div></div>`}
function confirmarImportacionCalibracion(){if(!excelCalibracionTemporal)return;const modo=sel("modoImportacionInstrumentos")||"omitir";let nuevos=0,actualizados=0,regs=0;excelCalibracionTemporal.resultados.forEach(r=>{if(r.estado==="error"||!r.data)return;const data=r.data,i=equiposCalibracion.findIndex(e=>norm(e.codigo)===norm(data.instrumento.codigo));if(i===-1){equiposCalibracion.push(data.instrumento);nuevos++;if(data.registro){registrosCalibracion.push(data.registro);regs++}return}if(modo!=="actualizar")return;const ant=equiposCalibracion[i],canon=ant.codigo;equiposCalibracion[i]={...ant,nombre:data.instrumento.nombre,area:data.instrumento.area,marca:data.instrumento.marca,modelo:data.instrumento.modelo,serie:data.instrumento.serie};actualizados++;if(data.registro){data.registro.equipoCodigo=canon;data.registro.equipoNombre=data.instrumento.nombre;const existente=registrosCalibracion.find(x=>norm(x.equipoCodigo)===norm(canon)&&x.fecha===data.registro.fecha);if(existente){if((!existente.certificado||existente.certificado==="Pendiente")&&data.registro.certificado!=="Pendiente")existente.certificado=data.registro.certificado;existente.limite=limiteCalibracion(existente.fecha)}else{registrosCalibracion.push(data.registro);regs++}}});actualizarProgramasCalibracionDinamicos(false);guardarCalibraciones();excelCalibracionTemporal=null;alert(`Importación completada.\n\nInstrumentos nuevos: ${nuevos}\nInstrumentos actualizados: ${actualizados}\nCalibraciones nuevas: ${regs}`);mostrarInicioCalibracion()}
function exportarCalibracionExcel(){if(!equiposCalibracion.length){alert("No existen instrumentos para exportar.");return}const d=[...equiposCalibracion].sort((a,b)=>compararPorCodigo(a,b)).map(e=>{const r=ultimaCalibracion(e.codigo),s=estadoInstrumentoCalibracion(e);return{"Código":e.codigo,"Nombre del instrumento":e.nombre,"Área":e.area,"Marca":e.marca||"","Modelo":e.modelo||"","Serie":e.serie||"","Fecha Calibración":r?.fecha||"","Código Certificado":r?.certificado||"","Estado":e.estado==="De baja"?"De baja":s.texto}});exportarXLSX(d,"Calibraciones",`Base_Calibraciones_${fechaHoy()}.xlsx`)}
function crearRespaldoCalibraciones(){if(!esAdmin)return;descargarJSON({tipo:"respaldo-calibraciones-sacm",version:1,fechaRespaldo:new Date().toISOString(),equiposCalibracion,registrosCalibracion,programasCalibracionEquipos},`Respaldo_Calibraciones_${fechaHoy()}.json`)}
function restaurarRespaldoCalibraciones(event){restaurarJSON(event,"respaldo-calibraciones-sacm",data=>{if(!Array.isArray(data.equiposCalibracion)||!Array.isArray(data.registrosCalibracion)||!Array.isArray(data.programasCalibracionEquipos))throw new Error();if(!confirm(`Se reemplazará la información actual de Calibraciones.\n\nInstrumentos: ${data.equiposCalibracion.length}\nCalibraciones: ${data.registrosCalibracion.length}\nProgramas: ${data.programasCalibracionEquipos.length}\n\n¿Continuar?`))return;equiposCalibracion=data.equiposCalibracion;registrosCalibracion=data.registrosCalibracion;programasCalibracionEquipos=data.programasCalibracionEquipos;migrarDatos(false);actualizarProgramasCalibracionDinamicos(false);guardarCalibraciones();alert("Respaldo restaurado correctamente.");mostrarInicioCalibracion()})}
/* UTILIDADES */
function leerExcelGenerico(ev,callback){const f=ev.target.files[0];if(!f)return;const nombre=f.name,r=new FileReader();r.onload=x=>{try{const wb=XLSX.read(new Uint8Array(x.target.result),{type:"array",cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});callback(rows,nombre)}catch(error){console.error(error);alert("No fue posible leer el archivo Excel.")}};r.readAsArrayBuffer(f);ev.target.value=""}
function exportarXLSX(datos,hoja,nombre){const ws=XLSX.utils.json_to_sheet(datos),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,hoja);XLSX.writeFile(wb,nombre)}
function descargarJSON(data,nombre){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function restaurarJSON(event,tipo,callback){if(!esAdmin)return;const archivo=event.target.files[0];event.target.value="";if(!archivo)return;const r=new FileReader();r.onload=e=>{try{const data=JSON.parse(e.target.result);if(data.tipo!==tipo)throw new Error();callback(data)}catch(error){console.error(error);alert("El archivo seleccionado no corresponde al respaldo esperado.")}};r.readAsText(archivo)}
/* KPI */
function mostrarKPI(){if(!esAdmin)return;moduloActual="kpi";vistaActual="kpi";marcarMenuActivo("kpi");const activos=equipos.filter(e=>e.estado!=="De baja"),completos=activos.filter(equipoCompletamenteCalificado),instAct=equiposCalibracion.filter(e=>e.estado!=="De baja"),instCal=instAct.filter(e=>estadoInstrumentoCalibracion(e).clase==="calibrado");$("contenido").innerHTML=cabecera("KPI","Indicadores generales SAC-M")+`<div class="tarjeta"><h2>Calificación de Equipos</h2><div class="resumen">${tarjetaResumen("⚙","Equipos activos",activos.length,"azul-bg")}${tarjetaResumen("✓","Completamente calificados",completos.length,"verde-bg")}${tarjetaResumen("!","Vencidos / incompletos",activos.length-completos.length,"rojo-bg")}${tarjetaResumen("⊘","De baja",equipos.length-activos.length,"gris-bg")}</div><div class="panel-etapas">${tarjetaResumenEtapa("IQ")}${tarjetaResumenEtapa("OQ")}${tarjetaResumenEtapa("PQ")}</div></div><div class="tarjeta"><h2>Calibración de Equipos</h2><div class="resumen">${tarjetaResumen("◎","Instrumentos activos",instAct.length,"azul-bg")}${tarjetaResumen("✓","Calibrados",instCal.length,"verde-bg")}${tarjetaResumen("!","No calibrados",instAct.length-instCal.length,"rojo-bg")}${tarjetaResumen("⊘","De baja",equiposCalibracion.length-instAct.length,"gris-bg")}</div></div>`}
/* SINCRONIZACION */
function refrescarVistaActual(){if(moduloActual==="inicio"){mostrarInicioGeneral();return}if(moduloActual==="calificacion"){if(!esAdmin){mostrarEquiposCalificacion();return}if(vistaActual==="calificacion-equipos")mostrarEquiposCalificacion();else if(vistaActual==="calificacion-programa")mostrarProgramaCalificacion();else if(vistaActual==="calificacion-documentos")mostrarGestionDocumentos();else if(vistaActual==="calificacion-excel")mostrarExcelCalificacion();else mostrarInicioCalificacion();return}if(moduloActual==="calibracion"){if(!esAdmin){mostrarInstrumentosCalibracion();return}if(vistaActual==="calibracion-instrumentos")mostrarInstrumentosCalibracion();else if(vistaActual==="calibracion-programa")mostrarProgramaCalibracion();else if(vistaActual==="calibracion-registros")mostrarRegistrosCalibracion();else if(vistaActual==="calibracion-terreno")mostrarTrabajoTerreno();else if(vistaActual==="calibracion-excel")mostrarExcelCalibracion();else mostrarInicioCalibracion();return}abrirModulo(moduloActual)}
window.addEventListener("storage",event=>{if(!["equipos","calificaciones","programasCalificacion","equiposCalibracion","registrosCalibracion","programasCalibracionEquipos","documentosSACM","registrosDocumentales"].includes(event.key))return;equipos=leerDatos("equipos");calificaciones=leerDatos("calificaciones");programasCalificacion=leerDatos("programasCalificacion");equiposCalibracion=leerDatos("equiposCalibracion");registrosCalibracion=leerDatos("registrosCalibracion");programasCalibracionEquipos=leerDatos("programasCalibracionEquipos");documentosSACM=leerDatos("documentosSACM");registrosDocumentales=leerDatos("registrosDocumentales");migrarDatos(false);actualizarCumplimientoProgramas(false);actualizarProgramasCalibracionDinamicos(false);actualizarPermisosUI();refrescarVistaActual()});
migrarDatos(true);actualizarCumplimientoProgramas(true);actualizarProgramasCalibracionDinamicos(true);actualizarPermisosUI();mostrarInicioGeneral();
</script>
