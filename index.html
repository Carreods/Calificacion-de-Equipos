<style>

<body>

<div class="app">

<!-- MENÚ LATERAL -->
<aside class="sidebar">

    <div class="logo">
        Gestión de Equipos
        <span>Calificados</span>
    </div>

    <ul class="menu">

        <li>
            <button class="active" onclick="mostrarPagina('inicio', this)">
                🏠 Inicio
            </button>
        </li>

        <li>
            <button onclick="mostrarPagina('equipos', this)">
                ⚙️ Equipos
            </button>
        </li>

        <li>
            <button onclick="mostrarPagina('calificaciones', this)">
                📋 Calificaciones
            </button>
        </li>

        <li>
            <button onclick="mostrarPagina('documentos', this)">
                📁 Documentos
            </button>
        </li>

        <li>
            <button onclick="mostrarPagina('configuracion', this)">
                ⚙️ Configuración
            </button>
        </li>

    </ul>

</aside>


<!-- CONTENIDO -->
<main class="main">
    <div id="contenido"></div>
</main>

</div>


<script>

/* =====================================================
   DATOS
===================================================== */

let equipos = JSON.parse(localStorage.getItem("equipos")) || [];

let equipoEditando = null;


/* =====================================================
   GUARDAR DATOS
===================================================== */

function guardarDatos() {
    localStorage.setItem("equipos", JSON.stringify(equipos));
}


/* =====================================================
   MENÚ
===================================================== */

function mostrarPagina(pagina, boton) {

    document.querySelectorAll(".menu button").forEach(function(btn) {
        btn.classList.remove("active");
    });

    boton.classList.add("active");

    if (pagina === "inicio") {
        mostrarInicio();
    }

    if (pagina === "equipos") {
        mostrarEquipos();
    }

    if (pagina === "calificaciones") {
        mostrarCalificaciones();
    }

    if (pagina === "documentos") {
        mostrarDocumentos();
    }

    if (pagina === "configuracion") {
        mostrarConfiguracion();
    }
}


/* =====================================================
   INICIO
===================================================== */

function mostrarInicio() {

    const activos = equipos.filter(e => e.estado === "Activo").length;

    document.getElementById("contenido").innerHTML = `

        <div class="header">
            <h1>Inicio</h1>
            <p>Gestión de Equipos Calificados</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Equipos registrados</h3>
                <div class="number">${equipos.length}</div>
            </div>

            <div class="card">
                <h3>Equipos activos</h3>
                <div class="number">${activos}</div>
            </div>

            <div class="card">
                <h3>Calificaciones</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Documentos</h3>
                <div class="number">0</div>
            </div>

        </div>

        <div class="panel">

            <h2>Bienvenido</h2>

            <p>
                Desde este sistema podrás gestionar los equipos,
                calificaciones y documentación asociada.
            </p>

            <p>
                Actualmente tienes <strong>${equipos.length}</strong>
                equipo(s) registrado(s).
            </p>

        </div>
    `;
}


/* =====================================================
   EQUIPOS
===================================================== */

function mostrarEquipos() {

    document.getElementById("contenido").innerHTML = `

        <div class="header">

            <h1>Equipos</h1>

            <p>
                Registro y gestión de equipos calificados.
            </p>

        </div>

        <div class="panel">

            <button class="btn" onclick="nuevoEquipo()">
                + Nuevo equipo
            </button>

            <button class="btn success" onclick="document.getElementById('excelInput').click()">
                📊 Importar Excel
            </button>

            <button class="btn secondary" onclick="descargarPlantilla()">
                ⬇ Descargar plantilla
            </button>

            <input
                type="file"
                id="excelInput"
                accept=".xlsx,.xls"
                style="display:none"
                onchange="importarExcel(event)"
            >

            <input
                type="text"
                class="search"
                placeholder="Buscar por código, nombre, área, ubicación..."
                oninput="buscarEquipos(this.value)"
            >

            <div id="tablaEquipos"></div>

        </div>
    `;

    mostrarTablaEquipos(equipos);
}


/* =====================================================
   TABLA
===================================================== */

function mostrarTablaEquipos(lista) {

    const contenedor = document.getElementById("tablaEquipos");

    if (!contenedor) return;

    if (lista.length === 0) {

        contenedor.innerHTML = `
            <p style="color:#6b7280;">
                No existen equipos registrados.
            </p>
        `;

        return;
    }

    let html = `

        <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>Código</th>
                    <th>Equipo</th>
                    <th>Área</th>
                    <th>Ubicación</th>
                    <th>Fabricante</th>
                    <th>Modelo</th>
                    <th>N.º de serie</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>
    `;

    lista.forEach((equipo, index) => {

        const indiceReal = equipos.indexOf(equipo);

        let claseEstado = "activo";

        if (equipo.estado === "En mantenimiento") {
            claseEstado = "mantenimiento";
        }

        if (equipo.estado === "Fuera de servicio") {
            claseEstado = "fuera";
        }

        html += `

            <tr>

                <td><strong>${escapeHTML(equipo.codigo)}</strong></td>

                <td>${escapeHTML(equipo.nombre)}</td>

                <td>${escapeHTML(equipo.area)}</td>

                <td>${escapeHTML(equipo.ubicacion)}</td>

                <td>${escapeHTML(equipo.fabricante)}</td>

                <td>${escapeHTML(equipo.modelo)}</td>

                <td>${escapeHTML(equipo.serie)}</td>

                <td>
                    <span class="estado ${claseEstado}">
                        ${escapeHTML(equipo.estado)}
                    </span>
                </td>

                <td class="acciones">

                    <button
                        class="editar"
                        onclick="editarEquipo(${indiceReal})">
                        Editar
                    </button>

                    <button
                        class="eliminar"
                        onclick="eliminarEquipo(${indiceReal})">
                        Eliminar
                    </button>

                </td>

            </tr>
        `;
    });

    html += `
            </tbody>

        </table>

        </div>
    `;

    contenedor.innerHTML = html;
}


/* =====================================================
   BUSCAR
===================================================== */

function buscarEquipos(texto) {

    texto = texto.toLowerCase();

    const resultado = equipos.filter(equipo => {

        return Object.values(equipo).some(valor =>
            String(valor).toLowerCase().includes(texto)
        );

    });

    mostrarTablaEquipos(resultado);
}


/* =====================================================
   NUEVO EQUIPO
===================================================== */

function nuevoEquipo() {

    equipoEditando = null;

    document.getElementById("contenido").innerHTML = `

        <div class="header">

            <h1>Nuevo equipo</h1>

            <p>
                Ingrese la información del equipo.
            </p>

        </div>

        <div class="panel">

            <div class="form-grid">

                <div class="form-group">

                    <label>Código *</label>

                    <input id="codigo" placeholder="Ej: E780/EF">

                </div>


                <div class="form-group">

                    <label>Nombre del equipo *</label>

                    <input
                        id="nombre"
                        placeholder="Ej: Envasadora de Gotas"
                    >

                </div>


                <div class="form-group">

                    <label>Área</label>

                    <input
                        id="area"
                        placeholder="Ej: Producción"
                    >

                </div>


                <div class="form-group">

                    <label>Ubicación</label>

                    <input
                        id="ubicacion"
                        placeholder="Ej: Línea de Envasado"
                    >

                </div>


                <div class="form-group">

                    <label>Fabricante</label>

                    <input id="fabricante">

                </div>


                <div class="form-group">

                    <label>Modelo</label>

                    <input id="modelo">

                </div>


                <div class="form-group">

                    <label>N.º de serie</label>

                    <input id="serie">

                </div>


                <div class="form-group">

                    <label>Estado</label>

                    <select id="estado">

                        <option>Activo</option>

                        <option>En mantenimiento</option>

                        <option>Fuera de servicio</option>

                    </select>

                </div>

            </div>

            <br>

            <button class="btn success" onclick="guardarEquipo()">
                Guardar equipo
            </button>

            <button class="btn secondary" onclick="mostrarEquipos()">
                Cancelar
            </button>

        </div>
    `;
}


/* =====================================================
   GUARDAR EQUIPO
===================================================== */

function guardarEquipo() {

    const codigo = document.getElementById("codigo").value.trim();
    const nombre = document.getElementById("nombre").value.trim();

    if (!codigo || !nombre) {

        alert("Debe ingresar al menos el código y nombre del equipo.");

        return;
    }

    const equipo = {

        codigo: codigo,

        nombre: nombre,

        area: document.getElementById("area").value.trim(),

        ubicacion: document.getElementById("ubicacion").value.trim(),

        fabricante: document.getElementById("fabricante").value.trim(),

        modelo: document.getElementById("modelo").value.trim(),

        serie: document.getElementById("serie").value.trim(),

        estado: document.getElementById("estado").value

    };


    if (equipoEditando === null) {

        equipos.push(equipo);

    } else {

        equipos[equipoEditando] = equipo;

        equipoEditando = null;

    }


    guardarDatos();

    alert("Equipo guardado correctamente.");

    mostrarEquipos();
}


/* =====================================================
   EDITAR
===================================================== */

function editarEquipo(indice) {

    const equipo = equipos[indice];

    equipoEditando = indice;

    nuevoEquipo();

    document.getElementById("codigo").value = equipo.codigo;
    document.getElementById("nombre").value = equipo.nombre;
    document.getElementById("area").value = equipo.area;
    document.getElementById("ubicacion").value = equipo.ubicacion;
    document.getElementById("fabricante").value = equipo.fabricante;
    document.getElementById("modelo").value = equipo.modelo;
    document.getElementById("serie").value = equipo.serie;
    document.getElementById("estado").value = equipo.estado;

    document.querySelector(".header h1").textContent = "Editar equipo";
}


/* =====================================================
   ELIMINAR
===================================================== */

function eliminarEquipo(indice) {

    const equipo = equipos[indice];

    const confirmar = confirm(
        "¿Está seguro de eliminar el equipo " +
        equipo.codigo +
        " - " +
        equipo.nombre +
        "?"
    );

    if (!confirmar) return;

    equipos.splice(indice, 1);

    guardarDatos();

    mostrarEquipos();
}


/* =====================================================
   IMPORTAR EXCEL
===================================================== */

function importarExcel(event) {

    const archivo = event.target.files[0];

    if (!archivo) return;

    const lector = new FileReader();

    lector.onload = function(e) {

        try {

            const datos = new Uint8Array(e.target.result);

            const libro = XLSX.read(datos, {
                type: "array"
            });

            const hoja = libro.Sheets[libro.SheetNames[0]];

            const filas = XLSX.utils.sheet_to_json(hoja, {
                defval: ""
            });

            if (filas.length === 0) {

                alert("La planilla no contiene datos.");

                return;
            }

            let agregados = 0;

            filas.forEach(fila => {

                const equipo = {

                    codigo: obtenerColumna(fila, [
                        "Código",
                        "Codigo",
                        "codigo"
                    ]),

                    nombre: obtenerColumna(fila, [
                        "Nombre del equipo",
                        "Nombre",
                        "nombre"
                    ]),

                    area: obtenerColumna(fila, [
                        "Área",
                        "Area",
                        "area"
                    ]),

                    ubicacion: obtenerColumna(fila, [
                        "Ubicación",
                        "Ubicacion",
                        "ubicacion"
                    ]),

                    fabricante: obtenerColumna(fila, [
                        "Fabricante",
                        "fabricante"
                    ]),

                    modelo: obtenerColumna(fila, [
                        "Modelo",
                        "modelo"
                    ]),

                    serie: obtenerColumna(fila, [
                        "N.º de serie",
                        "N° de serie",
                        "Nº de serie",
                        "Numero de serie",
                        "N.º Serie",
                        "Serie"
                    ]),

                    estado: obtenerColumna(fila, [
                        "Estado",
                        "estado"
                    ]) || "Activo"

                };


                if (equipo.codigo && equipo.nombre) {

                    equipos.push(equipo);

                    agregados++;
                }

            });


            guardarDatos();

            alert(
                "Importación completada.\n\n" +
                "Equipos agregados: " +
                agregados
            );

            mostrarEquipos();


        } catch (error) {

            console.error(error);

            alert(
                "No fue posible leer la planilla Excel."
            );

        }

    };

    lector.readAsArrayBuffer(archivo);

    event.target.value = "";
}


/* =====================================================
   OBTENER COLUMNA
===================================================== */

function obtenerColumna(fila, nombres) {

    for (const nombre of nombres) {

        if (fila[nombre] !== undefined) {

            return String(fila[nombre]).trim();

        }

    }

    return "";
}


/* =====================================================
   DESCARGAR PLANTILLA EXCEL
===================================================== */

function descargarPlantilla() {

    const datos = [

        {
            "Código": "E780/EF",
            "Nombre del equipo": "Envasadora de Gotas",
            "Área": "Producción",
            "Ubicación": "Línea de Envasado",
            "Fabricante": "Fabricante ejemplo",
            "Modelo": "Modelo ejemplo",
            "N.º de serie": "SN-0001",
            "Estado": "Activo"
        },

        {
            "Código": "E781/EF",
            "Nombre del equipo": "Disco de Arrastre",
            "Área": "Producción",
            "Ubicación": "Línea de Envasado",
            "Fabricante": "Fabricante ejemplo",
            "Modelo": "Modelo ejemplo",
            "N.º de serie": "SN-0002",
            "Estado": "Activo"
        }

    ];


    const hoja = XLSX.utils.json_to_sheet(datos);

    const libro = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        libro,
        hoja,
        "Equipos"
    );


    XLSX.writeFile(
        libro,
        "Plantilla_Equipos_Calificados.xlsx"
    );
}


/* =====================================================
   CALIFICACIONES
===================================================== */

function mostrarCalificaciones() {

    document.getElementById("contenido").innerHTML = `

        <div class="header">

            <h1>Calificaciones</h1>

            <p>
                Gestión de las calificaciones de los equipos.
            </p>

        </div>

        <div class="panel">

            <h2>Próximamente</h2>

            <p>
                En esta sección incorporaremos la gestión
                de IQ, OQ y PQ.
            </p>

        </div>
    `;
}


/* =====================================================
   DOCUMENTOS
===================================================== */

function mostrarDocumentos() {

    document.getElementById("contenido").innerHTML = `

        <div class="header">

            <h1>Documentos</h1>

            <p>
                Gestión de documentos asociados a los equipos.
            </p>

        </div>

        <div class="panel">

            <h2>Próximamente</h2>

            <p>
                En esta sección incorporaremos los documentos
                asociados a cada equipo y calificación.
            </p>

        </div>
    `;
}


/* =====================================================
   CONFIGURACIÓN
===================================================== */

function mostrarConfiguracion() {

    document.getElementById("contenido").innerHTML = `

        <div class="header">

            <h1>Configuración</h1>

            <p>
                Configuración general del sistema.
            </p>

        </div>

        <div class="panel">

            <h2>Gestión de Equipos Calificados</h2>

            <br>

            <p>
                Versión 2.0
            </p>

        </div>
    `;
}


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   INICIO
===================================================== */

window.onload = function() {

    const primerBoton =
        document.querySelector(".menu button");

    mostrarPagina(
        "inicio",
        primerBoton
    );

};

</script>

</body>
</html>
