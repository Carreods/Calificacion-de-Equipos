    }

    return documentos;

}


/* =========================================================
   GENERAR PROGRAMA PRÓXIMO AÑO
========================================================= */

function generarProgramaProximoAnio(
    descargarExcel = false
) {

    if (!esAdmin) {
        return;
    }

    const anio =
        anioActual() + 1;

    const candidatos =
        [];

    equipos
        .filter(
            equipo =>
                equipo.estado !==
                "De baja"
        )
        .forEach(
            equipo => {

                const referencia =
                    documentoReferenciaPrograma(
                        equipo
                    );

                if (!referencia) {
                    return;
                }

                if (
                    obtenerAnioFecha(
                        referencia.vencimiento
                    ) !== anio
                ) {
                    return;
                }

                candidatos.push({

                    equipoCodigo:
                        equipo.codigo,

                    equipoNombre:
                        equipo.nombre,

                    area:
                        equipo.area,

                    aplicaPQ:
                        equipo.aplicaPQ !==
                        false,

                    referenciaTipo:
                        equipo.aplicaPQ !==
                        false
                            ? "RCD"
                            : "RCO",

                    referenciaCodigo:
                        referencia.codigo,

                    vencimientoReferencia:
                        referencia.vencimiento,

                    mes:
                        obtenerMes(
                            referencia.vencimiento
                        ),

                    mesNumero:
                        obtenerNumeroMes(
                            referencia.vencimiento
                        ),

                    documentos:
                        documentosEsperadosPrograma(
                            equipo
                        )
                        .map(
                            documento => ({

                                ...documento,

                                estado:
                                    "Pendiente",

                                codigoCumplimiento:
                                    "",

                                fechaCumplimiento:
                                    "",

                                responsable:
                                    ""

                            })
                        ),

                    estadoGeneral:
                        "Pendiente",

                    equipoDeBaja:
                        false

                });

            }
        );

    if (!candidatos.length) {

        alert(
            `No existen equipos activos cuyo RCD/RCO venza durante ${anio}.`
        );

        return;
    }

    const existente =
        obtenerPrograma(
            anio
        );

    if (existente) {

        const continuar =
            confirm(
                `Ya existe un Programa de Calificaciones ${anio}.\n\n` +
                `¿Actualizarlo con la información actual?\n\n` +
                `Los cumplimientos existentes serán conservados cuando corresponda.`
            );

        if (!continuar) {

            if (
                descargarExcel
            ) {

                descargarProgramaExcel(
                    existente
                );

            }

            return;
        }

        candidatos.forEach(
            nuevo => {

                const anterior =
                    existente.equipos
                    ?.find(
                        item =>
                            item.equipoCodigo ===
                            nuevo.equipoCodigo
                    );

                if (!anterior) {
                    return;
                }

                nuevo.documentos.forEach(
                    docNuevo => {

                        const docAnterior =
                            anterior.documentos
                            ?.find(
                                doc =>
                                    doc.tipo ===
                                        docNuevo.tipo &&
                                    doc.documento ===
                                        docNuevo.documento
                            );

                        if (
                            docAnterior &&
                            docAnterior.estado ===
                            "Cumplido"
                        ) {

                            Object.assign(
                                docNuevo,
                                docAnterior
                            );

                        }

                    }
                );

            }
        );

        existente.fechaGeneracion =
            fechaHoy();

        existente.equipos =
            candidatos;

    } else {

        programasCalificacion.push({

            anio,

            fechaGeneracion:
                fechaHoy(),

            equipos:
                candidatos

        });

    }

    guardarTodo();

    actualizarCumplimientoProgramas();

    const programa =
        obtenerPrograma(
            anio
        );

    if (
        descargarExcel
    ) {

        descargarProgramaExcel(
            programa
        );

    }

    alert(
        `Programa de Calificaciones ${anio} generado.\n\n` +
        `Equipos programados: ${programa.equipos.length}`
    );

    mostrarProgramaCalificacion(
        anio
    );

}


/* =========================================================
   CUMPLIMIENTO DEL PROGRAMA
========================================================= */

function actualizarCumplimientoProgramas() {

    programasCalificacion.forEach(
        programa => {

            programa.equipos
            ?.forEach(
                item => {

                    const equipo =
                        equipos.find(
                            registro =>
                                registro.codigo ===
                                item.equipoCodigo
                        );

                    item.equipoDeBaja =
                        !equipo ||
                        equipo.estado ===
                        "De baja";

                    item.documentos
                    ?.forEach(
                        esperado => {

                            const candidatos =
                                calificaciones
                                .filter(
                                    registro =>
                                        registro.equipoCodigo ===
                                            item.equipoCodigo &&
                                        registro.tipo ===
                                            esperado.tipo &&
                                        registro.documento ===
                                            esperado.documento &&
                                        obtenerAnioFecha(
                                            fechaDocumento(
                                                registro
                                            )
                                        ) ===
                                            Number(
                                                programa.anio
                                            )
                                )
                                .sort(
                                    (a,b) =>
                                        fechaDocumento(b)
                                        .localeCompare(
                                            fechaDocumento(a)
                                        )
                                );

                            const encontrado =
                                candidatos[0];

                            if (
                                encontrado
                            ) {

                                esperado.estado =
                                    "Cumplido";

                                esperado.codigoCumplimiento =
                                    encontrado.codigo;

                                esperado.fechaCumplimiento =
                                    fechaDocumento(
                                        encontrado
                                    );

                                esperado.responsable =
                                    encontrado.responsable ||
                                    "";

                            } else {

                                esperado.estado =
                                    "Pendiente";

                                esperado.codigoCumplimiento =
                                    "";

                                esperado.fechaCumplimiento =
                                    "";

                                esperado.responsable =
                                    "";

                            }

                        }
                    );

                    const activos =
                        item.documentos ||
                        [];

                    const cumplidos =
                        activos.filter(
                            documento =>
                                documento.estado ===
                                "Cumplido"
                        ).length;

                    item.estadoGeneral =
                        activos.length &&
                        cumplidos ===
                        activos.length
                            ? "Cumplido"
                            : "Pendiente";

                }
            );

        }
    );

    guardarTodo();

}


/* =========================================================
   RESUMEN PROGRAMA
========================================================= */

function calcularResumenPrograma(
    programa
) {

    /*
        Equipos de baja se excluyen del denominador.
    */
    const equiposActivos =
        programa.equipos
        ?.filter(
            item =>
                !item.equipoDeBaja
        ) ||
        [];

    const documentos =
        equiposActivos.flatMap(
            item =>
                item.documentos ||
                []
        );

    const total =
        documentos.length;

    const cumplidos =
        documentos.filter(
            documento =>
                documento.estado ===
                "Cumplido"
        ).length;

    const excluidos =
        (
            programa.equipos ||
            []
        )
        .filter(
            item =>
                item.equipoDeBaja
        )
        .length;

    return {

        equipos:
            equiposActivos.length,

        total,

        cumplidos,

        pendientes:
            total -
            cumplidos,

        excluidos,

        porcentaje:
            total
                ? Math.round(
                    (
                        cumplidos /
                        total
                    ) *
                    100
                )
                : 0

    };

}

function tablaProgramaMeses(
    programa
) {

    const datos =
        MESES
        .slice(1)
        .map(
            (
                mes,
                indice
            ) => {

                const equiposMes =
                    (
                        programa.equipos ||
                        []
                    )
                    .filter(
                        item =>
                            item.mesNumero ===
                            indice + 1 &&
                            !item.equipoDeBaja
                    );

                const documentos =
                    equiposMes.flatMap(
                        item =>
                            item.documentos ||
                            []
                    );

                return {

                    mes,

                    equipos:
                        equiposMes.length,

                    documentos:
                        documentos.length,

                    cumplidos:
                        documentos.filter(
                            documento =>
                                documento.estado ===
                                "Cumplido"
                        ).length

                };

            }
        )
        .filter(
            item =>
                item.equipos >
                0
        );

    if (
        !datos.length
    ) {

        return `

            <div class="subdato">
                Sin equipos programados.
            </div>

        `;

    }

    return `

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>
                        <th>Mes límite</th>
                        <th>Equipos</th>
                        <th>Documentos</th>
                        <th>Cumplidos</th>
                        <th>Pendientes</th>
                    </tr>

                </thead>

                <tbody>

                    ${datos.map(
                        item => `

                            <tr>

                                <td>
                                    <strong>
                                        ${item.mes}
                                    </strong>
                                </td>

                                <td>
                                    ${item.equipos}
                                </td>

                                <td>
                                    ${item.documentos}
                                </td>

                                <td>
                                    ${item.cumplidos}
                                </td>

                                <td>
                                    ${
                                        item.documentos -
                                        item.cumplidos
                                    }
                                </td>

                            </tr>

                        `
                    ).join("")}

                </tbody>

            </table>

        </div>

    `;

}

========================================================= */

function descargarProgramaExcel(
    programa
) {

    if (!programa) {
        return;
    }

    const documentos =
        [];

    const resumenEquipos =
        [];

    (
        programa.equipos ||
        []
    )
    .forEach(
        item => {

            const activos =
                item.documentos ||
                [];

            const cumplidos =
                activos.filter(
                    documento =>
                        documento.estado ===
                        "Cumplido"
                ).length;

            const porcentaje =
                activos.length
                    ? Math.round(
                        (
                            cumplidos /
                            activos.length
                        ) *
                        100
                    )
                    : 0;

            resumenEquipos.push({

                "Año Programa":
                    programa.anio,

                "Mes límite":
                    item.mes,

                "Código equipo":
                    item.equipoCodigo,

                "Equipo":
                    item.equipoNombre,

                "Área":
                    item.area,

                "Aplica PQ":
                    item.aplicaPQ
                        ? "Sí"
                        : "No",

                "Documento referencia":
                    item.referenciaTipo,

                "Código referencia":
                    item.referenciaCodigo,

                "Estado equipo":
                    item.equipoDeBaja
                        ? "De baja"
                        : "Activo",

                "Cumplimiento":
                    item.equipoDeBaja
                        ? "Excluido"
                        : `${porcentaje}%`

            });

            activos.forEach(
                documento => {

                    documentos.push({

                        "Año Programa":
                            programa.anio,

                        "Mes límite":
                            item.mes,

                        "Código equipo":
                            item.equipoCodigo,

                        "Equipo":
                            item.equipoNombre,

                        "Área":
                            item.area,

                        "Aplica PQ":
                            item.aplicaPQ
                                ? "Sí"
                                : "No",

                        "Documento referencia":
                            item.referenciaTipo,

                        "Código referencia":
                            item.referenciaCodigo,

                        "Documento programado":
                            `${documento.tipo} ${documento.documento}`,

                        "Prefijo":
                            documento.prefijo,

                        "Estado equipo":
                            item.equipoDeBaja
                                ? "De baja"
                                : "Activo",

                        "Estado documento":
                            item.equipoDeBaja
                                ? "Excluido"
                                : documento.estado,

                        "Código cumplimiento":
                            documento.codigoCumplimiento,

                        "Fecha cumplimiento":
                            documento.fechaCumplimiento,

                        "Elaboró / Ejecutó":
                            documento.responsable

                    });

                }
            );

        }
    );

    const libro =
        XLSX.utils.book_new();

    const hojaDocumentos =
        XLSX.utils.json_to_sheet(
            documentos
        );

    const hojaResumen =
        XLSX.utils.json_to_sheet(
            resumenEquipos
        );

    XLSX.utils.book_append_sheet(
        libro,
        hojaResumen,
        "Resumen Equipos"
    );

    XLSX.utils.book_append_sheet(
        libro,
        hojaDocumentos,
        "Programa Documentos"
    );

    XLSX.writeFile(
        libro,
        `Programa_Calificaciones_${programa.anio}.xlsx`
    );

}

/* =========================================================

========================================================= */

function leerExcelCalificacion(
    evento
) {

    const archivo =
        evento.target.files[0];

    if (!archivo) {
        return;
    }

    const lector =
        new FileReader();

    lector.onload =
        eventoLectura => {

            try {

                const libro =
                    XLSX.read(
                        new Uint8Array(
                            eventoLectura.target.result
                        ),
                        {

                            type:
                                "array",

                            cellDates:
                                true

                        }
                    );

                const hoja =
                    libro.Sheets[
                        libro.SheetNames[0]
                    ];

                const filas =
                    XLSX.utils.sheet_to_json(
                        hoja,
                        {

                            defval:
                                "",

                            raw:
                                true

                        }
                    );

                procesarExcelCalificacion(
                    filas,
                    archivo.name
                );

            } catch(error) {

                console.error(
                    error
                );

                alert(
                    "No fue posible leer el archivo Excel."
                );

            }

        };

    lector.readAsArrayBuffer(
        archivo
    );

    evento.target.value =
        "";

}


/* =========================================================
   PROCESAR EXCEL
========================================================= */

function procesarExcelCalificacion(
    filas,
    nombreArchivo
) {

    const resultados =
        [];

    const codigosArchivo =
        new Set();

    filas.forEach(
        (
            fila,
            indice
        ) => {

            const codigo =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Código equipo",
                            "Codigo equipo",
                            "Código",
                            "Codigo"
                        ]
                    )
                ).trim();

            const nombre =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Nombre",
                            "Nombre equipo"
                        ]
                    )
                ).trim();

            const area =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Área",
                            "Area"
                        ]
                    )
                ).trim();

            if (
                !codigo ||
                !nombre ||
                !area
            ) {

                resultados.push({

                    fila:
                        indice + 2,

                    estado:
                        "error",

                    codigo,
                    nombre,

                    mensaje:
                        "Falta Código, Nombre o Área.",

                    data:
                        null

                });

                return;
            }

            const claveCodigo =
                codigo.toLowerCase();

            if (
                codigosArchivo.has(
                    claveCodigo
                )
            ) {

                resultados.push({

                    fila:
                        indice + 2,

                    estado:
                        "error",

                    codigo,
                    nombre,

                    mensaje:
                        "Código repetido dentro del mismo Excel.",

                    data:
                        null

                });

                return;
            }

            codigosArchivo.add(
                claveCodigo
            );

            const textoPQ =
                String(
                    columnaExcel(
                        fila,
                        ["Aplica PQ"]
                    )
                )
                .trim()
                .toLowerCase();

            const aplicaPQ =
                ![
                    "no",
                    "n",
                    "false",
                    "0"
                ]
                .includes(
                    textoPQ
                );

            const equipo = {

                codigo,
                nombre,
                area,

                marca:
                    String(
                        columnaExcel(
                            fila,
                            ["Marca"]
                        )
                    ).trim(),

                modelo:
                    String(
                        columnaExcel(
                            fila,
                            ["Modelo"]
                        )
                    ).trim(),

                serie:
                    String(
                        columnaExcel(
                            fila,
                            [
                                "Serie",
                                "N° Serie",
                                "N° de Serie"
                            ]
                        )
                    ).trim(),

                ubicacion:
                    String(
                        columnaExcel(
                            fila,
                            [
                                "Ubicación",
                                "Ubicacion"
                            ]
                        )
                    ).trim(),

                aplicaPQ,

                estado:
                    "Operativo",

                fechaBaja:
                    "",

                motivoBaja:
                    "",

                historialEstado:
                    []

            };

            const documentos =
                [];

            const errores =
                [];

            analizarDocumentoExcel(

                documentos,
                errores,
                fila,
                equipo,

                "IQ",
                "Protocolo",

                "Protocolo IQ",
                "Emisión Protocolo IQ",

                [
                    "Elaboró Protocolo IQ",
                    "Elaboro Protocolo IQ"
                ]

            );

            analizarDocumentoExcel(

                documentos,
                errores,
                fila,
                equipo,

                "IQ",
                "Reporte",

                "Reporte IQ",
                "Emisión Reporte IQ",

                [
                    "Ejecutó Reporte IQ",
                    "Ejecuto Reporte IQ",
                    "Elaboró Reporte IQ"
                ]

            );

            analizarDocumentoExcel(

                documentos,
                errores,
                fila,
                equipo,

                "OQ",
                "Protocolo",

                "Protocolo OQ",
                "Emisión Protocolo OQ",

                [
                    "Elaboró Protocolo OQ",
                    "Elaboro Protocolo OQ"
                ]

            );

            analizarDocumentoExcel(

                documentos,
                errores,
                fila,
                equipo,

                "OQ",
                "Reporte",

                "Reporte OQ",
                "Emisión Reporte OQ",

                [
                    "Ejecutó Reporte OQ",
                    "Ejecuto Reporte OQ",
                    "Elaboró Reporte OQ"
                ]

            );

            if (
                aplicaPQ
            ) {

                analizarDocumentoExcel(

                    documentos,
                    errores,
                    fila,
                    equipo,

                    "PQ",
                    "Protocolo",

                    "Protocolo PQ",
                    "Emisión Protocolo PQ",

                    [
                        "Elaboró Protocolo PQ",
                        "Elaboro Protocolo PQ"
                    ]

                );

                analizarDocumentoExcel(

                    documentos,
                    errores,
                    fila,
                    equipo,

                    "PQ",
                    "Reporte",

                    "Reporte PQ",
                    "Emisión Reporte PQ",

                    [
                        "Ejecutó Reporte PQ",
                        "Ejecuto Reporte PQ",
                        "Elaboró Reporte PQ"
                    ]

                );

            }

            if (
                errores.length
            ) {

                resultados.push({

                    fila:
                        indice + 2,

                    estado:
                        "error",

                    codigo,
                    nombre,

                    mensaje:
                        errores.join(
                            " · "
                        ),

                    data:
                        null

                });

                return;
            }

            const existe =
                equipos.some(
                    item =>
                        String(
                            item.codigo
                        ).toLowerCase() ===
                        codigo.toLowerCase()
                );

            resultados.push({

                fila:
                    indice + 2,

                estado:
                    existe
                        ? "duplicado"
                        : "valido",

                codigo,
                nombre,

                mensaje:
                    existe
                        ? "Equipo existente"
                        : "Equipo nuevo",

                data:{

                    equipo,
                    documentos

                }

            });

        }
    );

    excelTemporal = {

        archivo:
            nombreArchivo,

        resultados

    };

    renderPreviewExcelCalificacion();

}


function analizarDocumentoExcel(

    destino,
    errores,

    fila,
    equipo,

    tipo,
    documento,

    columnaCodigo,
    columnaFecha,

    columnasResponsable

) {

    const codigo =
        String(
            columnaExcel(
                fila,
                [columnaCodigo]
            )
        ).trim();

    const fechaOriginal =
        columnaExcel(
            fila,
            [columnaFecha]
        );

    const fecha =
        normalizarFechaExcel(
            fechaOriginal
        );

    /*
        Ambos vacíos:
        no hay documento y es válido.
    */
    if (
        !codigo &&
        !fechaOriginal
    ) {

        return;
    }

    /*
        Código sin fecha.
    */
    if (
        codigo &&
        !fechaOriginal
    ) {

        errores.push(
            `${columnaCodigo} sin fecha de emisión`
        );

        return;
    }

    /*
        Fecha sin código.
    */
    if (
        !codigo &&
        fechaOriginal
    ) {

        errores.push(
            `${columnaFecha} sin código de documento`
        );

        return;
    }

    /*
        Fecha presente pero inválida.
    */
    if (
        fechaOriginal &&
        !fecha
    ) {

        errores.push(
            `Fecha inválida en ${columnaFecha}`
        );

        return;
    }

    destino.push({

        equipoCodigo:
            equipo.codigo,

        equipoNombre:
            equipo.nombre,

        tipo,

        documento,

        codigo,

        version:
            extraerVersionDocumento(
                codigo
            ),

        fecha,

        vencimiento:
            sumarAnios(
                fecha,
                5
            ),

        responsable:
            String(
                columnaExcel(
                    fila,
                    columnasResponsable
                )
            ).trim()

    });

}


function extraerVersionDocumento(
    codigo
) {

    const partes =
        String(
            codigo || ""
        )
        .split("-");

    return partes.length > 1
        ? partes[
            partes.length - 1
        ]
        : "";

}

/* =========================================================
   CONFIRMAR IMPORTACIÓN
========================================================= */

function confirmarImportacionCalificacion() {

    if (!excelTemporal) {
        return;
    }

    const modo =
        obtenerSelect(
            "modoImportacionCal"
        ) ||
        "omitir";

    let nuevos =
        0;

    let actualizados =
        0;

    let omitidos =
        0;

    excelTemporal.resultados
        .forEach(
            resultado => {

                if (
                    resultado.estado ===
                    "error"
                ) {

                    omitidos++;
                    return;

                }

                const data =
                    resultado.data;

                const indice =
                    equipos.findIndex(
                        equipo =>
                            String(
                                equipo.codigo
                            ).toLowerCase() ===
                            String(
                                data.equipo.codigo
                            ).toLowerCase()
                    );

                /*
                    EQUIPO NUEVO
                */
                if (
                    indice === -1
                ) {

                    equipos.push(
                        data.equipo
                    );

                    data.documentos.forEach(
                        documento =>
                            agregarDocumentoSiNoExiste(
                                documento
                            )
                    );

                    nuevos++;

                    return;
                }

                /*
                    EQUIPO EXISTENTE
                */
                if (
                    modo ===
                    "omitir"
                ) {

                    omitidos++;
                    return;
                }

                const anterior =
                    equipos[indice];

                /*
                    Conservamos estado de baja,
                    fecha de baja e historial.
                */
                equipos[indice] = {

                    ...anterior,

                    nombre:
                        data.equipo.nombre,

                    area:
                        data.equipo.area,

                    marca:
                        data.equipo.marca,

                    modelo:
                        data.equipo.modelo,

                    serie:
                        data.equipo.serie,

                    ubicacion:
                        data.equipo.ubicacion,

                    aplicaPQ:
                        data.equipo.aplicaPQ

                };

                data.documentos.forEach(
                    documento =>
                        agregarDocumentoSiNoExiste(
                            documento
                        )
                );

                actualizados++;

            }
        );

    guardarTodo();

    actualizarCumplimientoProgramas();

    alert(
        `Importación finalizada.\n\n` +
        `Equipos nuevos: ${nuevos}\n` +
        `Equipos actualizados: ${actualizados}\n` +
        `Omitidos / errores: ${omitidos}`
    );

    excelTemporal =
        null;

    mostrarInicioCalificacion();

}


function agregarDocumentoSiNoExiste(
    documento
) {

    const existe =
        calificaciones.some(
            registro =>
                registro.equipoCodigo ===
                    documento.equipoCodigo &&
                registro.tipo ===
                    documento.tipo &&
                registro.documento ===
                    documento.documento &&
                registro.codigo ===
                    documento.codigo &&
                fechaDocumento(
                    registro
                ) ===
                    documento.fecha
        );

    if (!existe) {

        calificaciones.push(
            documento
        );

    }

}

function contarKPIEtapa(
    tipo
) {

    const lista =
        equipos.filter(
            equipo => {

                if (
                    equipo.estado ===
                    "De baja"
                ) {

                    return false;
                }

                if (
                    tipo === "PQ" &&
                    equipo.aplicaPQ ===
                    false
                ) {

                    return false;
                }

                return true;

            }
        );

    let vigente =
        0;

    let vencido =
        0;

    lista.forEach(
        equipo => {

            const estado =
                estadoEtapa(
                    equipo,
                    tipo
                );

            if (
                estado.clase ===
                    "vigente" ||
                estado.clase ===
                    "proximo"
            ) {

                vigente++;

            } else {

                vencido++;

            }

        }
    );

    return {

        total:
            lista.length,

        vigente,

        vencido

    };

}

    return `

                    ${tipo}

                    <div class="subdato">
                        Total
                    </div>

                    <div class="etapa-mini-numero">
                        ${datos.total}
                    </div>

                </div>

                <div class="etapa-mini">

                    <div class="subdato">
                        Vigente

                    <div class="etapa-mini-numero">
                        ${datos.vigente}
                    </div>

                </div>

                <div class="etapa-mini">

                    <div class="subdato">
                        Vencido /
                        incompleto
                    </div>

                    <div class="etapa-mini-numero">
                        ${datos.vencido}
                    </div>

                </div>

            </div>

        </div>

    `;

}

function mostrarModuloDocumental(

) {

    document.getElementById(

    ).innerHTML = `

        <div class="topbar">

            <div>

                <h1 class="titulo-pagina">

                    Gestión documental y control de vigencias

        <div class="modulo-grid">

            ${categorias.map(
                categoria => `
