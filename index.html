<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestión SAC-M</title>
<link rel="icon" type="image/png" href="PPPP.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}
:root{
--prater:#e30613;--prater-dark:#bd0010;--prater-soft:#fde8ea;
--bg:#eef1f3;--white:#fff;--text:#17212b;--muted:#687887;--border:#dfe4e8;
--green:#16834a;--green-bg:#dff7e8;--yellow:#b97900;--yellow-bg:#fff0ca;
--red:#d91f2b;--red-bg:#fde1e3;--blue:#196cb8;--blue-bg:#e7f1ff;
--purple:#6e55b3;--purple-bg:#eee9ff;--gray:#667685;--gray-bg:#edf1f4;
--shadow:0 5px 20px rgba(30,45,60,.06)
}

html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body.menu-abierto{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700;transition:.15s}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
input,select,textarea{width:100%;min-height:40px;padding:10px 11px;border:1px solid #d2d9df;border-radius:8px;background:#fff;color:var(--text);outline:none;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:#9aa8b4;box-shadow:0 0 0 3px rgba(25,108,184,.08)}
input[readonly]{background:#edf1f4;color:#576675}
textarea{min-height:90px;resize:vertical}
label{display:block;margin-bottom:6px;font-size:12px;font-weight:700}

/* SIDEBAR */
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--border);padding:18px 12px;overflow-y:auto;z-index:500;transition:transform .22s ease}
.logo-box{padding:5px 8px 15px;border-bottom:1px solid #e6e9ed;cursor:pointer}
.logo-imagen{display:block;width:150px;height:auto;margin-bottom:10px}
.logo-subtitulo{font-size:13px;font-weight:700;line-height:1.35}
.logo-descripcion{margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.6px}
.sidebar-cerrar{display:none;position:absolute;top:12px;right:12px;width:36px;height:36px;padding:0;background:#f1f3f5;color:#465462;font-size:18px}
.menu{list-style:none;padding:0;margin:16px 0}
.menu li{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding:10px 11px;border-radius:9px;color:#536373;font-size:13px;cursor:pointer;transition:.15s}
.menu li:hover{background:#f5f7f8}
.menu li.activo{background:var(--prater-soft);color:var(--prater);font-weight:700}
.menu-icono{width:19px;flex:none;text-align:center}
.menu-overlay{display:none;position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:450}

/* CONTENT */
.contenido{min-height:100vh;margin-left:250px;padding:18px 28px 28px}
.topbar{position:sticky;top:0;z-index:90;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:10px 0 15px;margin-bottom:8px;background:rgba(238,241,243,.95);backdrop-filter:blur(10px)}
.topbar-izquierda{display:flex;align-items:flex-start;gap:10px;min-width:0}
.menu-movil-btn{display:none;width:42px;height:42px;padding:0;background:#fff;border:1px solid var(--border);font-size:20px;flex:none}
.titulo-bloque{min-width:0}
.titulo-pagina{margin:0;font-size:27px;letter-spacing:-.4px}
.subtitulo-pagina{margin-top:5px;color:var(--muted);font-size:13px}
.topbar-acciones{position:relative;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px}

/* USUARIO */
.usuario-superior{display:flex;align-items:center;gap:9px;min-height:42px;padding:6px 11px;background:#fff;border:1px solid var(--border);border-radius:10px}
.usuario-icono{width:29px;height:29px;display:flex;align-items:center;justify-content:center;background:#f2f4f6;border-radius:50%;flex:none}
.usuario-nombre{font-size:11px;font-weight:800}
.usuario-rol{margin-top:2px;color:#748291;font-size:9px}
.btn-sesion{min-height:42px;background:#fff;color:#445465;border:1px solid var(--border)}

/* TARJETAS */
.tarjeta,.modulo-card,.hero-panel,.resumen-card,.etapa-resumen{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow)}
.tarjeta{padding:20px;margin-bottom:18px;border-radius:14px}
.tarjeta h2,.tarjeta h3{margin-top:0}
.subdato{color:#748392;font-size:11px;line-height:1.5}
.seccion-titulo{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}
.seccion-titulo h2{margin:0}

/* BOTONES */
.btn-principal{background:var(--prater);color:#fff}
.btn-principal:hover{background:var(--prater-dark)}
.btn-secundario,.btn-gris,.btn-editar{background:#edf1f4;color:#344454}
.btn-verde{background:var(--green-bg);color:var(--green)}
.btn-azul{background:var(--blue-bg);color:var(--blue)}
.btn-amarillo{background:var(--yellow-bg);color:#9b6600}
.btn-morado{background:var(--purple-bg);color:var(--purple)}
.btn-eliminar{background:var(--red-bg);color:var(--red)}
.btn-baja{background:#fff0f1;color:#c8202b}
.btn-reactivar{background:var(--green-bg);color:var(--green)}
.btn-eliminar-definitivo{background:#a9000b;color:#fff}
.btn-icono{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.botones,.acciones-form,.acciones-tabla{display:flex;flex-wrap:wrap;gap:8px}
.acciones-form{margin-top:15px}

/* NOTIFICACIONES */
.btn-campana{position:relative;width:42px;height:42px;padding:0;background:#fff;border:1px solid var(--border);color:#364655;font-size:18px}
.contador-notificacion{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;background:var(--prater);color:#fff;border:2px solid var(--bg);border-radius:20px;font-size:9px}
.panel-notificaciones{position:absolute;top:50px;right:0;width:420px;max-height:540px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 45px rgba(25,35,45,.18);z-index:1000}
.panel-notificaciones-header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e9ec}
.notificacion-item{padding:13px 16px;border-bottom:1px solid #edf0f2;cursor:pointer}
.notificacion-item:hover{background:#f7f9fa}
.notificacion-titulo{font-size:12px;font-weight:700}
.notificacion-texto{margin-top:4px;color:#71808e;font-size:11px;line-height:1.5}

/* SUBMENU */
.submenu{display:flex;flex-wrap:wrap;gap:7px;padding:7px;margin-bottom:20px;background:#fff;border:1px solid var(--border);border-radius:12px;overflow-x:auto}
.submenu button{background:transparent;color:#627181;white-space:nowrap}
.submenu button:hover{background:#f3f5f6}
.submenu button.activo{background:var(--prater-soft);color:var(--prater)}

/* INICIO GENERAL */
.inicio-bienvenida{padding:28px;background:linear-gradient(135deg,#fff,#f7f9fa);border:1px solid var(--border);border-radius:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.inicio-bienvenida h1{margin:0 0 7px;font-size:30px}
.inicio-bienvenida p{margin:0;color:var(--muted);font-size:13px}
.modulo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.modulo-card{padding:19px;border-radius:13px;cursor:pointer;transition:.15s}
.modulo-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(30,45,60,.1)}
.modulo-icono{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#f1f3f5;font-size:20px;margin-bottom:12px}
.modulo-card h3{margin:0 0 7px;font-size:15px}

/* DASHBOARD */
.resumen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:18px}
.resumen-card{display:flex;align-items:center;gap:12px;min-height:92px;padding:16px;border-radius:13px}
.resumen-icono{width:43px;height:43px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%;font-size:19px}
.resumen-titulo{color:var(--muted);font-size:11px;line-height:1.35}
.resumen-numero{margin-top:3px;font-size:24px;font-weight:800}
.verde-bg{background:var(--green-bg)}
.amarillo-bg{background:var(--yellow-bg)}
.rojo-bg{background:var(--red-bg)}
.azul-bg{background:var(--blue-bg)}
.gris-bg{background:var(--gray-bg)}
.morado-bg{background:var(--purple-bg)}
.dashboard-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:18px}
.hero-panel{padding:22px;border-radius:15px}
.hero-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.hero-numero{margin-top:5px;font-size:37px;font-weight:800}
.hero-descripcion{margin-top:5px;color:var(--muted);font-size:12px}
.barra-fondo{height:12px;margin-top:15px;overflow:hidden;background:#e9edef;border-radius:20px}
.barra-avance{height:100%;background:#25a45d;border-radius:20px}
.accion-principal{margin-top:14px;padding:15px;background:#f7f9fa;border-left:4px solid var(--blue);border-radius:9px}
.accion-principal-titulo{font-size:13px;font-weight:800}
.accion-principal-texto{margin-top:5px;color:#657584;font-size:12px;line-height:1.5}

/* ETAPAS */
.panel-etapas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:18px}
.etapa-resumen{padding:18px;border-radius:13px}
.etapa-resumen-cabecera{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.etapa-resumen-titulo{font-size:20px;font-weight:800}
.etapa-estados{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.etapa-mini{padding:10px;background:#f7f8fa;border-radius:9px}
.etapa-mini-numero{margin-top:4px;font-size:19px;font-weight:800}

/* ESTADOS */
.badge{display:inline-block;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.vigente,.cumplido{background:var(--green-bg);color:var(--green)}
.proximo,.pendiente{background:var(--yellow-bg);color:var(--yellow)}
.vencido{background:var(--red-bg);color:var(--red)}
.neutro,.baja{background:var(--gray-bg);color:var(--gray)}
.programado{background:var(--blue-bg);color:var(--blue)}
.punto{display:inline-block;width:11px;height:11px;margin-right:6px;border-radius:50%;vertical-align:-1px}
.punto-verde{background:#21a35c}
.punto-amarillo{background:#e4a000}
.punto-rojo{background:#dc303c}
.punto-gris{background:#a7b0b8}

/* TABLAS */
.tabla-contenedor{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:11px 10px;background:#f3f5f6;color:#455565;border-bottom:1px solid #dfe3e8;text-align:left;white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid #e7eaed;vertical-align:middle}
tbody tr:hover td{background:#fafbfc}
.codigo{font-weight:800}

/* EQUIPOS MOVIL */
.lista-equipos-movil{display:none}
.equipo-movil-card{padding:16px;background:#fff;border:1px solid var(--border);border-radius:13px;margin-bottom:11px;box-shadow:0 3px 12px rgba(30,45,60,.04)}
.equipo-movil-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.equipo-movil-codigo{color:var(--prater);font-size:13px;font-weight:800}
.equipo-movil-nombre{font-size:16px;font-weight:800;margin-top:3px}
.equipo-movil-datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.equipo-movil-dato{padding:9px;background:#f7f8fa;border-radius:8px}
.equipo-movil-label{font-size:9px;color:#7a8793;text-transform:uppercase}
.equipo-movil-valor{font-size:11px;font-weight:700;margin-top:3px}
.equipo-movil-accion{margin-top:12px;padding:11px;background:#f7f9fa;border-left:3px solid var(--blue);border-radius:8px;font-size:11px}
.equipo-movil-botones{display:flex;gap:8px;margin-top:12px}
.equipo-movil-botones button{flex:1}

/* FORMULARIOS / FILTROS */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.completo{grid-column:1/-1}
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:15px}
.filtros-consulta{grid-template-columns:2fr 1fr 1fr}

/* FICHA */
.ficha-hero{margin-bottom:18px;padding:22px;background:linear-gradient(135deg,#fff,#fafbfc);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.ficha-hero-cabecera{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.ficha-codigo{margin-bottom:5px;color:var(--prater);font-size:15px;font-weight:800}
.ficha-nombre{margin:0;font-size:27px}
.ficha-estado-area{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}
.estado-global-grande{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:22px;font-size:12px;font-weight:800}
.ficha-proxima-accion{margin-top:18px;padding:14px 16px;background:#f6f8fa;border-left:4px solid var(--blue);border-radius:9px}
.ficha-proxima-accion strong{display:block;margin-bottom:4px;font-size:12px}
.ficha-proxima-accion span{color:#607080;font-size:12px}
.ficha-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ficha-dato{padding:14px;background:#f7f8fa;border-radius:10px}
.ficha-label{color:#71808f;font-size:11px}
.ficha-valor{margin-top:4px;font-size:14px;font-weight:700}

/* IQ/OQ/PQ */
.calificacion-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.etapa-card{overflow:hidden;background:#fff;border:1px solid var(--border);border-left:5px solid #a8b1ba;border-radius:12px}
.etapa-card.estado-vigente{border-left-color:var(--green)}
.etapa-card.estado-proximo{border-left-color:#e1a000}
.etapa-card.estado-vencido{border-left-color:var(--red)}
.etapa-card.estado-neutro{border-left-color:#a8b1ba}
.etapa-header{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:#f4f6f7}
.etapa-titulo{font-size:16px;font-weight:800}
.doc-card{padding:14px;border-top:1px solid #e8ebee}
.doc-tipo{margin-bottom:5px;color:#6b7885;font-size:11px}
.doc-codigo{margin-bottom:8px;font-weight:800;word-break:break-word}
.doc-linea{margin-top:5px;color:#5d6c7b;font-size:11px}
.sin-documento{color:#87939e;font-size:12px}

/* PROGRAMA */
.programa-cabecera{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}
.programa-anio{font-size:28px;font-weight:800}
.programa-resumen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:15px}
.programa-mini{padding:13px;background:#f7f8fa;border-radius:9px;font-size:11px;color:#677684}
.programa-mini strong{display:block;margin-top:4px;color:var(--text);font-size:20px}

/* EXCEL / RESPALDO */
.excel-panel{padding:30px;background:#fafbfc;border:2px dashed #d2d9df;border-radius:14px;text-align:center}
.excel-resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.excel-resumen-card{padding:14px;background:#fff;border:1px solid var(--border);border-radius:10px}
.excel-resumen-card strong{display:block;margin-top:4px;font-size:23px}
.fila-valida td{background:#f5fbf7!important}
.fila-duplicada td{background:#fff8e7!important}
.fila-error td{background:#fff1f2!important}
.respaldo-panel{padding:20px;background:#f7f9fb;border:1px solid #dae1e7;border-radius:12px}
.respaldo-panel p{color:#667685;font-size:12px;line-height:1.55}

/* PELIGRO */
.zona-peligro{background:#fff9f9;border-color:#efb7bc}
.zona-peligro h2{color:#aa000b}
.advertencia{padding:13px;background:var(--red-bg);color:#98131d;border-radius:9px;font-size:12px;line-height:1.55}

/* LOGIN */
.login-overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:15px;background:rgba(0,0,0,.45);z-index:2000}
.login-card{width:360px;max-width:100%;padding:24px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.login-error{display:none;margin-bottom:10px;color:var(--red);font-size:12px}

/* RESPONSIVE */
@media(max-width:1200px){
.resumen{grid-template-columns:repeat(3,minmax(0,1fr))}
.programa-resumen{grid-template-columns:repeat(3,minmax(0,1fr))}
.modulo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1000px){
.dashboard-hero{grid-template-columns:1fr}
.panel-etapas,.calificacion-grid{grid-template-columns:1fr}
.ficha-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.filtros{grid-template-columns:1fr 1fr}
}
@media(max-width:800px){
.sidebar{width:min(300px,86vw);transform:translateX(-105%);box-shadow:8px 0 30px rgba(0,0,0,.15)}
.sidebar.abierto{transform:translateX(0)}
.sidebar-cerrar{display:block}
.menu-overlay.visible{display:block}
.contenido{margin-left:0;padding:10px 13px 25px}
.logo-box{padding-top:16px}
.logo-imagen{width:140px}
.menu-movil-btn{display:inline-flex;align-items:center;justify-content:center}
.topbar{gap:10px;padding-top:7px}
.titulo-pagina{font-size:21px;line-height:1.15}
.subtitulo-pagina{font-size:11px}
.topbar-acciones{gap:6px}
.usuario-superior{padding:5px 8px}
.usuario-superior .usuario-rol{display:none}
.usuario-icono{width:27px;height:27px}
.btn-sesion{padding:8px 10px;font-size:11px}
.btn-campana{width:39px;height:39px}
.inicio-bienvenida{padding:20px}
.inicio-bienvenida h1{font-size:24px}
.modulo-grid,.resumen,.programa-resumen,.form-grid,.form-grid-3,.filtros,.filtros-consulta,.ficha-grid,.excel-resumen{grid-template-columns:1fr}
.dashboard-hero,.panel-etapas,.calificacion-grid{grid-template-columns:1fr}
.ficha-hero{padding:17px}
.ficha-hero-cabecera{flex-direction:column}
.ficha-estado-area{justify-content:flex-start}
.ficha-nombre{font-size:23px}
.tarjeta{padding:16px}
.seccion-titulo,.programa-cabecera{align-items:flex-start;flex-direction:column}
.completo{grid-column:auto}
.excel-panel{padding:20px 12px}
.botones>button,.acciones-form>button{min-height:42px}
.panel-notificaciones{position:fixed;top:65px;left:12px;right:12px;width:auto;max-height:70vh}
.submenu{flex-wrap:nowrap}
.tabla-equipos-escritorio{display:none}
.lista-equipos-movil{display:block}
}
@media(max-width:480px){
.contenido{padding:8px 10px 22px}
.topbar{flex-direction:column}
.topbar-acciones{width:100%;justify-content:flex-end}
.titulo-pagina{font-size:20px}
.resumen-numero{font-size:21px}
.hero-numero{font-size:31px}
.equipo-movil-datos{grid-template-columns:1fr}
}
@media(min-width:801px){
.tabla-equipos-escritorio{display:block}
.lista-equipos-movil{display:none}
}
</style>
</head>

<body>

<div id="menuOverlay" class="menu-overlay" onclick="cerrarMenuMovil()"></div>

<aside class="sidebar" id="sidebar">
<button class="sidebar-cerrar" onclick="cerrarMenuMovil()">×</button>

<div class="logo-box" onclick="mostrarInicioGeneral();cerrarMenuMovil()" title="Inicio General SAC-M">
<img src="logo prater.png" class="logo-imagen" alt="Laboratorios Prater">
<div class="logo-subtitulo">Sistemas de Apoyo Crítico y Metrología</div>
<div class="logo-descripcion">LABORATORIOS PRATER</div>
</div>

<ul class="menu" id="menuPrincipal">
<li data-modulo="calificacion" onclick="abrirModulo('calificacion')"><span class="menu-icono">▣</span>Calificación de Equipos</li>
<li data-modulo="calibracion" onclick="abrirModulo('calibracion')"><span class="menu-icono">◎</span>Calibración de Equipos</li>
<li data-modulo="agua" onclick="abrirModulo('agua')"><span class="menu-icono">◉</span>Agua Purificada</li>
<li data-modulo="hvac" onclick="abrirModulo('hvac')"><span class="menu-icono">≋</span>HVAC</li>

function fechaHoy(){
const d=new Date();
return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const anioActual=()=>new Date().getFullYear();

function fechaBonita(f){
if(!f)return"—";
const p=String(f).split("-");
return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:f;
}

function sumarAnios(f,n){
if(!f)return"";
const[a,m,d]=String(f).split("-").map(Number);
if(!a||!m||!d)return"";
let x=new Date(a+n,m-1,d);
if(x.getMonth()!==m-1)x=new Date(a+n,m,0);
return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}

function normalizarFechaExcel(v){
if(v===null||v===undefined||v==="")return"";
if(v instanceof Date){
return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
}
if(typeof v==="number"){
const x=XLSX.SSF.parse_date_code(v);
return x?`${x.y}-${String(x.m).padStart(2,"0")}-${String(x.d).padStart(2,"0")}`:"";
}
const t=String(v).trim();
if(/^\d{4}-\d{2}-\d{2}$/.test(t)){
const d=new Date(t+"T00:00:00");
return Number.isNaN(d.getTime())?"":t;
}
const m=t.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
if(!m)return"";
const f=`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
const d=new Date(f+"T00:00:00");
return Number.isNaN(d.getTime())?"":f;
}

function col(f,n){
for(const x of n){
if(f[x]!==undefined&&f[x]!==null&&String(f[x]).trim()!=="")return f[x];
}
return"";
}

const MESES=["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const obtenerMes=f=>f?MESES[Number(String(f).split("-")[1])||0]:"";
const obtenerNumeroMes=f=>f?Number(String(f).split("-")[1]||0):0;
const obtenerAnioFecha=f=>f?Number(String(f).split("-")[0]||0):0;

/* ORDEN CORRELATIVO */
function correlativoEquipo(codigo){
const m=String(codigo||"").match(/(\d+)/);
return m?Number(m[1]):Number.MAX_SAFE_INTEGER;
}

function compararEquiposCorrelativo(a,b,direccion="asc"){
const na=correlativoEquipo(a.codigo),nb=correlativoEquipo(b.codigo);
let r=na-nb;
if(r===0)r=String(a.codigo||"").localeCompare(String(b.codigo||""),"es",{numeric:true,sensitivity:"base"});
return direccion==="desc"?-r:r;
}

/* MIGRACIÓN */
function migrarDatosAntiguos(guardar=true){
let cambios=false;

equipos.forEach(e=>{
["marca","modelo","serie","fechaBaja","motivoBaja"].forEach(k=>{
if(!(k in e)){e[k]="";cambios=true}
});
if(!("estado" in e)){e.estado="Operativo";cambios=true}
if(!("aplicaPQ" in e)){e.aplicaPQ=true;cambios=true}
if(!Array.isArray(e.historialEstado)){e.historialEstado=[];cambios=true}
});

calificaciones.forEach(r=>{
if(!r.fecha&&r.emision){r.fecha=r.emision;cambios=true}
if(!("responsable" in r)){r.responsable="";cambios=true}
if(r.fecha&&!r.vencimiento){r.vencimiento=sumarAnios(r.fecha,5);cambios=true}
});

programasCalificacion.forEach(p=>{
if(!Array.isArray(p.equipos)){p.equipos=[];cambios=true}
p.equipos.forEach(i=>{
if(!Array.isArray(i.documentos)){i.documentos=[];cambios=true}
if(!("equipoDeBaja" in i)){i.equipoDeBaja=false;cambios=true}
});
});

if(cambios&&guardar)guardarCalificaciones();
return cambios;
}

/* ESTADOS */
function estadoFecha(f){
if(!f)return{texto:"Sin registro",clase:"neutro"};

const hoy=new Date();
hoy.setHours(0,0,0,0);

const vencimiento=new Date(f+"T00:00:00");
if(Number.isNaN(vencimiento.getTime()))return{texto:"Fecha inválida",clase:"neutro"};

const dias=Math.ceil((vencimiento-hoy)/86400000);

if(dias<0)return{texto:"Vencido",clase:"vencido"};
if(dias<=DIAS_PROXIMO)return{texto:"Próximo",clase:"proximo"};

return{texto:"Vigente",clase:"vigente"};
}

function puntoEstado(e){
const p=e.clase==="vigente"?"punto-verde":e.clase==="proximo"?"punto-amarillo":e.clase==="vencido"?"punto-rojo":"punto-gris";
return`<span class="punto ${p}"></span><span class="badge ${e.clase}">${e.texto}</span>`;
}

const fechaDocumento=r=>r?.fecha||r?.emision||"";

function ultimoDocumento(c,t,d){
const codigo=normalizarTexto(c);
return calificaciones
.filter(r=>normalizarTexto(r.equipoCodigo)===codigo&&r.tipo===t&&r.documento===d)
.sort((a,b)=>fechaDocumento(b).localeCompare(fechaDocumento(a)))[0]||null;
}

function documentosRequeridosEquipo(e){
const d=[
{tipo:"IQ",documento:"Protocolo"},
{tipo:"IQ",documento:"Reporte"},
{tipo:"OQ",documento:"Protocolo"},
{tipo:"OQ",documento:"Reporte"}
];

if(e.aplicaPQ!==false){
d.push(
{tipo:"PQ",documento:"Protocolo"},
{tipo:"PQ",documento:"Reporte"}
);
}

return d;
}

function estadoEtapa(e,t){
if(t==="PQ"&&e.aplicaPQ===false)return{texto:"No aplica",clase:"neutro"};

const p=ultimoDocumento(e.codigo,t,"Protocolo");
const r=ultimoDocumento(e.codigo,t,"Reporte");

if(!p||!r)return{texto:"Incompleto",clase:"vencido"};

const ep=estadoFecha(p.vencimiento),er=estadoFecha(r.vencimiento);

if(ep.clase==="vencido"||er.clase==="vencido")return{texto:"Vencido",clase:"vencido"};
if(ep.clase==="proximo"||er.clase==="proximo")return{texto:"Próximo",clase:"proximo"};

return{texto:"Vigente",clase:"vigente"};
}

function estadoGlobalEquipo(e){
if(e.estado==="De baja")return{texto:"De baja",clase:"neutro",icono:"⊘"};

const tipos=["IQ","OQ"];
if(e.aplicaPQ!==false)tipos.push("PQ");

const estados=tipos.map(t=>estadoEtapa(e,t));

if(estados.some(x=>x.clase==="vencido"))return{texto:"Vencida / incompleta",clase:"vencido",icono:"!"};
if(estados.some(x=>x.clase==="proximo"))return{texto:"Próxima a recalificar",clase:"proximo",icono:"◷"};

return{texto:"Calificación vigente",clase:"vigente",icono:"✓"};
}

const equipoCompletamenteCalificado=e=>["vigente","proximo"].includes(estadoGlobalEquipo(e).clase);
const obtenerPrograma=a=>programasCalificacion.find(p=>Number(p.anio)===Number(a))||null;

function documentoReferenciaPrograma(e){
return e.aplicaPQ!==false
?ultimoDocumento(e.codigo,"PQ","Reporte")
:ultimoDocumento(e.codigo,"OQ","Reporte");
}

/* PRÓXIMA ACCIÓN */
function proximaAccionEquipo(e){
if(e.estado==="De baja"){
return{
texto:"Equipo fuera del programa activo",
detalle:"La documentación permanece disponible como historial.",
prioridad:99
};
}

const etapas=["IQ","OQ"];
if(e.aplicaPQ!==false)etapas.push("PQ");

for(const t of etapas){
const p=ultimoDocumento(e.codigo,t,"Protocolo");
if(!p)return{texto:`Completar Protocolo ${t}`,detalle:"No existe protocolo registrado para esta etapa.",prioridad:1};

const r=ultimoDocumento(e.codigo,t,"Reporte");
if(!r)return{texto:`Completar Reporte ${t}`,detalle:"Existe protocolo, pero no reporte registrado.",prioridad:1};
}

const vencidos=documentosRequeridosEquipo(e)
.map(x=>({...x,registro:ultimoDocumento(e.codigo,x.tipo,x.documento)}))
.filter(x=>x.registro&&estadoFecha(x.registro.vencimiento).clase==="vencido")
.sort((a,b)=>a.registro.vencimiento.localeCompare(b.registro.vencimiento));

if(vencidos.length){
const x=vencidos[0];
return{
texto:`Regularizar ${x.tipo} ${x.documento}`,
detalle:`${x.registro.codigo} venció el ${fechaBonita(x.registro.vencimiento)}.`,
prioridad:2
};
}

const proximos=documentosRequeridosEquipo(e)
.map(x=>({...x,registro:ultimoDocumento(e.codigo,x.tipo,x.documento)}))
.filter(x=>x.registro&&estadoFecha(x.registro.vencimiento).clase==="proximo")
.sort((a,b)=>a.registro.vencimiento.localeCompare(b.registro.vencimiento));

if(proximos.length){
const x=proximos[0];
return{
texto:`Preparar recalificación ${x.tipo}`,
detalle:`${x.registro.codigo} vence el ${fechaBonita(x.registro.vencimiento)}.`,
prioridad:4
};
}

return{
texto:"Sin acciones pendientes",
detalle:"La documentación requerida se encuentra vigente.",
prioridad:50
};
}

/* NOTIFICACIONES */
function generarNotificaciones(){
const alertas=[];

equipos
.filter(e=>e.estado!=="De baja")
.forEach(e=>{

documentosRequeridosEquipo(e).forEach(req=>{

const r=ultimoDocumento(e.codigo,req.tipo,req.documento);

if(!r){
alertas.push({
equipoCodigo:e.codigo,
prioridad:1,
icono:"🔴",
titulo:`${e.codigo} · Documentación incompleta`,
texto:`Falta ${req.documento} ${req.tipo}.`
});
return;
}

const estado=estadoFecha(r.vencimiento);

if(estado.clase==="vencido"){
alertas.push({
equipoCodigo:e.codigo,
prioridad:2,
icono:"🔴",
titulo:`${e.codigo} · ${req.tipo} ${req.documento}`,
texto:`${r.codigo} venció el ${fechaBonita(r.vencimiento)}.`
});
}

if(estado.clase==="proximo"){
alertas.push({
equipoCodigo:e.codigo,
prioridad:3,
icono:"🟡",
titulo:`${e.codigo} · ${req.tipo} ${req.documento}`,
texto:`${r.codigo} vence el ${fechaBonita(r.vencimiento)}.`
});
}

});

});

return alertas.sort((a,b)=>a.prioridad-b.prioridad);
}

function resumenEtapa(t){
const l=equipos.filter(e=>e.estado!=="De baja"&&!(t==="PQ"&&e.aplicaPQ===false));
const r={total:l.length,vigente:0,proximo:0,vencido:0};

l.forEach(e=>{
const s=estadoEtapa(e,t);

if(s.clase==="vigente")r.vigente++;
else if(s.clase==="proximo")r.proximo++;
else r.vencido++;
});

return r;
}

function guardarEquipo(){
if(!esAdmin)return;

const codigo=val("eqCodigo");
const nombre=val("eqNombre");
const area=val("eqArea");

if(!codigo||!nombre||!area){
alert("Completa Código, Nombre y Área.");
return;
}

const dup=equipos.findIndex((e,i)=>
normalizarTexto(e.codigo)===normalizarTexto(codigo)&&
i!==indiceEdicionEquipo
);

if(dup!==-1){
alert("Ya existe otro equipo con ese código.");
return;
}

if(indiceEdicionEquipo===null){

equipos.push({
codigo,
nombre,
area,
marca:val("eqMarca"),
modelo:val("eqModelo"),
serie:val("eqSerie"),
ubicacion:val("eqUbicacion"),
aplicaPQ:sel("eqPQ")==="si",
estado:"Operativo",
fechaBaja:"",
motivoBaja:"",
historialEstado:[]
});

}else{

const e=equipos[indiceEdicionEquipo];
const anterior=e.codigo;

Object.assign(e,{
codigo,
nombre,
area,
marca:val("eqMarca"),
modelo:val("eqModelo"),
serie:val("eqSerie"),
ubicacion:val("eqUbicacion"),
aplicaPQ:sel("eqPQ")==="si"
});

calificaciones.forEach(r=>{
if(normalizarTexto(r.equipoCodigo)===normalizarTexto(anterior)){
r.equipoCodigo=codigo;
r.equipoNombre=nombre;
}
});

programasCalificacion.forEach(p=>{
(p.equipos||[]).forEach(x=>{
if(normalizarTexto(x.equipoCodigo)===normalizarTexto(anterior)){
x.equipoCodigo=codigo;
x.equipoNombre=nombre;
}
});
});

}

guardarCalificaciones();
actualizarCumplimientoProgramas();
mostrarEquiposCalificacion();
}

function equiposFiltrados(){
const q=normalizarTexto(val("buscarEquipo"));
const fe=$("filtroEstadoEquipo")?sel("filtroEstadoEquipo"):"";
const fp=$("filtroPQ")?sel("filtroPQ"):"";
const fa=$("filtroAreaEquipo")?sel("filtroAreaEquipo"):"";
const orden=$("ordenEquipo")?sel("ordenEquipo"):"asc";

return equipos
.filter(e=>{

const busqueda=[
e.codigo,
e.nombre,
e.area,
e.marca,
e.modelo,
e.serie,
e.ubicacion
].some(x=>normalizarTexto(x).includes(q));

const estado=!fe||e.estado===fe;

const pq=
!fp||
(fp==="si"&&e.aplicaPQ!==false)||
(fp==="no"&&e.aplicaPQ===false);

const area=!fa||e.area===fa;

return busqueda&&estado&&pq&&area;

})
.sort((a,b)=>compararEquiposCorrelativo(a,b,orden));
}

).length;

equipos:(p.equipos||[]).filter(x=>

)
}));

guardarCalificaciones();
mostrarEquiposCalificacion();

function generarProgramaProximoAnio(descargar=false){
if(!esAdmin)return;

const anio=anioActual()+1;
const candidatos=[];

equipos
.filter(e=>e.estado!=="De baja")
.forEach(e=>{

const r=documentoReferenciaPrograma(e);

if(!r)return;
if(obtenerAnioFecha(r.vencimiento)!==anio)return;

candidatos.push({
equipoCodigo:e.codigo,
equipoNombre:e.nombre,
area:e.area,
aplicaPQ:e.aplicaPQ!==false,
referenciaTipo:e.aplicaPQ!==false?"RCD":"RCO",
referenciaCodigo:r.codigo,
vencimientoReferencia:r.vencimiento,
mes:obtenerMes(r.vencimiento),
mesNumero:obtenerNumeroMes(r.vencimiento),
documentos:documentosEsperadosPrograma(e).map(d=>({
...d,
estado:"Pendiente",
codigoCumplimiento:"",
fechaCumplimiento:"",
responsable:""
})),
estadoGeneral:"Pendiente",
equipoDeBaja:false
});

});

if(!candidatos.length){
alert(`No existen equipos activos cuyo RCD/RCO venza durante ${anio}.`);
return;
}

let p=obtenerPrograma(anio);

if(p){

if(!confirm(`Ya existe el Programa de Calificaciones ${anio}.\n\n¿Actualizarlo con la información actual?`)){
if(descargar)descargarProgramaExcel(p);
return;
}

p.fechaGeneracion=fechaHoy();
p.equipos=candidatos;

}else{

p={
anio,
fechaGeneracion:fechaHoy(),
equipos:candidatos
};

programasCalificacion.push(p);

}

guardarCalificaciones();
actualizarCumplimientoProgramas();

if(descargar)descargarProgramaExcel(p);

mostrarProgramaCalificacion(anio);
}

function actualizarCumplimientoProgramas(guardar=true){
const antes=JSON.stringify(programasCalificacion);

programasCalificacion.forEach(p=>{

if(!Array.isArray(p.equipos))p.equipos=[];

p.equipos.forEach(i=>{

if(!Array.isArray(i.documentos))i.documentos=[];

const e=equipos.find(x=>
normalizarTexto(x.codigo)===normalizarTexto(i.equipoCodigo)
);

i.equipoDeBaja=!e||e.estado==="De baja";

i.documentos.forEach(d=>{

const r=calificaciones
.filter(x=>
normalizarTexto(x.equipoCodigo)===normalizarTexto(i.equipoCodigo)&&
x.tipo===d.tipo&&
x.documento===d.documento&&
obtenerAnioFecha(fechaDocumento(x))===Number(p.anio)
)
.sort((a,b)=>fechaDocumento(b).localeCompare(fechaDocumento(a)))[0];

if(r){

d.estado="Cumplido";
d.codigoCumplimiento=r.codigo;
d.fechaCumplimiento=fechaDocumento(r);
d.responsable=r.responsable||"";

}else{

d.estado="Pendiente";
d.codigoCumplimiento="";
d.fechaCumplimiento="";
d.responsable="";

}

});

i.estadoGeneral=
i.documentos.length&&
i.documentos.every(d=>d.estado==="Cumplido")
?"Cumplido"
:"Pendiente";

});

});

const despues=JSON.stringify(programasCalificacion);

if(guardar&&antes!==despues){
localStorage.setItem("programasCalificacion",despues);
}

return antes!==despues;
}

function resumenPrograma(p){
const e=(p.equipos||[]).filter(x=>!x.equipoDeBaja);
const d=e.flatMap(x=>x.documentos||[]);
const c=d.filter(x=>x.estado==="Cumplido").length;

return{
equipos:e.length,
total:d.length,
cumplidos:c,
pendientes:d.length-c,
excluidos:(p.equipos||[]).filter(x=>x.equipoDeBaja).length,
porcentaje:d.length?Math.round(c/d.length*100):0
};
}

function restaurarRespaldoCalificaciones(event){
if(!esAdmin)return;

const archivo=event.target.files[0];
event.target.value="";

if(!archivo)return;

const reader=new FileReader();

reader.onload=e=>{

try{

const data=JSON.parse(e.target.result);

if(
data.tipo!=="respaldo-calificaciones-sacm"||
!Array.isArray(data.equipos)||
!Array.isArray(data.calificaciones)||
!Array.isArray(data.programasCalificacion)
){
throw new Error("Formato inválido");
}

const mensaje=
`Se restaurará el respaldo completo de Calificaciones.

Equipos: ${data.equipos.length}
Documentos: ${data.calificaciones.length}
Programas: ${data.programasCalificacion.length}

La información actual del módulo será reemplazada.

¿Continuar?`;

if(!confirm(mensaje))return;

equipos=data.equipos;
calificaciones=data.calificaciones;
programasCalificacion=data.programasCalificacion;

migrarDatosAntiguos(false);
actualizarCumplimientoProgramas(false);
guardarCalificaciones();

alert("Respaldo restaurado correctamente.");

mostrarInicioCalificacion();

}catch(error){

console.error(error);

alert(
"El archivo seleccionado no corresponde a un respaldo válido de Calificaciones."
);

}

};

reader.readAsText(archivo);
}

function interpretarPQ(valor){
const t=normalizarTexto(valor);

if(["no","n","false","0"].includes(t))return false;
if(["si","sí","s","yes","y","true","1"].includes(t))return true;

/* Compatibilidad con archivos antiguos */
return true;
}

function leerDocumentoExcel(
fila,
equipo,
tipo,
documento,
colCodigo,
colFecha,
columnasResponsable,
errores
){
const rawCodigo=col(fila,[colCodigo]);
const rawFecha=col(fila,[colFecha]);

const codigo=String(rawCodigo||"").trim();
const fecha=normalizarFechaExcel(rawFecha);

const hayCodigo=!!codigo;
const hayFechaRaw=rawFecha!==""&&rawFecha!==null&&rawFecha!==undefined;

if(!hayCodigo&&!hayFechaRaw)return null;

if(hayCodigo&&!hayFechaRaw){
errores.push(`${tipo} ${documento}: existe código pero falta fecha de emisión.`);
return null;
}

if(!hayCodigo&&hayFechaRaw){
errores.push(`${tipo} ${documento}: existe fecha de emisión pero falta código.`);
return null;
}

if(!fecha){
errores.push(`${tipo} ${documento}: fecha de emisión inválida.`);
return null;
}

return{
equipoCodigo:equipo.codigo,
equipoNombre:equipo.nombre,
tipo,
documento,
codigo,
version:"",
fecha,
vencimiento:sumarAnios(fecha,5),
responsable:String(col(fila,columnasResponsable)||"").trim()
};
}

const codigo=String(

if(!nombre)errores.push("Falta Nombre.");
if(!area)errores.push("Falta Área.");

const clave=normalizarTexto(codigo);

const aplicaPQ=interpretarPQ(

);

const equipo={

};

[

errores

errores
),

leerDocumentoExcel(
fila,
equipo,
"OQ",
"Protocolo",
"Protocolo OQ",
"Emisión Protocolo OQ",
["Elaboró Protocolo OQ","Elaboro Protocolo OQ"],
errores
),

leerDocumentoExcel(
fila,
equipo,
"OQ",
"Reporte",
"Reporte OQ",
"Emisión Reporte OQ",
["Ejecutó Reporte OQ","Ejecuto Reporte OQ"],
errores
)

].filter(Boolean).forEach(d=>documentos.push(d));

if(aplicaPQ){

[
leerDocumentoExcel(
fila,
equipo,
"PQ",
"Protocolo",
"Protocolo PQ",
"Emisión Protocolo PQ",
["Elaboró Protocolo PQ","Elaboro Protocolo PQ"],
errores
),

leerDocumentoExcel(
fila,
equipo,
"PQ",
"Reporte",
"Reporte PQ",
"Emisión Reporte PQ",
["Ejecutó Reporte PQ","Ejecuto Reporte PQ"],
errores
)

].filter(Boolean).forEach(d=>documentos.push(d));

}

const existe=equipos.some(x=>
normalizarTexto(x.codigo)===normalizarTexto(codigo)
);

resultados.push({

estado:errores.length
?"error"
:existe
?"duplicado"
:"valido",
codigo,
nombre,
mensaje:errores.length

:{

excelTemporal={

};

}

function documentoExiste(d){
return calificaciones.some(r=>
normalizarTexto(r.equipoCodigo)===normalizarTexto(d.equipoCodigo)&&
r.tipo===d.tipo&&
r.documento===d.documento&&
normalizarTexto(r.codigo)===normalizarTexto(d.codigo)&&
fechaDocumento(r)===d.fecha
);
}

function agregarDocumentoSiNoExiste(d){
if(!documentoExiste(d)){
calificaciones.push(d);
return true;
}

return false;
}

function confirmarImportacionCalificacion(){
if(!excelTemporal)return;

const modo=sel("modoImportacionCal")||"omitir";

let nuevos=0;
let actualizados=0;
let documentosNuevos=0;

excelTemporal.resultados.forEach(r=>{

if(r.estado==="error"||!r.data)return;

const data=r.data;

const i=equipos.findIndex(e=>
normalizarTexto(e.codigo)===normalizarTexto(data.equipo.codigo)
);

if(i===-1){

equipos.push(data.equipo);
nuevos++;

data.documentos.forEach(d=>{
if(agregarDocumentoSiNoExiste(d))documentosNuevos++;
});

return;
}

if(modo!=="actualizar")return;

const anterior=equipos[i];

/*
Mantener código canónico existente.
Esto evita que e780/ef cree documentos
separados de E780/EF.
*/
const codigoCanonico=anterior.codigo;

equipos[i]={
...anterior,
nombre:data.equipo.nombre,
area:data.equipo.area,
marca:data.equipo.marca,
modelo:data.equipo.modelo,
serie:data.equipo.serie,
ubicacion:data.equipo.ubicacion,
aplicaPQ:data.equipo.aplicaPQ
};

actualizados++;

data.documentos.forEach(d=>{

d.equipoCodigo=codigoCanonico;
d.equipoNombre=data.equipo.nombre;

if(agregarDocumentoSiNoExiste(d)){
documentosNuevos++;
}

});

});

guardarCalificaciones();
actualizarCumplimientoProgramas();

excelTemporal=null;

alert(
`Importación completada.

Equipos nuevos: ${nuevos}
Equipos actualizados: ${actualizados}
Documentos nuevos: ${documentosNuevos}`
);

mostrarInicioCalificacion();
}

"Protocolo IQ":pi?.codigo||"",

"Elaboró Protocolo IQ":pi?.responsable||"",

"Reporte IQ":ri?.codigo||"",
"Emisión Reporte IQ":fechaDocumento(ri),
"Ejecutó Reporte IQ":ri?.responsable||"",

"Protocolo OQ":po?.codigo||"",
"Emisión Protocolo OQ":fechaDocumento(po),
"Elaboró Protocolo OQ":po?.responsable||"",

"Reporte OQ":ro?.codigo||"",
"Emisión Reporte OQ":fechaDocumento(ro),
"Ejecutó Reporte OQ":ro?.responsable||"",

"Protocolo PQ":e.aplicaPQ!==false?(pp?.codigo||""):"NO APLICA",
"Emisión Protocolo PQ":e.aplicaPQ!==false?fechaDocumento(pp):"",
"Elaboró Protocolo PQ":e.aplicaPQ!==false?(pp?.responsable||""):"",

"Reporte PQ":e.aplicaPQ!==false?(rp?.codigo||""):"NO APLICA",
"Emisión Reporte PQ":e.aplicaPQ!==false?fechaDocumento(rp):"",
"Ejecutó Reporte PQ":e.aplicaPQ!==false?(rp?.responsable||""):""
};

});

const ws=XLSX.utils.json_to_sheet(d);
const wb=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Calificación"
);

XLSX.writeFile(
wb,
`Base_Calificacion_${fechaHoy()}.xlsx`
);
}

/* KPI */
function mostrarKPI(){
if(!esAdmin)return;

marcarMenuActivo("kpi");

const activos=equipos.filter(e=>e.estado!=="De baja");
const completos=activos.filter(equipoCompletamenteCalificado);

$("contenido").innerHTML=
cabecera(
"KPI",
"Indicadores de Calificación de Equipos"
)+
`
<div class="resumen">

${tarjetaResumen("⚙","Equipos activos",activos.length,"azul-bg")}

${tarjetaResumen(
"✓",
"Completamente calificados",
completos.length,
"verde-bg"
)}

${tarjetaResumen(
"!",
"Vencidos / incompletos",
activos.length-completos.length,
"rojo-bg"
)}

${tarjetaResumen(
"⊘",
"De baja",
equipos.length-activos.length,
"gris-bg"
)}

</div>

<div class="panel-etapas">

${tarjetaResumenEtapa("IQ")}
${tarjetaResumenEtapa("OQ")}
${tarjetaResumenEtapa("PQ")}

</div>`;
}

/* SINCRONIZACIÓN ENTRE PESTAÑAS */
window.addEventListener("storage",event=>{

if(![
"equipos",
"calificaciones",
"programasCalificacion",
"equiposCalibracion",
"registrosCalibracion",
"documentosSACM",
"registrosDocumentales"
].includes(event.key))return;

equipos=leerDatos("equipos");
calificaciones=leerDatos("calificaciones");
programasCalificacion=leerDatos("programasCalificacion");

equiposCalibracion=leerDatos("equiposCalibracion");
registrosCalibracion=leerDatos("registrosCalibracion");
documentosSACM=leerDatos("documentosSACM");
registrosDocumentales=leerDatos("registrosDocumentales");

migrarDatosAntiguos(false);
actualizarCumplimientoProgramas(false);
actualizarPermisosUI();

if(moduloActual==="inicio"){
mostrarInicioGeneral();
return;
}

if(moduloActual==="calificacion"){
if(esAdmin)mostrarInicioCalificacion();
else mostrarEquiposCalificacion();
return;
}

abrirModulo(moduloActual);
});

/* INICIO */
migrarDatosAntiguos(true);
actualizarCumplimientoProgramas(true);
actualizarPermisosUI();
mostrarInicioGeneral();
</script>
