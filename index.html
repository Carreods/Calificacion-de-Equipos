<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestión SAC-M</title>

    <!-- ICONO DE PESTAÑA -->
    <link
        rel="icon"
        type="image/png"
        href="PPPP.png"
    >

    <!-- EXCEL -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>

        /* =========================================================
           VARIABLES GENERALES
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        :root {
            --prater: #e30613;
            --prater-dark: #bc0010;
            --prater-soft: #fde8ea;

            --bg: #eef1f3;
            --white: #ffffff;

            --text: #17212b;
            --muted: #687887;

            --border: #dfe4e8;

            --green: #16834a;
            --green-bg: #dff7e8;

            --yellow: #b97900;
            --yellow-bg: #fff0ca;

            --red: #d91f2b;
            --red-bg: #fde1e3;

            --blue: #196cb8;
            --blue-bg: #e7f1ff;

            --purple: #6e55b3;
            --purple-bg: #eee9ff;

            --gray: #667685;
            --gray-bg: #edf1f4;

            --shadow:
                0 5px 20px rgba(30, 45, 60, .06);
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);
            color: var(--text);
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            padding: 9px 13px;

            border: 0;
            border-radius: 8px;

            cursor: pointer;

            font-weight: 700;

            transition:
                transform .12s ease,
                box-shadow .12s ease,
                background .12s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        input,
        select,
        textarea {
            width: 100%;

            min-height: 40px;

            padding: 10px 11px;

            border: 1px solid #d2d9df;
            border-radius: 8px;

            background: #ffffff;

            color: var(--text);

            font-size: 13px;

            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9aa8b4;

            box-shadow:
                0 0 0 3px rgba(25,108,184,.08);
        }

        input[readonly] {
            background: #edf1f4;
            color: #576675;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-size: 12px;
            font-weight: 700;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width: 250px;

            display: flex;
            flex-direction: column;

            padding: 18px 12px;

            background: #ffffff;

            border-right: 1px solid var(--border);

            overflow-y: auto;

            z-index: 200;
        }

        .logo-box {
            padding: 5px 8px 15px;

            border-bottom:
                1px solid #e6e9ed;
        }

        .logo-imagen {
            display: block;

            width: 150px;
            height: auto;

            margin-bottom: 10px;
        }

        .logo-subtitulo {
            font-size: 13px;
            font-weight: 700;

            line-height: 1.35;
        }

        .logo-descripcion {
            margin-top: 4px;

            color: var(--muted);

            font-size: 10px;

            letter-spacing: .6px;
        }

        .menu {
            list-style: none;

            padding: 0;
            margin: 16px 0 0;
        }

        .menu li {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 4px;

            padding: 10px 11px;

            border-radius: 9px;

            color: #536373;

            font-size: 13px;

            line-height: 1.25;

            cursor: pointer;

            transition:
                background .15s ease,
                color .15s ease;
        }

        .menu li:hover {
            background: #f5f7f8;
        }

        .menu li.activo {
            background: var(--prater-soft);
            color: var(--prater);

            font-weight: 700;
        }

        .menu-icono {
            width: 19px;

            flex: none;

            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;

            padding-top: 15px;

            border-top:
                1px solid #e6e9ed;
        }

        .sidebar-label {
            margin-bottom: 6px;

            color: #687887;

            font-size: 10px;

            text-transform: uppercase;
        }

        .usuario-box {
            padding: 10px;

            background: #f7f8fa;

            border-radius: 9px;
        }

        .usuario-nombre {
            font-size: 13px;
            font-weight: 700;
        }

        .usuario-area {
            margin-top: 3px;

            color: #75818c;

            font-size: 11px;
        }

        /* =========================================================
           CONTENIDO
        ========================================================= */

        .contenido {
            min-height: 100vh;

            margin-left: 250px;

            padding: 18px 28px 28px;
        }

        .topbar {
            position: sticky;

            top: 0;

            z-index: 90;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;

            padding: 10px 0 15px;

            margin-bottom: 8px;

            background:
                rgba(238,241,243,.94);

            backdrop-filter: blur(10px);
        }

        .topbar-acciones {
            position: relative;

            display: flex;
            flex-wrap: wrap;

            justify-content: flex-end;
            align-items: center;

            gap: 8px;
        }

        .titulo-pagina {
            margin: 0;

            font-size: 27px;

            letter-spacing: -.4px;
        }

        .subtitulo-pagina {
            margin-top: 5px;

            color: var(--muted);

            font-size: 13px;
        }

        /* =========================================================
           TARJETAS GENERALES
        ========================================================= */

        .tarjeta {
            margin-bottom: 18px;

            padding: 20px;

            background: #ffffff;

            border:
                1px solid var(--border);

            border-radius: 14px;

            box-shadow: var(--shadow);
        }

        .tarjeta h2,
        .tarjeta h3 {
            margin-top: 0;
        }

        .subdato {
            color: #748392;

            font-size: 11px;

            line-height: 1.5;
        }

        .seccion-titulo {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 15px;
        }

        .seccion-titulo h2 {
            margin: 0;
        }

        /* =========================================================
           BOTONES
        ========================================================= */

        .btn-principal,
        .btn-login {
            background: var(--prater);
            color: #ffffff;
        }

        .btn-principal:hover {
            background: var(--prater-dark);
        }

        .btn-secundario,
        .btn-gris,
        .btn-editar,
        .btn-logout {
            background: #edf1f4;
            color: #344454;
        }

        .btn-verde {
            background: #e1f7e9;
            color: #147640;
        }

        .btn-azul {
            background: var(--blue-bg);
            color: var(--blue);
        }

        .btn-amarillo {
            background: var(--yellow-bg);
            color: #9b6600;
        }

        .btn-morado {
            background: var(--purple-bg);
            color: var(--purple);
        }

        .btn-eliminar {
            background: var(--red-bg);
            color: var(--red);
        }

        .btn-baja {
            background: #fff0f1;
            color: #c8202b;
        }

        .btn-reactivar {
            background: var(--green-bg);
            color: var(--green);
        }

        .btn-eliminar-definitivo {
            background: #a9000b;
            color: #ffffff;
        }

        .btn-login,
        .btn-logout {
            width: 100%;
            margin-top: 9px;
        }

        .btn-icono {
            width: 36px;
            height: 36px;

            display: inline-flex;

            justify-content: center;
            align-items: center;

            padding: 0;
        }

        .botones {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;
        }

        /* =========================================================
           CAMPANA / NOTIFICACIONES
        ========================================================= */

        .btn-campana {
            position: relative;

            width: 42px;
            height: 42px;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 0;

            background: #ffffff;

            border:
                1px solid var(--border);

            color: #364655;

            font-size: 18px;
        }

        .contador-notificacion {
            position: absolute;

            top: -6px;
            right: -6px;

            min-width: 20px;
            height: 20px;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 0 5px;

            background: var(--prater);
            color: #ffffff;

            border:
                2px solid var(--bg);

            border-radius: 20px;

            font-size: 9px;
            font-weight: 800;
        }

        .panel-notificaciones {
            position: absolute;

            top: 50px;
            right: 0;

            width: 410px;

            max-height: 540px;

            overflow-y: auto;

            background: #ffffff;

            border:
                1px solid var(--border);

            border-radius: 14px;

            box-shadow:
                0 16px 45px rgba(25,35,45,.18);

            z-index: 1000;
        }

        .panel-notificaciones-header {
            position: sticky;

            top: 0;

            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 14px 16px;

            background: #ffffff;

            border-bottom:
                1px solid #e5e9ec;
        }

        .notificacion-item {
            padding: 13px 16px;

            border-bottom:
                1px solid #edf0f2;

            cursor: pointer;
        }

        .notificacion-item:hover {
            background: #f7f9fa;
        }

        .notificacion-titulo {
            font-size: 12px;
            font-weight: 700;
        }

        .notificacion-texto {
            margin-top: 4px;

            color: #71808e;

            font-size: 11px;

            line-height: 1.5;
        }

        /* =========================================================
           SUBMENÚ
        ========================================================= */

        .submenu {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            padding: 7px;

            margin-bottom: 20px;

            background: #ffffff;

            border:
                1px solid var(--border);

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(30,45,60,.035);
        }

        .submenu button {
            background: transparent;
            color: #627181;
        }

        .submenu button:hover {
            background: #f3f5f6;
        }

        .submenu button.activo {
            background: var(--prater-soft);
            color: var(--prater);
        }

        /* =========================================================
           RESUMEN / DASHBOARD
        ========================================================= */

        .resumen {
            display: grid;

            grid-template-columns:
                repeat(5,minmax(0,1fr));

            gap: 13px;

            margin-bottom: 18px;
        }

        .resumen-card {
            display: flex;

            align-items: center;

            gap: 12px;

            min-height: 92px;

            padding: 16px;

            background: #ffffff;

            border:
                1px solid var(--border);

            border-radius: 13px;

            box-shadow: var(--shadow);

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .resumen-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(30,45,60,.09);
        }

        .resumen-icono {
            width: 43px;
            height: 43px;

            display: flex;

            justify-content: center;
            align-items: center;

            flex: none;

            border-radius: 50%;

            font-size: 19px;
        }

        .verde-bg {
            background: var(--green-bg);
        }

        .amarillo-bg {
            background: var(--yellow-bg);
        }

        .rojo-bg {
            background: var(--red-bg);
        }

        .azul-bg {
            background: var(--blue-bg);
        }

        .gris-bg {
            background: var(--gray-bg);
        }

        .morado-bg {
            background: var(--purple-bg);
        }

        .resumen-titulo {
            color: var(--muted);

            font-size: 11px;

            line-height: 1.35;
        }

        .resumen-numero {
            margin-top: 3px;

            font-size: 24px;
            font-weight: 800;
        }

        /* =========================================================
           HERO DASHBOARD
        ========================================================= */

        .dashboard-hero {
            display: grid;

            grid-template-columns:
                1.2fr 1fr;

            gap: 16px;

            margin-bottom: 18px;
        }

        .hero-panel {
            padding: 22px;

            background: #ffffff;

            border:
                1px solid var(--border);

            border-radius: 15px;

            box-shadow: var(--shadow);
        }

        .hero-label {
            color: var(--muted);

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: .5px;
        }

        .hero-numero {
            margin-top: 5px;

            font-size: 37px;
            font-weight: 800;

            letter-spacing: -1px;
        }

        .hero-descripcion {
            margin-top: 5px;

            color: var(--muted);

            font-size: 12px;
        }

        .barra-fondo {
            height: 12px;

            margin-top: 15px;

            overflow: hidden;

            background: #e9edef;

            border-radius: 20px;
        }

        .barra-avance {
            height: 100%;

            background: #25a45d;

            border-radius: 20px;

            transition: width .25s ease;
        }

        .accion-principal {
            margin-top: 14px;

            padding: 15px;

            background: #f7f9fa;

            border-left:
                4px solid var(--blue);

            border-radius: 9px;
        }

        .accion-principal-titulo {
            font-size: 13px;
            font-weight: 800;
        }

        .accion-principal-texto {
            margin-top: 5px;

            color: #657584;

            font-size: 12px;

            line-height: 1.5;
        }

        /* =========================================================
           IQ / OQ / PQ RESUMEN
        ========================================================= */

        .panel-etapas {
            display: grid;

            grid-template-columns:
                repeat(3,minmax(0,1fr));

            gap: 15px;

            margin-bottom: 18px;
        }

        .etapa-resumen {
            padding: 18px;

            background: #ffffff;

            border:
                1px solid var(--border);

            border-radius: 13px;

            box-shadow: var(--shadow);
        }

        .etapa-resumen-cabecera {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .etapa-resumen-titulo {
            font-size: 20px;
            font-weight: 800;
        }

        .etapa-estados {
            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 7px;
        }

        .etapa-mini {
            padding: 10px;

            background: #f7f8fa;

            border-radius: 9px;
        }

        .etapa-mini-numero {
            margin-top: 4px;

            font-size: 19px;
            font-weight: 800;
        }

        /* =========================================================
           ESTADOS
        ========================================================= */

        .badge {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
        }

        .vigente {
            background: var(--green-bg);
            color: var(--green);
        }

        .proximo {
            background: var(--yellow-bg);
            color: var(--yellow);
        }

        .vencido {
            background: var(--red-bg);
            color: var(--red);
        }

        .neutro {
            background: var(--gray-bg);
            color: var(--gray);
        }

        .programado {
            background: var(--blue-bg);
            color: var(--blue);
        }

        .cumplido {
            background: var(--green-bg);
            color: var(--green);
        }

        .pendiente {
            background: var(--yellow-bg);
            color: var(--yellow);
        }

        .baja {
            background: #e9edef;
            color: #52606c;
        }

        .punto {
            display: inline-block;

            width: 11px;
            height: 11px;

            margin-right: 6px;

            border-radius: 50%;

            vertical-align: -1px;
        }

        .punto-verde {
            background: #21a35c;
        }

        .punto-amarillo {
            background: #e4a000;
        }

        .punto-rojo {
            background: #dc303c;
        }

        .punto-gris {
            background: #a7b0b8;
        }

        /* =========================================================
           TABLAS
        ========================================================= */

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            font-size: 12px;
        }

        th {
            padding: 11px 10px;

            background: #f3f5f6;
            color: #455565;

            border-bottom:
                1px solid #dfe3e8;

            text-align: left;

            white-space: nowrap;
        }

        td {
            padding: 12px 10px;

            border-bottom:
                1px solid #e7eaed;

            vertical-align: middle;
        }

        tbody tr:hover td {
            background: #fafbfc;
        }

        .codigo {
            font-weight: 800;
        }

        .acciones-tabla {
            display: flex;
            gap: 5px;
        }

        /* =========================================================
           FORMULARIOS
        ========================================================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2,minmax(0,1fr));

            gap: 12px;
        }

        .form-grid-3 {
            display: grid;

            grid-template-columns:
                repeat(3,minmax(0,1fr));

            gap: 12px;
        }

        .completo {
            grid-column: 1 / -1;
        }

        .acciones-form {
            display: flex;
            flex-wrap: wrap;

            gap: 9px;

            margin-top: 15px;
        }

        /* =========================================================
           FILTROS
        ========================================================= */

        .filtros {
            display: grid;

            grid-template-columns:
                2fr 1fr 1fr;

            gap: 10px;

            margin-bottom: 15px;
        }

        /* =========================================================
           FICHA HERO
        ========================================================= */

        .ficha-hero {
            margin-bottom: 18px;

            padding: 22px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #fafbfc 100%
                );

            border:
                1px solid var(--border);

            border-radius: 16px;

            box-shadow: var(--shadow);
        }

        .ficha-hero-cabecera {
            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;
        }

        .ficha-codigo {
            margin-bottom: 5px;

            color: var(--prater);

            font-size: 15px;
            font-weight: 800;
        }

        .ficha-nombre {
            margin: 0;

            font-size: 27px;

            letter-spacing: -.4px;
        }

        .ficha-estado-area {
            display: flex;

            flex-wrap: wrap;

            justify-content: flex-end;

            gap: 7px;
        }

        .estado-global-grande {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 9px 14px;

            border-radius: 22px;

            font-size: 12px;
            font-weight: 800;
        }

        .ficha-proxima-accion {
            margin-top: 18px;

            padding: 14px 16px;

            background: #f6f8fa;

            border-left:
                4px solid var(--blue);

            border-radius: 9px;
        }

        .ficha-proxima-accion strong {
            display: block;

            margin-bottom: 4px;

            font-size: 12px;
        }

        .ficha-proxima-accion span {
            color: #607080;

            font-size: 12px;
        }

        .ficha-grid {
            display: grid;

            grid-template-columns:
                repeat(3,minmax(0,1fr));

            gap: 12px;
        }

        .ficha-dato {
            padding: 14px;

            background: #f7f8fa;

            border-radius: 10px;
        }

        .ficha-label {
            color: #71808f;

            font-size: 11px;
        }

        .ficha-valor {
            margin-top: 4px;

            font-size: 14px;
            font-weight: 700;
        }

        /* =========================================================
           TARJETAS IQ/OQ/PQ
        ========================================================= */

        .calificacion-grid {
            display: grid;

            grid-template-columns:
                repeat(3,minmax(0,1fr));

            gap: 15px;
        }

        .etapa-card {
            position: relative;

            overflow: hidden;

            background: #ffffff;

            border:
                1px solid var(--border);

            border-left:
                5px solid #a8b1ba;

            border-radius: 12px;

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .etapa-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(30,45,60,.08);
        }

        .etapa-card.estado-vigente {
            border-left-color:
                var(--green);
        }

        .etapa-card.estado-proximo {
            border-left-color:
                #e1a000;
        }

        .etapa-card.estado-vencido {
            border-left-color:
                var(--red);
        }

        .etapa-card.estado-neutro {
            border-left-color:
                #a8b1ba;
        }

        .etapa-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 13px 14px;

            background: #f4f6f7;
        }

        .etapa-titulo {
            font-size: 16px;
            font-weight: 800;
        }

        .doc-card {
            padding: 14px;

            border-top:
                1px solid #e8ebee;
        }

        .doc-tipo {
            margin-bottom: 5px;

            color: #6b7885;

            font-size: 11px;
        }

        .doc-codigo {
            margin-bottom: 8px;

            font-weight: 800;

            word-break: break-word;
        }

        .doc-linea {
            margin-top: 5px;

            color: #5d6c7b;

            font-size: 11px;

            line-height: 1.45;
        }

        .sin-documento {
            color: #87939e;

            font-size: 12px;

            line-height: 1.5;
        }

        /* =========================================================
           PROGRAMA
        ========================================================= */

        .programa-cabecera {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 15px;
        }

        .programa-anio {
            margin-top: 3px;

            font-size: 28px;
            font-weight: 800;
        }

        .programa-resumen {
            display: grid;

            grid-template-columns:

</head>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ADMIN_USUARIO =
    "admin";

const ADMIN_CLAVE =
    "SACM2026";

const DIAS_PROXIMO =
    180;

let esAdmin =
    sessionStorage.getItem(
        "adminSACM"
    ) === "true";

let moduloActual =
    "calificacion";

let indiceEdicionEquipo =
    null;

let indiceEdicionDocumento =
    null;

let excelTemporal =
    null;

let panelNotificacionesAbierto =
    false;


/* =========================================================
   ALMACENAMIENTO
========================================================= */

function leerDatos(clave) {

    try {

        const contenido =
            localStorage.getItem(
                clave
            );

        if (!contenido) {
            return [];
        }

        const datos =
            JSON.parse(
                contenido
            );

        return Array.isArray(datos)
            ? datos
            : [];

    } catch(error) {

        console.error(
            "Error leyendo " + clave,
            error
        );

        return [];
    }

}


let equipos =
    leerDatos(
        "equipos"
    );

let calificaciones =
    leerDatos(
        "calificaciones"
    );

let programasCalificacion =
    leerDatos(
        "programasCalificacion"
    );

let equiposCalibracion =
    leerDatos(
        "equiposCalibracion"
    );

let registrosCalibracion =
    leerDatos(
        "registrosCalibracion"
    );

let documentosSACM =
    leerDatos(
        "documentosSACM"
    );

let registrosDocumentales =
    leerDatos(
        "registrosDocumentales"
    );


function guardarTodo() {

    localStorage.setItem(
        "equipos",
        JSON.stringify(
            equipos
        )
    );

    localStorage.setItem(
        "calificaciones",
        JSON.stringify(
            calificaciones
        )
    );

    localStorage.setItem(
        "programasCalificacion",
        JSON.stringify(
            programasCalificacion
        )
    );

    localStorage.setItem(
        "equiposCalibracion",
        JSON.stringify(
            equiposCalibracion
        )
    );

    localStorage.setItem(
        "registrosCalibracion",
        JSON.stringify(
            registrosCalibracion
        )
    );

    localStorage.setItem(
        "documentosSACM",
        JSON.stringify(
            documentosSACM
        )
    );

    localStorage.setItem(
        "registrosDocumentales",
        JSON.stringify(
            registrosDocumentales
        )
    );

}


/* =========================================================
   UTILIDADES
========================================================= */

function obtenerValor(id) {

    const elemento =
        document.getElementById(
            id
        );

    return elemento
        ? String(
            elemento.value || ""
        ).trim()
        : "";

}


function obtenerSelect(id) {

    const elemento =
        document.getElementById(
            id
        );

    return elemento
        ? elemento.value
        : "";

}


function escaparHTML(valor) {

    return String(
        valor ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escaparJS(valor) {

    return String(
        valor ?? ""
    )
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


function fechaHoy() {

    const hoy =
        new Date();

    return [
        hoy.getFullYear(),
        String(
            hoy.getMonth()+1
        ).padStart(2,"0"),
        String(
            hoy.getDate()
        ).padStart(2,"0")
    ].join("-");

}


function anioActual() {

    return new Date()
        .getFullYear();

}


function fechaBonita(fecha) {

    if (!fecha) {
        return "—";
    }

    const partes =
        String(fecha)
        .split("-");

    if (
        partes.length !== 3
    ) {
        return fecha;
    }

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


function sumarAnios(
    fecha,
    cantidad
) {

    if (!fecha) {
        return "";
    }

    const partes =
        String(fecha)
        .split("-");

    if (
        partes.length !== 3
    ) {
        return "";
    }

    const anio =
        Number(partes[0]);

    const mes =
        Number(partes[1]);

    const dia =
        Number(partes[2]);

    let nuevaFecha =
        new Date(
            anio + cantidad,
            mes - 1,
            dia
        );

    /*
        Ajuste de 29 de febrero.
    */
    if (
        nuevaFecha.getMonth() !==
        mes - 1
    ) {

        nuevaFecha =
            new Date(
                anio + cantidad,
                mes,
                0
            );

    }

    return [
        nuevaFecha.getFullYear(),
        String(
            nuevaFecha.getMonth()+1
        ).padStart(2,"0"),
        String(
            nuevaFecha.getDate()
        ).padStart(2,"0")
    ].join("-");

}


function normalizarFechaExcel(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "";
    }

    if (
        valor instanceof Date
    ) {

        return [
            valor.getFullYear(),
            String(
                valor.getMonth()+1
            ).padStart(2,"0"),
            String(
                valor.getDate()
            ).padStart(2,"0")
        ].join("-");

    }

    if (
        typeof valor ===
        "number"
    ) {

        const fecha =
            XLSX.SSF.parse_date_code(
                valor
            );

        if (!fecha) {
            return "";
        }

        return [
            fecha.y,
            String(
                fecha.m
            ).padStart(2,"0"),
            String(
                fecha.d
            ).padStart(2,"0")
        ].join("-");

    }

    const texto =
        String(valor)
        .trim();

    if (
        /^\d{4}-\d{2}-\d{2}$/
        .test(texto)
    ) {

        return texto;
    }

    let match =
        texto.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (match) {

        return (
            match[3] +
            "-" +
            match[2].padStart(2,"0") +
            "-" +
            match[1].padStart(2,"0")
        );

    }

    match =
        texto.match(
            /^(\d{1,2})-(\d{1,2})-(\d{4})$/
        );

    if (match) {

        return (
            match[3] +
            "-" +
            match[2].padStart(2,"0") +
            "-" +
            match[1].padStart(2,"0")
        );

    }

    return "";

}


function columnaExcel(
    fila,
    nombres
) {

    for (
        const nombre of nombres
    ) {

        if (
            fila[nombre] !== undefined &&
            fila[nombre] !== null &&
            String(
                fila[nombre]
            ).trim() !== ""
        ) {

            return fila[nombre];

        }

    }

    return "";

}


const MESES = [
    "",
    "Enero",
    "Febrero",
    "Marzo",
    "Abril",
    "Mayo",
    "Junio",
    "Julio",
    "Agosto",
    "Septiembre",
    "Octubre",
    "Noviembre",
    "Diciembre"
];


function obtenerMes(fecha) {

    if (!fecha) {
        return "";
    }

    const partes =
        String(fecha)
        .split("-");

    return MESES[
        Number(
            partes[1] || 0
        )
    ] || "";

}


function obtenerNumeroMes(fecha) {

    if (!fecha) {
        return 0;
    }

    return Number(
        String(fecha)
        .split("-")[1] || 0
    );

}


function obtenerAnioFecha(fecha) {

    if (!fecha) {
        return 0;
    }

    return Number(
        String(fecha)
        .split("-")[0]
    ) || 0;

}


/* =========================================================
   MIGRACIÓN DE DATOS ANTIGUOS
========================================================= */

function migrarDatosAntiguos() {

    let cambios =
        false;

    equipos.forEach(
        equipo => {

            if (
                !("marca" in equipo)
            ) {

                equipo.marca = "";
                cambios = true;

            }

            if (
                !("modelo" in equipo)
            ) {

                equipo.modelo = "";
                cambios = true;

            }

            if (
                !("serie" in equipo)
            ) {

                equipo.serie = "";
                cambios = true;

            }

            if (
                !("estado" in equipo)
            ) {

                equipo.estado =
                    "Operativo";

                cambios = true;

            }

            if (
                !("fechaBaja" in equipo)
            ) {

                equipo.fechaBaja = "";
                cambios = true;

            }

            if (
                !("motivoBaja" in equipo)
            ) {

                equipo.motivoBaja = "";
                cambios = true;

            }

            if (
                !Array.isArray(
                    equipo.historialEstado
                )
            ) {

                equipo.historialEstado =
                    [];

                cambios = true;

            }

            if (
                !("aplicaPQ" in equipo)
            ) {

                equipo.aplicaPQ =
                    true;

                cambios = true;

            }

        }
    );

    calificaciones.forEach(
        registro => {

            if (
                !registro.fecha &&
                registro.emision
            ) {

                registro.fecha =
                    registro.emision;

                cambios = true;

            }

            if (
                !("responsable" in registro)
            ) {

                registro.responsable =
                    "";

                cambios = true;

            }

            if (
                registro.fecha &&
                !registro.vencimiento
            ) {

                registro.vencimiento =
                    sumarAnios(
                        registro.fecha,
                        5
                    );

                cambios = true;

            }

        }
    );

    if (cambios) {
        guardarTodo();
    }

}


/* =========================================================
   ESTADO DE DOCUMENTOS
========================================================= */

function estadoFecha(fecha) {

    if (!fecha) {

        return {
            texto:
                "Sin registro",

            clase:
                "neutro"
        };

    }

    const hoy =
        new Date();

    hoy.setHours(
        0,
        0,
        0,
        0
    );

    const vencimiento =
        new Date(
            fecha +
            "T00:00:00"
        );

    if (
        Number.isNaN(
            vencimiento.getTime()
        )
    ) {

        return {
            texto:
                "Fecha inválida",

            clase:
                "neutro"
        };

    }

    const dias =
        Math.ceil(
            (
                vencimiento -
                hoy
            ) /
            86400000
        );

    if (
        dias < 0
    ) {

        return {
            texto:
                "Vencido",

            clase:
                "vencido"
        };

    }

    if (
        dias <=
        DIAS_PROXIMO
    ) {

        return {
            texto:
                "Próximo",

            clase:
                "proximo"
        };

    }

    return {
        texto:
            "Vigente",

        clase:
            "vigente"
    };

}


function puntoEstado(
    estado
) {

    let punto =
        "punto-gris";

    if (
        estado.clase ===
        "vigente"
    ) {

        punto =
            "punto-verde";

    }

    if (
        estado.clase ===
        "proximo"
    ) {

        punto =
            "punto-amarillo";

    }

    if (
        estado.clase ===
        "vencido"
    ) {

        punto =
            "punto-rojo";

    }

    return `
        <span
            class="
                punto
                ${punto}
            "
        ></span>

        <span
            class="
                badge
                ${estado.clase}
            "
        >
            ${estado.texto}
        </span>
    `;

}


/* =========================================================
   DOCUMENTOS DE CALIFICACIÓN
========================================================= */

function fechaDocumento(
    registro
) {

    return (
        registro?.fecha ||
        registro?.emision ||
        ""
    );

}


function ultimoDocumento(
    equipoCodigo,
    tipo,
    documento
) {

    return calificaciones
        .filter(
            registro =>
                registro.equipoCodigo ===
                    equipoCodigo &&
                registro.tipo ===
                    tipo &&
                registro.documento ===
                    documento
        )
        .sort(
            (a,b) =>
                fechaDocumento(b)
                .localeCompare(
                    fechaDocumento(a)
                )
        )[0] || null;

}


function documentosRequeridosEquipo(
    equipo
) {

    const documentos = [

        {
            tipo:"IQ",
            documento:"Protocolo"
        },

        {
            tipo:"IQ",
            documento:"Reporte"
        },

        {
            tipo:"OQ",
            documento:"Protocolo"
        },

        {
            tipo:"OQ",
            documento:"Reporte"
        }

    ];

    if (
        equipo.aplicaPQ !==
        false
    ) {

        documentos.push(

            {
                tipo:"PQ",
                documento:"Protocolo"
            },

            {
                tipo:"PQ",
                documento:"Reporte"
            }

        );

    }

    return documentos;

}


function estadoEtapa(
    equipo,
    tipo
) {

    if (
        tipo === "PQ" &&
        equipo.aplicaPQ ===
        false
    ) {

        return {
            texto:
                "No aplica",

            clase:
                "neutro"
        };

    }

    const protocolo =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Protocolo"
        );

    const reporte =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Reporte"
        );

    if (
        !protocolo ||
        !reporte
    ) {

        return {
            texto:
                "Incompleto",

            clase:
                "vencido"
        };

    }

    const estadoP =
        estadoFecha(
            protocolo.vencimiento
        );

    const estadoR =
        estadoFecha(
            reporte.vencimiento
        );

    if (
        estadoP.clase ===
            "vencido" ||
        estadoR.clase ===
            "vencido"
    ) {

        return {
            texto:
                "Vencido",

            clase:
                "vencido"
        };

    }

    if (
        estadoP.clase ===
            "proximo" ||
        estadoR.clase ===
            "proximo"
    ) {

        return {
            texto:
                "Próximo",

            clase:
                "proximo"
        };

    }

    return {
        texto:
            "Vigente",

        clase:
            "vigente"
    };

}


/* =========================================================
   ESTADO GLOBAL
========================================================= */

function estadoGlobalEquipo(
    equipo
) {

    if (
        equipo.estado ===
        "De baja"
    ) {

        return {
            texto:
                "De baja",

            clase:
                "neutro",

            icono:
                "⊘"
        };

    }

    const tipos =
        ["IQ","OQ"];

    if (
        equipo.aplicaPQ !==
        false
    ) {

        tipos.push(
            "PQ"
        );

    }

    const estados =
        tipos.map(
            tipo =>
                estadoEtapa(
                    equipo,
                    tipo
                )
        );

    if (
        estados.some(
            estado =>
                estado.clase ===
                "vencido"
        )
    ) {

        return {
            texto:
                "Vencida / incompleta",

            clase:
                "vencido",

            icono:
                "!"
        };

    }

    if (
        estados.some(
            estado =>
                estado.clase ===
                "proximo"
        )
    ) {

        return {
            texto:
                "Próxima a recalificar",

            clase:
                "proximo",

            icono:
                "◷"
        };

    }

    return {
        texto:
            "Calificación vigente",

        clase:
            "vigente",

        icono:
            "✓"
    };

}


function equipoCompletamenteCalificado(
    equipo
) {

    const estado =
        estadoGlobalEquipo(
            equipo
        );

    return (
        estado.clase ===
            "vigente" ||
        estado.clase ===
            "proximo"
    );

}


/* =========================================================
   PROGRAMA - HELPERS
========================================================= */

function obtenerPrograma(
    anio
) {

    return programasCalificacion
        .find(
            programa =>
                Number(
                    programa.anio
                ) ===
                Number(
                    anio
                )
        ) ||
        null;

}


function documentoReferenciaPrograma(
    equipo
) {

    if (
        equipo.aplicaPQ !==
        false
    ) {

        return ultimoDocumento(
            equipo.codigo,
            "PQ",
            "Reporte"
        );

    }

    return ultimoDocumento(
        equipo.codigo,
        "OQ",
        "Reporte"
    );

}


/* =========================================================
   PRÓXIMA ACCIÓN AUTOMÁTICA
========================================================= */

function proximaAccionEquipo(
    equipo
) {

    if (
        equipo.estado ===
        "De baja"
    ) {

        return {
            texto:
                "Equipo fuera del programa activo",

            detalle:
                "La documentación permanece disponible como historial.",

            prioridad:
                99
        };

    }

    /*
        1. Revisamos documentación faltante.
    */
    const etapas =
        ["IQ","OQ"];

    if (
        equipo.aplicaPQ !==
        false
    ) {

        etapas.push(
            "PQ"
        );

    }

    for (
        const tipo of etapas
    ) {

        const protocolo =
            ultimoDocumento(
                equipo.codigo,
                tipo,
                "Protocolo"
            );

        if (!protocolo) {

            return {
                texto:
                    `Completar Protocolo ${tipo}`,

                detalle:
                    "No existe un protocolo registrado para esta etapa.",

                prioridad:
                    1
            };

        }

        const reporte =
            ultimoDocumento(
                equipo.codigo,
                tipo,
                "Reporte"
            );

        if (!reporte) {

            return {
                texto:
                    `Completar Reporte ${tipo}`,

                detalle:
                    "Existe protocolo, pero aún no se encuentra registrado el reporte.",

                prioridad:
                    1
            };

        }

    }

    /*
        2. Revisamos documentación vencida.
    */
    const vencidos =
        [];

    documentosRequeridosEquipo(
        equipo
    ).forEach(
        requerido => {

            const documento =
                ultimoDocumento(
                    equipo.codigo,
                    requerido.tipo,
                    requerido.documento
                );

            if (
                documento &&
                estadoFecha(
                    documento.vencimiento
                ).clase ===
                "vencido"
            ) {

                vencidos.push({
                    ...requerido,
                    registro:
                        documento
                });

            }

        }
    );

    vencidos.sort(
        (a,b) =>
            a.registro.vencimiento
            .localeCompare(
                b.registro.vencimiento
            )
    );

    if (
        vencidos.length
    ) {

        const primero =
            vencidos[0];

        return {
            texto:
                `Regularizar ${primero.tipo} ${primero.documento}`,

            detalle:
                `${primero.registro.codigo} venció el ${fechaBonita(primero.registro.vencimiento)}.`,

            prioridad:
                2
        };

    }

    /*
        3. Revisamos programa actual.
    */
    const programasOrdenados =
        [...programasCalificacion]
        .sort(
            (a,b) =>
                Number(a.anio) -
                Number(b.anio)
        );

    for (
        const programa of programasOrdenados
    ) {

        if (
            Number(programa.anio) <
            anioActual()
        ) {
            continue;
        }

        const item =
            programa.equipos
            ?.find(
                fila =>
                    fila.equipoCodigo ===
                    equipo.codigo
            );

        if (!item) {
            continue;
        }

        const pendiente =
            item.documentos
            ?.find(
                documento =>
                    documento.estado !==
                    "Cumplido"
            );

        if (pendiente) {

            return {
                texto:
                    `${pendiente.tipo} ${pendiente.documento} programado`,

                detalle:
                    `Programa ${programa.anio} · Mes límite ${item.mes}.`,

                prioridad:
                    3
            };

        }

    }

    /*
        4. Próxima documentación por vencer.
    */
    const proximos =
        [];

    documentosRequeridosEquipo(
        equipo
    ).forEach(
        requerido => {

            const documento =
                ultimoDocumento(
                    equipo.codigo,
                    requerido.tipo,
                    requerido.documento
                );

            if (
                documento &&
                estadoFecha(
                    documento.vencimiento
                ).clase ===
                "proximo"
            ) {

                proximos.push({
                    ...requerido,
                    registro:
                        documento
                });

            }

        }
    );

    proximos.sort(
        (a,b) =>
            a.registro.vencimiento
            .localeCompare(
                b.registro.vencimiento
            )
    );

    if (
        proximos.length
    ) {

        const primero =
            proximos[0];

        return {
            texto:
                `Preparar recalificación ${primero.tipo}`,

            detalle:
                `${primero.registro.codigo} vence el ${fechaBonita(primero.registro.vencimiento)}.`,

            prioridad:
                4
        };

    }

    return {
        texto:
            "Sin acciones pendientes",

        detalle:
            "La documentación requerida se encuentra vigente.",

        prioridad:
            50
    };

}

    if (

/* =========================================================
   NOTIFICACIONES
========================================================= */

function generarNotificaciones() {

    const alertas =
        [];

    equipos
        .filter(
            equipo =>
                equipo.estado !==
                "De baja"
        )
        .forEach(
            equipo => {

                documentosRequeridosEquipo(
                    equipo
                )
                .forEach(
                    requerido => {

                        const registro =
                            ultimoDocumento(
                                equipo.codigo,
                                requerido.tipo,
                                requerido.documento
                            );

                        if (!registro) {
                            return;
                        }

                        const estado =
                            estadoFecha(
                                registro.vencimiento
                            );

                        if (
                            estado.clase ===
                            "vencido"
                        ) {

                            alertas.push({

                                equipoCodigo:
                                    equipo.codigo,

                                prioridad:
                                    1,

                                icono:
                                    "🔴",

                                titulo:
                                    `${equipo.codigo} · ${requerido.tipo} ${requerido.documento}`,

                                texto:
                                    `${registro.codigo} venció el ${fechaBonita(registro.vencimiento)}.`

                            });

                        }

                        if (
                            estado.clase ===
                            "proximo"
                        ) {

                            alertas.push({

                                equipoCodigo:
                                    equipo.codigo,

                                prioridad:
                                    2,

                                icono:
                                    "🟡",

                                titulo:
                                    `${equipo.codigo} · ${requerido.tipo} ${requerido.documento}`,

                                texto:
                                    `${registro.codigo} vence el ${fechaBonita(registro.vencimiento)}.`

                            });

                        }

                    }
                );

            }
        );

    const programa =
        obtenerPrograma(
            anioActual()
        );

    if (programa) {

        const mesActual =
            new Date()
            .getMonth() + 1;

        programa.equipos
            .forEach(
                item => {

                    if (
                        item.equipoDeBaja
                    ) {
                        return;
                    }

                    if (
                        item.estadoGeneral ===
                        "Cumplido"
                    ) {
                        return;
                    }

                    if (
                        item.mesNumero <=
                        mesActual + 1
                    ) {

                        alertas.push({

                            equipoCodigo:
                                item.equipoCodigo,

                            prioridad:
                                3,

                            icono:
                                "🔵",

                            titulo:
                                `${item.equipoCodigo} · Programa ${programa.anio}`,

                            texto:
                                `Calificación programada con mes límite ${item.mes}.`

                        });

                    }

                }
            );

    }

    return alertas
        .sort(
            (a,b) =>
                a.prioridad -
                b.prioridad
        );

}

/* =========================================================
   RESUMEN IQ OQ PQ
========================================================= */

function resumenEtapa(
    tipo
) {

    const lista =
        equipos.filter(
            equipo => {

                if (
                    equipo.estado ===
                    "De baja"
                ) {
                    return false;
                }

                if (
                    tipo === "PQ" &&
                    equipo.aplicaPQ === false
                ) {
                    return false;
                }

                return true;

            }
        );

    const resultado = {

        total:
            lista.length,

        vigente:
            0,

        proximo:
            0,

        vencido:
            0

    };

    lista.forEach(
        equipo => {

            const estado =
                estadoEtapa(
                    equipo,
                    tipo
                );

            if (
                estado.clase ===
                "vigente"
            ) {

                resultado.vigente++;

            }

            if (
                estado.clase ===
                "proximo"
            ) {

                resultado.proximo++;

            }

            if (
                estado.clase ===
                "vencido"
            ) {

                resultado.vencido++;

            }

        }
    );

    return resultado;

}

function mostrarInicioCalificacion() {

    moduloActual =
        "calificacion";

    marcarMenuActivo(

    );

    actualizarCumplimientoProgramas();

    const activos =
        equipos.filter(

                "De baja"
        );

    const deBaja =
        equipos.filter(
            equipo =>
                equipo.estado ===

function tablaEquiposAtencion() {

    const lista =
        equipos
        .filter(
            equipo =>
                equipo.estado !==
                "De baja"
        )
        .map(
            equipo => ({
                equipo,

                estado:
                    estadoGlobalEquipo(
                        equipo
                    ),

                accion:
                    proximaAccionEquipo(
                        equipo
                    )
            })
        )
        .filter(
            item =>
                item.estado.clase !==
                    "vigente" ||
                item.accion.prioridad <
                    50
        )
        .sort(
            (a,b) => {

                const prioridadEstado = {
                    vencido:1,
                    proximo:2,
                    vigente:3
                };

                return (
                    (
                        prioridadEstado[
                            a.estado.clase
                        ] || 9
                    ) -
                    (
                        prioridadEstado[
                            b.estado.clase
                        ] || 9
                    )
                );

            0,
            12
        );

    if (!lista.length) {

        return `

    return `

function tablaProximasCalificaciones() {

    const lista =
        equipos
        .filter(
            equipo =>
                equipo.estado !==
                "De baja"
        )
        .map(
            equipo => {

                const referencia =
                    documentoReferenciaPrograma(
                        equipo
                    );

                if (!referencia) {
                    return null;
                }

                return {
                    equipo,
                    referencia
                };

            }

        .filter(Boolean)
        .sort(
            (a,b) =>
                a.referencia.vencimiento

function guardarEquipo() {

    const codigo =
        obtenerValor(
            "eqCodigo"
        );

    const nombre =
        obtenerValor(
            "eqNombre"
        );

    const area =
        obtenerValor(
            "eqArea"
        );

    if (
        !codigo ||
        !nombre ||
        !area
    ) {

        alert(
            "Completa Código, Nombre y Área."
        );

        return;
    }

    const duplicado =
        equipos.findIndex(
            (
                equipo,
                indice
            ) =>
                String(
                    equipo.codigo
                ).toLowerCase() ===
                    codigo.toLowerCase() &&
                indice !==
                    indiceEdicionEquipo
        );

    if (
        duplicado !== -1
    ) {

        alert(
            "Ya existe otro equipo con ese código."
        );

        return;
    }

    if (
        indiceEdicionEquipo ===
        null
    ) {

        equipos.push({

            codigo,
            nombre,
            area,

            marca:
                obtenerValor(
                    "eqMarca"
                ),

            modelo:
                obtenerValor(
                    "eqModelo"
                ),

            serie:
                obtenerValor(
                    "eqSerie"
                ),

            ubicacion:
                obtenerValor(
                    "eqUbicacion"
                ),

            aplicaPQ:
                obtenerSelect(
                    "eqPQ"
                ) === "si",

            estado:
                "Operativo",

            fechaBaja:
                "",

            motivoBaja:
                "",

            historialEstado:
                []

        });

    } else {

        const anterior =
            equipos[
                indiceEdicionEquipo
            ];

        const codigoAnterior =
            anterior.codigo;

        anterior.codigo =
            codigo;

        anterior.nombre =
            nombre;

        anterior.area =
            area;

        anterior.marca =
            obtenerValor(
                "eqMarca"
            );

        anterior.modelo =
            obtenerValor(
                "eqModelo"
            );

        anterior.serie =
            obtenerValor(
                "eqSerie"
            );

        anterior.ubicacion =
            obtenerValor(
                "eqUbicacion"
            );

        anterior.aplicaPQ =
            obtenerSelect(
                "eqPQ"
            ) === "si";

        /*
            Actualizamos la relación documental
            si cambia el código.
        */
        calificaciones.forEach(
            documento => {

                if (
                    documento.equipoCodigo ===
                    codigoAnterior
                ) {

                    documento.equipoCodigo =
                        codigo;

                    documento.equipoNombre =
                        nombre;

                }

            }
        );

        programasCalificacion
            .forEach(
                programa => {

                    programa.equipos
                    ?.forEach(
                        item => {

                            if (
                                item.equipoCodigo ===
                                codigoAnterior
                            ) {

                                item.equipoCodigo =
                                    codigo;

                                item.equipoNombre =
                                    nombre;

                            }

                        }
                    );

                }
            );

    }

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarEquiposCalificacion();

}

function renderEquipos() {

    const contenedor =
        document.getElementById(
            "tablaPrincipal"
        );

    if (!contenedor) {
        return;
    }

    const buscar =
        obtenerValor(
            "buscarEquipo"
        )
        .toLowerCase();

    const filtroEstado =
        obtenerSelect(
            "filtroEstadoEquipo"
        );

    const filtroPQ =
        obtenerSelect(
            "filtroPQ"
        );

    const lista =
        equipos.filter(
            equipo => {

                const coincideBusqueda =
                    [
                        equipo.codigo,
                        equipo.nombre,
                        equipo.area,
                        equipo.marca,
                        equipo.modelo,
                        equipo.serie,
                        equipo.ubicacion
                    ]
                    .some(
                        campo =>
                            String(
                                campo || ""
                            )
                            .toLowerCase()
                            .includes(
                                buscar
                            )
                    );

                const coincideEstado =
                    !filtroEstado ||
                    equipo.estado ===
                    filtroEstado;

                const coincidePQ =
                    !filtroPQ ||

                    (
                        filtroPQ ===
                            "si" &&
                        equipo.aplicaPQ !==
                            false
                    ) ||

                    (
                        filtroPQ ===
                            "no" &&
                        equipo.aplicaPQ ===
                            false
                    );

                return (
                    coincideBusqueda &&
                    coincideEstado &&
                    coincidePQ
                );

            }
        );

    if (!lista.length) {

        contenedor.innerHTML = `

            <div class="subdato">
                No se encontraron equipos.
            </div>

        `;

        return;
    }

    contenedor.innerHTML = `

        <div class="tabla-contenedor">

            <table>

function tarjetaEtapa(
    equipo,
    tipo
) {

    if (
        tipo === "PQ" &&
        equipo.aplicaPQ === false
    ) {

        return `

            <div class="etapa-card estado-neutro">

                <div class="etapa-header">

                    <div class="etapa-titulo">
                        PQ
                    </div>

                    <span class="badge neutro">
                        No aplica
                    </span>

                </div>

                <div class="doc-card">

                    <div class="sin-documento">
                        Este equipo no requiere Calificación de Desempeño.
                    </div>

                </div>

            </div>

        `;

    }

    const protocolo =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Protocolo"
        );

    const reporte =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Reporte"
        );

    const estado =
        estadoEtapa(
            equipo,
            tipo
        );

    return `

        <div
            class="
                etapa-card
                estado-${estado.clase}
            "
        >

            <div class="etapa-header">

                <div class="etapa-titulo">
                    ${tipo}
                </div>

                ${puntoEstado(
                    estado
                )}

            </div>

            ${tarjetaDocumentoFicha(
                protocolo,
                "Protocolo"
            )}

            ${tarjetaDocumentoFicha(
                reporte,
                "Reporte"
            )}

        </div>

    `;

}

    }

    return `

        <div class="doc-card">

            <div class="doc-tipo">
                ${tipo}
            </div>

            <div class="doc-codigo">
                ${escaparHTML(
                    registro.codigo
                )}
            </div>

            <div class="doc-linea">

                Emisión:

                <strong>
                    ${fechaBonita(
                        fechaDocumento(
                            registro

                    )}
                </strong>

            <div style="margin-top:9px">

                ${puntoEstado(
                    estadoFecha(
                        registro.vencimiento
                    )

        </div>

    `;

}


/* =========================================================
   HISTORIAL
========================================================= */

function tablaHistorialEquipo(
    codigo
) {

    const lista =
        calificaciones
        .filter(
            documento =>
                documento.equipoCodigo ===
                codigo
        )
        .sort(
            (a,b) =>
                fechaDocumento(b)
                .localeCompare(
                    fechaDocumento(a)
                )
        );

    if (!lista.length) {

        return `

            <div class="subdato">
                No existen documentos registrados.
            </div>

        `;

    }

    return `

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>
                        <th>Etapa</th>
                        <th>Documento</th>
                        <th>Código</th>
                        <th>Versión</th>
                        <th>Emisión</th>
                        <th>Vencimiento</th>
                        <th>Elaboró / Ejecutó</th>
                        <th>Estado</th>
                        ${
                            esAdmin
                                ? "<th>Acciones</th>"
                                : ""
                        }
                    </tr>

                </thead>

                <tbody>

                    ${lista.map(
                        registro => {

                            const indice =
                                calificaciones.indexOf(
                                    registro
                                );

                            return `

                                <tr>

                                    <td>
                                        ${registro.tipo}
                                    </td>

                                    <td>
                                        ${registro.documento}
                                    </td>

                                    <td class="codigo">
                                        ${escaparHTML(
                                            registro.codigo
                                        )}
                                    </td>

                                    <td>
                                        ${escaparHTML(
                                            registro.version ||
                                            "—"
                                        )}
                                    </td>

                                    <td>
                                        ${fechaBonita(
                                            fechaDocumento(
                                                registro
                                            )
                                        )}
                                    </td>

                                    <td>
                                        ${fechaBonita(
                                            registro.vencimiento
                                        )}
                                    </td>

                                    <td>
                                        ${escaparHTML(
                                            registro.responsable ||
                                            "—"
                                        )}
                                    </td>

                                    <td>

                                        ${puntoEstado(
                                            estadoFecha(
                                                registro.vencimiento
                                            )
                                        )}

                                    </td>

                                    ${
                                        esAdmin
                                            ? `

                                                <td>

                                                    <div class="acciones-tabla">

                                                        <button

                                                            title="Editar"

                    ).innerHTML=''
                "
            >
                Cancelar
            </button>

    `;

}


function confirmarBajaEquipo(
    codigo
) {

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    const fecha =
        obtenerValor(
            "fechaBaja"
        );

    const motivo =
        obtenerValor(
            "motivoBaja"
        );

    if (!fecha) {

        alert(
            "Ingresa la fecha de baja."
        );

        return;
    }

    if (
        !confirm(
            `¿Dar de baja ${equipo.codigo}?\n\n` +
            `La documentación NO será eliminada y el equipo dejará de participar en los KPI.`
        )
    ) {

        return;
    }

    equipo.estado =
        "De baja";

    equipo.fechaBaja =
        fecha;

    equipo.motivoBaja =
        motivo;

    if (
        !Array.isArray(
            equipo.historialEstado
        )
    ) {

        equipo.historialEstado =
            [];

    }

    equipo.historialEstado.push({

        estado:
            "De baja",

        fecha,

        motivo

    });

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarFichaEquipo(
        codigo
    );

}


function reactivarEquipo(
    codigo
) {

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    if (
        !confirm(
            `¿Reactivar ${equipo.codigo}?\n\n` +
            `El equipo volverá a participar en KPI y futuras programaciones.`
        )
    ) {

        return;
    }

    equipo.estado =
        "Operativo";

    if (
        !Array.isArray(
            equipo.historialEstado
        )
    ) {

        equipo.historialEstado =
            [];

    }

    equipo.historialEstado.push({

        estado:
            "Reactivado",

        fecha:
            fechaHoy(),

        motivo:
            "Equipo reincorporado al estado operativo."

    });

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarFichaEquipo(
        codigo
    );

}


/* =========================================================
   ELIMINACIÓN DEFINITIVA
========================================================= */

function eliminarEquipoDefinitivamente(
    codigo
) {

    if (!esAdmin) {
        return;
    }

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    const cantidadDocumentos =
        calificaciones.filter(
            registro =>
                registro.equipoCodigo ===
                codigo
        ).length;

    if (
        !confirm(
            `ELIMINACIÓN DEFINITIVA\n\n` +
            `${equipo.codigo} - ${equipo.nombre}\n\n` +
            `Se eliminarán ${cantidadDocumentos} documento(s) de calificación y sus registros de programación.\n\n` +
            `¿Deseas continuar?`
        )
    ) {

        return;
    }

    const escrito =
        prompt(
            `Para confirmar escribe exactamente:\n\n${equipo.codigo}`
        );

    if (
        escrito === null
    ) {
        return;
    }

    if (
        escrito.trim() !==
        equipo.codigo
    ) {

        alert(
            "El código ingresado no coincide. No se eliminó ningún dato."
        );

        return;
    }

    equipos =
        equipos.filter(
            item =>
                item.codigo !==
                codigo
        );

    calificaciones =
        calificaciones.filter(
            documento =>
                documento.equipoCodigo !==
                codigo
        );

    programasCalificacion =
        programasCalificacion.map(
            programa => ({

                ...programa,

                equipos:
                    (
                        programa.equipos ||
                        []
                    )
                    .filter(
                        item =>
                            item.equipoCodigo !==
                            codigo
                    )

            })
        );

    guardarTodo();

    alert(
        `El equipo ${codigo} fue eliminado definitivamente.`
    );

    mostrarEquiposCalificacion();

}

function guardarDocumentoCalificacion() {

    actualizarVencimientoDocumento();

    const equipoCodigo =
        obtenerSelect(
            "docEquipo"
        );

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                equipoCodigo
        );

    const registro = {

        equipoCodigo,

        equipoNombre:
            equipo?.nombre ||
            "",

        tipo:
            obtenerSelect(
                "docTipo"
            ),

        documento:
            obtenerSelect(
                "docDocumento"
            ),

        codigo:
            obtenerValor(
                "docCodigo"
            ),

        version:
            obtenerValor(
                "docVersion"
            ),

        fecha:
            obtenerValor(
                "docFecha"
            ),

        vencimiento:
            obtenerValor(
                "docVencimiento"
            ),

        responsable:
            obtenerValor(
                "docResponsable"
            )

    };

    if (
        !registro.codigo ||
        !registro.fecha
    ) {

        alert(
            "Ingresa el código del documento y la fecha de emisión."
        );

        return;
    }

    const duplicado =
        calificaciones.findIndex(
            (
                item,
                indice
            ) =>
                item.equipoCodigo ===
                    registro.equipoCodigo &&
                item.tipo ===
                    registro.tipo &&
                item.documento ===
                    registro.documento &&
                item.codigo ===
                    registro.codigo &&
                fechaDocumento(item) ===
                    registro.fecha &&
                indice !==
                    indiceEdicionDocumento
        );

    if (
        duplicado !== -1
    ) {

        alert(
            "Ese documento ya existe con el mismo equipo, código y fecha."
        );

        return;
    }

    if (
        indiceEdicionDocumento ===
        null
    ) {

        calificaciones.push(
            registro
        );

    } else {

        calificaciones[
            indiceEdicionDocumento
        ] =
            registro;

    }

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarGestionDocumentos();

}

                "PCI"

        },

        }

    ) {

            }
