<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestión de Equipos Calificados</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f3;
    color: #182230;
}

button,
input,
select {
    font-family: inherit;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 220px;
    height: 100vh;
    background: #ffffff;
    border-right: 1px solid #dfe3e8;
    position: fixed;
    top: 0;
    left: 0;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    z-index: 10;
}

.logo-box {
    padding: 6px 8px 14px 8px;
    border-bottom: 1px solid #e6e9ed;
}

.logo-imagen {
    width: 105px;
    height: auto;
    display: block;
    margin: 0 0 8px 0;
}

.logo-subtitulo {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    color: #1f2937;
}

.logo-descripcion {
    margin-top: 4px;
    font-size: 10px;
    color: #66788a;
    letter-spacing: 0.5px;
}

.menu {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
}

.menu li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 9px;
    margin-bottom: 5px;
    cursor: pointer;
    color: #526273;
    font-size: 14px;
}

.menu li:hover {
    background: #f7f8fa;
}

.menu li.activo {
    color: #e30613;
    background: #fde8ea;
    font-weight: 700;
}

.menu-icono {
    width: 18px;
    text-align: center;
}

.sidebar-bottom {
    margin-top: auto;
    border-top: 1px solid #e6e9ed;
    padding-top: 15px;
}

.sidebar-label {
    font-size: 10px;
    color: #657484;
    text-transform: uppercase;
    margin-bottom: 6px;
}

.usuario-box {
    padding: 10px;
    background: #f7f8fa;
    border-radius: 8px;
}

.usuario-nombre {
    font-weight: 700;
    font-size: 13px;
}

.usuario-area {
    color: #6d7985;
    font-size: 11px;
    margin-top: 3px;
}


/* =========================================================
   CONTENIDO
========================================================= */

.contenido {
    margin-left: 220px;
    padding: 28px;
    min-height: 100vh;
}

.topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.titulo-pagina {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
}

.subtitulo-pagina {
    margin-top: 6px;
    color: #66788a;
    font-size: 13px;
}

.btn-rojo-principal {
    background: #e30613;
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    font-weight: 700;
    cursor: pointer;
}

.btn-rojo-principal:hover {
    background: #c7000b;
}


/* =========================================================
   TARJETAS
========================================================= */

.tarjeta {
    background: #fff;
    border: 1px solid #e0e5e9;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.resumen {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
}

.resumen-card {
    background: #fff;
    border: 1px solid #e0e5e9;
    border-radius: 13px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.resumen-icono {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 21px;
}

.icono-azul {
    background: #e7f1ff;
}

.icono-verde {
    background: #dcf8e8;
}

.icono-amarillo {
    background: #fff3d8;
}

.icono-rojo {
    background: #fde4e6;
}

.resumen-titulo {
    color: #66788a;
    font-size: 13px;
}

.resumen-numero {
    font-size: 24px;
    font-weight: 800;
    margin-top: 3px;
}


/* =========================================================
   GRID
========================================================= */

.layout-calificaciones {
    display: grid;
    grid-template-columns: minmax(0, 2.4fr) minmax(320px, 1fr);
    gap: 18px;
    align-items: start;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.completo {
    grid-column: 1 / -1;
}


/* =========================================================
   FORMULARIOS
========================================================= */

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 10px 11px;
    min-height: 40px;
    border: 1px solid #d4dae0;
    border-radius: 8px;
    background: white;
    font-size: 13px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #9aa8b5;
    box-shadow: 0 0 0 3px rgba(100,120,140,0.08);
}

input[readonly] {
    background: #edf1f4;
    color: #50606f;
}

.codigo-generado {
    font-weight: 700;
}

.info {
    margin-top: 8px;
    background: #e7f3ff;
    color: #196cb8;
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.4;
}


/* =========================================================
   BOTONES
========================================================= */

button {
    border: none;
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: 700;
}

.btn-principal {
    background: #e30613;
    color: white;
}

.btn-secundario {
    background: #e9eef2;
    color: #1f2c38;
}

.btn-editar {
    background: #edf2f5;
    color: #344454;
}

.btn-eliminar {
    background: #fde8ea;
    color: #e30613;
}

.btn-verde {
    background: #e3f7ea;
    color: #17753b;
}

.btn-gris {
    background: #edf1f4;
    color: #425364;
}

.acciones-form {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.acciones-form button {
    flex: 1;
}


/* =========================================================
   TABLA
========================================================= */

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th {
    padding: 12px 10px;
    text-align: left;
    background: #f3f5f6;
    border-bottom: 1px solid #dfe3e8;
    color: #455565;
    font-weight: 700;
    white-space: nowrap;
}

td {
    padding: 12px 10px;
    border-bottom: 1px solid #e6e9ed;
    vertical-align: middle;
}

tr:hover td {
    background: #fafbfc;
}

.codigo-equipo {
    font-weight: 700;
}

.nombre-equipo {
    font-size: 11px;
    color: #748291;
    margin-top: 3px;
}

.codigo-doc {
    font-weight: 700;
    white-space: nowrap;
}

.acciones-tabla {
    display: flex;
    gap: 6px;
}

.acciones-tabla button {
    padding: 7px 9px;
}


/* =========================================================
   ESTADOS
========================================================= */

.badge {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}

.vigente {
    background: #def7e8;
    color: #17854b;
}

.proximo {
    background: #fff0cc;
    color: #d38a00;
}

.vencido {
    background: #fde0e2;
    color: #d91f2b;
}


/* =========================================================
   FILTROS
========================================================= */

.filtros {
    display: grid;
    grid-template-columns: 2fr repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}


/* =========================================================
   EQUIPOS
========================================================= */

.botones-superiores {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.form-equipo-card {
    max-width: 900px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1150px) {

    .resumen {
        grid-template-columns: repeat(2, 1fr);
    }

    .layout-calificaciones {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 800px) {

    .sidebar {
        width: 180px;
    }

    .contenido {
        margin-left: 180px;
        padding: 16px;
    }

    .resumen {
        grid-template-columns: 1fr;
    }

    .form-grid,
    .filtros {
        grid-template-columns: 1fr;
    }

    .completo {
        grid-column: auto;
    }

}

</style>

</head>

<body>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar">

    <div class="logo-box">

        <img
            src="logo prater.png"
            alt="Logo PRATER"
            class="logo-imagen"
        >

        <div class="logo-subtitulo">
            Sistemas de Apoyo Crítico y Metrología
        </div>

        <div class="logo-descripcion">
            LABORATORIOS PRATER
        </div>

    </div>


    <ul class="menu">

        <li
            class="activo"
            onclick="mostrarPagina('inicio', this)"
        >
            <span class="menu-icono">⌂</span>
            Inicio
        </li>

        <li onclick="mostrarPagina('equipos', this)">
            <span class="menu-icono">⚙</span>
            Equipos
        </li>

        <li onclick="mostrarPagina('calificaciones', this)">
            <span class="menu-icono">▣</span>
            Calificaciones
        </li>

        <li onclick="mostrarPagina('documentos', this)">
            <span class="menu-icono">▤</span>
            Documentación
        </li>

        <li onclick="mostrarPagina('configuracion', this)">
            <span class="menu-icono">◉</span>
            Base de datos
        </li>

    </ul>


    <div class="sidebar-bottom">

        <div class="sidebar-label">
            Usuario
        </div>

        <div class="usuario-box">

            <div class="usuario-nombre">
                ASCAL
            </div>

            <div class="usuario-area">
                Aseguramiento de la Calidad
            </div>

        </div>

    </div>

</aside>


<main
    class="contenido"
    id="contenido">
</main>


<script>

/* =========================================================
   DATOS
========================================================= */

let equipos =
    JSON.parse(localStorage.getItem("equipos")) || [];

let calificaciones =
    JSON.parse(localStorage.getItem("calificaciones")) || [];

let equipoEditando = null;
let calificacionEditando = null;


/* =========================================================
   GUARDAR
========================================================= */

function guardarDatos() {

    localStorage.setItem(
        "equipos",
        JSON.stringify(equipos)
    );

    localStorage.setItem(
        "calificaciones",
        JSON.stringify(calificaciones)
    );

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function mostrarPagina(pagina, elemento) {

    document.querySelectorAll(".menu li")
        .forEach(li => li.classList.remove("activo"));


    if (elemento) {
        elemento.classList.add("activo");
    }


    if (pagina === "inicio") {
        mostrarInicio();
    }

    if (pagina === "equipos") {
        mostrarEquipos();
    }

    if (pagina === "calificaciones") {
        mostrarCalificaciones();
    }

    if (pagina === "documentos") {
        mostrarDocumentos();
    }

    if (pagina === "configuracion") {
        mostrarConfiguracion();
    }

}


/* =========================================================
   ESTADO DOCUMENTO
========================================================= */

function obtenerEstadoDocumento(vencimiento) {

    if (!vencimiento) {

        return {
            texto: "Sin fecha",
            clase: "proximo"
        };

    }


    let hoy = new Date();

    hoy.setHours(0,0,0,0);


    let fechaVencimiento =
        new Date(vencimiento + "T00:00:00");


    let dias =
        Math.ceil(
            (fechaVencimiento - hoy)
            /
            (1000 * 60 * 60 * 24)
        );


    if (dias < 0) {

        return {
            texto: "Vencido",
            clase: "vencido"
        };

    }


    if (dias <= 180) {

        return {
            texto: "Próximo",
            clase: "proximo"
        };

    }


    return {
        texto: "Vigente",
        clase: "vigente"
    };

}


/* =========================================================
   INICIO
========================================================= */

function mostrarInicio() {

    let vigentes = 0;
    let proximos = 0;
    let vencidos = 0;


    calificaciones.forEach(c => {

        let estado =
            obtenerEstadoDocumento(c.vencimiento);

        if (estado.texto === "Vigente") {
            vigentes++;
        }

        if (estado.texto === "Próximo") {
            proximos++;
        }

        if (estado.texto === "Vencido") {
            vencidos++;
        }

    });


    document.getElementById("contenido").innerHTML = `

        <div class="topbar">

            <div>

                <h1 class="titulo-pagina">
                    Panel de calificaciones
                </h1>

                <div class="subtitulo-pagina">
                    Gestión de equipos y documentación de calificación
                </div>

            </div>

        </div>


        <div class="resumen">

            <div class="resumen-card">

                <div class="resumen-icono icono-azul">
                    ⚙
                </div>

                <div>

                    <div class="resumen-titulo">
                        Equipos registrados
                    </div>

                    <div class="resumen-numero">
                        ${equipos.length}
                    </div>

                </div>

            </div>


            <div class="resumen-card">

                <div class="resumen-icono icono-verde">
                    ✓
                </div>

                <div>

                    <div class="resumen-titulo">
                        Documentos vigentes
                    </div>

                    <div class="resumen-numero">
                        ${vigentes}
                    </div>

                </div>

            </div>


            <div class="resumen-card">

                <div class="resumen-icono icono-amarillo">
                    ◷
                </div>

                <div>

                    <div class="resumen-titulo">
                        Próximos a vencer
                    </div>

                    <div class="resumen-numero">
                        ${proximos}
                    </div>

                </div>

            </div>


            <div class="resumen-card">

                <div class="resumen-icono icono-rojo">
                    !
                </div>

                <div>

                    <div class="resumen-titulo">
                        Vencidos
                    </div>

                    <div class="resumen-numero">
                        ${vencidos}
                    </div>

                </div>

            </div>

        </div>


        <div class="tarjeta">

            <h2 style="margin-top:0;">
                Gestión de Equipos Calificados
            </h2>

            <p style="color:#66788a;">
                Sistema para el control de equipos,
                protocolos y reportes correspondientes a
                calificación de Diseño, Instalación,
                Operación y Desempeño.
            </p>

        </div>

    `;

}


/* =========================================================
   EQUIPOS
========================================================= */

function mostrarEquipos() {

    document.getElementById("contenido").innerHTML = `

        <div class="topbar">

            <div>

                <h1 class="titulo-pagina">
                    Equipos
                </h1>

                <div class="subtitulo-pagina">
                    Registro maestro de equipos
                </div>

            </div>

            <button
                class="btn-rojo-principal"
                onclick="nuevoEquipo()"
            >
                + Nuevo equipo
            </button>

        </div>


        <div class="tarjeta">

            <div class="botones-superiores">

                <button
                    class="btn-verde"
                    onclick="document.getElementById('archivoExcel').click()"
                >
                    Importar Excel
                </button>


                <button
                    class="btn-gris"
                    onclick="descargarPlantilla()"
                >
                    Descargar plantilla
                </button>

            </div>


            <input
                type="file"
                id="archivoExcel"
                accept=".xlsx,.xls"
                style="display:none"
                onchange="importarExcel(event)"
            >

        </div>


        <div id="formularioEquipo"></div>


        <div class="tarjeta">

            <h2 style="margin-top:0;">
                Equipos registrados
            </h2>


            <input
                type="text"
                id="busquedaEquipo"
                placeholder="Buscar por código, nombre, área, ubicación..."
                oninput="buscarEquipos()"
            >


            <div
                id="tablaEquipos"
                style="margin-top:15px;">
            </div>

        </div>

    `;


    mostrarTablaEquipos();

}


/* =========================================================
   NUEVO EQUIPO
========================================================= */

function nuevoEquipo() {

    equipoEditando = null;


    document.getElementById(
        "formularioEquipo"
    ).innerHTML = `

        <div class="tarjeta form-equipo-card">

            <h2 style="margin-top:0;">
                Nuevo equipo
            </h2>


            <div class="form-grid">

                <div>

                    <label>Código *</label>

                    <input
                        id="codigoEquipo"
                        placeholder="Ejemplo: E780/EF"
                    >

                </div>


                <div>

                    <label>Nombre del equipo *</label>

                    <input
                        id="nombreEquipo"
                    >

                </div>


                <div>

                    <label>Área</label>

                    <input id="areaEquipo">

                </div>


                <div>

                    <label>Ubicación</label>

                    <input id="ubicacionEquipo">

                </div>


                <div>

                    <label>Fabricante</label>

                    <input id="fabricanteEquipo">

                </div>


                <div>

                    <label>Modelo</label>

                    <input id="modeloEquipo">

                </div>


                <div>

                    <label>N.º de serie</label>

                    <input id="serieEquipo">

                </div>


                <div>

                    <label>Estado</label>

                    <select id="estadoEquipo">

                        <option>Activo</option>
                        <option>En mantenimiento</option>
                        <option>Fuera de servicio</option>

                    </select>

                </div>

            </div>


            <div class="acciones-form">

                <button
                    class="btn-principal"
                    onclick="guardarEquipo()"
                >
                    Guardar equipo
                </button>


                <button
                    class="btn-secundario"
                    onclick="cancelarFormularioEquipo()"
                >
                    Cancelar
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   GUARDAR EQUIPO
========================================================= */

function guardarEquipo() {

    let equipo = {

        codigo:
            document.getElementById("codigoEquipo").value.trim(),

        nombre:
            document.getElementById("nombreEquipo").value.trim(),

        area:
            document.getElementById("areaEquipo").value.trim(),

        ubicacion:
            document.getElementById("ubicacionEquipo").value.trim(),

        fabricante:
            document.getElementById("fabricanteEquipo").value.trim(),

        modelo:
            document.getElementById("modeloEquipo").value.trim(),

        serie:
            document.getElementById("serieEquipo").value.trim(),

        estado:
            document.getElementById("estadoEquipo").value

    };


    if (!equipo.codigo || !equipo.nombre) {

        alert("Debes ingresar código y nombre del equipo.");

        return;

    }


    if (equipoEditando === null) {

        equipos.push(equipo);

    } else {

        equipos[equipoEditando] = equipo;

    }


    guardarDatos();

    mostrarEquipos();

}


/* =========================================================
   EDITAR EQUIPO
========================================================= */

function editarEquipo(indice) {

    let equipo = equipos[indice];

    nuevoEquipo();

    equipoEditando = indice;


    document.getElementById("codigoEquipo").value =
        equipo.codigo || "";

    document.getElementById("nombreEquipo").value =
        equipo.nombre || "";

    document.getElementById("areaEquipo").value =
        equipo.area || "";

    document.getElementById("ubicacionEquipo").value =
        equipo.ubicacion || "";

    document.getElementById("fabricanteEquipo").value =
        equipo.fabricante || "";

    document.getElementById("modeloEquipo").value =
        equipo.modelo || "";

    document.getElementById("serieEquipo").value =
        equipo.serie || "";

    document.getElementById("estadoEquipo").value =
        equipo.estado || "Activo";

}


/* =========================================================
   CANCELAR EQUIPO
========================================================= */

function cancelarFormularioEquipo() {

    document.getElementById(
        "formularioEquipo"
    ).innerHTML = "";

    equipoEditando = null;

}


/* =========================================================
   ELIMINAR EQUIPO
========================================================= */

function eliminarEquipo(indice) {

    let equipo = equipos[indice];


    if (!confirm(
        "¿Eliminar el equipo " +
        equipo.codigo +
        "?"
    )) {
        return;
    }


    equipos.splice(indice, 1);

    guardarDatos();

    mostrarTablaEquipos();

}


/* =========================================================
   BUSCAR EQUIPOS
========================================================= */

function buscarEquipos() {

    mostrarTablaEquipos(
        document.getElementById(
            "busquedaEquipo"
        ).value
    );

}


/* =========================================================
   TABLA EQUIPOS
========================================================= */

function mostrarTablaEquipos(filtro = "") {

    let texto =
        filtro.toLowerCase();


    let lista =
        equipos.filter(e => {

            return (

                (e.codigo || "").toLowerCase().includes(texto)

                ||

                (e.nombre || "").toLowerCase().includes(texto)

                ||

                (e.area || "").toLowerCase().includes(texto)

                ||

                (e.ubicacion || "").toLowerCase().includes(texto)

            );

        });


    let html = `

        <div class="tabla-contenedor">

        <table>

            <thead>

                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Área</th>
                    <th>Ubicación</th>
                    <th>Fabricante</th>
                    <th>Modelo</th>
                    <th>Serie</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

    `;


    lista.forEach(equipo => {

        let indice =
            equipos.indexOf(equipo);


        html += `

            <tr>

                <td class="codigo-equipo">
                    ${escapeHTML(equipo.codigo)}
                </td>

                <td>
                    ${escapeHTML(equipo.nombre)}
                </td>

                <td>
                    ${escapeHTML(equipo.area)}
                </td>

                <td>

/* =========================================================
   GENERAR CÓDIGO
========================================================= */

function generarCodigoCalificacion() {

    let equipoIndice =
        document.getElementById("calEquipo").value;

    let tipo =
        document.getElementById("calTipo").value;

    let documento =
        document.getElementById("calDocumento").value;

    let version =
        document.getElementById("calVersion").value.trim();

    let campoCodigo =
        document.getElementById("calCodigo");


    if (
        equipoIndice === "" ||
        !tipo ||
        !documento ||
        !version
    ) {

        campoCodigo.value = "";

        return;

    }


    let equipo =
        equipos[equipoIndice];


    let prefijo = "";


    if (tipo === "Di") {

        if (documento === "Protocolo") {
            prefijo = "PCDi";
        }

        if (documento === "Reporte") {
            prefijo = "RCDi";
        }

    }


    if (tipo === "IQ") {

        if (documento === "Protocolo") {
            prefijo = "PCI";
        }

        if (documento === "Reporte") {
            prefijo = "RCI";
        }

    }


    if (tipo === "OQ") {

        if (documento === "Protocolo") {
            prefijo = "PCO";
        }

        if (documento === "Reporte") {
            prefijo = "RCO";
        }

    }


    if (tipo === "PQ") {

        if (documento === "Protocolo") {
            prefijo = "PCD";
        }

        if (documento === "Reporte") {
            prefijo = "RCD";
        }

    }


    campoCodigo.value =
        prefijo +
        "-" +
        equipo.codigo +
        "-" +
        version;

}


/* =========================================================
   VENCIMIENTO +5 AÑOS
========================================================= */

function calcularVencimiento() {

    let fecha =
        document.getElementById("calFecha");


    let vencimiento =
        document.getElementById("calVencimiento");


    if (!fecha || !vencimiento) {
        return;
    }


    if (!fecha.value) {

        vencimiento.value = "";

        return;

    }


    let partes =
        fecha.value.split("-");


    let año =
        Number(partes[0]);

    let mes =
        partes[1];

    let dia =
        partes[2];


    vencimiento.value =
        (año + 5) +
        "-" +
        mes +
        "-" +
        dia;

}


/* =========================================================
   GUARDAR CALIFICACIÓN
========================================================= */

function guardarCalificacion() {

    let equipoIndice =
        document.getElementById("calEquipo").value;

    let tipo =
        document.getElementById("calTipo").value;

    let documento =
        document.getElementById("calDocumento").value;

    let version =
        document.getElementById("calVersion").value.trim();

    let fecha =
        document.getElementById("calFecha").value;


    if (
        equipoIndice === "" ||
        !tipo ||
        !documento ||
        !version ||
        !fecha
    ) {

        alert(
            "Completa todos los campos obligatorios."
        );

        return;

    }


    calcularVencimiento();

    generarCodigoCalificacion();


    let vencimiento =
        document.getElementById("calVencimiento").value;

    let codigo =
        document.getElementById("calCodigo").value;

    let equipo =
        equipos[equipoIndice];


    let registro = {

        equipoCodigo:
            equipo.codigo,

        equipoNombre:
            equipo.nombre,

        tipo:
            tipo,

        documento:
            documento,

        version:
            version,

        codigo:
            codigo,

        fecha:
            fecha,

        vencimiento:
            vencimiento

    };


    if (calificacionEditando === null) {

        calificaciones.push(registro);

    } else {

        calificaciones[
            calificacionEditando
        ] = registro;

    }


    guardarDatos();


    calificacionEditando = null;


    mostrarCalificaciones();

}


/* =========================================================
   EDITAR CALIFICACIÓN
========================================================= */

function editarCalificacion(indice) {

    let registro =
        calificaciones[indice];


    nuevaCalificacion();


    calificacionEditando =
        indice;


    let indiceEquipo =
        equipos.findIndex(
            e =>
                e.codigo ===
                registro.equipoCodigo
        );


    document.getElementById(
        "calEquipo"
    ).value = indiceEquipo;


    document.getElementById(
        "calTipo"
    ).value = registro.tipo;


    document.getElementById(
        "calDocumento"
    ).value = registro.documento;


    document.getElementById(
        "calVersion"
    ).value = registro.version;


    document.getElementById(
        "calFecha"
    ).value = registro.fecha;


    calcularVencimiento();

    generarCodigoCalificacion();

}

function eliminarCalificacion(indice) {

    let registro =
        calificaciones[indice];


    if (!confirm(

        registro.codigo +

    calificaciones.splice(

    guardarDatos();

    mostrarCalificaciones();

/* =========================================================
   EXCEL
========================================================= */

function importarExcel(event) {

    let archivo =
        event.target.files[0];


    if (!archivo) {
        return;
    }


    let lector =
        new FileReader();


    lector.onload =
        function(e) {

            try {

                let datos =
                    new Uint8Array(
                        e.target.result
                    );


                let libro =
                    XLSX.read(
                        datos,
                        {
                            type: "array"
                        }
                    );


                let hoja =
                    libro.Sheets[
                        libro.SheetNames[0]
                    ];


                let filas =
                    XLSX.utils.sheet_to_json(
                        hoja
                    );


                filas.forEach(fila => {

                    let codigo =
                        obtenerColumna(
                            fila,
                            [
                                "Código",
                                "Codigo",
                                "codigo"
                            ]
                        );


                    let nombre =
                        obtenerColumna(
                            fila,
                            [
                                "Nombre del equipo",
                                "Nombre",
                                "nombre"
                            ]
                        );


                    if (!codigo || !nombre) {
                        return;
                    }


                    let existe =
                        equipos.some(
                            e =>
                                e.codigo === codigo
                        );


                    if (existe) {
                        return;
                    }


                    equipos.push({

                        codigo: codigo,

                        nombre: nombre,

                        area:
                            obtenerColumna(
                                fila,
                                ["Área","Area","area"]
                            ),

                        ubicacion:
                            obtenerColumna(
                                fila,
                                ["Ubicación","Ubicacion","ubicacion"]
                            ),

                        fabricante:
                            obtenerColumna(
                                fila,
                                ["Fabricante","fabricante"]
                            ),

                        modelo:
                            obtenerColumna(
                                fila,
                                ["Modelo","modelo"]
                            ),

                        serie:
                            obtenerColumna(
                                fila,
                                [
                                    "N.º de serie",
                                    "N° de serie",
                                    "Nº de serie",
                                    "Numero de serie",
                                    "Serie"
                                ]
                            ),

                        estado:
                            obtenerColumna(
                                fila,
                                ["Estado","estado"]
                            )
                            ||
                            "Activo"

                    });

                });


                guardarDatos();

                mostrarEquipos();


            } catch (error) {

                alert(
                    "No se pudo leer el Excel."
                );

            }

        };


    lector.readAsArrayBuffer(
        archivo
    );

}


/* =========================================================
   COLUMNA EXCEL
========================================================= */

function obtenerColumna(
    fila,
    nombres
) {

    for (let nombre of nombres) {

        if (
            fila[nombre] !== undefined &&
            fila[nombre] !== null
        ) {

            return String(
                fila[nombre]
            ).trim();

        }

    }


    return "";

}

/* =========================================================
   FECHAS
========================================================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "—";
    }


    let partes =
        fecha.split("-");


    if (partes.length !== 3) {
        return fecha;
    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    return String(valor)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

window.onload =
    function() {

        mostrarInicio();

    };

</script>
