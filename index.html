/* =========================================================
   PROGRAMA ANUAL
========================================================= */

function obtenerPrograma(
    anio
) {

    return programasCalificacion.find(
        programa =>
            Number(programa.anio) ===
            Number(anio)
    ) || null;
}

function documentosEsperadosPrograma(
    equipo
) {

    const documentos = [
        {
            tipo:"IQ",
            documento:"Protocolo",
            prefijo:"PCI"
        },
        {
            tipo:"IQ",
            documento:"Reporte",
            prefijo:"RCI"
        },
        {
            tipo:"OQ",
            documento:"Protocolo",
            prefijo:"PCO"
        },
        {
            tipo:"OQ",
            documento:"Reporte",
            prefijo:"RCO"
        }
    ];

    if (
        equipo.aplicaPQ !== false
    ) {

        documentos.push(
            {
                tipo:"PQ",
                documento:"Protocolo",
                prefijo:"PCD"
            },
            {
                tipo:"PQ",
                documento:"Reporte",
                prefijo:"RCD"
            }
        );
    }

    return documentos;
}

/* =========================================================
   GENERAR PROGRAMA DEL PRÓXIMO AÑO
========================================================= */

function generarProgramaProximoAnio(
    descargarExcel = false
) {

    if (!esAdmin) {
        return;
    }

    const anioPrograma =
        anioActual() + 1;

    const candidatos = [];

    equipos
        .filter(
            equipo =>
                equipo.estado !==
                "De baja"
        )
        .forEach(
            equipo => {

                const referencia =
                    documentoReferenciaPrograma(
                        equipo
                    );

                if (!referencia) {
                    return;
                }

                const vencimiento =
                    referencia.vencimiento;

                if (
                    obtenerAnioFecha(
                        vencimiento
                    ) !==
                    anioPrograma
                ) {
                    return;
                }

                candidatos.push({

                    equipoCodigo:
                        equipo.codigo,

                    equipoNombre:
                        equipo.nombre,

                    area:
                        equipo.area,

                    aplicaPQ:
                        equipo.aplicaPQ !== false,

                    referenciaCodigo:
                        referencia.codigo,

                    referenciaTipo:
                        equipo.aplicaPQ !== false
                            ? "RCD"
                            : "RCO",

                    vencimientoReferencia:
                        vencimiento,

                    mes:
                        obtenerMes(
                            vencimiento
                        ),

                    mesNumero:
                        obtenerNumeroMes(
                            vencimiento
                        ),

                    documentos:
                        documentosEsperadosPrograma(
                            equipo
                        ).map(
                            doc => ({
                                ...doc,
                                estado:"Pendiente",
                                codigoCumplimiento:"",
                                fechaCumplimiento:"",
                                responsable:""
                            })
                        ),

                    estadoGeneral:
                        "Pendiente"
                });
            }
        );

    if (!candidatos.length) {

        alert(
            `No existen equipos activos cuyo RCD/RCO venza durante ${anioPrograma}.`
        );

        return;
    }

    const existente =
        obtenerPrograma(
            anioPrograma
        );

    if (existente) {

        if (
            !confirm(
                `Ya existe un Programa de Calificaciones ${anioPrograma}.\n\n` +
                `¿Deseas actualizarlo con la información actual?\n\n` +
                `Los cumplimientos ya registrados serán conservados cuando sea posible.`
            )
        ) {

            if (descargarExcel) {
                descargarProgramaExcel(
                    existente
                );
            }

            return;
        }

        /*
            Conservamos seguimiento ya alcanzado.
        */
        candidatos.forEach(
            nuevoEquipo => {

                const anterior =
                    existente.equipos.find(
                        item =>
                            item.equipoCodigo ===
                            nuevoEquipo.equipoCodigo
                    );

                if (!anterior) {
                    return;
                }

                nuevoEquipo.documentos.forEach(
                    docNuevo => {

                        const docAnterior =
                            anterior.documentos.find(
                                doc =>
                                    doc.tipo ===
                                        docNuevo.tipo &&
                                    doc.documento ===
                                        docNuevo.documento
                            );

                        if (
                            docAnterior &&
                            docAnterior.estado ===
                            "Cumplido"
                        ) {

                            Object.assign(
                                docNuevo,
                                docAnterior
                            );
                        }
                    }
                );
            }
        );

        existente.fechaGeneracion =
            fechaHoy();

        existente.equipos =
            candidatos;

    } else {

        programasCalificacion.push({

            anio:
                anioPrograma,

            fechaGeneracion:
                fechaHoy(),

            equipos:
                candidatos
        });
    }

    actualizarCumplimientoProgramas();

    guardarTodo();

    const programa =
        obtenerPrograma(
            anioPrograma
        );

    if (descargarExcel) {

        descargarProgramaExcel(
            programa
        );
    }

    alert(
        `Programa de Calificaciones ${anioPrograma} generado correctamente.\n\n` +
        `Equipos programados: ${programa.equipos.length}`
    );

    mostrarProgramaCalificacion(
        anioPrograma
    );
}

/* =========================================================
   CUMPLIMIENTO AUTOMÁTICO
========================================================= */

function actualizarCumplimientoProgramas() {

    programasCalificacion.forEach(
        programa => {

            programa.equipos.forEach(
                item => {

                    const equipoActual =
                        equipos.find(
                            equipo =>
                                equipo.codigo ===
                                item.equipoCodigo
                        );

                    /*
                        Si posteriormente el equipo se da de baja,
                        el programa histórico permanece, pero
                        indicamos su estado.
                    */
                    item.equipoDeBaja =
                        !equipoActual ||
                        equipoActual.estado ===
                        "De baja";

                    item.documentos.forEach(
                        esperado => {

                            /*
                                Solo documentos cuya emisión corresponde
                                al año programado pueden cumplir ese programa.
                            */
                            const candidatos =
                                calificaciones
                                .filter(
                                    registro =>
                                        registro.equipoCodigo ===
                                            item.equipoCodigo &&
                                        registro.tipo ===
                                            esperado.tipo &&
                                        registro.documento ===
                                            esperado.documento &&
                                        obtenerAnioFecha(
                                            fechaDocumento(
                                                registro
                                            )
                                        ) ===
                                            Number(programa.anio)
                                )
                                .sort(
                                    (a,b) =>
                                        fechaDocumento(b)
                                        .localeCompare(
                                            fechaDocumento(a)
                                        )
                                );

                            const encontrado =
                                candidatos[0];

                            if (encontrado) {

                                esperado.estado =
                                    "Cumplido";

                                esperado.codigoCumplimiento =
                                    encontrado.codigo;

                                esperado.fechaCumplimiento =
                                    fechaDocumento(
                                        encontrado
                                    );

                                esperado.responsable =
                                    encontrado.responsable || "";

                            } else {

                                esperado.estado =
                                    "Pendiente";

                                esperado.codigoCumplimiento =
                                    "";

                                esperado.fechaCumplimiento =
                                    "";

                                esperado.responsable =
                                    "";
                            }
                        }
                    );

                    const total =
                        item.documentos.length;

                    const cumplidos =
                        item.documentos.filter(
                            doc =>
                                doc.estado ===
                                "Cumplido"
                        ).length;

                    item.estadoGeneral =
                        total > 0 &&
                        total === cumplidos
                            ? "Cumplido"
                            : "Pendiente";
                }
            );
        }
    );

    guardarTodo();
}

/* =========================================================
   EXCEL PROGRAMA
========================================================= */

function descargarProgramaExcel(
    programa
) {

    if (!programa) {
        return;
    }

    const filas = [];

    programa.equipos.forEach(
        item => {

            item.documentos.forEach(
                doc => {

                    filas.push({

                        "Año Programa":
                            programa.anio,

                        "Mes límite":
                            item.mes,

                        "Código equipo":
                            item.equipoCodigo,

                        "Equipo":
                            item.equipoNombre,

                        "Área":
                            item.area,

                        "Aplica PQ":
                            item.aplicaPQ
                                ? "Sí"
                                : "No",

                        "Documento referencia":
                            item.referenciaTipo,

                        "Código referencia":
                            item.referenciaCodigo,

                        "Documento programado":
                            `${doc.tipo} ${doc.documento}`,

                        "Prefijo":
                            doc.prefijo,

                        "Estado":
                            doc.estado,

                        "Código cumplimiento":
                            doc.codigoCumplimiento,

                        "Fecha cumplimiento":
                            doc.fechaCumplimiento,

                        "Elaboró / Ejecutó":
                            doc.responsable
                    });
                }
            );
        }
    );

    const hoja =
        XLSX.utils.json_to_sheet(
            filas
        );

    hoja["!cols"] = [
        {wch:12},
        {wch:15},
        {wch:16},
        {wch:32},
        {wch:22},
        {wch:12},
        {wch:20},
        {wch:25},
        {wch:24},
        {wch:10},
        {wch:14},
        {wch:28},
        {wch:18},
        {wch:28}
    ];

    const libro =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        libro,
        hoja,
        `Programa ${programa.anio}`
    );

    XLSX.writeFile(
        libro,
        `Programa_Calificaciones_${programa.anio}.xlsx`
    );
}

function calcularResumenPrograma(
    programa
) {

    const documentos =
        programa.equipos.flatMap(
            item =>
                item.documentos
        );

    const total =
        documentos.length;

    const cumplidos =
        documentos.filter(
            doc =>
                doc.estado ===
                "Cumplido"
        ).length;

    return {

        total,

        cumplidos,

        pendientes:
            total - cumplidos,

        porcentaje:
            total
                ? Math.round(
                    cumplidos /
                    total *
                    100
                )
                : 0
    };
}

function tablaProgramaMeses(

    const datos =

                const equiposMes =
                    programa.equipos.filter(
                        item =>
                            item.mesNumero ===
                            indice + 1
                    );

                const documentos =
                    equiposMes.flatMap(
                        item =>
                            item.documentos
                    );

                return {

                    mes,

                    equipos:
                        equiposMes.length,

                    documentos:
                        documentos.length,

                    cumplidos:
                        documentos.filter(
                            doc =>
                                doc.estado ===
                                "Cumplido"

        .filter(
            item =>
                item.equipos > 0

function tablaProgramaDocumentos(

function leerExcelCalificacion(
    evento
) {

    const archivo =
        evento.target.files[0];

    if (!archivo) {
        return;
    }

    const lector =
        new FileReader();

    lector.onload =
        eventoLectura => {

            try {

                const libro =
                    XLSX.read(
                        new Uint8Array(
                            eventoLectura.target.result
                        ),
                        {
                            type:"array",
                            cellDates:true
                        }
                    );

                const hoja =
                    libro.Sheets[
                        libro.SheetNames[0]
                    ];

                const filas =
                    XLSX.utils.sheet_to_json(
                        hoja,
                        {
                            defval:"",
                            raw:true
                        }
                    );

                procesarExcelCalificacion(
                    filas,
                    archivo.name
                );

            } catch(error) {

                console.error(error);

                alert(
                    "No fue posible leer el archivo."
                );
            }
        };

    lector.readAsArrayBuffer(
        archivo
    );

    evento.target.value = "";
}

function procesarExcelCalificacion(
    filas,
    archivo
) {

    const resultados = [];

    filas.forEach(
        (fila,indice) => {

            const codigo =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Código equipo",
                            "Codigo equipo",
                            "Código",
                            "Codigo"
                        ]
                    )
                ).trim();

            const nombre =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Nombre",
                            "Nombre equipo"
                        ]
                    )
                ).trim();

            const area =
                String(
                    columnaExcel(
                        fila,
                        [
                            "Área",
                            "Area"
                        ]
                    )
                ).trim();

            if (
                !codigo ||
                !nombre ||
                !area
            ) {

                resultados.push({

                    fila:
                        indice + 2,

                    estado:
                        "error",

                    codigo,
                    nombre,

                    mensaje:
                        "Falta Código, Nombre o Área.",

                    data:
                        null
                });

                return;
            }

            const textoPQ =
                String(
                    columnaExcel(
                        fila,
                        ["Aplica PQ"]
                    )
                )
                .trim()
                .toLowerCase();

            const aplicaPQ =
                ![
                    "no",
                    "n",
                    "false",
                    "0"
                ].includes(
                    textoPQ
                );

            const equipo = {

                codigo,
                nombre,
                area,

                marca:
                    String(
                        columnaExcel(
                            fila,
                            ["Marca"]
                        )
                    ).trim(),

                modelo:
                    String(
                        columnaExcel(
                            fila,
                            ["Modelo"]
                        )
                    ).trim(),

                serie:
                    String(
                        columnaExcel(
                            fila,
                            [
                                "Serie",
                                "N° Serie",
                                "N° de Serie"
                            ]
                        )
                    ).trim(),

                ubicacion:
                    String(
                        columnaExcel(
                            fila,
                            [
                                "Ubicación",
                                "Ubicacion"
                            ]
                        )
                    ).trim(),

                aplicaPQ,

                estado:
                    "Operativo",

                fechaBaja:
                    "",

                motivoBaja:
                    "",

                historialEstado:
                    []
            };

            const documentos = [];

            agregarDocumentoExcel(
                documentos,
                fila,
                equipo,
                "IQ",
                "Protocolo",
                "Protocolo IQ",
                "Emisión Protocolo IQ",
                [
                    "Elaboró Protocolo IQ",
                    "Elaboro Protocolo IQ"
                ]
            );

            agregarDocumentoExcel(
                documentos,
                fila,
                equipo,
                "IQ",
                "Reporte",
                "Reporte IQ",
                "Emisión Reporte IQ",
                [
                    "Ejecutó Reporte IQ",
                    "Ejecuto Reporte IQ",
                    "Elaboró Reporte IQ"
                ]
            );

            agregarDocumentoExcel(
                documentos,
                fila,
                equipo,
                "OQ",
                "Protocolo",
                "Protocolo OQ",
                "Emisión Protocolo OQ",
                [
                    "Elaboró Protocolo OQ",
                    "Elaboro Protocolo OQ"
                ]
            );

            agregarDocumentoExcel(
                documentos,
                fila,
                equipo,
                "OQ",
                "Reporte",
                "Reporte OQ",
                "Emisión Reporte OQ",
                [
                    "Ejecutó Reporte OQ",
                    "Ejecuto Reporte OQ",
                    "Elaboró Reporte OQ"
                ]
            );

            if (aplicaPQ) {

                agregarDocumentoExcel(
                    documentos,
                    fila,
                    equipo,
                    "PQ",
                    "Protocolo",
                    "Protocolo PQ",
                    "Emisión Protocolo PQ",
                    [
                        "Elaboró Protocolo PQ",
                        "Elaboro Protocolo PQ"
                    ]
                );

                agregarDocumentoExcel(
                    documentos,
                    fila,
                    equipo,
                    "PQ",
                    "Reporte",
                    "Reporte PQ",
                    "Emisión Reporte PQ",
                    [
                        "Ejecutó Reporte PQ",
                        "Ejecuto Reporte PQ",
                        "Elaboró Reporte PQ"
                    ]
                );
            }

            const existe =
                equipos.some(
                    item =>
                        String(item.codigo).toLowerCase() ===
                        codigo.toLowerCase()
                );

            resultados.push({

                fila:
                    indice + 2,

                estado:
                    existe
                        ? "duplicado"
                        : "valido",

                codigo,
                nombre,

                mensaje:
                    existe
                        ? "Equipo existente"
                        : "Equipo nuevo",

                data:{
                    equipo,
                    documentos
                }
            });
        }
    );

    excelTemporal = {
        archivo,
        resultados
    };

    renderPreviewExcelCalificacion();
}

function agregarDocumentoExcel(
    destino,
    fila,
    equipo,
    tipo,
    documento,
    columnaCodigo,
    columnaFecha,
    columnasResponsable
) {

    const codigo =
        String(
            columnaExcel(
                fila,
                [columnaCodigo]
            )
        ).trim();

    const fecha =
        normalizarFechaExcel(
            columnaExcel(
                fila,
                [columnaFecha]
            )
        );

    if (
        !codigo &&
        !fecha
    ) {
        return;
    }

    if (
        !codigo ||
        !fecha
    ) {
        return;
    }

    destino.push({

        equipoCodigo:
            equipo.codigo,

        equipoNombre:
            equipo.nombre,

        tipo,

        documento,

        codigo,

        version:
            extraerVersionDocumento(
                codigo
            ),

        fecha,

        vencimiento:
            sumarAnios(
                fecha,
                5
            ),

        responsable:
            String(
                columnaExcel(
                    fila,
                    columnasResponsable
                )
            ).trim()
    });
}

function extraerVersionDocumento(
    codigo
) {

    const partes =
        String(codigo || "")
        .split("-");

    return partes.length > 1
        ? partes[
            partes.length - 1
        ]
        : "";
}

function confirmarImportacionCalificacion() {

    if (!excelTemporal) {
        return;
    }

    const modo =
        obtenerSelect(
            "modoImportacionCal"
        );

    let nuevos = 0;
    let actualizados = 0;
    let omitidos = 0;

    excelTemporal.resultados.forEach(
        resultado => {

            if (
                resultado.estado ===
                "error"
            ) {

                omitidos++;
                return;
            }

            const data =
                resultado.data;

            const indice =
                equipos.findIndex(
                    equipo =>
                        String(equipo.codigo).toLowerCase() ===
                        String(data.equipo.codigo).toLowerCase()
                );

            if (
                indice === -1
            ) {

                equipos.push(
                    data.equipo
                );

                data.documentos.forEach(
                    documento =>
                        agregarDocumentoSiNoExiste(
                            documento
                        )
                );

                nuevos++;

                return;
            }

            if (
                modo === "omitir"
            ) {

                omitidos++;
                return;
            }

            const anterior =
                equipos[indice];

            equipos[indice] = {

                ...anterior,

                nombre:
                    data.equipo.nombre,

                area:
                    data.equipo.area,

                marca:
                    data.equipo.marca,

                modelo:
                    data.equipo.modelo,

                serie:
                    data.equipo.serie,

                ubicacion:
                    data.equipo.ubicacion,

                aplicaPQ:
                    data.equipo.aplicaPQ
            };

            data.documentos.forEach(
                documento =>
                    agregarDocumentoSiNoExiste(
                        documento
                    )
            );

            actualizados++;
        }
    );

    guardarTodo();

    actualizarCumplimientoProgramas();

    alert(
        `Importación finalizada.\n\n` +
        `Nuevos: ${nuevos}\n` +
        `Actualizados: ${actualizados}\n` +
        `Omitidos: ${omitidos}`
    );

    excelTemporal =
        null;

    mostrarInicioCalificacion();
}

function agregarDocumentoSiNoExiste(
    documento
) {

    const existe =
        calificaciones.some(
            registro =>
                registro.equipoCodigo ===
                    documento.equipoCodigo &&
                registro.tipo ===
                    documento.tipo &&
                registro.documento ===
                    documento.documento &&
                registro.codigo ===
                    documento.codigo &&
                fechaDocumento(registro) ===
                    documento.fecha
        );

    if (!existe) {

        calificaciones.push(
            documento
        );
    }
}

/* =========================================================

========================================================= */

function contarKPIEtapa(
    tipo
) {

    const lista =
        equipos.filter(
            equipo => {

                if (
                    equipo.estado ===
                    "De baja"
                ) {
                    return false;
                }

                if (
                    tipo === "PQ" &&
                    equipo.aplicaPQ === false
                ) {
                    return false;
                }

                return true;
            }
        );

    let vigente = 0;
    let vencido = 0;

    lista.forEach(
        equipo => {

            const estado =
                estadoEtapa(
                    equipo,
                    tipo
                );

            if (
                estado.clase === "vigente" ||
                estado.clase === "proximo"
            ) {

                vigente++;

            } else {

                vencido++;
            }
        }
    );

    return {
        total:lista.length,
        vigente,
        vencido
    };
}

            )}

function tarjetaKPIEtapa(
    tipo,
    datos
) {

    const porcentaje =
        datos.total
            ? Math.round(
                datos.vigente /
                datos.total *
                100
            )
            : 0;

    return `
        <div class="etapa-resumen">

            <div class="etapa-resumen-cabecera">

                <div class="etapa-resumen-titulo">
                    ${tipo}
                </div>

                <strong>
                    ${porcentaje}%
                </strong>

            </div>

            <div class="etapa-estados">

                <div class="etapa-mini">

                    <div class="subdato">
                        Total
                    </div>

                    <div class="etapa-mini-numero">
                        ${datos.total}
                    </div>

                </div>

                <div class="etapa-mini">

                    <div class="subdato">
                        Vigente
                    </div>

                    <div class="etapa-mini-numero">
                        ${datos.vigente}
                    </div>

                </div>

                <div class="etapa-mini">

                    <div class="subdato">
                        Vencido / incompleto
                    </div>

                    <div class="etapa-mini-numero">
                        ${datos.vencido}
                    </div>

                </div>

            </div>

        </div>
    `;
}
