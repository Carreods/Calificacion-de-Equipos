<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión SAC-M</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="PPPP.png">

    <!-- LIBRERÍAS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --rojo-prater: #e30613;
            --rojo-oscuro: #b8000b;
            --rojo-claro: #fde8ea;

            --fondo: #eef1f3;
            --blanco: #ffffff;

            --texto: #182230;
            --texto-secundario: #687786;

            --borde: #dfe4e8;

            --verde: #17854b;
            --verde-fondo: #def7e8;

            --amarillo: #b97800;
            --amarillo-fondo: #fff0cc;

            --rojo: #d91f2b;
            --rojo-fondo: #fde0e2;

            --azul: #196cb8;
            --azul-fondo: #e7f1ff;

            --gris: #66788a;
            --gris-fondo: #edf1f4;

            --morado: #7456b8;
            --morado-fondo: #efe9ff;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--fondo);
            color: var(--texto);
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: 700;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 40px;
            padding: 10px 11px;

            background: #ffffff;

            border: 1px solid #d3d9df;
            border-radius: 8px;

            font-size: 13px;
            outline: none;
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9aa7b3;
        }

        input[readonly] {
            background: #edf1f4;
            color: #536271;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;

            width: 250px;
            height: 100vh;

            display: flex;
            flex-direction: column;

            padding: 18px 12px;

            background: #ffffff;
            border-right: 1px solid var(--borde);

            overflow-y: auto;

            z-index: 100;
        }

        .logo-box {
            padding: 4px 8px 14px;
            border-bottom: 1px solid #e6e9ed;
        }

        .logo-imagen {
            display: block;
            width: 150px;
            height: auto;
            margin-bottom: 10px;
        }

        .logo-subtitulo {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.35;
        }

        .logo-descripcion {
            margin-top: 4px;
            color: var(--texto-secundario);
            font-size: 10px;
            letter-spacing: .5px;
        }

        .menu {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
        }

        .menu li {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 4px;
            padding: 10px 11px;

            border-radius: 9px;

            color: #526273;
            font-size: 13px;
            line-height: 1.25;

            cursor: pointer;
        }

        .menu li:hover {
            background: #f6f8f9;
        }

        .menu li.activo {
            background: var(--rojo-claro);
            color: var(--rojo-prater);
            font-weight: 700;
        }

        .menu-icono {
            width: 18px;
            text-align: center;
            flex: none;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #e6e9ed;
        }

        .sidebar-label {
            margin-bottom: 6px;
            color: #667687;
            font-size: 10px;
            text-transform: uppercase;
        }

        .usuario-box {
            padding: 10px;
            background: #f7f8fa;
            border-radius: 8px;
        }

        .usuario-nombre {
            font-size: 13px;
            font-weight: 700;
        }

        .usuario-area {
            margin-top: 3px;
            color: #74808b;
            font-size: 11px;
        }

        /* =========================================================
           CONTENIDO
        ========================================================= */

        .contenido {
            min-height: 100vh;
            margin-left: 250px;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;

            margin-bottom: 20px;
        }

        .topbar-derecha {
            position: relative;

            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .titulo-pagina {
            margin: 0;
            font-size: 27px;
        }

        .subtitulo-pagina {
            margin-top: 5px;
            color: var(--texto-secundario);
            font-size: 13px;
        }

        .tarjeta {
            margin-bottom: 18px;
            padding: 20px;

            background: #ffffff;

            border: 1px solid #e0e5e9;
            border-radius: 14px;
        }

        .tarjeta h2,
        .tarjeta h3 {
            margin-top: 0;
        }

        .subdato {
            color: #748291;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================================================
           BOTONES
        ========================================================= */

        .btn-principal,
        .btn-login {
            background: var(--rojo-prater);
            color: #ffffff;
        }

        .btn-principal:hover {
            background: #c9000d;
        }

        .btn-secundario,
        .btn-gris,
        .btn-editar,
        .btn-logout {
            background: #edf1f4;
            color: #344454;
        }

        .btn-verde {
            background: #e3f7ea;
            color: #17753b;
        }

        .btn-azul {
            background: #e7f1ff;
            color: #196cb8;
        }

        .btn-amarillo {
            background: #fff0cc;
            color: #9d6900;
        }

        .btn-eliminar {
            background: #fde8ea;
            color: #e30613;
        }

        .btn-eliminar-definitivo {
            background: #ad000a;
            color: #ffffff;
        }

        .btn-reactivar {
            background: #e3f7ea;
            color: #17753b;
        }

        .btn-baja {
            background: #fff0f1;
            color: #c8202b;
        }

        .btn-morado {
            background: var(--morado-fondo);
            color: var(--morado);
        }

        .btn-login,
        .btn-logout {
            width: 100%;
            margin-top: 9px;
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* =========================================================
           NOTIFICACIONES
        ========================================================= */

        .btn-campana {
            position: relative;

            width: 42px;
            height: 42px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0;

            background: #ffffff;
            color: #344454;

            border: 1px solid #dfe4e8;

            font-size: 18px;
        }

        .contador-notificacion {
            position: absolute;
            top: -6px;
            right: -6px;

            min-width: 19px;
            height: 19px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0 5px;

            background: var(--rojo-prater);
            color: #fff;

            border-radius: 20px;
            border: 2px solid #eef1f3;

            font-size: 9px;
            font-weight: 800;
        }

        .panel-notificaciones {
            position: absolute;
            top: 50px;
            right: 0;

            width: 390px;
            max-height: 520px;

            background: #ffffff;

            border: 1px solid #dfe4e8;
            border-radius: 13px;

            box-shadow: 0 12px 35px rgba(0,0,0,.15);

            overflow-y: auto;

            z-index: 500;
        }

        .panel-notificaciones-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 14px 16px;

            border-bottom: 1px solid #e5e9ec;
        }

        .notificacion-item {
            padding: 13px 16px;
            border-bottom: 1px solid #edf0f2;
            cursor: pointer;
        }

        .notificacion-item:hover {
            background: #f8f9fa;
        }

        .notificacion-item:last-child {
            border-bottom: 0;
        }

        .notificacion-titulo {
            font-size: 12px;
            font-weight: 700;
        }

        .notificacion-texto {
            margin-top: 4px;
            color: #71808e;
            font-size: 11px;
            line-height: 1.45;
        }

        /* =========================================================
           SUBMENÚ
        ========================================================= */

        .submenu {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            margin-bottom: 20px;
            padding: 7px;

            background: #ffffff;

            border: 1px solid #e0e5e9;
            border-radius: 12px;
        }

        .submenu button {
            background: transparent;
            color: #627181;
        }

        .submenu button:hover {
            background: #f4f6f7;
        }

        .submenu button.activo {
            background: var(--rojo-claro);
            color: var(--rojo-prater);
        }

        /* =========================================================
           RESUMEN
        ========================================================= */

        .resumen {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            gap: 14px;

            margin-bottom: 18px;
        }

        .resumen-card {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 17px;

            background: #ffffff;

            border: 1px solid #e0e5e9;
            border-radius: 13px;
        }

        .resumen-icono {
            width: 43px;
            height: 43px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 19px;
        }

        .verde-bg {
            background: #dcf8e8;
        }

        .amarillo-bg {
            background: #fff3d8;
        }

        .rojo-bg {
            background: #fde4e6;
        }

        .azul-bg {
            background: #e7f1ff;
        }

        .gris-bg {
            background: #edf1f4;
        }

        .morado-bg {
            background: #efe9ff;
        }

        .resumen-titulo {
            color: var(--texto-secundario);
            font-size: 12px;
        }

        .resumen-numero {
            margin-top: 2px;
            font-size: 24px;
            font-weight: 800;
        }

        /* =========================================================
           FORMULARIOS
        ========================================================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 12px;
        }

        .form-grid-3 {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 12px;
        }

        .completo {
            grid-column: 1 / -1;
        }

        .acciones-form {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;

            margin-top: 15px;
        }

        /* =========================================================
           TABLAS
        ========================================================= */

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            padding: 11px 9px;

            background: #f3f5f6;
            color: #455565;

            border-bottom: 1px solid #dfe3e8;

            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 11px 9px;
            border-bottom: 1px solid #e6e9ed;
            vertical-align: middle;
        }

        tbody tr:hover td {
            background: #fafbfc;
        }

        .codigo {
            font-weight: 700;
        }

        .acciones-tabla {
            display: flex;
            gap: 5px;
        }

        /* =========================================================
           ESTADOS
        ========================================================= */

        .badge {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
        }

        .vigente {
            background: var(--verde-fondo);
            color: var(--verde);
        }

        .proximo {
            background: var(--amarillo-fondo);
            color: var(--amarillo);
        }

        .vencido {
            background: var(--rojo-fondo);
            color: var(--rojo);
        }

        .neutro {
            background: var(--gris-fondo);
            color: var(--gris);
        }

        .programado {
            background: var(--azul-fondo);
            color: var(--azul);
        }

        .cumplido {
            background: var(--verde-fondo);
            color: var(--verde);
        }

        .pendiente {
            background: var(--amarillo-fondo);
            color: var(--amarillo);
        }

        .baja {
            background: #eceff1;
            color: #525f69;
        }

        .punto {
            display: inline-block;

            width: 11px;
            height: 11px;

            margin-right: 6px;

            border-radius: 50%;

            vertical-align: -1px;
        }

        .punto-verde {
            background: #20a35b;
        }

        .punto-amarillo {
            background: #e6a400;
        }

        .punto-rojo {
            background: #dc303c;
        }

        .punto-gris {
            background: #a8b1ba;
        }

        /* =========================================================
           FILTROS
        ========================================================= */

        .filtros {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;

            margin-bottom: 15px;
        }

        /* =========================================================
           INICIO CALIFICACIÓN
        ========================================================= */

        .panel-etapas {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 15px;

            margin-bottom: 18px;
        }

        .etapa-resumen {
            padding: 18px;

            background: #fff;

            border: 1px solid #e0e5e9;
            border-radius: 13px;
        }

        .etapa-resumen-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .etapa-resumen-titulo {
            font-size: 19px;
            font-weight: 800;
        }

        .etapa-estados {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 8px;
        }

        .etapa-mini {
            padding: 11px;
            background: #f7f8fa;
            border-radius: 9px;
        }

        .etapa-mini-numero {
            margin-top: 3px;
            font-size: 20px;
            font-weight: 800;
        }

        /* =========================================================
           FICHA
        ========================================================= */

        .ficha-cabecera {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;

            margin-bottom: 17px;
        }

        .ficha-codigo {
            margin-bottom: 4px;

            color: var(--rojo-prater);

            font-size: 14px;
            font-weight: 800;
        }

        .ficha-grid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 12px;
        }

        .ficha-dato {
            padding: 14px;

            background: #f7f8fa;

            border-radius: 10px;
        }

        .ficha-label {
            color: #71808f;
            font-size: 11px;
        }

        .ficha-valor {
            margin-top: 4px;

            font-size: 14px;
            font-weight: 700;
        }

        .estado-equipo-grande {
            display: inline-block;

            padding: 9px 15px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 800;
        }

        .estado-operativo {
            background: #def7e8;
            color: #17854b;
        }

        .estado-baja {
            background: #eceff1;
            color: #4e5963;
        }

        .calificacion-grid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 15px;
        }

        .etapa-card {
            overflow: hidden;

            background: #fff;

            border: 1px solid #dfe4e8;
            border-radius: 12px;
        }

        .etapa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 12px 14px;

            background: #f3f5f6;
        }

        .etapa-titulo {
            font-size: 15px;
            font-weight: 800;
        }

        .doc-card {
            padding: 14px;
            border-top: 1px solid #e8ebee;
        }

        .doc-tipo {
            margin-bottom: 5px;

            color: #6b7885;

            font-size: 11px;
        }

        .doc-codigo {
            margin-bottom: 8px;

            font-weight: 800;

            word-break: break-word;
        }

        .doc-linea {
            margin-top: 4px;

            color: #586878;

            font-size: 11px;
        }

        .sin-documento {
            color: #87939e;
            font-size: 12px;
        }

        /* =========================================================
           PROGRAMA ANUAL
        ========================================================= */

        .programa-cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 15px;
        }

        .programa-anio {
            font-size: 26px;
            font-weight: 800;
        }

        .barra-fondo {
            height: 14px;

            margin-top: 10px;

            background: #e7ebee;

            border-radius: 20px;

            overflow: hidden;
        }

        .barra-avance {
            height: 100%;

            background: #22a35b;

            border-radius: 20px;

            transition: width .25s ease;
        }

        .programa-resumen {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            gap: 12px;

            margin-top: 15px;
        }

        .programa-mini {
            padding: 13px;

            background: #f7f8fa;

            border-radius: 9px;
        }

        .programa-mini strong {
            display: block;
            margin-top: 4px;
            font-size: 20px;
        }

        /* =========================================================
           EXCEL
        ========================================================= */

        .excel-panel {
            padding: 30px;

            background: #fafbfc;

            border: 2px dashed #d4dae0;
            border-radius: 14px;

            text-align: center;
        }

        .excel-resumen {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            gap: 12px;

            margin: 18px 0;
        }

        .excel-resumen-card {
            padding: 14px;

            background: #ffffff;

            border: 1px solid #e1e5e9;
            border-radius: 10px;
        }

        .excel-resumen-card strong {
            display: block;
            margin-top: 4px;
            font-size: 24px;
        }

        .fila-valida td {
            background: #f4fbf7 !important;
        }

        .fila-duplicada td {
            background: #fff8e6 !important;
        }

        .fila-error td {
            background: #fff0f1 !important;
        }

        /* =========================================================
           PELIGRO
        ========================================================= */

        .zona-peligro {
            border-color: #efb9bd;
            background: #fff9f9;
        }

        .zona-peligro h2 {
            color: #a9000a;
        }

        .advertencia {
            padding: 13px;

            background: #fde8ea;
            color: #97111b;

            border-radius: 9px;

            font-size: 12px;
            line-height: 1.5;
        }

        /* =========================================================
           LOGIN
        ========================================================= */

        .login-overlay {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(0,0,0,.45);

            z-index: 1000;
        }

        .login-card {
            width: 360px;
            max-width: 90%;

            padding: 24px;

            background: #ffffff;

            border-radius: 14px;
        }

        .login-error {
            display: none;

            margin-bottom: 10px;

            color: #d91f2b;

            font-size: 12px;
        }

        /* =========================================================
           OTROS MÓDULOS
        ========================================================= */

        .modulo-grid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 15px;
        }

        .modulo-card {
            padding: 18px;

            background: #ffffff;

            border: 1px solid #e0e5e9;
            border-radius: 12px;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media(max-width:1150px) {
            .resumen,
            .programa-resumen {
                grid-template-columns: repeat(2,minmax(0,1fr));
            }

            .ficha-grid {
                grid-template-columns: repeat(2,minmax(0,1fr));
            }

            .calificacion-grid,
            .panel-etapas {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width:800px) {
            .sidebar {
                width: 190px;
            }

            .contenido {
                margin-left: 190px;
                padding: 15px;
            }

            .logo-imagen {
                width: 140px;
            }

            .topbar {
                flex-direction: column;
            }

            .topbar-derecha {
                width: 100%;
                justify-content: flex-start;
            }

            .panel-notificaciones {
                left: 0;
                right: auto;
                width: min(390px,calc(100vw - 225px));
            }

            .form-grid,
            .form-grid-3,
            .filtros,
            .resumen,
            .programa-resumen,
            .ficha-grid,
            .excel-resumen,
            .modulo-grid {
                grid-template-columns: 1fr;
            }

            .completo {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar">

    <div class="logo-box">

        <img
            src="logo prater.png"
            alt="Laboratorios Prater"
            class="logo-imagen"
        >

        <div class="logo-subtitulo">
            Sistemas de Apoyo Crítico y Metrología
        </div>

        <div class="logo-descripcion">
            LABORATORIOS PRATER
        </div>

    </div>

    <ul class="menu" id="menuPrincipal">

        <li data-modulo="calificacion" onclick="abrirModulo('calificacion')">
            <span class="menu-icono">▣</span>
            Calificación de Equipos
        </li>

        <li data-modulo="calibracion" onclick="abrirModulo('calibracion')">
            <span class="menu-icono">◎</span>
            Calibración de Equipos
        </li>

        <li data-modulo="agua" onclick="abrirModulo('agua')">

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ADMIN_USUARIO = "admin";
const ADMIN_CLAVE = "SACM2026";

const DIAS_PROXIMO = 180;

let esAdmin =

let moduloActual = "calificacion";

let indiceEdicionEquipo = null;
let indiceEdicionDocumento = null;

let excelTemporal = null;

let panelNotificacionesAbierto = false;

/* =========================================================
   ALMACENAMIENTO
========================================================= */

function leerDatos(clave) {

    try {

        const contenido =
            localStorage.getItem(clave);

        if (!contenido) {
            return [];
        }

        const datos =
            JSON.parse(contenido);

        return Array.isArray(datos)
            ? datos
            : [];

    } catch(error) {

        console.error(
            "Error leyendo " + clave,
            error
        );

        return [];
    }
}

let equipos =
    leerDatos("equipos");

let calificaciones =
    leerDatos("calificaciones");

let programasCalificacion =
    leerDatos("programasCalificacion");

let equiposCalibracion =
    leerDatos("equiposCalibracion");

let registrosCalibracion =
    leerDatos("registrosCalibracion");

let documentosSACM =
    leerDatos("documentosSACM");

let registrosDocumentales =
    leerDatos("registrosDocumentales");

/* =========================================================
   GUARDAR
========================================================= */

function guardarTodo() {

    localStorage.setItem(
        "equipos",
        JSON.stringify(equipos)
    );

    localStorage.setItem(
        "calificaciones",
        JSON.stringify(calificaciones)
    );

    localStorage.setItem(
        "programasCalificacion",
        JSON.stringify(programasCalificacion)
    );

    localStorage.setItem(
        "equiposCalibracion",
        JSON.stringify(equiposCalibracion)
    );

    localStorage.setItem(
        "registrosCalibracion",
        JSON.stringify(registrosCalibracion)
    );

    localStorage.setItem(
        "documentosSACM",
        JSON.stringify(documentosSACM)
    );

    localStorage.setItem(
        "registrosDocumentales",
        JSON.stringify(registrosDocumentales)
    );
}

/* =========================================================
   MIGRACIÓN
========================================================= */

function migrarDatosAntiguos() {

    let cambios = false;

    equipos.forEach(equipo => {

        if (!("marca" in equipo)) {
            equipo.marca = "";
            cambios = true;
        }

        if (!("modelo" in equipo)) {
            equipo.modelo = "";
            cambios = true;
        }

        if (!("serie" in equipo)) {
            equipo.serie = "";
            cambios = true;
        }

        if (!("estado" in equipo)) {
            equipo.estado = "Operativo";
            cambios = true;
        }

        if (!("fechaBaja" in equipo)) {
            equipo.fechaBaja = "";
            cambios = true;
        }

        if (!("motivoBaja" in equipo)) {
            equipo.motivoBaja = "";
            cambios = true;
        }

        if (!Array.isArray(equipo.historialEstado)) {
            equipo.historialEstado = [];
            cambios = true;
        }

        if (!("aplicaPQ" in equipo)) {
            equipo.aplicaPQ = true;
            cambios = true;
        }
    });

    calificaciones.forEach(documento => {

        if (!("responsable" in documento)) {
            documento.responsable = "";
            cambios = true;
        }

        if (!documento.fecha && documento.emision) {
            documento.fecha = documento.emision;
            cambios = true;
        }

        if (
            documento.fecha &&
            !documento.vencimiento
        ) {

            documento.vencimiento =
                sumarAnios(
                    documento.fecha,
                    5
                );

            cambios = true;
        }
    });

    if (cambios) {
        guardarTodo();
    }
}

/* =========================================================
   UTILIDADES
========================================================= */

function obtenerValor(id) {

    const elemento =
        document.getElementById(id);

    return elemento
        ? String(elemento.value || "").trim()
        : "";
}

function obtenerSelect(id) {

    const elemento =
        document.getElementById(id);

    return elemento
        ? elemento.value
        : "";
}

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escaparJS(valor) {

    return String(valor ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}

function fechaHoy() {

    const hoy = new Date();

    return [
        hoy.getFullYear(),
        String(hoy.getMonth()+1).padStart(2,"0"),
        String(hoy.getDate()).padStart(2,"0")
    ].join("-");
}

function anioActual() {

    return new Date().getFullYear();
}

function fechaBonita(fecha) {

    if (!fecha) {
        return "—";
    }

    const partes =
        String(fecha).split("-");

    if (partes.length !== 3) {
        return fecha;
    }

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );
}

function sumarAnios(fecha,cantidad) {

    if (!fecha) {
        return "";
    }

    const partes =
        String(fecha).split("-");

    if (partes.length !== 3) {
        return "";
    }

    const anio = Number(partes[0]);
    const mes = Number(partes[1]);
    const dia = Number(partes[2]);

    let nuevaFecha =
        new Date(
            anio + cantidad,
            mes - 1,
            dia
        );

    /*
        Corrige 29 de febrero.
    */
    if (
        nuevaFecha.getMonth() !==
        mes - 1
    ) {

        nuevaFecha =
            new Date(
                anio + cantidad,
                mes,
                0
            );
    }

    return [
        nuevaFecha.getFullYear(),
        String(nuevaFecha.getMonth()+1).padStart(2,"0"),
        String(nuevaFecha.getDate()).padStart(2,"0")
    ].join("-");
}

function normalizarFechaExcel(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {
        return "";
    }

    if (valor instanceof Date) {

        return [
            valor.getFullYear(),
            String(valor.getMonth()+1).padStart(2,"0"),
            String(valor.getDate()).padStart(2,"0")
        ].join("-");
    }

    if (typeof valor === "number") {

        const fecha =
            XLSX.SSF.parse_date_code(valor);

        if (!fecha) {
            return "";
        }

        return [
            fecha.y,
            String(fecha.m).padStart(2,"0"),
            String(fecha.d).padStart(2,"0")
        ].join("-");
    }

    const texto =
        String(valor).trim();

    if (
        /^\d{4}-\d{2}-\d{2}$/.test(texto)
    ) {
        return texto;
    }

    let match =
        texto.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if (match) {

        return (
            match[3] +
            "-" +
            match[2].padStart(2,"0") +
            "-" +
            match[1].padStart(2,"0")
        );
    }

    match =
        texto.match(
            /^(\d{1,2})-(\d{1,2})-(\d{4})$/
        );

    if (match) {

        return (
            match[3] +
            "-" +
            match[2].padStart(2,"0") +
            "-" +
            match[1].padStart(2,"0")
        );
    }

    return "";
}

function columnaExcel(
    fila,
    nombres
) {

    for (const nombre of nombres) {

        if (
            fila[nombre] !== undefined &&
            fila[nombre] !== null &&
            String(fila[nombre]).trim() !== ""
        ) {

            return fila[nombre];
        }
    }

    return "";
}

const MESES = [
    "",
    "Enero",
    "Febrero",
    "Marzo",
    "Abril",
    "Mayo",
    "Junio",
    "Julio",
    "Agosto",
    "Septiembre",
    "Octubre",
    "Noviembre",
    "Diciembre"
];

function obtenerMes(fecha) {

    if (!fecha) {
        return "";
    }

    const partes =
        fecha.split("-");

    if (partes.length !== 3) {
        return "";
    }

    return MESES[
        Number(partes[1])
    ] || "";
}

function obtenerNumeroMes(fecha) {

    if (!fecha) {
        return 0;
    }

    const partes =
        fecha.split("-");

    return Number(
        partes[1] || 0
    );
}

function obtenerAnioFecha(fecha) {

    if (!fecha) {
        return 0;
    }

    return Number(
        String(fecha).split("-")[0]
    ) || 0;
}

/* =========================================================
   ESTADOS DOCUMENTALES
========================================================= */

function estadoFecha(fecha) {

    if (!fecha) {

        return {
            texto:"Sin registro",
            clase:"neutro"
        };
    }

    const hoy = new Date();

    hoy.setHours(0,0,0,0);

    const vencimiento =
        new Date(
            fecha + "T00:00:00"
        );

    if (
        Number.isNaN(
            vencimiento.getTime()
        )
    ) {

        return {
            texto:"Fecha inválida",
            clase:"neutro"
        };
    }

    const dias =
        Math.ceil(
            (vencimiento - hoy) /
            86400000
        );

    if (dias < 0) {

        return {
            texto:"Vencido",
            clase:"vencido"
        };
    }

    if (dias <= DIAS_PROXIMO) {

        return {
            texto:"Próximo",
            clase:"proximo"
        };
    }

    return {
        texto:"Vigente",
        clase:"vigente"
    };
}

function puntoEstado(estado) {

    let punto = "punto-gris";

    if (estado.clase === "vigente") {
        punto = "punto-verde";
    }

    if (estado.clase === "proximo") {
        punto = "punto-amarillo";
    }

    if (estado.clase === "vencido") {
        punto = "punto-rojo";
    }

    return `
        <span class="punto ${punto}"></span>
        <span class="badge ${estado.clase}">
            ${estado.texto}
        </span>
    `;
}

function tarjetaResumen(
    icono,
    titulo,
    valor,
    clase
) {

    return `
        <div class="resumen-card">

            <div class="resumen-icono ${clase}">

            <div>

                <div class="resumen-titulo">
                    ${titulo}
                </div>

                <div class="resumen-numero">
                    ${valor}
                </div>

            </div>

        </div>
    `;
}

/* =========================================================
   LOGIN
========================================================= */

function actualizarUsuario() {

    document.getElementById(
        "nombreUsuario"
    ).textContent =
        esAdmin
            ? "ADMINISTRADOR"
            : "MODO CONSULTA";

    document.getElementById(
        "areaUsuario"
    ).textContent =
        esAdmin
            ? "SAC-M · Edición habilitada"
            : "Solo lectura";

    document.getElementById(
        "btnAcceso"
    ).style.display =
        esAdmin
            ? "none"
            : "block";

    document.getElementById(
        "btnSalir"
    ).style.display =
        esAdmin
            ? "block"
            : "none";

    document.getElementById(
        "menuKPI"
    ).style.display =
        esAdmin
            ? "flex"
            : "none";
}

function abrirLogin() {

    document.getElementById(
        "loginModal"
    ).style.display =
        "block";

    document.getElementById(
        "loginUsuario"
    ).value = "";

    document.getElementById(
        "loginClave"
    ).value = "";

    document.getElementById(
        "loginError"
    ).style.display =
        "none";
}

function cerrarLogin() {

    document.getElementById(
        "loginModal"
    ).style.display =
        "none";
}

function iniciarSesion() {

    const usuario =
        obtenerValor(
            "loginUsuario"
        );

    const clave =
        obtenerValor(
            "loginClave"
        );

    if (
        usuario === ADMIN_USUARIO &&
        clave === ADMIN_CLAVE
    ) {

        esAdmin = true;

        sessionStorage.setItem(
            "adminSACM",
            "true"
        );

        cerrarLogin();

        actualizarUsuario();

        abrirModulo(
            moduloActual
        );

        return;
    }

    document.getElementById(
        "loginError"
    ).style.display =
        "block";
}

function cerrarSesion() {

    if (
        !confirm(
            "¿Cerrar sesión de administrador?"
        )
    ) {
        return;
    }

    esAdmin = false;

    sessionStorage.removeItem(
        "adminSACM"
    );

    actualizarUsuario();

    if (
        moduloActual === "kpi"
    ) {

        abrirModulo(
            "calificacion"
        );

    } else {

        abrirModulo(
            moduloActual
        );
    }
}

/* =========================================================
   MENÚ
========================================================= */

function marcarMenuActivo(modulo) {

    document
        .querySelectorAll(
            "#menuPrincipal li"
        )
        .forEach(
            elemento =>
                elemento.classList.remove(
                    "activo"
                )
        );

    const elemento =
        document.querySelector(
            `[data-modulo="${modulo}"]`
        );

    if (elemento) {
        elemento.classList.add(
            "activo"
        );
    }
}

function abrirModulo(modulo) {

    panelNotificacionesAbierto = false;

    if (
        modulo === "kpi" &&
        !esAdmin
    ) {
        return;
    }

    moduloActual = modulo;

    marcarMenuActivo(
        modulo
    );

    if (
        modulo === "calificacion"
    ) {

        mostrarInicioCalificacion();
        return;
    }

    if (
        modulo === "calibracion"
    ) {

        mostrarModuloSimple(
            "Calibración de Equipos",
            "Gestión documental e historial metrológico."
        );

        return;
    }

    if (
        modulo === "agua"
    ) {

        mostrarModuloDocumental(
            "Agua Purificada",
            [
                "Sistemas",
                "Sanitizaciones",
                "Ensayos / Análisis",
                "Mantenimientos",
                "Documentación",
                "Carga Excel"
            ]
        );

        return;
    }

    if (
        modulo === "hvac"
    ) {

        mostrarModuloDocumental(
            "HVAC",
            [
                "Sistemas",
                "Filtros",
                "Mantenimientos",
                "Ensayos / Certificaciones",
                "Documentación",
                "Carga Excel"
            ]
        );

        return;
    }

    if (
        modulo === "aire"
    ) {

        mostrarModuloDocumental(
            "Aire Comprimido",
            [
                "Sistemas",
                "Mantenimientos",
                "Ensayos / Certificaciones",
                "Documentación",
                "Carga Excel"
            ]

    }

    if (

    ) {

                "Áreas / Equipos",
                "Estudios de Mapeo",
                "Re-mapeos",
                "Hallazgos / Desviaciones",
                "Documentación",

            ]

    if (

}

function topbarDerecha(
    incluirPrograma = false
) {

    const cantidad =

    return `
        <div class="topbar-derecha">

            ${
                esAdmin &&
                incluirPrograma
                    ? `

                ${

                    esAdmin
                        ? "👤 Administrador"

                }
            </button>

            <div id="panelNotificaciones"></div>

        </div>
    `;
}

function toggleNotificaciones(evento) {

    if (evento) {
        evento.stopPropagation();
    }

    panelNotificacionesAbierto =
        !panelNotificacionesAbierto;

    const contenedor =
        document.getElementById(
            "panelNotificaciones"
        );

    if (!contenedor) {
        return;
    }

    if (
        !panelNotificacionesAbierto
    ) {

        contenedor.innerHTML = "";
        return;
    }

    const lista =
        generarNotificaciones();

    contenedor.innerHTML = `
        <div
            class="panel-notificaciones"
            onclick="event.stopPropagation()"
        >

            <div class="panel-notificaciones-header">

                <strong>
                    Notificaciones
                </strong>

                <span class="badge neutro">
                    ${lista.length}
                </span>

            </div>

            ${
                lista.length
                    ? lista.map(item => `

                        <div
                            class="notificacion-item"
                            onclick="abrirNotificacion('${escaparJS(item.equipoCodigo)}')"
                        >

                            <div class="notificacion-titulo">
                                ${item.icono}
                                ${escaparHTML(item.titulo)}
                            </div>

                            <div class="notificacion-texto">
                                ${escaparHTML(item.texto)}
                            </div>

                        </div>

                    `).join("")
                    : `
                        <div class="notificacion-item">

                            <div class="notificacion-texto">
                                No existen alertas documentales.
                            </div>

                        </div>
                    `
            }

        </div>
    `;
}

document.addEventListener(
    "click",
    () => {

        if (
            panelNotificacionesAbierto
        ) {

            panelNotificacionesAbierto =
                false;

            const panel =
                document.getElementById(
                    "panelNotificaciones"
                );

            if (panel) {
                panel.innerHTML = "";
            }
        }
    }
);

function abrirNotificacion(
    codigoEquipo
) {

    panelNotificacionesAbierto =
        false;

    mostrarFichaEquipo(
        codigoEquipo
    );
}

/* =========================================================
   NOTIFICACIONES
========================================================= */

function generarNotificaciones() {

    const alertas = [];

    equipos
        .filter(
            equipo =>
                equipo.estado !==
                "De baja"
        )
        .forEach(
            equipo => {

                ["IQ","OQ","PQ"].forEach(
                    tipo => {

                        if (
                            tipo === "PQ" &&
                            equipo.aplicaPQ === false
                        ) {
                            return;
                        }

                        ["Protocolo","Reporte"].forEach(
                            documento => {

                                const registro =
                                    ultimoDocumento(
                                        equipo.codigo,
                                        tipo,
                                        documento
                                    );

                                if (!registro) {
                                    return;
                                }

                                const estado =
                                    estadoFecha(
                                        registro.vencimiento
                                    );

                                if (
                                    estado.clase ===
                                    "vencido"
                                ) {

                                    alertas.push({

                                        equipoCodigo:
                                            equipo.codigo,

                                        prioridad:
                                            1,

                                        icono:
                                            "🔴",

                                        titulo:
                                            `${equipo.codigo} · ${tipo} ${documento}`,

                                        texto:
                                            `${registro.codigo} venció el ${fechaBonita(registro.vencimiento)}.`
                                    });

                                } else if (
                                    estado.clase ===
                                    "proximo"
                                ) {

                                    alertas.push({

                                        equipoCodigo:
                                            equipo.codigo,

                                        prioridad:
                                            2,

                                        icono:
                                            "🟡",

                                        titulo:
                                            `${equipo.codigo} · ${tipo} ${documento}`,

                                        texto:
                                            `${registro.codigo} vence el ${fechaBonita(registro.vencimiento)}.`
                                    });
                                }
                            }
                        );
                    }
                );
            }
        );

    /*
        También se incorporan alertas del programa
        del año actual.
    */
    const programaActual =
        obtenerPrograma(
            anioActual()
        );

    if (programaActual) {

        const mesActual =
            new Date().getMonth() + 1;

        programaActual.equipos.forEach(
            item => {

                if (
                    item.estadoGeneral ===
                    "Cumplido"
                ) {
                    return;
                }

                if (
                    item.mesNumero <=
                    mesActual + 1
                ) {

                    alertas.push({

                        equipoCodigo:
                            item.equipoCodigo,

                        prioridad:
                            3,

                        icono:
                            "🔵",

                        titulo:
                            `${item.equipoCodigo} · Programa ${programaActual.anio}`,

                        texto:
                            `Calificación programada con mes límite ${item.mes}.`
                    });
                }
            }
        );
    }

    return alertas.sort(
        (a,b) =>
            a.prioridad -
            b.prioridad
    );
}

/* =========================================================
   DOCUMENTOS
========================================================= */

function fechaDocumento(registro) {

    return (
        registro?.fecha ||
        registro?.emision ||
        ""
    );
}

function ultimoDocumento(
    equipoCodigo,
    tipo,
    documento
) {

    return calificaciones
        .filter(
            registro =>
                registro.equipoCodigo === equipoCodigo &&
                registro.tipo === tipo &&
                registro.documento === documento
        )
        .sort(
            (a,b) =>
                fechaDocumento(b)
                .localeCompare(
                    fechaDocumento(a)
                )
        )[0] || null;
}

function estadoEtapa(
    equipo,
    tipo
) {

    if (
        tipo === "PQ" &&
        equipo.aplicaPQ === false
    ) {

        return {
            texto:"No aplica",
            clase:"neutro"
        };
    }

    const protocolo =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Protocolo"
        );

    const reporte =
        ultimoDocumento(
            equipo.codigo,
            tipo,
            "Reporte"
        );

    if (
        !protocolo ||
        !reporte
    ) {

        return {
            texto:"Incompleto",
            clase:"vencido"
        };
    }

    const estadoP =
        estadoFecha(
            protocolo.vencimiento
        );

    const estadoR =
        estadoFecha(
            reporte.vencimiento
        );

    if (
        estadoP.clase === "vencido" ||
        estadoR.clase === "vencido"
    ) {

        return {
            texto:"Vencido",
            clase:"vencido"
        };
    }

    if (
        estadoP.clase === "proximo" ||
        estadoR.clase === "proximo"
    ) {

        return {
            texto:"Próximo",
            clase:"proximo"
        };
    }

    return {
        texto:"Vigente",
        clase:"vigente"
    };
}

function equipoCompletamenteCalificado(
    equipo
) {

    const iq =
        estadoEtapa(
            equipo,
            "IQ"
        );

    const oq =
        estadoEtapa(
            equipo,
            "OQ"
        );

    if (
        iq.clase === "vencido" ||
        oq.clase === "vencido"
    ) {
        return false;
    }

    if (
        equipo.aplicaPQ !== false
    ) {

        const pq =
            estadoEtapa(
                equipo,
                "PQ"
            );

        if (
            pq.clase === "vencido"
        ) {
            return false;
        }
    }

    return true;
}

/* =========================================================
   CONTADORES IQ OQ PQ
========================================================= */

function resumenEtapa(tipo) {

    const lista =
        equipos.filter(
            equipo => {

                if (
                    equipo.estado ===
                    "De baja"
                ) {
                    return false;
                }

                if (
                    tipo === "PQ" &&
                    equipo.aplicaPQ === false
                ) {
                    return false;
                }

                return true;
            }
        );

    const resultado = {
        total:lista.length,
        vigente:0,
        proximo:0,
        vencido:0
    };

    lista.forEach(
        equipo => {

            const estado =
                estadoEtapa(
                    equipo,
                    tipo
                );

            if (
                estado.clase === "vigente"
            ) {
                resultado.vigente++;
            }

            if (
                estado.clase === "proximo"
            ) {
                resultado.proximo++;
            }

            if (
                estado.clase === "vencido"
            ) {
                resultado.vencido++;
            }
        }
    );

    return resultado;
}

function tarjetaResumenEtapa(

    const datos =
        resumenEtapa(

        );

    return `

function equiposConDocumentacionProxima() {

    return equipos.filter(
        equipo => {

            if (
                equipo.estado ===
                "De baja"

                return false;
            }

            return ["IQ","OQ","PQ"].some(
                tipo => {

                    if (
                        tipo === "PQ" &&
                        equipo.aplicaPQ === false
                    ) {
                        return false;
                    }

                    return ["Protocolo","Reporte"].some(
                        documento => {

                            const reg =
                                ultimoDocumento(
                                    equipo.codigo,
                                    tipo,
                                    documento
                                );

                            if (!reg) {
                                return false;
                            }

                            return (
                                estadoFecha(
                                    reg.vencimiento
                                ).clase ===
                                "proximo"
                            );
                        }
                    );
                }
            );
        }
    );
}

function documentoReferenciaPrograma(
    equipo
) {

    if (
        equipo.aplicaPQ !== false
    ) {

        return ultimoDocumento(
            equipo.codigo,
            "PQ",
            "Reporte"
        );
    }

    return ultimoDocumento(
        equipo.codigo,
        "OQ",
        "Reporte"
    );
}

        equipos

                "De baja"

        .map(

                    documentoReferenciaPrograma(
                        equipo

                    equipo,
                    referencia

function guardarEquipo() {

    const codigo =
        obtenerValor(
            "eqCodigo"
        );

    const nombre =
        obtenerValor(
            "eqNombre"
        );

    const area =
        obtenerValor(
            "eqArea"
        );

    if (
        !codigo ||
        !nombre ||
        !area
    ) {

        alert(
            "Completa Código, Nombre y Área."
        );

        return;
    }

    const duplicado =
        equipos.findIndex(
            (equipo,indice) =>
                String(equipo.codigo).toLowerCase() ===
                    codigo.toLowerCase() &&
                indice !==
                    indiceEdicionEquipo
        );

    if (
        duplicado !== -1
    ) {

        alert(
            "Ya existe otro equipo con ese código."
        );

        return;
    }

    if (
        indiceEdicionEquipo === null
    ) {

        equipos.push({

            codigo,
            nombre,
            area,

            marca:
                obtenerValor(
                    "eqMarca"
                ),

            modelo:
                obtenerValor(
                    "eqModelo"
                ),

            serie:
                obtenerValor(
                    "eqSerie"
                ),

            ubicacion:
                obtenerValor(
                    "eqUbicacion"
                ),

            aplicaPQ:
                obtenerSelect(
                    "eqPQ"
                ) === "si",

            estado:
                "Operativo",

            fechaBaja:
                "",

            motivoBaja:
                "",

            historialEstado:
                []
        });

    } else {

        const anterior =
            equipos[
                indiceEdicionEquipo
            ];

        const codigoAnterior =
            anterior.codigo;

        anterior.codigo =
            codigo;

        anterior.nombre =
            nombre;

        anterior.area =
            area;

        anterior.marca =
            obtenerValor(
                "eqMarca"
            );

        anterior.modelo =
            obtenerValor(
                "eqModelo"
            );

        anterior.serie =
            obtenerValor(
                "eqSerie"
            );

        anterior.ubicacion =
            obtenerValor(
                "eqUbicacion"
            );

        anterior.aplicaPQ =
            obtenerSelect(
                "eqPQ"
            ) === "si";

        calificaciones.forEach(
            documento => {

                if (
                    documento.equipoCodigo ===
                    codigoAnterior
                ) {

                    documento.equipoCodigo =
                        codigo;

                    documento.equipoNombre =
                        nombre;
                }
            }
        );

        programasCalificacion.forEach(
            programa => {

                programa.equipos.forEach(
                    item => {

                        if (
                            item.equipoCodigo ===
                            codigoAnterior
                        ) {

                            item.equipoCodigo =
                                codigo;

                            item.equipoNombre =
                                nombre;
                        }
                    }
                );
            }
        );
    }

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarEquiposCalificacion();
}

        obtenerValor(
            "buscarEquipo"
        ).toLowerCase();

    const estado =
        obtenerSelect(
            "filtroEstadoEquipo"
        );

    const pq =
        obtenerSelect(
            "filtroPQ"
        );

    const lista =
        equipos.filter(
            equipo => {

                const coincideBusqueda =
                    [
                        equipo.codigo,
                        equipo.nombre,
                        equipo.area,
                        equipo.marca,
                        equipo.modelo,
                        equipo.serie,
                        equipo.ubicacion
                    ].some(
                        campo =>
                            String(campo || "")
                            .toLowerCase()
                            .includes(buscar)
                    );

                const coincideEstado =
                    !estado ||
                    equipo.estado === estado;

                const coincidePQ =
                    !pq ||
                    (
                        pq === "si" &&
                        equipo.aplicaPQ !== false
                    ) ||
                    (
                        pq === "no" &&
                        equipo.aplicaPQ === false
                    );

                return (
                    coincideBusqueda &&
                    coincideEstado &&
                    coincidePQ
                );
            }
        );

    if (!lista.length) {

        contenedor.innerHTML = `
            <div class="subdato">
                No se encontraron equipos.
            </div>
        `;

        return;
    }

    contenedor.innerHTML = `

                                equipos.indexOf(
                                    equipo
                                );

                            return `

                                <tr>

                                    <td class="codigo">
                                        ${escaparHTML(equipo.codigo)}
                                    </td>

                                    <td>
                                        ${escaparHTML(equipo.nombre)}
                                    </td>

                                    <td>
                                        ${escaparHTML(equipo.area)}
                                    </td>

                                    <td>
                                        ${escaparHTML(equipo.marca || "—")}
                                    </td>

                                    <td>
                                        ${escaparHTML(equipo.modelo || "—")}
                                    </td>

                                    <td>
                                        ${escaparHTML(equipo.serie || "—")}
                                    </td>

                                    <td>

                                    </td>

                                    <td>

                                        ${
                                            equipo.estado === "De baja"
                                                ? `<span class="badge baja">De baja</span>`
                                                : `<span class="badge vigente">Operativo</span>`
                                        }

                                    </td>

                                    <td>

                                        <button
                                            class="btn-azul"
                                            onclick="mostrarFichaEquipo('${escaparJS(equipo.codigo)}')"
                                        >

                                    </td>

                                    ${

                                            ? `

    const protocolo =
        ultimoDocumento(
            equipo.codigo,
            tipo,

            equipo.codigo,
            tipo,

            </button>

function confirmarBajaEquipo(
    codigo
) {

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    const fecha =
        obtenerValor(
            "fechaBaja"
        );

    if (!fecha) {

        alert(
            "Ingresa la fecha de baja."
        );

        return;
    }

    if (
        !confirm(
            `¿Dar de baja ${equipo.codigo}?\n\nEl equipo no se eliminará y conservará toda su documentación.`
        )
    ) {
        return;
    }

    equipo.estado =
        "De baja";

    equipo.fechaBaja =
        fecha;

    equipo.motivoBaja =
        obtenerValor(
            "motivoBaja"
        );

    equipo.historialEstado.push({

        estado:
            "De baja",

        fecha,

        motivo:
            equipo.motivoBaja
    });

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarFichaEquipo(
        codigo
    );
}

function reactivarEquipo(
    codigo
) {

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    if (
        !confirm(
            `¿Reactivar ${equipo.codigo}?\n\nVolverá a participar en KPI y futuras programaciones.`
        )
    ) {
        return;
    }

    equipo.estado =
        "Operativo";

    equipo.historialEstado.push({

        estado:
            "Reactivado",

        fecha:
            fechaHoy(),

        motivo:
            "Equipo reincorporado al estado operativo."
    });

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarFichaEquipo(
        codigo
    );
}

/* =========================================================
   ELIMINAR DEFINITIVAMENTE
========================================================= */

function eliminarEquipoDefinitivamente(
    codigo
) {

    if (!esAdmin) {
        return;
    }

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    if (!equipo) {
        return;
    }

    const cantidadDocumentos =
        calificaciones.filter(
            documento =>
                documento.equipoCodigo ===
                codigo
        ).length;

    if (
        !confirm(
            `ELIMINACIÓN DEFINITIVA\n\n` +
            `${equipo.codigo} - ${equipo.nombre}\n\n` +
            `Se eliminarán también ${cantidadDocumentos} documento(s) IQ/OQ/PQ.\n\n` +
            `¿Continuar?`
        )
    ) {
        return;
    }

    const codigoIngresado =
        prompt(
            `Escribe exactamente el código ${equipo.codigo} para confirmar:`
        );

    if (
        codigoIngresado === null
    ) {
        return;
    }

    if (
        codigoIngresado.trim() !==
        equipo.codigo
    ) {

        alert(
            "El código no coincide. No se eliminó el equipo."
        );

        return;
    }

    calificaciones =
        calificaciones.filter(
            documento =>
                documento.equipoCodigo !==
                codigo
        );

    equipos =
        equipos.filter(
            item =>
                item.codigo !==
                codigo
        );

    /*
        Los programas históricos NO se eliminan.
        Quedan como evidencia de que el equipo estuvo
        programado en algún momento.
    */

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarEquiposCalificacion();
}

                    <label>Versión</label>

                        id="docVersion"
                        value="${escaparHTML(registro.version || "")}"
                    >

                    <label>Fecha de emisión *</label>

                        value="${fechaDocumento(registro)}"
                        onchange="actualizarVencimientoDocumento()"
                    >

                </div>

                <div>

                    <label>Vencimiento automático</label>

                    <input
                        id="docVencimiento"
                        type="date"
                        readonly
                    >

                    <label>

                    </label>

    );

}

function actualizarOpcionesTipoDocumento(
    seleccionado = ""
) {

    const codigo =
        obtenerSelect(
            "docEquipo"
        );

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigo
        );

    const tipos = [
        "IQ",
        "OQ"
    ];

    if (
        equipo &&
        equipo.aplicaPQ !== false
    ) {
        tipos.push("PQ");
    }

    const select =
        document.getElementById(
            "docTipo"
        );

    if (!select) {
        return;
    }

    select.innerHTML =
        tipos.map(
            tipo => `

                <option
                    value="${tipo}"
                    ${tipo === seleccionado ? "selected" : ""}
                >
                    ${tipo}
                </option>

            `
        ).join("");
}

function actualizarVencimientoDocumento() {

    const campo =
        document.getElementById(
            "docVencimiento"
        );

    if (!campo) {
        return;
    }

    campo.value =
        sumarAnios(
            obtenerValor(
                "docFecha"
            ),
            5
        );
}

function guardarDocumentoCalificacion() {

    actualizarVencimientoDocumento();

    const codigoEquipo =
        obtenerSelect(
            "docEquipo"
        );

    const equipo =
        equipos.find(
            item =>
                item.codigo ===
                codigoEquipo
        );

    const registro = {

        equipoCodigo:
            codigoEquipo,

        equipoNombre:
            equipo?.nombre || "",

        tipo:
            obtenerSelect(
                "docTipo"
            ),

        documento:
            obtenerSelect(
                "docDocumento"
            ),

        codigo:
            obtenerValor(
                "docCodigo"
            ),

        version:
            obtenerValor(
                "docVersion"
            ),

        fecha:
            obtenerValor(
                "docFecha"
            ),

        vencimiento:
            obtenerValor(
                "docVencimiento"
            ),

        responsable:
            obtenerValor(
                "docResponsable"
            )
    };

    if (
        !registro.codigo ||
        !registro.fecha
    ) {

        alert(
            "Ingresa el código y la fecha de emisión."
        );

        return;
    }

    const duplicado =
        calificaciones.findIndex(
            (item,indice) =>
                item.equipoCodigo ===
                    registro.equipoCodigo &&
                item.tipo ===
                    registro.tipo &&
                item.documento ===
                    registro.documento &&
                item.codigo ===
                    registro.codigo &&
                fechaDocumento(item) ===
                    registro.fecha &&
                indice !==
                    indiceEdicionDocumento
        );

    if (
        duplicado !== -1
    ) {

        alert(
            "Ese documento ya existe con el mismo código y fecha."
        );

        return;
    }

    if (
        indiceEdicionDocumento === null
    ) {

        calificaciones.push(
            registro
        );

    } else {

        calificaciones[
            indiceEdicionDocumento
        ] = registro;
    }

    guardarTodo();

    actualizarCumplimientoProgramas();

    mostrarGestionDocumentos();
}

                        valor =>

                            .toLowerCase()

                    );
